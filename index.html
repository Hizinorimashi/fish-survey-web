<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魚類調査記録</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e14">
<link rel="stylesheet" href="./leaflet.css">
<style>
:root{
  --bg:#0a0e14; --panel:#141b25; --panel2:#1b2430; --line:#2b3644;
  --fg:#e6edf5; --dim:#93a2b5; --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --ng:#f85149;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5}
body{padding-bottom:40px}
header{position:sticky;top:0;z-index:900;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-top)) 10px;padding-top:calc(8px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;min-height:34px}
#title{font-weight:700;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#sub:empty{margin-top:0}
.pill{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#264d31}
.pill.warn{color:var(--warn);border-color:#4d3f16}
.pill.ng{color:var(--ng);border-color:#5c2626}
main{padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--panel2)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.dim{color:var(--dim);font-size:13px}
.small{font-size:12px}
h3{margin:16px 0 8px;font-size:14px;color:var(--dim);font-weight:600;letter-spacing:.04em}
h3:first-child{margin-top:0}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--dim)}
input,select,textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);margin-top:10px;text-align:center}
.btn:active{background:#26303e}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
.btn.ok{background:#1c3a25;border-color:#2d5c3a;color:#8ce39c}
.btn.ng{background:#3a1d1d;border-color:#5c2b2b;color:#ff9a92}
.btn.sm{padding:8px;font-size:14px;margin-top:6px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn2{display:flex;gap:8px}
.btn2 .btn{margin-top:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
.seg.basemap button{font-size:13px;padding:7px 10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:#0f1720;border:1px solid var(--line);color:var(--fg);padding:11px 16px;border-radius:9px;
  max-width:88vw;opacity:0;pointer-events:none;transition:.2s;z-index:2000;font-size:14px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.map{width:100%;height:60vh;min-height:320px;border-radius:10px;overflow:hidden;background:#0d1219}
.leaflet-container{background:#0d1219;font-family:inherit}
.pinmark{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.hr{height:1px;background:var(--line);margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}
th{color:var(--dim);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.warnbox{background:#2a2110;border:1px solid #4d3f16;color:#f0d48a;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.ngbox{background:#2a1414;border:1px solid #5c2626;color:#ffb4ad;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.okbox{background:#12271a;border:1px solid #264d31;color:#9be0aa;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:12px;color:var(--dim);margin:2px 4px 2px 0}
.splist{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.spitem{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.spitem:last-child{border-bottom:none}
.spitem:active{background:var(--panel2)}
.spitem .fam{color:var(--dim);font-size:12px;margin-left:8px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button id="backBtn" class="seg" style="display:none;background:none;border:none;padding:0"
      onclick="goBack()"><span style="display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px">戻る</span></button>
    <div id="title">魚類調査記録</div>
  </div>
  <div id="sub"></div>
</header>
<main id="main"></main>
<div id="toast"></div>

<script src="./leaflet.js"></script>
<script>
/* ============================================================
   魚類調査記録アプリ
   単一HTMLのオフラインPWA。現場で獲れた魚と川の環境を記録し、
   魚類データベースにそのまま取り込めるCSVを書き出す。

   置き場所の分け方（同じ場所に鳥・産卵床のアプリがあるため必ず分ける）
     localStorage  fs_          IndexedDB  fish_survey_media
     キャッシュ    fish-survey-* / fish-map-*
   ============================================================ */
const APP_VERSION = 'v9';   // sw.js の CACHE 名と揃える（smoke テストが照合する）

/* ---------- 小道具 ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
function nowISO(){ return new Date().toISOString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateValue(d){ d=d||new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function timeValue(d){ d=d||new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDate(s){ if(!s) return '—'; return String(s).slice(0,10); }
function fmtTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){ const t=$('#toast'); if(!t) return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms||2400); }

/* 数値の取り出し。空欄は '' のまま返す。
   0 を未入力と取り違えないため。魚類では 流速0・水深0・通電0秒・尾数0 が普通にある */
function numOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  // parseFloat は '12abc' を 12 として通してしまう。全体が数のときだけ受ける
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return '';
  const n=parseFloat(s);
  return isFinite(n) ? n : '';
}
/* 尾数の受け取り。空欄は ''、0以上の整数だけ数として返す。
   それ以外（負の数・小数・'12abc'）は null を返して「おかしい」と伝える。
   負の数を通すと、測った個体を打ち消して「尾数0」になり、
   実在する記録が黙って書き出しから消える（2026-08-16 の監査 Major） */
function countOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  if(!/^\d+$/.test(s)) return null;
  const n=parseInt(s,10);
  // 大きすぎる数は丸められて、入れた文字と書き出す数が食い違う
  return Number.isSafeInteger(n) ? n : null;
}
/* 記録の尾数がおかしければ、その理由を返す。問題なければ '' */
function badCount(c, inds){
  if(countOf(c.count_unmeasured)===null){
    return `尾数「${String(c.count_unmeasured)}」は数として読めません（0以上の整数で入れてください）`;
  }
  const n = catchTotal(c, inds);
  if(!isFinite(n) || n<0 || n!==Math.floor(n)) return `尾数が正しくありません（${n}）`;
  return '';
}
function numVal(sel){ const el=$(sel); return el ? numOf(el.value) : ''; }
function strVal(sel){ const el=$(sel); return el ? String(el.value).trim() : ''; }
/* 空欄を落とさずに数だけ集める。filter(v=>v) と書くと 0 が消える */
function nums(arr){ return (arr||[]).map(numOf).filter(v=>v!==''); }
function fmtNum(v, d){ return v==='' || v===null || v===undefined || isNaN(v)
  ? '—' : (d===undefined ? String(v) : (+v).toFixed(d)); }
function fmtDist(d){ d=+d||0; return d>=1000 ? (d/1000).toFixed(2)+'km' : Math.round(d)+'m'; }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec||0));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}時間${m}分` : (m ? `${m}分${pad2(s)}秒` : `${s}秒`); }

/* ============================================================
   使用権の確認（複数タブ）と書き込みの門
   同じ記録を2つのタブで開くと、あとから保存したほうが相手の記録を消す。
   起動時に使用権を取り、取れるまで・取れなければ一切書き込まない。
   ============================================================ */
const TAB_ID    = uuid();
const LOCK_NAME = 'fs_write_lock';   // ブラウザ標準の仕組みで使う名前
const LOCK_KEY  = 'fs_lock';         // 標準の仕組みが無いときの控え
const LOCK_TTL  = 12000;   // これより古い印は、閉じられたタブのものとみなす
const LOCK_BEAT = 4000;    // 生きている印を書き直す間隔
const LOCK_WAIT = 350;     // 取ったあと、割り込みが無かったか確かめるまでの待ち
window.WRITE_OK   = false;
window.READ_ONLY  = false;
let SAVE_FATAL = false;    // 後片付けに失敗した状態。読み込み直すまで解けない
let LOCK_WHY   = '';
let LOCK_MODE  = '';       // 'locks'（ブラウザ標準）か 'storage'（控え）
let LOCK_RELEASE = null;   // ブラウザ標準の使用権を手放す関数
let lockBeatTimer = null;

const WHY_OTHER_TAB = 'ほかのタブでこのアプリが開いています。'
  + 'そのタブを閉じてから、この画面を読み込み直してください';

function lockRead(){ try{
  const o=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');
  return (o && typeof o.id==='string' && typeof o.at==='number') ? o : null;
}catch(e){ return null; } }
function lockAlive(o){ return !!o && (Date.now()-o.at) < LOCK_TTL; }
function lockWrite(){ try{
  localStorage.setItem(LOCK_KEY, JSON.stringify({id:TAB_ID, at:Date.now()})); return true;
}catch(e){ return false; } }

/* いま自分が使用権を持っているか。保存の直前に必ずこれで確かめる。
   WRITE_OK という旗だけを信じると、裏で別のタブに取られていても保存してしまい、
   相手の記録ごと上書きする（2026-08-16 の監査 Critical） */
function ownsLock(){
  if(!window.WRITE_OK) return false;
  if(LOCK_MODE==='locks') return true;   // ページの間ずっと握り続けている
  const o = lockRead();
  return !!o && o.id===TAB_ID;           // 控えの方式では、印の持ち主を毎回見る
}

function goReadOnly(why){
  window.WRITE_OK=false; window.READ_ONLY=true; LOCK_WHY=why;
  if(lockBeatTimer){ clearInterval(lockBeatTimer); lockBeatTimer=null; }
  try{ render(); }catch(e){}
}
function openWrite(){
  window.WRITE_OK=true; window.READ_ONLY=false; LOCK_WHY='';
  try{ render(); }catch(e){}
}

function claimLock(){
  // ブラウザ標準の仕組みがあれば、それを使う。
  // タブが落ちても自動で解放されるので、時間切れの当て推量が要らない
  if(navigator.locks && navigator.locks.request){
    LOCK_MODE='locks';
    const held = new Promise(res=>{ LOCK_RELEASE = res; });
    navigator.locks.request(LOCK_NAME, {mode:'exclusive', ifAvailable:true}, lock=>{
      if(!lock){ goReadOnly(WHY_OTHER_TAB); return; }
      openWrite();
      return held;        // ページを離れるまで握り続ける
    }).catch(()=>goReadOnly('使用権を確かめられませんでした。読み込み直してください'));
    return;
  }

  // ここから下は、標準の仕組みが無いブラウザ用の控え
  LOCK_MODE='storage';
  const cur = lockRead();
  if(lockAlive(cur) && cur.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
  if(!lockWrite()){
    goReadOnly('このブラウザ／開き方では保存できません（保存領域が使えません）');
    return;
  }
  setTimeout(()=>{
    const c2 = lockRead();
    if(!c2 || c2.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
    openWrite();
    lockBeatTimer = setInterval(()=>{
      if(!window.WRITE_OK) return;
      const o = lockRead();
      // 自分の印でなければ、別のタブに取られている。上書きして奪い返さない
      if(o && o.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
      lockWrite();
    }, LOCK_BEAT);
  }, LOCK_WAIT);
}

/* このページを離れるときは使用権を手放す。
   握ったままだと、同じタブで読み込み直しただけで
   「別のタブが開いている」と誤判定する */
function releaseLock(){
  if(LOCK_RELEASE){ try{ LOCK_RELEASE(); }catch(e){} LOCK_RELEASE=null; }
  const o = lockRead();
  if(o && o.id===TAB_ID){ try{ localStorage.removeItem(LOCK_KEY); }catch(e){} }
}
window.addEventListener('pagehide', releaseLock);
/* 戻るボタンなどで表に戻ってきたら取り直す */
window.addEventListener('pageshow', e=>{ if(e.persisted){ window.WRITE_OK=false; claimLock(); } });

window.addEventListener('storage', e=>{
  if(e.key!==LOCK_KEY || !window.WRITE_OK || LOCK_MODE!=='storage') return;
  const o = lockRead();
  if(o && o.id!==TAB_ID) goReadOnly(WHY_OTHER_TAB);
});

/* 記録に関わる書き込みは必ずここを通す。
   端末ごとの好み（地図の種類・下書き）は記録ではないので対象外 */
function writeAllowed(){
  if(SAVE_FATAL){
    toast('保存の後片付けに失敗しています。ページを読み込み直してください', 6000);
    return false;
  }
  // 抜け道は作らない。どの経路でも、保存の直前に使用権を確かめる
  if(ownsLock()) return true;
  if(window.WRITE_OK){
    // 旗は立っているのに使用権が無い＝裏で別のタブに取られた
    goReadOnly(WHY_OTHER_TAB);
    return false;
  }
  toast(window.READ_ONLY ? LOCK_WHY
    : '起動時の確認が終わるまで保存できません。数秒待ってからやり直してください', 5000);
  return false;
}

/* ============================================================
   保存層（localStorage）
   削除は deleted_at を立てる論理削除のみ。
   保存に失敗したら false を返す。呼び出し側は「できたことにしない」
   ============================================================ */
const DB = {
  key:{ sv:'fs_surveys', st:'fs_stations', ca:'fs_catches',
        ind:'fs_individuals', nt:'fs_notes' },

  /* 壊れていても空配列を返す。表示用 */
  load(k){ try{ const a=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(a)?a:[]; }
           catch(e){ return []; } },
  /* 壊れていたら例外にする。「本当に空」と「読めない」を区別する必要がある処理用
     （バックアップ・完全削除・書き出しなど、空を鵜呑みにすると記録を失うもの） */
  loadRaw(k){
    const raw = localStorage.getItem(k);
    if(raw===null || raw==='') return [];
    let a; try{ a=JSON.parse(raw); }
    catch(e){ throw new Error('保存された記録を読み取れません: '+k); }
    if(!Array.isArray(a)) throw new Error('保存された記録の形がおかしいです: '+k);
    return a;
  },
  save(k, arr){
    if(!writeAllowed()) return false;
    try{ localStorage.setItem(k, JSON.stringify(arr)); return true; }
    catch(e){
      toast('保存できませんでした。端末の空き容量を確認してください', 6000);
      return false;
    }
  },
  get(k,u){ return this.load(k).find(x=>x.uuid===u) || null; },
  /* 生きているものだけ返す。消したはずのものが画面に出ないよう、
     画面はこちらを使う（get はごみ箱・復元のためのもの） */
  getAlive(k,u){ const r=this.get(k,u); return (r && !r.deleted_at) ? r : null; },
  /* 箇所は、親の調査も生きているときだけ返す。
     調査を消したのに、中の箇所だけ開けてしまうのを防ぐ */
  liveStation(u){
    const st = this.getAlive(this.key.st, u);
    if(!st) return null;
    return this.getAlive(this.key.sv, st.survey_uuid) ? st : null;
  },
  alive(k){ return this.load(k).filter(x=>!x.deleted_at); },

  upsert(k, rec){
    if(!rec.uuid) rec.uuid = uuid();
    rec.updated_at = nowISO();
    let a; try{ a=this.loadRaw(k); }
    catch(e){ toast('保存された記録を読み取れないため、保存を中止しました', 6000); return false; }
    const i = a.findIndex(x=>x.uuid===rec.uuid);
    if(i<0){ rec.created_at = rec.created_at || nowISO(); a.push(rec); }
    else a[i] = rec;
    return this.save(k, a) ? rec : false;
  },
  softDelete(k, u, by){
    let a; try{ a=this.loadRaw(k); }
    catch(e){ toast('記録を読み取れないため、削除を中止しました', 6000); return false; }
    const t = nowISO();
    let hit=false;
    a.forEach(x=>{ if(x.uuid===u && !x.deleted_at){ x.deleted_at=t; if(by) x.deleted_by=by; hit=true; } });
    if(!hit) return true;
    return this.save(k, a);
  },
  restore(k, u){
    let a; try{ a=this.loadRaw(k); }catch(e){ return false; }
    a.forEach(x=>{ if(x.uuid===u){ delete x.deleted_at; delete x.deleted_by; } });
    return this.save(k, a);
  },

  /* 親子のたどり方 */
  surveys(){ return this.alive(this.key.sv)
    .sort((a,b)=> String(b.survey_date||'').localeCompare(String(a.survey_date||''))
               || String(b.created_at||'').localeCompare(String(a.created_at||''))); },
  stationsOf(sv){ return this.alive(this.key.st).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=> (a.station_no||0)-(b.station_no||0)); },
  catchesOf(st){
    // 親の箇所（とその親の調査）が消えていれば、中の記録も見せない
    if(!this.liveStation(st)) return [];
    return this.alive(this.key.ca).filter(x=>x.station_uuid===st)
      .sort((a,b)=> String(a.created_at||'').localeCompare(String(b.created_at||'')));
  },
  /* 消した箇所にぶら下がる記録は見せない。
     子にも印を付けて回ると、途中で保存に失敗したとき迷子の記録が残る。
     印は親に1つだけ付け、見るときに親の生死で絞る（2026-08-16 の監査 Critical） */
  catchesOfSurvey(sv){
    const live = new Set(this.stationsOf(sv).map(x=>x.uuid));
    return this.alive(this.key.ca)
      .filter(x=>x.survey_uuid===sv && (!x.station_uuid || live.has(x.station_uuid)));
  },
  individualsOf(ca){ return this.alive(this.key.ind).filter(x=>x.catch_uuid===ca)
    .sort((a,b)=> (a.individual_number||0)-(b.individual_number||0)); },
  notesOf(sv){ return this.alive(this.key.nt).filter(x=>x.survey_uuid===sv); },
};

/* ---------- 完全に消した記録の印（墓標） ----------

    .filter(t=>t && typeof t.uuid==='string' && t.uuid);

  const a=tombstones();

}

/* inds を渡すと、その一覧から数える（書き出しのときは「壊れていたら止める」読み方で
   取った控えを渡す）。渡さないときは画面表示用の読み方 */
function catchTotal(c, inds){
  if(!c) return 0;
  const list = indsOf(inds, c.uuid);
  const measured = list.length;
  const un = countOf(c.count_unmeasured);
  return measured + (un==='' || un===null ? 0 : un);
}
function catchLengths(c, inds){

}
/* 1尾ずつの記録を取り出す。控え（記録ごとにまとめたもの）があればそれを使う */
function indsOf(inds, catchUuid){
  if(!inds) return DB.individualsOf(catchUuid);
  if(inds.byCatch) return inds.byCatch[catchUuid] || [];
  return inds.filter(i=>i.catch_uuid===catchUuid && !i.deleted_at);
}

   川の環境（測点・河床材の割合・岸のカバー）
   ============================================================ */
function envPoints(st){ return (st && Array.isArray(st.env_points)) ? st.env_points : []; }

/* 測点から最小・最大・平均を出す。代表値は手入力があればそちら。
   0 を落とさないよう nums() を通す（淵の流速0・干出部の水深0は測った値） */
function pointStats(st, field, manualField){
  const v = nums(envPoints(st).map(p=>p[field]));
  const manual = numOf(st[manualField]);
  const avg = v.length ? v.reduce((a,b)=>a+b,0)/v.length : '';
  return {
    n: v.length,
    min: v.length ? Math.min.apply(null,v) : '',
    max: v.length ? Math.max.apply(null,v) : '',
    avg, manual,
    rep: manual!=='' ? manual : avg,
  };
}
function depthStats(st){ return pointStats(st, 'depth_cm', 'depth_rep_cm'); }
function velocityStats(st){ return pointStats(st, 'velocity_cms', 'velocity_rep_cms'); }

/* 河床材の割合（7区分） */
function substratePct(st){
  const o = st && st.substrate_pct;
  return (o && typeof o === 'object') ? o : {};
}
function substratePctSum(st){
  const p = substratePct(st);
  return OPT.substrate.reduce((a,k)=>{ const v=numOf(p[k]); return a + (v===''?0:v); }, 0);
}
/* 割合の多い順。優占・次優占を出すのに使う */
function substrateRank(st){
  const p = substratePct(st);
  return OPT.substrate
    .map(k=>({name:k, pct: numOf(p[k])===''?0:numOf(p[k])}))
    .filter(x=>x.pct>0)
    .sort((a,b)=>b.pct-a.pct);
}

/* 岸のカバー。side は 'left' か 'right' */
function coverList(st, side){
  const a = st && st['cover_'+side];
  return Array.isArray(a) ? a.filter(x=>x && x.type) : [];
}
function coverPctSum(st, side){
  return coverList(st, side).reduce((a,c)=>{ const v=numOf(c.pct); return a+(v===''?0:v); }, 0);
}
/* カバーがあるか。「なし」だけならカバー無し */
function coverPresent(st, side){
  const list = coverList(st, side);
  if(!list.length) return '';
  return list.some(c=>c.type && c.type!=='なし') ? 'あり' : 'なし';
}

/* ============================================================
   とった労力（通電秒数・歩いた距離・調べた面積）
   ============================================================ */
const TRACK_MIN_MOVE = 3;      // これ未満しか動いていなければ、軌跡に足さない（m）
const TRACK_SAVE_MS  = 15000;  // 軌跡を保存する間隔（書き込みすぎを防ぐ）

/* いまの通電秒数。押しっぱなしの分は、実際の時計で足す。
   秒数を数え続ける仕掛けを持たないので、画面を移してもアプリを閉じても狂わない */
function effortSeconds(st){
  if(!st) return 0;
  const base = numOf(st.effort_seconds);
  let n = base==='' ? 0 : base;
  if(st.effort_started_at){
    const t = Date.parse(st.effort_started_at);
    if(isFinite(t)) n += Math.max(0, (Date.now()-t)/1000);
  }
  return n;
}
function effortRunning(st){ return !!(st && st.effort_started_at); }

/* 区間の長さ。
   電気ショッカーは行きつ戻りつするので、軌跡の総延長をそのまま使うと
   同じ50mを3往復して150mになる。面積が3倍、単位努力量あたりの尾数が
   3分の1になり、労力を記録する意味が消える。
   だから既定は「始点から終点までの直線」。軌跡も残して、後から確かめられるようにする */
function stationLengths(st){
  const track = (st.track||[]).filter(validPt);
  const trackLen = pathLength(track);
  let straight = '';
  const a = track.length ? track[0] : null;
  const b = track.length ? track[track.length-1] : null;
  if(a && b) straight = distMeters(a, b);
  const manual = numOf(st.length_m_manual);
  const used = manual!=='' ? manual : (straight!=='' && straight>0 ? straight : trackLen);
  return {track:trackLen, straight, manual, used};
}
function stationAreas(st){
  const L = stationLengths(st).used;
  const w = numOf(st.width_m);
  const calc = (w==='' || !isFinite(L)) ? '' : L * w;
  const manual = numOf(st.area_m2_manual);
  const used = manual!=='' ? manual : calc;
  return {calc, manual, used};
}
/* 調査ぜんぶの合計。箇所の「使う値」を足す */
function surveyLengths(sv){
  const auto = DB.stationsOf(sv.uuid)
    .reduce((a,st)=>{ const v=stationLengths(st).used; return a + (isFinite(v)?v:0); }, 0);
  const manual = numOf(sv.survey_length_m_manual);
  return {auto, manual, used: manual!=='' ? manual : auto};
}
function surveyAreas(sv){
  const auto = DB.stationsOf(sv.uuid)
    .reduce((a,st)=>{ const v=stationAreas(st).used; return a + (v===''||!isFinite(v)?0:v); }, 0);
  const manual = numOf(sv.survey_area_m2_manual);
  return {auto, manual, used: manual!=='' ? manual : auto};
}
/* 単位努力量あたりの尾数 */
function cpue(st){
  const n = stationTotal(st);
  const sec = effortSeconds(st);
  const area = stationAreas(st).used;
  return {
    per100s: sec>0 ? n/sec*100 : '',
    per100m2: (area!=='' && area>0) ? n/area*100 : '',
  };
}

/* ---- 歩いた道すじを記録する ---- */
let TRACK_SAVED_AT = 0;
function trackTick(fix){
  if(!fix || !window.WRITE_OK) return;
  if(fix.acc > GPS_MAX_ACC) return;        // 粗すぎる位置は使わない
  const sv = DB.surveys().find(x=>x.status==='調査中');
  if(!sv) return;
  const st = DB.stationsOf(sv.uuid).find(x=>!x.ended_at);
  if(!st) return;
  const pt = [fix.lat, fix.lon];
  if(!validPt(pt)) return;
  const track = (st.track||[]).filter(validPt);
  const last = track.length ? track[track.length-1] : null;
  // 立ち止まっていても距離が伸びるのを防ぐ
  if(last && distMeters(last, pt) < TRACK_MIN_MOVE) return;
  track.push(pt);
  st.track = track;
  if(Date.now() - TRACK_SAVED_AT < TRACK_SAVE_MS){
    return;                                 // 書き込みすぎない。次の機会にまとめて保存
  }
  if(DB.upsert(DB.key.st, st)) TRACK_SAVED_AT = Date.now();
}

/* ============================================================
   下書き（画面を離れても書きかけを失わない）
   「開いただけ」で入る自動の値は下書きに数えない。
   数えてしまうと、開いて戻っただけで書きかけが残り続ける
   ============================================================ */
function draftAll(){ try{ return JSON.parse(localStorage.getItem('fs_draft_edit')||'{}')||{}; }
  catch(e){ return {}; } }
function draftSave(key, obj){
  const a=draftAll();
  if(obj===null) delete a[key]; else a[key]=obj;
  try{ localStorage.setItem('fs_draft_edit', JSON.stringify(a)); }catch(e){}
}
function draftGet(key){ return draftAll()[key] || null; }
function draftClear(key){ draftSave(key, null); }

/* 入力中の書きかけを控える。
   画面ごとに「どこから値を集めるか」を登録し、入力のたびに保存する。
   登録するだけで保存していなかったので、戻ったり読み込み直すと消えていた
   （2026-08-16 の監査 Major） */
let DRAFT_KEY=null, DRAFT_GET=null, DRAFT_BASE=null;
/* 画面を開いた時点の中身を控えておき、そこから変わったときだけ保存する。
   「どの欄なら書きかけとみなすか」を並べる方式だと、
   並べ忘れた欄（調査日・季節・同定の確からしさ など）だけを直したときに
   書きかけが消える（2026-08-16 の3回目の監査 Major） */
/* base を渡すと、それを「元の姿」とする。
   渡さないと、書きかけを戻した後の姿を元と勘違いし、
   同じ値に戻したときに書きかけを消してしまう（4回目の監査 Major） */
function draftBind(key, get, base){
  DRAFT_KEY=key; DRAFT_GET=get;
  try{ DRAFT_BASE = JSON.stringify(base!==undefined ? base : get()); }
  catch(e){ DRAFT_BASE=null; }
}
function draftUnbind(){ DRAFT_KEY=null; DRAFT_GET=null; DRAFT_BASE=null; }
function draftTouch(){
  if(!DRAFT_KEY || !DRAFT_GET) return;
  let d; try{ d=DRAFT_GET(); }catch(e){ return; }
  // 開いたときのまま（＝何も触っていない）なら、書きかけを残さない
  if(DRAFT_BASE!==null && JSON.stringify(d)===DRAFT_BASE) draftClear(DRAFT_KEY);
  else draftSave(DRAFT_KEY, d);
}
// バブル段階で受ける。先回りで受けると、onchange で季節を入れ直す前の
// 古い値を控えてしまう（2026-08-16 の再監査 Major）
document.addEventListener('input',  draftTouch);
document.addEventListener('change', draftTouch);

/* 選ぶボタンの状態を書き戻す */
function applySeg(field, val){
  if(val===undefined || val===null) return;
  const wrap=document.querySelector(`[data-seg="${field}"]`); if(!wrap) return;
  const want = val==='' ? 'なし' : val;
  Array.from(wrap.querySelectorAll('button')).forEach(b=>
    b.classList.toggle('on', b.textContent===want));
}
function applySegMulti(field, vals){
  if(!Array.isArray(vals)) return;
  const wrap=document.querySelector(`[data-segmulti="${field}"]`); if(!wrap) return;
  Array.from(wrap.querySelectorAll('button')).forEach(b=>
    b.classList.toggle('on', vals.indexOf(b.textContent)>=0));
}
function applyVals(map){
  Object.keys(map).forEach(sel=>{

    if(el && v!==undefined && v!==null) el.value=v;

/* ============================================================
   画面のしくみ
   ============================================================ */
let STACK = [{name:'home', arg:null}];
/* 画面を描くたびに増える番号。GPSや写真のような時間のかかる処理は
   始めた時の番号を覚えておき、終わった時に変わっていたら何もしない。
   そうしないと、待っている間に別の記録を開いたとき、そちらに書き込んでしまう */
let SCREEN_SEQ = 0;
function screenGen(){ return SCREEN_SEQ; }
function screenStale(gen){ return gen !== SCREEN_SEQ; }
const SCREENS = {};

function nav(name, arg){ STACK.push({name,arg}); render(); }
function goBack(){ if(STACK.length>1){ STACK.pop(); render(); } }
/* 履歴を丸ごと捨てる。起動時とホームへ戻すときだけに使う。
   保存のあとにこれを使うと、前の画面へ戻れなくなる（2026-08-16 の監査 Major） */
function reset(name,arg){ STACK=[{name:name||'home',arg:arg||null}]; render(); }

/* 保存のあとの行き先。履歴を捨てず、親までの道すじを組み直す。
   例) goTo('station', stUuid) → home > survey > station
   こうすると「戻る」で調査ハブ、もう一度でホームへ戻れる */
function goTo(name, arg){
  STACK = buildChain(name, arg);
  render();
}
/* 画面から親をたどって道すじを作る */
function buildChain(name, arg){
  const home = {name:'home', arg:null};
  if(name==='home') return [home];
  if(name==='survey') return [home, {name:'survey', arg:arg}];
  if(name==='station'){
    const st = DB.liveStation(arg);
    // 消された箇所なら、そこへは連れて行かない。ホームへ帰す
    return st ? [home, {name:'survey', arg:st.survey_uuid}, {name:'station', arg:arg}]
              : [home];
  }
  return [home, {name, arg}];
}
/* いまの画面を別の画面に置き換える（積み上げない） */
function navReplace(name, arg){
  if(!STACK.length) STACK=[{name:'home',arg:null}];
  STACK[STACK.length-1] = {name, arg};
  render();
}

let EFFORT_TIMER = null;
let ENV_GPS_TIMER = null;
function render(){
  SCREEN_SEQ++;
  draftUnbind();
  if(EFFORT_TIMER){ clearInterval(EFFORT_TIMER); EFFORT_TIMER=null; }
  if(ENV_GPS_TIMER){ clearInterval(ENV_GPS_TIMER); ENV_GPS_TIMER=null; }
  destroyMaps();
  const cur = STACK[STACK.length-1];
  const scr = SCREENS[cur.name] || SCREENS.home;
  let v;
  try{ v = scr(cur.arg); }
  catch(e){ console.error(e); toast('画面を開けませんでした'); v = SCREENS.home(); }
  if(!v){
    // 消された記録などで画面が作れないときは、ホームへ帰す
    STACK=[{name:'home',arg:null}]; v = SCREENS.home();
  }
  $('#title').textContent = v.title || '魚類調査記録';
  $('#backBtn').style.display = STACK.length>1 ? '' : 'none';
  const pills = (v.sub||[]).slice();
  if(window.READ_ONLY) pills.unshift({text:'閲覧のみ', cls:'ng'});
  else if(!window.WRITE_OK) pills.unshift({text:'確認中', cls:'warn'});
  $('#sub').innerHTML = pills.map(s=>
    `<span class="pill ${s.cls||''}">${esc(s.text)}</span>`).join('');
  $('#main').innerHTML = (window.READ_ONLY
      ? `<div class="ngbox">${esc(LOCK_WHY)}</div>` : '') + (v.html || '');
  window.scrollTo(0,0);
  if(v.onMount) try{ v.onMount(); }catch(e){ console.error(e); }
}

/* ============================================================
   位置（GPS）
   ============================================================ */
const GPS_MAX_ACC = 50;     // これより粗い位置は軌跡に使わない（m）
let lastFix = null;         // {lat, lon, acc, t}
let gpsWatchId = null;

function startGps(){
  if(gpsWatchId!=null || !navigator.geolocation) return;
  gpsWatchId = navigator.geolocation.watchPosition(p=>{
    lastFix = {lat:p.coords.latitude, lon:p.coords.longitude,
               acc:p.coords.accuracy, t:Date.now()};
    try{ trackTick(lastFix); }catch(e){}
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function stopGps(){ if(gpsWatchId!=null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; } }
/* 古い測位を使わない。前の地点の座標が付くのを防ぐ */
function freshFix(maxAgeMs){
  if(!lastFix) return null;
  return (Date.now()-lastFix.t) <= (maxAgeMs||30000) ? lastFix : null;
}
function validPt(p){ return Array.isArray(p) && p.length===2 && isFinite(p[0]) && isFinite(p[1])
  && Math.abs(p[0])<=90 && Math.abs(p[1])<=180; }
function distMeters(a,b){
  const R=6378137, rad=Math.PI/180;
  const y=(b[0]-a[0])*rad;
  const x=(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad);
  return Math.sqrt(x*x+y*y)*R;
}
function pathLength(path){
  const p=(path||[]).filter(validPt); let d=0;
  for(let i=1;i<p.length;i++) d+=distMeters(p[i-1],p[i]);
  return d;
}
/* 位置を1回だけ取る。決め方（GPS/地図/手入力）は呼び出し側が書く。
   ここで position_source を書き換えない（上書きすると、地図で置いた位置がGPS扱いになる） */
function getFixOnce(cb){
  if(!navigator.geolocation){ cb(null); return; }
  const g = screenGen();
  navigator.geolocation.getCurrentPosition(p=>{
    if(screenStale(g)) return;
    cb({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy});
  }, ()=>{ if(!screenStale(g)) cb(null); },
     {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
}

let OPOLYLAYER=null;   // 囲った範囲の線（destroyMaps が片付ける）
/* ============================================================
   地図
   画像ファイルを使わない作りにする（文字ボタン＋divIcon）。
   leaflet.css は images/*.png を参照するので、同梱しないと「？」に化ける
   ============================================================ */
const BASEMAPS = {
  '航空写真': {url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
               max:18, attr:'国土地理院'},
  '地形図':   {url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
               max:18, attr:'国土地理院'},
  '淡色地図': {url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',
               max:18, attr:'国土地理院'},
};
function baseMapName(){ const v=prefs().basemap; return BASEMAPS[v] ? v : '航空写真'; }
/* 地図はここ1か所で持つ。let で宣言した変数を window['名前'] で触ると
   別のものになり、画面を離れても地図が残る（同じ場所に2つ目を作れず壊れる） */
const MAPS = { main:{map:null, layer:null}, off:{map:null, layer:null} };
function destroyMaps(){
  Object.keys(MAPS).forEach(k=>{
    const s = MAPS[k];
    if(s.map){ try{ s.map.remove(); }catch(e){} }
    s.map=null; s.layer=null;
  });
  OPOLYLAYER=null;
}
function makeMap(elId, center, zoom){
  const el = document.getElementById(elId);
  if(!el || !window.L) return null;
  const m = L.map(el, {zoomControl:true, attributionControl:true})
             .setView(center||[43.06,141.35], zoom||14);

}
function applyBaseMap(slot, name){
  const s = MAPS[slot];
  if(!s || !s.map) return;
  const b = BASEMAPS[name] || BASEMAPS['航空写真'];
  if(s.layer){ try{ s.map.removeLayer(s.layer); }catch(e){} }
  // crossOrigin を付けると、中身の分かる応答で返るので保存の可否が判断できる
  s.layer = L.tileLayer(b.url, {maxZoom:b.max, maxNativeZoom:b.max,
                                attribution:b.attr, crossOrigin:true})
    .addTo(s.map);
}
function baseMapButtonsHtml(){
  const cur = baseMapName();
  return `<div class="seg basemap" style="margin-bottom:8px">` + Object.keys(BASEMAPS).map(n=>
    `<button type="button" class="${n===cur?'on':''}" onclick="switchBaseMap(this,'${esc(n)}')">${esc(n)}</button>`
  ).join('') + `</div>`;
}
function switchBaseMap(btn, name){
  if(!BASEMAPS[name]) return;
  pickSeg(btn); prefSet('basemap', name);
  applyBaseMap('main', name);
  applyBaseMap('off', name);
}
/* 丸い印。画像を使わない */
function dotIcon(color, size){

/* 現在地ボタン。画像を使わない自前のコントロール */
function addLocateControl(map){
  const C = L.Control.extend({
    options:{position:'topleft'},
    onAdd(){
      const d = L.DomUtil.create('div','leaflet-bar');
      const a = L.DomUtil.create('a','',d);

/* ============================================================
   オフライン地図（範囲を囲って先に落としておく）
   ============================================================ */
function lon2tx(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2ty(lat,z){ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
function polyBounds(poly){
  const lats=poly.map(p=>p[0]), lons=poly.map(p=>p[1]);
  return {s:Math.min.apply(null,lats), n:Math.max.apply(null,lats),
          w:Math.min.apply(null,lons), e:Math.max.apply(null,lons)};
}
function pointInPoly(lat, lon, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function tx2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function ty2lat(y,z){ const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }
/* 2本の線分が交わるか */
function segCross(a1,a2,b1,b2){
  const d=(p,q,r)=>(q[1]-p[1])*(r[0]-q[0])-(q[0]-p[0])*(r[1]-q[1]);
  const s1=d(a1,a2,b1), s2=d(a1,a2,b2), s3=d(b1,b2,a1), s4=d(b1,b2,a2);
  return ((s1>0)!==(s2>0)) && ((s3>0)!==(s4>0));
}
/* タイルが範囲にかかるか。
   四隅と中心を見るだけだと、
   ・囲った範囲がタイル1枚の中にすっぽり収まるとき
   ・細長い範囲がタイルを横切るだけのとき
   を取りこぼし、粗い倍率で地図が欠ける（2026-08-16 の監査 Major）。
   タイルの角が範囲に入るか／範囲の角がタイルに入るか／辺どうしが交わるか、の3つで見る */
function tileHitsPoly(x,y,z,poly){
  const w=tx2lon(x,z), e=tx2lon(x+1,z), n=ty2lat(y,z), s=ty2lat(y+1,z);
  // 1) タイルの角か中心が、囲った範囲の中にある
  const pts=[[n,w],[n,e],[s,w],[s,e],[(n+s)/2,(w+e)/2]];
  if(pts.some(p=>pointInPoly(p[0],p[1],poly))) return true;
  // 2) 囲った範囲の角が、タイルの中にある（範囲がタイルに収まる場合）
  const inTile=p=>p[0]>=s && p[0]<=n && p[1]>=w && p[1]<=e;
  if(poly.some(inTile)) return true;
  // 3) 辺どうしが交わる（横切るだけの場合）
  const corners=[[n,w],[n,e],[s,e],[s,w]];
  for(let i=0;i<poly.length;i++){
    const a1=poly[i], a2=poly[(i+1)%poly.length];
    for(let j=0;j<4;j++){
      if(segCross(a1,a2,corners[j],corners[(j+1)%4])) return true;
    }
  }
  return false;
}
function packTiles(poly, zmax){
  const out=[];
  for(let z=10; z<=zmax; z++){
    const b=polyBounds(poly);
    const x0=lon2tx(b.w,z), x1=lon2tx(b.e,z);
    const y0=lat2ty(b.n,z), y1=lat2ty(b.s,z);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
      if(tileHitsPoly(x,y,z,poly)) out.push([x,y,z]);
    }
  }
  return out;
}
function packTileUrls(poly, zmax, layers){
  const tiles = packTiles(poly, zmax);
  const urls=[];
  (layers||[]).forEach(name=>{
    const b=BASEMAPS[name]; if(!b) return;
    tiles.forEach(([x,y,z])=>{
      if(z>b.max) return;
      urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y));
    });
  });
  return urls;
}
function packEstimate(poly, zmax, layers){
  const n = packTileUrls(poly, zmax, layers).length;
  return {tiles:n, mb: Math.round(n*0.02*10)/10};   // 1枚 約20KB で見積もる
}
/* 読むだけ。読むついでに書き換えると、閲覧のみのタブでも保存領域を触ってしまい、
   2枚のタブが別々の印を付けて上書き合う（2026-08-16 の4回目の監査 Major） */
function packStore(){
  let a;
  try{ a = JSON.parse(localStorage.getItem('fs_map_packs')||'[]'); }
  catch(e){ return []; }
  return Array.isArray(a) ? a.filter(Boolean) : [];
}
function packSaveList(a){
  try{ localStorage.setItem('fs_map_packs', JSON.stringify(a)); return true; }
  catch(e){ return false; }
}
/* 昔の記録には印（id）が無い。無いまま扱うと、どの「消す」を押しても
   印の無いものが全部まとめて一覧から消える。
   付け直すのは書き込みなので、使用権を持つタブではっきり行う。
   付け直せたかどうかを返す */
function migratePackIds(){
  const a = packStore();
  const seen = new Set();
  let changed = false;
  a.forEach(p=>{
    if(!p.id || seen.has(p.id)){ p.id = uuid(); changed = true; }
    seen.add(p.id);
  });
  if(!changed) return true;
  if(!ownsLock()) return false;      // 閲覧のみのタブでは触らない
  return packSaveList(a);
}
/* サービスワーカーに頼む（返事を待つ） */
function swAsk(msg, timeoutMs){
  return new Promise((res,rej)=>{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ rej(new Error('オフライン用の仕組みが動いていません')); return; }
    const ch = new MessageChannel();
    const t = setTimeout(()=>{
      // 返事が無いだけで、向こうはまだ動いているかもしれない。
      // 「失敗した」とは違うので、呼び出し側が区別できるよう印を付ける
      const err = new Error('返事がありません');
      err.timeout = true;
      rej(err);
    }, timeoutMs||120000);
    ch.port1.onmessage = e=>{ clearTimeout(t); res(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}

/* ============================================================
   書き出し
   列の決め方は1か所にまとめる。CSVも他の書き出しも同じものを見る

/* 魚類データベース「資料管理 → 調査記録 → CSV/Excelから一括インポート」の
   テンプレートと1文字も違わないこと。csvdb テストが照合する */
const FS_DB_COLS = ['緯度','経度','調査日','季節','天気','水温','水深','流速',
  '河川名','地点名','区間名','河川形態A','河川形態B','河床材料','礫の状況','環境区分',
  '調査区分','調査方法','種ID','個体数','最大体長','最小体長','同定確度',
  'コピー数','在不在','流量','開始時刻','終了時刻','備考','業務番号','業務名'];

function download(filename, text, mime){
  downloadBlob(filename, new Blob([text], {type: mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function csvCell(v){
  v = v==null ? '' : String(v);
  // Excelの数式として読まれるのを防ぐ。数値（マイナスの緯度経度など）はそのまま通す
  if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d+(\.\d+)?$/.test(v)) v = "'"+v;
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCsv(cols, rows){
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n');
}
/* 緯度経度は全部の行で同じ文字列にする。
   桁がばらつくと、取り込み側が別々の調査として分けてしまう */
function fixCoord(v){ const n=numOf(v); return n==='' ? '' : n.toFixed(6); }
/* 内部は cm・cm/s で持ち、書き出す瞬間に m・m/s に直す */
function cmToM(v){ const n=numOf(v); return n==='' ? '' : (n/100); }

/* 取り込み側が「同じ箇所」とみなす手がかり。
   この12項目の文字が全部同じだと、別々の箇所が1つにまとめられてしまう。
   魚類データベース app/pages/4_資料管理.py の _HABITAT_KEY と同じ並び */
const FS_HABITAT_KEY = ['環境区分','河川形態B','水温','水深','流速','流量',
  '河床材料','礫の状況','調査区分','調査方法','開始時刻','終了時刻'];

/* データベース取り込み用の行を組み立てる。
   1行 = 1種の結果。落とすものは黙って落とさず、理由と件数を返す */
/* 書き出しのための控えを取る。
   ここは「読めない」を「空」と取り違えてはいけない場所なので、
   壊れていたら例外にする読み方（loadRaw）を使う。
   表示用の読み方だと、体長の記録が壊れていたとき尾数を少なく出してしまう
   （2026-08-16 の監査 Critical） */
function exportSnapshot(){
  const box = {};
  [['st', DB.key.st, '箇所'], ['ca', DB.key.ca, '魚の記録'],
   ['ind', DB.key.ind, '1尾ずつの記録']].forEach(([k, key, label])=>{
    try{ box[k] = DB.loadRaw(key).filter(x=>x && !x.deleted_at); }
    catch(e){ throw new Error(label + 'を読み取れません。書き出しを中止しました'); }
  });
  // 1尾ずつの記録は、記録ごとにまとめておく。
  // 毎回すべてを見に行くと、記録が増えたときに時間がかかりすぎる
  box.byCatch = {};
  box.ind.forEach(i=>{
    const k = i.catch_uuid;
    if(!k) return;
    (box.byCatch[k] || (box.byCatch[k]=[])).push(i);
  });
  return box;
}

function buildDbRows(sv){
  const rows=[], excluded=[], blocked=[], warnings=[];

  let snap;
  try{ snap = exportSnapshot(); }
  catch(e){
    // 読めないものがある。空として出すと記録を取りこぼすので、何も作らずに止める
    return {rows:[], excluded:[], warnings:[], blocked:[e.message]};
  }

  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid)
    .sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  const lat = fixCoord(sv.latitude), lon = fixCoord(sv.longitude);
  if(lat==='' || lon===''){
    blocked.push('調査の位置（緯度経度）が入っていません');
  }
  stations.forEach(st=>{
    // 開始・終了時刻が空だと、取り込み側が別々の箇所を1つにまとめてしまう
    if(!st.survey_time_start){
      blocked.push(`${st.name||'箇所'}：開始時刻が入っていません`);
    }
    snap.ca.filter(c=>c.station_uuid===st.uuid)
      .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')))
      .forEach(c=>{
      const name = c.species_name || '(種名なし)';
      const bad = badCount(c, snap);
      if(bad){ blocked.push(`${name}：${bad}`); return; }
      const n = catchTotal(c, snap);
      if(!c.species_id){ excluded.push(`${name}（種IDがありません）`); return; }
      if(n<=0){ excluded.push(`${name}（尾数が0です）`); return; }
      rows.push(dbRowOf(sv, st, c, snap));
    });
  });
  // 別々の箇所が1つにまとめられてしまう組み合わせを探す。
  // 実際に書き出す文字で見る（画面の値ではなく、CSVに載る形で比べる）
  const seen = {};
  stations.forEach(st=>{
    const src = dbRowOf(sv, st, null, snap);
    const k = FS_HABITAT_KEY.map(c=>String(src[c]==null?'':src[c])).join('');
    if(seen[k]) warnings.push(`${seen[k]} と ${st.name} は、取り込み側で1つの箇所にまとめられます`);
    else seen[k] = st.name;
  });

  return {rows, excluded, blocked, warnings};
}
/* CSVの1行を組み立てる。c が null なら魚の欄は空のまま（箇所の鍵を調べるときに使う） */
function dbRowOf(sv, st, c, inds){

  return {
    '緯度': fixCoord(sv.latitude), '経度': fixCoord(sv.longitude),
    '調査日':sv.survey_date||'', '季節':sv.season||'', '天気':sv.weather||'',
    '水温': numOf(st.water_temp),
    // 代表値は「手入力があればそれ、無ければ測点の平均」
    '水深': cmToM(depthStats(st).rep),
    '流速': cmToM(velocityStats(st).rep),
    '河川名':sv.river_name||'', '地点名':sv.site_name||'', '区間名':sv.section_name||'',
    '河川形態A':sv.river_morphology_a||'', '河川形態B':st.river_morphology_b||'',
    '河床材料':st.substrate1||'', '礫の状況':st.gravel_condition||'',

    '種ID': c ? (c.species_id||'') : '', '個体数': c ? catchTotal(c, inds) : '',
    '最大体長': ls.length ? Math.max.apply(null,ls) : '',

/* 入力欄から値を集める。下書きの保存と、保存ボタンの両方で使う */
function collectSurvey(){
  return {
    survey_date: strVal('#f_date'), season: segVal('season'), weather: segVal('weather'),
    river_name: strVal('#f_river'), site_name: strVal('#f_site'),
    section_name: strVal('#f_section'), river_morphology_a: segVal('formA'),
    latitude: strVal('#f_lat'), longitude: strVal('#f_lon'),
    project_number: strVal('#f_pno'), project_name: strVal('#f_pname'),
    investigator: strVal('#f_inv'), survey_type_default: segVal('svtype'),
    detail_level: segVal('detail'), memo: strVal('#f_memo'),
  };
}
function onSurveyDate(){
  const s = seasonOf(strVal('#f_date'));
  const wrap = $('#f_season_wrap');
  if(wrap && s) wrap.innerHTML = segHtml('season', OPT.season, s, true);
  draftTouch();      // 入れ直した季節も控える
}
function grabPos(){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    const la=$('#f_lat'), lo=$('#f_lon');
    if(la) la.value = f.lat.toFixed(6);
    if(lo) lo.value = f.lon.toFixed(6);
    const el=$('#posInfo');
    if(el) el.textContent = `決め方：GPS（精度およそ${Math.round(f.acc)}m）`;
    window._posSource = 'GPS'; window._posAcc = f.acc;
    draftTouch();      // 差し込んだ緯度経度は input が起きないので、自分で控える
    toast('現在地を入れました');
  });
}
function saveSurvey(svUuid){
  const rec = svUuid ? (DB.get(DB.key.sv, svUuid)||{uuid:svUuid}) : {uuid:uuid(), status:'未開始'};
  const f = collectSurvey();
  rec.survey_date        = f.survey_date;
  rec.season             = f.season;
  rec.weather            = f.weather;
  rec.river_name         = f.river_name;
  rec.site_name          = f.site_name;
  rec.section_name       = f.section_name;
  rec.river_morphology_a = f.river_morphology_a;
  rec.latitude           = numOf(f.latitude);
  rec.longitude          = numOf(f.longitude);
  if(window._posSource){ rec.position_source = window._posSource; rec.gps_accuracy = window._posAcc; }
  rec.project_number     = f.project_number;
  rec.project_name       = f.project_name;
  rec.investigator       = f.investigator;
  rec.survey_type_default= f.survey_type_default || '採取';
  rec.detail_level       = f.detail_level || '一般';
  rec.memo               = f.memo;
  if(!rec.river_name && !rec.site_name){ toast('河川名か地点名のどちらかは入れてください'); return; }
  const ok = DB.upsert(DB.key.sv, rec);
  if(!ok) return;                       // 保存できていないので画面も動かさない
  window._posSource=null; window._posAcc=null;
  prefSet('project_number', rec.project_number);
  prefSet('project_name', rec.project_name);
  prefSet('investigator', rec.investigator);
  draftClear('survey:'+(svUuid||'new'));
  draftUnbind();
  toast('保存しました');
  if(svUuid) goBack(); else goTo('survey', rec.uuid);
}
function deleteSurvey(u){
  if(!confirm('この調査を削除します。よろしいですか？（ごみ箱に入ります）')) return;
  if(DB.softDelete(DB.key.sv, u)){ toast('削除しました'); reset('home'); }
}

/* ---------- 調査ハブ ---------- */
SCREENS.survey = (svUuid)=>{
  const sv = DB.getAlive(DB.key.sv, svUuid);
  if(!sv) return null;
  const stations = DB.stationsOf(svUuid);
  // 「記録中」は、いま現場にいるときだけの言い方。
  // あとから書き起こしているときに「記録中」と出ると、何かが動いている誤解になる。
  // 詳細（点を打つ形）では、点に「途中」という状態が無いので使わない
  const running  = (isLiveNow(sv) && !isDetail(sv))
    ? stations.find(s=>!s.ended_at) : null;
  const W = stWord(sv);
  const svLen = surveyLengths(sv), svArea = surveyAreas(sv);
  const svSec = stations.reduce((a,st)=>a+effortSeconds(st), 0);
  const nSp = new Set(DB.catchesOfSurvey(svUuid).map(c=>c.species_id).filter(Boolean)).size;
  const stCards = stations.map(st=>{
    const n = stationTotal(st);
    const sp = DB.catchesOf(st.uuid).length;
    return `<div class="card tap" onclick="nav('station','${st.uuid}')">
      <div class="row">
        <div class="grow">
          <div style="font-weight:700">${esc(st.name)}　<span class="dim small">${esc(st.habitat_type||'区分なし')}</span></div>
          <div class="dim small">${st.survey_time_start
            ? esc(st.survey_time_start)+'〜'+esc(st.survey_time_end||'')
            : '<span class="pill ng">時刻なし</span>'}　${sp}種 ${n}尾${
            effortSeconds(st)>0 ? '　通電'+esc(fmtDur(effortSeconds(st))) : ''}${
            isDetail(sv) ? (numOf(st.latitude)!=='' ? '　±'+fmtNum(numOf(st.gps_accuracy),0)+'m'
                                                    : '　<span class="pill ng">位置なし</span>') : ''}</div>
        </div>
        ${(isLiveNow(sv) && !isDetail(sv) && !st.ended_at)
          ? '<span class="pill ok">記録中</span>' : ''}
      </div></div>`;
  }).join('');
  return {
    title: `${sv.river_name||''} ${sv.site_name||''}`.trim() || '調査',
    sub:[{text:fmtDate(sv.survey_date)}, {text:sv.status||'未開始', cls: sv.status==='調査中'?'ok':''},
         {text:`${nSp}種 ${surveyTotal(sv)}尾`}],
    html:`
      ${running
        ? `<button class="btn pri" onclick="nav('station','${running.uuid}')">記録中の ${esc(running.name)} を開く</button>`
        : `<button class="btn pri" onclick="newStation('${svUuid}')">${W}を追加する</button>`}

      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="dim small">いま現場にいるとき</div>
            <div>${sv.status==='調査中'
              ? 'GPSで歩いた道すじを記録しています'
              : '「はじめる」を押すと、時刻が自動で入り、道すじを記録します'}</div>
          </div>
          ${sv.status==='調査中'
            ? `<button class="btn" style="width:auto;margin:0" onclick="endSurvey('${svUuid}')">終える</button>`
            : `<button class="btn ok" style="width:auto;margin:0" onclick="startSurvey('${svUuid}')">はじめる</button>`}
        </div>
        <div class="dim small">押さなくても記録はできます。
          あとから書き起こすときは、そのまま「${W}を追加する」へどうぞ。</div>
      </div>

      ${isDetail(sv) ? '' : `<div class="card">
        <div class="row">
          <div class="grow"><div class="dim small">調べた距離（合計）</div>
            <div>${esc(fmtDist(svLen.used))}</div></div>
          <div class="grow"><div class="dim small">調べた面積（合計）</div>
            <div>${svArea.used===''||!svArea.used?'—':esc(fmtNum(svArea.used,1))+' m²'}</div></div>
          <div class="grow"><div class="dim small">通電（合計）</div>
            <div>${esc(fmtDur(svSec))}</div></div>
        </div>
        <div class="dim small">箇所ごとの「使う値」を足したものです。</div>
      </div>`}

      <h3>${isDetail(sv) ? '地点（打った点）' : '箇所（瀬淵ごと）'}</h3>
      ${stations.length ? stCards : `<div class="card dim">まだ${W}がありません。</div>`}

      <div class="hr"></div>
      <button class="btn" onclick="nav('notes','${svUuid}')">メモ（${DB.notesOf(svUuid).length}件）</button>
      <button class="btn" onclick="nav('map','${svUuid}')">地図で見る</button>
      <button class="btn" onclick="nav('exportHub','${svUuid}')">書き出す</button>
      <button class="btn" onclick="nav('surveyEdit','${svUuid}')">調査の設定</button>
    `,
    onMount(){ startGps(); }
  };
};
function startSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; sv.started_at = sv.started_at || nowISO();
  if(DB.upsert(DB.key.sv, sv)){ startGps(); render(); }
}
function endSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='終了'; sv.finished_at = nowISO();
  if(DB.upsert(DB.key.sv, sv)){ stopGps(); toast('調査を終えました'); render(); }
}
function reopenSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; delete sv.finished_at;
  if(DB.upsert(DB.key.sv, sv)){ render(); }
}

   「調査中」は、GPSで道すじを記録するかどうかの合図にすぎない */
function newStation(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  nav('stationEdit', {survey:svUuid});
}

      const key = 'station:'+(arg.uuid || ('new:'+svUuid));
      const base = collectStation();    // 書きかけを戻す前の姿を控える
      const d = draftGet(key);
      if(d){
        applyVals({'#s_name':d.name, '#s_wt':d.water_temp,
          '#s_memo':d.memo, '#s_lat':d.latitude, '#s_lon':d.longitude,
          '#s_depth':d.depth_rep_cm, '#s_vel':d.velocity_rep_cms,
          '#s_t1':d.survey_time_start, '#s_t2':d.survey_time_end});
        applySeg('habitat', d.habitat_type); applySeg('svtype2', d.survey_type);
        applySeg('sub1', d.substrate1); applySeg('gravel', d.gravel_condition);
        applySegMulti('method', d.survey_method);
        toast('書きかけを戻しました');
      }
      draftBind(key, collectStation, base);
    }
  };
};
function collectStation(){
  return {
    name: strVal('#s_name'), habitat_type: segVal('habitat'),
    survey_time_start: strVal('#s_t1'), survey_time_end: strVal('#s_t2'),
    survey_type: segVal('svtype2'), survey_method: segMultiVal('method'),
    latitude: strVal('#s_lat'), longitude: strVal('#s_lon'),
    depth_rep_cm: strVal('#s_depth'), velocity_rep_cms: strVal('#s_vel'),
    water_temp: strVal('#s_wt'), substrate1: segVal('sub1'),
    gravel_condition: segVal('gravel'), memo: strVal('#s_memo'),
  };
}

function grabStationPos(){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    applyVals({'#s_lat': f.lat.toFixed(6), '#s_lon': f.lon.toFixed(6)});
    const el=$('#stPos');
    if(el) el.textContent = `決め方：GPS（±${Math.round(f.acc)}m）`;
    window._stPosSource='GPS'; window._stPosAcc=Math.round(f.acc);
    draftTouch();
    toast('現在地を入れました');
  });
}
function nowInto(sel){
  const el = $(sel);
  if(!el) return;
  el.value = timeValue();
  draftTouch();
  toast('いまの時刻を入れました');
}
function saveStation(svUuid, stUuid){
  const isNew = !stUuid;
  const sv = DB.getAlive(DB.key.sv, svUuid);
  const rec = isNew
    ? {uuid:uuid(), survey_uuid:svUuid, station_no: DB.stationsOf(svUuid).length+1,
       started_at:nowISO(), env_points:[]}
    : (DB.get(DB.key.st, stUuid)||{uuid:stUuid, survey_uuid:svUuid});
  const f = collectStation();
  rec.name              = f.name || ((isDetail(sv)?'P.':'St.')+(rec.station_no||1));
  rec.survey_time_start = f.survey_time_start;
  rec.survey_time_end   = f.survey_time_end;
  // いま現場にいる調査で、開始の時刻が空のままなら、いまの時刻を入れる。
  // 調査日が今日でないときは入れない（あとから書き起こしている最中なので、
  // 今の時刻を入れると実際の調査時刻と食い違う）
  if(isNew && !rec.survey_time_start && isLiveNow(sv)) rec.survey_time_start = timeValue();
  rec.habitat_type      = f.habitat_type;
  rec.survey_type       = f.survey_type || '採取';
  rec.survey_method     = f.survey_method;
  rec.water_temp        = numOf(f.water_temp);
  rec.substrate1        = f.substrate1;
  rec.gravel_condition  = f.gravel_condition;
  rec.memo              = f.memo;
  if(isDetail(sv)){
    // 点は打った時点で1つの記録。区間のように「はじめて終える」ものではない
    rec.ended_at = rec.ended_at || nowISO();
    // 時刻の幅を持たないので、終わりは始まりと同じにする。
    // 空のままだと、取り込み側が別々の点を1つの箇所にまとめてしまう
    if(rec.survey_time_start && !rec.survey_time_end) rec.survey_time_end = rec.survey_time_start;
    rec.latitude         = numOf(f.latitude);
    rec.longitude        = numOf(f.longitude);
    rec.depth_rep_cm     = numOf(f.depth_rep_cm);
    rec.velocity_rep_cms = numOf(f.velocity_rep_cms);
    if(window._stPosSource){
      rec.position_source = window._stPosSource;
      rec.gps_accuracy    = window._stPosAcc;
    }
    // 新しい地点で、まだ位置が無ければ、いま立っている場所を入れる
    if(isNew && rec.latitude==='' && isLiveNow(sv)){
      const fix = freshFix(20000);
      if(fix && fix.acc<=GPS_MAX_ACC){
        rec.latitude = +fix.lat.toFixed(6);
        rec.longitude = +fix.lon.toFixed(6);
        rec.gps_accuracy = Math.round(fix.acc);
        rec.position_source = 'GPS';
      }
    }
  }
  window._stPosSource=null; window._stPosAcc=null;
  const ok = DB.upsert(DB.key.st, rec);
  if(!ok) return;                       // 保存できていないので書きかけを消さない
  draftClear('station:'+(stUuid || ('new:'+svUuid)));
  draftUnbind();
  toast(isNew ? (stWord(sv)+'をはじめました') : '保存しました');
  if(isNew) goTo('station', rec.uuid); else goBack();
}
function deleteStation(u){
  const st = DB.get(DB.key.st, u);
  const n = DB.catchesOf(u).length;
  const W = stWordOf(st);
  if(!confirm(`この${W}を削除します。${n>0?`記録${n}件も一緒に見えなくなります。`:''}よろしいですか？`)) return;
  // 印を付けるのは箇所1つだけ。中の記録は「親が消えている」ことで隠れる。
  // 何件も書き込むと、途中で失敗したときに迷子の記録が残る
  if(!DB.softDelete(DB.key.st, u)) return;
  toast('削除しました');
  goTo('survey', st ? st.survey_uuid : null);
}

/* 通電のスタート・ストップ。押した時刻だけを覚え、表示は時計から作る */
function toggleEffort(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  if(effortRunning(st)){
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
    if(DB.upsert(DB.key.st, st)){ toast(`通電 ${fmtDur(st.effort_seconds)}`); render(); }
  }else{
    st.effort_started_at = nowISO();
    if(DB.upsert(DB.key.st, st)){ toast('通電をはじめました'); render(); }
  }
}
function saveEffort(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  const passes = strVal('#e_passes');
  if(countOf(passes)===null){ toast('流した回数は0以上の整数で入れてください'); return; }
  st.effort_passes    = countOf(passes);
  st.width_m          = numVal('#e_width');
  st.length_m_manual  = numVal('#e_len');
  st.area_m2_manual   = numVal('#e_area');
  if(DB.upsert(DB.key.st, st)){ toast('保存しました'); render(); }
}
function endStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  const sv = DB.getAlive(DB.key.sv, st.survey_uuid);
  if(effortRunning(st)){          // 押しっぱなしのまま終わらせない
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
  }
  st.ended_at = nowISO();
  // 終了の時刻は、いま現場にいるときだけ自動で入れる。
  // あとから書き起こしているときは、手で入れた時刻を上書きしない
  if(isLiveNow(sv) && !st.survey_time_end) st.survey_time_end = timeValue();
  if(DB.upsert(DB.key.st, st)){ toast(stWordOf(st)+'を終えました'); goTo('survey', st.survey_uuid); }
}
function reopenStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  delete st.ended_at;   // 入れた終了時刻は消さない（手で入れたものかもしれない）
  if(DB.upsert(DB.key.st, st)){ render(); }
}

function collectCatch(){

    count_unmeasured: strVal('#c_n'),
    identification_confidence: segVal('conf'),
    notes: strVal('#c_note'),

function saveCatch(stUuid, caUuid, spId, next){
  const st = DB.get(DB.key.st, stUuid); if(!st) return;
  const sp = speciesById(spId);
  const rec = caUuid ? (DB.get(DB.key.ca, caUuid)||{uuid:caUuid})
                     : {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
                        recorded_at:nowISO()};
  rec.survey_uuid  = rec.survey_uuid  || st.survey_uuid;
  rec.station_uuid = rec.station_uuid || stUuid;
  if(spId){ rec.species_id=spId; rec.species_name=sp?sp.ja:''; rec.species_family=sp?sp.fam:''; }
  const raw = strVal('#c_n');
  if(countOf(raw)===null){
    toast('尾数は0以上の整数で入れてください（小数やマイナスは入れられません）', 5000);
    return;                       // 保存もせず、画面も動かさない
  }
  rec.count_unmeasured        = countOf(raw);
  rec.identification_confidence = segVal('conf');
  rec.notes                   = strVal('#c_note');
  const draftKey = 'catch:'+(caUuid || ('new:'+stUuid+':'+(spId||'')));
  if(catchTotalOf(rec)<=0){
    toast('尾数を入れてください（0だと書き出しから除かれます）');
  }
  if(!DB.upsert(DB.key.ca, rec)) return;   // 保存できていないので書きかけを消さない
  draftClear(draftKey);
  draftUnbind();
  toast('保存しました');
  if(next){
    // 「次の魚種へ」。1つ下がすでに魚種選びなら、そこへ戻るだけ。
    // 積み上げると「戻る」で同じ画面を何度も通ることになる
    if(STACK.length>1 && STACK[STACK.length-2].name==='speciesPick'){ STACK.pop(); render(); }
    else navReplace('speciesPick', stUuid);
  }
  else { goTo('station', stUuid); }
}
/* 「1尾ずつ測る」へ。記録がまだ無ければ先に作る（個体は記録にぶら下がるため） */
function toIndividuals(stUuid, caUuid, spId){
  if(caUuid){ nav('individuals', caUuid); return; }
  const st = DB.getAlive(DB.key.st, stUuid); if(!st) return;
  const raw = strVal('#c_n');
  if(countOf(raw)===null){
    toast('数えただけの尾数は0以上の整数で入れてください（空でも構いません）', 5000);
    return;
  }
  const sp = speciesById(spId);
  const rec = {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
    recorded_at:nowISO(),
    species_id:spId||'', species_name:sp?sp.ja:'', species_family:sp?sp.fam:'',
    count_unmeasured: countOf(raw),
    identification_confidence: segVal('conf'),
    notes: strVal('#c_note')};
  if(!DB.upsert(DB.key.ca, rec)) return;
  draftClear('catch:new:'+stUuid+':'+(spId||''));
  draftUnbind();
  // 履歴に「魚の記録」を残したまま個体入力へ。戻れば尾数の画面に帰る
  navReplace('catchEdit', {uuid: rec.uuid});
  nav('individuals', rec.uuid);
}

/* まだ保存していない記録にも使える版 */
function catchTotalOf(rec){
  const measured = rec.uuid ? DB.individualsOf(rec.uuid).length : 0;
  const un = countOf(rec.count_unmeasured);
  return measured + (un==='' || un===null ? 0 : un);
}

/* いま位置がどれくらい受かっているか。現場で「取れていない」と気づけるように */
function gpsHint(){
  const f = freshFix(20000);
  if(!f) return '位置：まだ取れていません（空の見えるところでお待ちください）';
  if(f.acc > GPS_MAX_ACC) return `位置：±${Math.round(f.acc)}m（粗いので測点には付けません）`;
  return `位置：±${Math.round(f.acc)}m で受かっています`;
}

function addEnvPoint(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  const d = numVal('#p_d'), v = numVal('#p_v');
  if(d==='' && v===''){ toast('水深か流速のどちらかは入れてください'); return; }
  if(d!=='' && d<0){ toast('水深は0以上で入れてください'); return; }
  if(v!=='' && v<0){ toast('流速は0以上で入れてください'); return; }

  const pt = {depth_cm:d, velocity_cms:v, substrate:segVal('p_sub'), note:strVal('#p_note')};
  // いま立っている場所を添える。
  // 古い測位や粗すぎる位置は付けない（前の測点の場所が付くほうが困る）
  const fix = freshFix(20000);
  let posMsg = '';
  if(fix && fix.acc<=GPS_MAX_ACC){
    pt.latitude = +fix.lat.toFixed(6);
    pt.longitude = +fix.lon.toFixed(6);
    pt.gps_accuracy = Math.round(fix.acc);
    pt.position_source = 'GPS';
  }else{
    posMsg = fix ? '（位置は粗すぎるので付けていません）' : '（位置が取れていません）';
  }

  const pts = envPoints(st).slice();
  pts.push(pt);
  st.env_points = pts;
  if(!DB.upsert(DB.key.st, st)) return;      // 保存できていないので欄も消さない
  toast(`${pts.length}点目${posMsg}`, posMsg?4000:2400);
  render();
}
function delEnvPoint(stUuid, i){
  const st = DB.liveStation(stUuid); if(!st) return;
  const pts = envPoints(st).slice();
  if(i<0 || i>=pts.length) return;
  if(!confirm(`${i+1}点目を消します。よろしいですか？`)) return;
  pts.splice(i,1);
  st.env_points = pts;
  if(DB.upsert(DB.key.st, st)){ toast('消しました'); render(); }
}
function saveEnv(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  st.depth_rep_cm     = numVal('#e_drep');
  st.velocity_rep_cms = numVal('#e_vrep');

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#sp_'+SUBSTRATE_NO[k]); });
  st.substrate_pct = pct;
  // 割合を入れたなら、多い順の1位2位を優占・次優占にする
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    st.substrate1 = rank[0].name;
    st.substrate2 = rank[1] ? rank[1].name : '';
  }

  ['left','right'].forEach(side=>{
    const list = [];
    [0,1,2].forEach(i=>{
      const type = strVal('#cv_'+side+'_'+i+'_t');
      const p = numVal('#cv_'+side+'_'+i);
      if(type) list.push({type, pct:p});
    });
    st['cover_'+side] = list;
    st['cover_'+side+'_length_m'] = numVal('#cv_'+side+'_len');
  });

  if(DB.upsert(DB.key.st, st)){ toast('保存しました'); goBack(); }
}

function addIndividual(caUuid){
  const c = DB.getAlive(DB.key.ca, caUuid); if(!c) return;
  const tl = numVal('#i_tl');
  if(tl===''){ toast('全長を入れてください'); return; }
  if(tl<=0){ toast('全長は0より大きい数で入れてください'); return; }
  const fl = numVal('#i_fl');
  if(fl!=='' && fl<=0){ toast('尾叉長は0より大きい数で入れてください'); return; }
  if(fl!=='' && fl>tl){ toast('尾叉長が全長より長くなっています。確かめてください', 5000); }
  const list = DB.individualsOf(caUuid);
  const no = list.reduce((m,i)=>Math.max(m, numOf(i.individual_number)||0), 0) + 1;
  const rec = {uuid:uuid(), catch_uuid:caUuid,
    station_uuid:c.station_uuid, survey_uuid:c.survey_uuid,
    individual_number:no, total_length_cm:tl, fork_length_cm:fl,
    recorded_at:nowISO()};
  if(!DB.upsert(DB.key.ind, rec)) return;   // 保存できていないので欄も消さない
  toast(`${no}尾目：${tl}cm`);
  render();                                  // 一覧を出し直し、欄は空に戻る

  if(!i) return;
  if(!confirm(`${i.individual_number}尾目（${i.total_length_cm}cm）を消します。よろしいですか？`)) return;

let OPOLY = [];
// 圏外用の地図をさわる処理は、いちどに1つだけ。
// 保存と削除が重なると、一覧と実体が食い違う。
// 返事が返ってこなかったときは、読み込み直しても解けないよう印を残す
// （向こうはまだ動いているかもしれない）
let PACK_BUSY = false;
/* 出し入れ中であることを示す札。
   ただの「保存」「削除」という文字だと、別のタブの札を上書き・削除してしまう。
   操作ごとに別の札（id つき）にして、自分の札だけを外す（7回目の監査 Major）。
     {id, kind:'保存'|'削除', at, deadline, state:'進行中'|'結果不明'}  */
function packPending(){
  try{
    const o = JSON.parse(localStorage.getItem('fs_pack_pending')||'null');
    return (o && typeof o.id==='string' && o.id) ? o : null;
  }catch(e){ return null; }
}
/* 札を置く。使用権があり、ほかの札が無いときだけ。置けたら id を返す。
   置くのは「頼む前」。頼んだ後だと、返事を待つ間に読み込み直されて札が無い */
function packPendingSet(kind, timeoutMs){
  if(!ownsLock()) return null;
  if(packPending()) return null;             // ほかの札があれば上書きしない
  const rec = {id:uuid(), kind, at:Date.now(),
               deadline:Date.now() + (timeoutMs||300000), state:'進行中'};
  try{ localStorage.setItem('fs_pack_pending', JSON.stringify(rec)); }
  catch(e){ return null; }
  const back = packPending();                // 置けたことを読み直して確かめる
  return (back && back.id===rec.id) ? rec.id : null;
}
/* 自分の札だけを外す */
function packPendingDrop(id){
  const cur = packPending();
  if(!cur) return true;
  if(id && cur.id!==id) return false;        // 別のタブの札は触らない
  try{ localStorage.removeItem('fs_pack_pending'); return true; }catch(e){ return false; }
}
/* 返事が来なかった札に「結果不明」の印を付ける */
function packPendingUnknown(id){
  const cur = packPending();
  if(!cur || cur.id!==id) return;
  cur.state = '結果不明';
  try{ localStorage.setItem('fs_pack_pending', JSON.stringify(cur)); }catch(e){}
}
/* 解除してよいか。使用権があり、かつ「結果不明」か、待ち時間を過ぎていること。
   まだ動いている最中の札を、別のタブから外させない */
function packPendingClearable(){
  const cur = packPending();
  if(!cur) return false;
  return ownsLock() && (cur.state==='結果不明' || Date.now() > cur.deadline);
}
/* 「確かめたので続ける」 */
function packPendingClear(){
  if(!packPendingClearable()){
    toast(ownsLock() ? 'まだ処理中かもしれません。少し待ってからもう一度押してください'
                     : 'このタブでは解除できません。記録を入れているタブで行ってください', 6000);
    return;
  }
  const cur = packPending();
  if(!packPendingDrop(cur.id)){
    toast('解除できませんでした。ページを読み込み直してください', 6000);
    return;
  }
  PACK_BUSY = false;          // 同じ画面のまま、次の出し入れができるようにする
  toast('解除しました');
  render();
}
function packLocked(){ return PACK_BUSY || !!packPending(); }

    : L.polyline(OPOLY, {color:'#4aa3ff', weight:2})).addTo(map);

function opolyEstimate(){

function opolySave(svUuid){
  if(packLocked()){ toast('いま別の地図の出し入れが終わっていません。少し待ってください'); return; }
  if(!ownsLock()){
    toast('このタブでは地図を保存できません。記録を入れているタブから行ってください', 6000);
    return;
  }
  if(OPOLY.length<3){ toast('まず3点以上で囲ってください'); return; }
  const layers = segMultiVal('olayers');
  if(!layers.length){ toast('落とす地図を選んでください'); return; }
  const zmax = opolyZmax();
  const poly = OPOLY.slice();
  const urls = packTileUrls(poly, zmax, layers);
  const prog = $('#oprog');
  const jobId = packPendingSet('保存', 600000);
  if(!jobId){
    toast('いま別の出し入れが終わっていないか、印を置けませんでした', 8000);
    return;
  }
  // 一覧の書き換えまで終わってから札を外す。先に外すと、
  // その間に別のタブが古い一覧をもとに書き込める
  const done = (fn)=>{ try{ fn(); } finally { packPendingDrop(jobId); PACK_BUSY = false; } };
  if(prog) prog.textContent = `${urls.length}枚を保存しています…`;
  PACK_BUSY = true;
  swAsk({type:'savePack', urls}, 600000).then(r=>{
    const okN   = (r && r.ok)   || 0;
    const failN = (r && r.fail) || 0;
    if(okN===0){
      // 1枚も入っていないのに「保存しました」と言わない。
      // 圏外で地図が出ないことに現場で気づくことになる
      done(()=>{
        if(prog) prog.textContent = `1枚も保存できませんでした（${failN}枚失敗）。`
          + '電波の届くところでもう一度お試しください。';
        toast('保存できませんでした', 5000);
      });
      return;
    }
    // 保存に時間がかかる間に、使用権がほかのタブへ移っていることがある
    if(!ownsLock()){
      done(()=>{
        if(prog) prog.textContent = '地図は保存できましたが、'
          + '途中で使用権がほかのタブへ移ったため、一覧に記録できませんでした。'
          + 'ページを読み込み直してからやり直してください。';
        toast('一覧に記録できませんでした。読み込み直してください', 8000);
      });
      return;
    }
    const list = packStore();
    // 消すときに実体をたどれるよう、囲った範囲そのものを覚えておく。
    // 並びが変わっても取り違えないよう、id を付ける
    list.push({id:uuid(), name:`範囲${list.length+1}`, tiles:okN, fail:failN,
               mb:Math.round(okN*0.02*10)/10, layers, zmax, poly, at:nowISO()});
    if(!packSaveList(list)){
      // 実体は入ったのに一覧に残らない。「保存しました」と言うと、
      // 消せない地図が容量を食ったまま行方不明になる
      done(()=>{
        if(prog) prog.textContent = '地図は保存できましたが、一覧に記録できませんでした。'
          + '端末の空き容量を確認してください。';
        toast('一覧に記録できませんでした。空き容量を確認してください', 8000);
      });
      return;
    }
    done(()=>{
      if(prog) prog.textContent = failN
        ? `${okN}枚を保存しました（${failN}枚は取れませんでした）。`
        : `${okN}枚を保存しました。`;
      toast(failN ? `${okN}枚保存（${failN}枚は取れず）` : '保存しました', failN?5000:2400);
    });
    render();
  }).catch(e=>{
    if(e && e.timeout){
      // 向こうがまだ動いている可能性がある。次の出し入れを許すと食い違う。
      // 札は残したまま「結果不明」にする
      packPendingUnknown(jobId);
      if(prog) prog.textContent = '保存の返事が返ってきません。'
        + '裏でまだ動いているかもしれないので、しばらく待ってから'
        + '保存済みの一覧を確かめてください。';
      toast('返事がありません。一覧を確かめてください', 8000);
      render();
      return;                       // PACK_BUSY は立てたまま
    }
    done(()=>{                              // はっきり失敗したので札を外す
      if(prog) prog.textContent = '保存できませんでした：'+e.message;
      toast('保存できませんでした');
    });
  });
}
function packDrop(id){
  if(packLocked()){ toast('いま別の地図の出し入れが終わっていません。少し待ってください'); return; }
  if(!ownsLock()){
    toast('このタブでは地図を消せません。記録を入れているタブから行ってください', 6000);
    return;
  }
  const list=packStore();
  const hits = list.filter(p=>p.id===id);
  if(hits.length!==1){
    // 見つからない、または同じ印が複数ある。消すと巻き添えが出る
    toast(hits.length===0 ? 'その範囲が見つかりません。ページを読み込み直してください'
                          : '同じ印の記録が複数あります。ページを読み込み直してください', 8000);
    render();
    return;
  }
  const target = hits[0];
  if(!confirm('この範囲の地図を消します。よろしいですか？')) return;

  // 番号ではなく id で消す。並びは削除の間に変わりうる
  const dropFromList = (msg)=>{
    if(!ownsLock()){
      toast('書き換えの途中で使用権がほかのタブへ移りました。一覧はそのまま残します', 8000);
      return;
    }
    const now = packStore();
    if(now.filter(p=>p.id===id).length!==1){
      toast('一覧が変わりました。ページを読み込み直して確かめてください', 8000);
      render();
      return;
    }
    const rest = now.filter(p=>p.id!==id);
    if(!packSaveList(rest)){
      toast('一覧を書き換えられませんでした。端末の空き容量を確認してください', 8000);
      return;
    }
    toast(msg, 5000); render();
  };

  // 範囲の形を覚えていない古い記録が1つでもあると、
  // 「ほかの範囲でも使っているタイル」を数え切れない。
  // 数え違えると、別の範囲の地図まで消してしまう
  const others = list.filter(p=>p.id!==id);
  if(!target.poly || others.some(p=>!p.poly)){
    dropFromList('一覧から消しました。'
      + '（範囲の形を覚えていない古い記録があるため、地図の実体は残します）');
    return;
  }

  const mine = new Set(packTileUrls(target.poly, target.zmax, target.layers||[]));
  const keep = new Set();
  others.forEach(p=>packTileUrls(p.poly, p.zmax, p.layers||[]).forEach(u=>keep.add(u)));
  const drop = Array.from(mine).filter(u=>!keep.has(u));

  if(!drop.length){
    dropFromList('一覧から消しました（ほかの範囲でも使っている地図は残ります）');
    return;
  }

  const jobId = packPendingSet('削除', 300000);
  if(!jobId){
    toast('いま別の出し入れが終わっていないか、印を置けませんでした', 8000);
    return;
  }
  // 一覧の書き換えまで終わってから札を外す
  const done = (fn)=>{ try{ fn(); } finally { packPendingDrop(jobId); PACK_BUSY = false; } };
  PACK_BUSY = true;
  toast(`${drop.length}枚を消しています…`);
  swAsk({type:'dropPack', urls:drop}, 300000).then(r=>{
    if(!r || r.error){
      done(()=>toast('地図の実体を消せませんでした。一覧はそのまま残します（'
        + ((r&&r.error)||'返事がありません') + '）', 8000));
      return;                      // 一覧を消さない。あとでやり直せる
    }
    const failed = (r.failed||[]).length;
    if(failed){
      done(()=>toast(`${r.deleted||0}枚を消しましたが、${failed}枚が残りました。`
        + '一覧はそのまま残します。もう一度お試しください', 8000));
      return;
    }
    done(()=>dropFromList(`${r.deleted||0}枚を消しました`));
  }).catch(e=>{
    if(e && e.timeout){
      packPendingUnknown(jobId);   // 札は残したまま「結果不明」にする
      toast('消した結果の返事が返ってきません。一覧はそのまま残します。'
        + '一覧を確かめてください', 8000);
      render();
      return;                       // PACK_BUSY は立てたまま
    }
    done(()=>toast('地図の実体を消せませんでした。一覧はそのまま残します（'
      + e.message + '）', 8000));
  });
}

        <h3>取り込みかた</h3>
        <div class="dim small">
          魚類データベースを開き、「資料管理」→「調査記録」→「CSV / Excel から一括インポート」に
          書き出したファイルを入れてください。
        </div>
      </div>
    `};
};
/* 31列に乗らない分の書き出し */
function exportExtraCsv(svUuid, kind){
  if(!ownsLock()){
    toast('このタブでは書き出せません。記録を入れているタブから書き出してください', 6000);
    return;
  }
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  let snap;
  try{ snap = exportSnapshot(); }
  catch(e){ toast(e.message, 8000); return; }

  const table = {
    '個体': [FS_IND_COLS,     buildIndRows(sv, snap)],
    '箇所': [FS_STATION_COLS, buildStationRows(sv, snap)],
    '調査': [FS_SURVEY_COLS,  buildSurveyRow(sv, snap)],
    '測点': [FS_POINT_COLS,   buildPointRows(sv, snap)],
  }[kind];
  if(!table){ toast('書き出せません'); return; }
  const [cols, rows] = table;
  if(!rows.length){ toast('書き出す記録がありません'); return; }

  const csv = toCsv(cols, rows);
  const fname = `${exportFileBase(sv)}_${kind}.csv`;
  if(!ownsLock()){
    toast('書き出しの途中で、ほかのタブに使用権が移りました。'
        + 'このタブを読み込み直してからやり直してください', 8000);
    return;
  }
  download(fname, '﻿'+csv, 'text/csv;charset=utf-8');
  toast(`${rows.length}行を書き出しました`);
}

function exportDbCsv(svUuid){
  // 使用権のないタブから書き出すと、別のタブが書き換えている途中の
  // ばらばらな中身を1つのCSVに混ぜてしまう
  if(!ownsLock()){
    toast('このタブでは書き出せません。記録を入れているタブから書き出してください', 6000);
    return;
  }
  const sv = DB.get(DB.key.sv, svUuid); if(!sv) return;
  const r = buildDbRows(sv);
  if(r.blocked.length){ toast('先に足りないところを直してください'); return; }
  if(!r.rows.length){ toast('書き出す記録がありません'); return; }
  // 中身を全部作り終えてから、ファイルを出す直前にもう一度使用権を見る。
  // 組み立てに時間がかかる間に、ほかのタブへ移っていることがある
  const csv = toCsv(FS_DB_COLS, r.rows);
  const fname = `${exportFileBase(sv)}_DB取込用.csv`;
  if(!ownsLock()){
    toast('書き出しの途中で、ほかのタブに使用権が移りました。'
        + 'このタブを読み込み直してからやり直してください', 8000);
    return;
  }
  download(fname, '﻿'+csv, 'text/csv;charset=utf-8');
  sv.exported_at = nowISO();
  if(!DB.upsert(DB.key.sv, sv)){
    // ファイルは作れたが、書き出した記録が残らなかった。
    // 「書き出しました」と言うと、二重に取り込む危険が上がる
    toast('CSVは作りましたが、書き出した日時を保存できませんでした。'
        + '端末の空き容量を確認し、ページを読み込み直してください', 8000);
    return;
  }
  toast(`${r.rows.length}行を書き出しました`);
  render();
}

/* ============================================================
   アプリを最新にする
   記録（調査・箇所・魚）と、圏外用に落とした地図は消さない。
   消すのはアプリのプログラムと、地図を動かして自然に溜まった分だけ。
   ============================================================ */
/* 消してよい保管場所の名前を返す。
   - fish-map-pack-*（自分で範囲を囲って落とした地図）は消さない。
     利用者がわざわざ落としたもので、アプリの更新とは関係がない
   - 鳥（bird-）や産卵床（redd-）のものは、当然さわらない */
function cachesToClear(keys){
  return (keys||[]).filter(k =>
    k.startsWith('fish-survey-') || k.startsWith('fish-map-tiles-'));
}

/* いま配信されている版を見に行く（読むだけ。何も消さない） */
function checkLatestVersion(){
  return fetch('./fish_survey.html', {cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error('取りに行けませんでした（'+r.status+'）');
      return r.text();
    })
    .then(t=>{
      const m = t.match(/const APP_VERSION = '([^']*)'/);
      if(!m) throw new Error('版が読み取れませんでした');
      return m[1];
    });
}

function checkUpdate(){
  const box = $('#updInfo');
  if(box) box.textContent = '調べています…';
  checkLatestVersion().then(latest=>{
    if(!box) return;
    box.textContent = latest === APP_VERSION
      ? `最新です（${APP_VERSION}）`
      : `新しい版があります：${latest}（いまは ${APP_VERSION}）。下のボタンで取り込めます`;
  }).catch(e=>{
    if(box) box.textContent = '調べられませんでした：' + e.message
      + '（電波の届くところでお試しください）';
  });
}

function forceUpdate(){
  // 出し入れの途中なら、聞くまでもなく止める
  if(typeof packLocked==='function' && packLocked()){
    toast('圏外用の地図の出し入れが終わっていません。終わってからお試しください', 8000);
    return;
  }
  if(!confirm('アプリのプログラムだけを最新に読み込み直します。\n\n'
    + '・記録した調査・箇所・魚はそのまま残ります\n'
    + '・圏外用に落とした地図もそのまま残ります\n'
    + '・電波の届くところで行ってください\n\nよろしいですか？')) return;

  toast('最新に読み込み直しています…', 8000);
  const reload = ()=>location.reload();
  const tasks = [];
  // このアプリのものだけを対象にする（同じ場所の別アプリを壊さない）
  if('serviceWorker' in navigator){
    tasks.push(navigator.serviceWorker.getRegistration()
      .then(r=>r ? r.unregister() : null).catch(()=>{}));
  }
  if(window.caches){
    tasks.push(caches.keys()
      .then(ks=>Promise.all(cachesToClear(ks).map(k=>caches.delete(k))))
      .catch(()=>{}));
  }
  Promise.all(tasks).then(reload, reload);
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  render();            // 先に画面を出す。保存領域の準備を待つと白いままになる
  claimLock();
  startGps();
  if(navigator.storage && navigator.storage.persist){
    try{ navigator.storage.persist(); }catch(e){}
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
