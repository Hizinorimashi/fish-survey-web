<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魚類調査記録</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0e14">
<link rel="stylesheet" href="./leaflet.css">
<style>
:root{
  --bg:#0a0e14; --panel:#141b25; --panel2:#1b2430; --line:#2b3644;
  --fg:#e6edf5; --dim:#93a2b5; --accent:#4aa3ff; --ok:#3fb950; --warn:#d29922; --ng:#f85149;
}
/* 屋外モード（明るい表示）。晴天の川原で、暗い画面が反射して読めない対策
   （2026-08-23 の実機の声・鳥アプリから） */
html.light{
  --bg:#f2f5f9; --panel:#ffffff; --panel2:#e9eef4; --line:#c9d3de;
  --fg:#101826; --dim:#54637a; --accent:#0b6bcb; --ok:#1a7f37; --warn:#8a5a00; --ng:#c62828;
}
html.light .map, html.light .leaflet-container{background:#dde5ee}
html.light .mediathumb{background:#dde5ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.5}
body{padding-bottom:40px}
header{position:sticky;top:0;z-index:900;background:var(--panel);border-bottom:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-top)) 10px;padding-top:calc(8px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:8px;min-height:34px}
#title{font-weight:700;font-size:17px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#sub:empty{margin-top:0}
.pill{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;color:var(--dim);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:#264d31}
.pill.warn{color:var(--warn);border-color:#4d3f16}
.pill.ng{color:var(--ng);border-color:#5c2626}
main{padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--panel2)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.dim{color:var(--dim);font-size:13px}
.small{font-size:12px}
h3{margin:16px 0 8px;font-size:14px;color:var(--dim);font-weight:600;letter-spacing:.04em}
h3:first-child{margin-top:0}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--dim)}
input,select,textarea{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:8px;padding:10px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
button{font-family:inherit;font-size:15px;cursor:pointer}
.btn{display:block;width:100%;padding:13px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel2);color:var(--fg);margin-top:10px;text-align:center}
.btn:active{background:#26303e}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
.btn.ok{background:#1c3a25;border-color:#2d5c3a;color:#8ce39c}
.btn.ng{background:#3a1d1d;border-color:#5c2b2b;color:#ff9a92}
.btn.sm{padding:8px;font-size:14px;margin-top:6px}
.btn[disabled]{opacity:.4;pointer-events:none}
.mapicons a{display:flex!important;align-items:center;justify-content:center;
  width:36px;height:36px;color:#1b2531}
.mapicons a.on{background:var(--accent);color:#04121f}
.mapicons a.on svg{stroke:#04121f}
.btn2{display:flex;gap:8px}
.btn2 .btn{margin-top:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel2);color:var(--dim);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;font-size:14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}
.seg.basemap button{font-size:13px;padding:7px 10px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  /* 背景も文字もテーマの色にそろえる。背景だけ濃い色で固定すると、
     明るい表示のとき「黒地に黒文字」になって読めない（2026-08-24 の実機の声） */
  background:var(--panel);border:1px solid var(--line);color:var(--fg);
  box-shadow:0 4px 16px rgba(0,0,0,.35);padding:11px 16px;border-radius:9px;
  max-width:88vw;opacity:0;pointer-events:none;transition:.2s;z-index:2000;font-size:14px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.map{width:100%;height:60vh;min-height:320px;border-radius:10px;overflow:hidden;background:#0d1219}
.leaflet-container{background:#0d1219;font-family:inherit}
.pinmark{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.hr{height:1px;background:var(--line);margin:14px 0}
/* 折りたたみ。ブラウザの標準の仕組みを使うので、開け閉めに手を入れなくてよい */
details.fold{padding:0}
details.fold>summary{list-style:none;cursor:pointer;padding:12px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'ひらく';margin-left:auto;color:var(--dim);font-size:12px;
  border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
details.fold[open]>summary::after{content:'とじる'}
.fold .ftitle{font-weight:700}
.fold .fsub{color:var(--dim);font-size:13px}
.fold .fbody{padding:0 12px 12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left}
th{color:var(--dim);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.warnbox{background:#2a2110;border:1px solid #4d3f16;color:#f0d48a;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.ngbox{background:#2a1414;border:1px solid #5c2626;color:#ffb4ad;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.mediagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mediajump{position:absolute;left:4px;bottom:4px;border:0;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:3px 7px}
.mediathumb{position:relative;aspect-ratio:1/1;border-radius:8px;overflow:hidden;background:#1a1d22}
.mediathumb img{width:100%;height:100%;object-fit:cover;display:block}
.mediadel{position:absolute;top:2px;right:2px;width:26px;height:26px;border:0;border-radius:13px;
  background:rgba(0,0,0,.62);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.photoview{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:12px}
.photoview img{max-width:100%;max-height:82vh;object-fit:contain}
.okbox{background:#12271a;border:1px solid #264d31;color:#9be0aa;border-radius:8px;padding:10px;font-size:13px;margin:10px 0}
.chip{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:12px;color:var(--dim);margin:2px 4px 2px 0}
.splist{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.spitem{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.spitem:last-child{border-bottom:none}
.spitem:active{background:var(--panel2)}
.spitem .fam{color:var(--dim);font-size:12px;margin-left:8px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <button id="backBtn" class="seg" style="display:none;background:none;border:none;padding:0"
      onclick="goBack()"><span style="display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 11px">戻る</span></button>
    <div id="title">魚類調査記録</div>
  </div>
  <div id="sub"></div>
</header>
<main id="main"></main>
<div id="toast"></div>

<script src="./leaflet.js"></script>
<!-- 地図を回すための部品。読めなかった端末では、北が上のまま今までどおり動く -->
<script src="./vendor/leaflet-rotate.js"></script>
<script>
/* ============================================================
   魚類調査記録アプリ
   単一HTMLのオフラインPWA。現場で獲れた魚と川の環境を記録し、
   魚類データベースにそのまま取り込めるCSVを書き出す。

   置き場所の分け方（同じ場所に鳥・産卵床のアプリがあるため必ず分ける）
     localStorage  fs_          IndexedDB  fish_survey_media
     キャッシュ    fish-survey-* / fish-map-*
   ============================================================ */
const APP_VERSION = 'v130';   // sw.js の CACHE 名と揃える（smoke テストが照合する）

/* ---------- 小道具 ---------- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); });
}
function nowISO(){ return new Date().toISOString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function dateValue(d){ d=d||new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function timeValue(d){ d=d||new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtDate(s){ if(!s) return '—'; return String(s).slice(0,10); }
function fmtTime(s){ if(!s) return '—'; const d=new Date(s); if(isNaN(d)) return '—';
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){ const t=$('#toast'); if(!t) return; t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'), ms||2400); }

/* 数値の取り出し。空欄は '' のまま返す。
   0 を未入力と取り違えないため。魚類では 流速0・水深0・通電0秒・尾数0 が普通にある */
function numOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  // parseFloat は '12abc' を 12 として通してしまう。全体が数のときだけ受ける
  if(!/^[+-]?(\d+(\.\d*)?|\.\d+)$/.test(s)) return '';
  const n=parseFloat(s);
  return isFinite(n) ? n : '';
}
/* 尾数の受け取り。空欄は ''、0以上の整数だけ数として返す。
   それ以外（負の数・小数・'12abc'）は null を返して「おかしい」と伝える。
   負の数を通すと、測った個体を打ち消して「尾数0」になり、
   実在する記録が黙って書き出しから消える（2026-08-16 の監査 Major） */
function countOf(v){
  if(v===null || v===undefined) return '';
  const s=String(v).trim(); if(s==='') return '';
  if(!/^\d+$/.test(s)) return null;
  const n=parseInt(s,10);
  // 大きすぎる数は丸められて、入れた文字と書き出す数が食い違う
  return Number.isSafeInteger(n) ? n : null;
}
/* 記録の尾数がおかしければ、その理由を返す。問題なければ '' */
function badCount(c, inds){
  if(countOf(c.count_unmeasured)===null){
    return `尾数「${String(c.count_unmeasured)}」は数として読めません（0以上の整数で入れてください）`;
  }
  const n = catchTotal(c, inds);
  if(!isFinite(n) || n<0 || n!==Math.floor(n)) return `尾数が正しくありません（${n}）`;
  return '';
}
function numVal(sel){ const el=$(sel); return el ? numOf(el.value) : ''; }
function strVal(sel){ const el=$(sel); return el ? String(el.value).trim() : ''; }
/* 空欄を落とさずに数だけ集める。filter(v=>v) と書くと 0 が消える */
function nums(arr){ return (arr||[]).map(numOf).filter(v=>v!==''); }
function fmtNum(v, d){ return v==='' || v===null || v===undefined || isNaN(v)
  ? '—' : (d===undefined ? String(v) : (+v).toFixed(d)); }
function fmtDist(d){
  if(d==='' || d===null || d===undefined || !isFinite(d)) return '—';
  d=+d; return d>=1000 ? (d/1000).toFixed(2)+'km' : Math.round(d)+'m';
}
function fmtDur(sec){ sec=Math.max(0,Math.round(sec||0));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? `${h}時間${m}分` : (m ? `${m}分${pad2(s)}秒` : `${s}秒`); }

/* ============================================================
   使用権の確認（複数タブ）と書き込みの門
   同じ記録を2つのタブで開くと、あとから保存したほうが相手の記録を消す。
   起動時に使用権を取り、取れるまで・取れなければ一切書き込まない。
   ============================================================ */
const TAB_ID    = uuid();
const LOCK_NAME = 'fs_write_lock';   // ブラウザ標準の仕組みで使う名前
const LOCK_KEY  = 'fs_lock';         // 標準の仕組みが無いときの控え
const LOCK_TTL  = 12000;   // これより古い印は、閉じられたタブのものとみなす
const LOCK_BEAT = 4000;    // 生きている印を書き直す間隔
const LOCK_WAIT = 350;     // 取ったあと、割り込みが無かったか確かめるまでの待ち
window.WRITE_OK   = false;
window.READ_ONLY  = false;
let SAVE_FATAL = false;    // 後片付けに失敗した状態。読み込み直すまで解けない
let LOCK_WHY   = '';
let LOCK_MODE  = '';       // 'locks'（ブラウザ標準）か 'storage'（控え）
let LOCK_RELEASE = null;   // ブラウザ標準の使用権を手放す関数
let lockBeatTimer = null;

const WHY_OTHER_TAB = 'ほかのタブでこのアプリが開いています。'
  + 'そのタブを閉じてから、この画面を読み込み直してください';

function lockRead(){ try{
  const o=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');
  return (o && typeof o.id==='string' && typeof o.at==='number') ? o : null;
}catch(e){ return null; } }
function lockAlive(o){ return !!o && (Date.now()-o.at) < LOCK_TTL; }
function lockWrite(){ try{
  localStorage.setItem(LOCK_KEY, JSON.stringify({id:TAB_ID, at:Date.now()})); return true;
}catch(e){ return false; } }

/* いま自分が使用権を持っているか。保存の直前に必ずこれで確かめる。
   WRITE_OK という旗だけを信じると、裏で別のタブに取られていても保存してしまい、
   相手の記録ごと上書きする（2026-08-16 の監査 Critical） */
function ownsLock(){
  if(!window.WRITE_OK) return false;
  if(LOCK_MODE==='locks') return true;   // ページの間ずっと握り続けている
  const o = lockRead();
  return !!o && o.id===TAB_ID;           // 控えの方式では、印の持ち主を毎回見る
}

function goReadOnly(why){
  window.WRITE_OK=false; window.READ_ONLY=true; LOCK_WHY=why;
  if(lockBeatTimer){ clearInterval(lockBeatTimer); lockBeatTimer=null; }
  try{ render(); }catch(e){}
}
function openWrite(){
  window.WRITE_OK=true; window.READ_ONLY=false; LOCK_WHY='';
  try{ render(); }catch(e){}
}

function claimLock(){
  // ブラウザ標準の仕組みがあれば、それを使う。
  // タブが落ちても自動で解放されるので、時間切れの当て推量が要らない
  if(navigator.locks && navigator.locks.request){
    LOCK_MODE='locks';
    const held = new Promise(res=>{ LOCK_RELEASE = res; });
    navigator.locks.request(LOCK_NAME, {mode:'exclusive', ifAvailable:true}, lock=>{
      if(!lock){ goReadOnly(WHY_OTHER_TAB); return; }
      openWrite();
      return held;        // ページを離れるまで握り続ける
    }).catch(()=>goReadOnly('使用権を確かめられませんでした。読み込み直してください'));
    return;
  }

  // ここから下は、標準の仕組みが無いブラウザ用の控え
  LOCK_MODE='storage';
  const cur = lockRead();
  if(lockAlive(cur) && cur.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
  if(!lockWrite()){
    goReadOnly('このブラウザ／開き方では保存できません（保存領域が使えません）');
    return;
  }
  setTimeout(()=>{
    const c2 = lockRead();
    if(!c2 || c2.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
    openWrite();
    lockBeatTimer = setInterval(()=>{
      if(!window.WRITE_OK) return;
      const o = lockRead();
      // 自分の印でなければ、別のタブに取られている。上書きして奪い返さない
      if(o && o.id!==TAB_ID){ goReadOnly(WHY_OTHER_TAB); return; }
      lockWrite();
    }, LOCK_BEAT);
  }, LOCK_WAIT);
}

/* このページを離れるときは使用権を手放す。
   握ったままだと、同じタブで読み込み直しただけで
   「別のタブが開いている」と誤判定する */
function releaseLock(){
  if(LOCK_RELEASE){ try{ LOCK_RELEASE(); }catch(e){} LOCK_RELEASE=null; }
  const o = lockRead();
  if(o && o.id===TAB_ID){ try{ localStorage.removeItem(LOCK_KEY); }catch(e){} }
}
function flushAllForms(){
  // 使用権を手放す前に、打ちかけを書いてしまう（監査47・51回目 Critical）。
  // 書けたかどうかを返す（合成の前ぶれで使う。監査80回目 Major）
  let ok = true;
  try{ if(typeof spotInfoFlush==='function' && spotInfoFlush() === false) ok = false; }
  catch(e){ ok = false; }
  try{ if(typeof envFlush==='function' && envFlush() === false) ok = false; }
  catch(e){ ok = false; }
  return ok;
}
window.addEventListener('pagehide', ()=>{ flushAllForms(); releaseLock(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden') flushAllForms();
});
/* 戻るボタンなどで表に戻ってきたら取り直す */
window.addEventListener('pageshow', e=>{ if(e.persisted){ window.WRITE_OK=false; claimLock(); } });

window.addEventListener('storage', e=>{
  if(e.key!==LOCK_KEY || !window.WRITE_OK || LOCK_MODE!=='storage') return;
  const o = lockRead();
  if(o && o.id!==TAB_ID) goReadOnly(WHY_OTHER_TAB);
});

/* 記録に関わる書き込みは必ずここを通す。
   端末ごとの好み（地図の種類・下書き）は記録ではないので対象外 */
function writeAllowed(){
  if(SAVE_FATAL){
    toast('保存の後片付けに失敗しています。ページを読み込み直してください', 6000);
    return false;
  }
  // 抜け道は作らない。どの経路でも、保存の直前に使用権を確かめる
  if(ownsLock()) return true;
  if(window.WRITE_OK){
    // 旗は立っているのに使用権が無い＝裏で別のタブに取られた
    goReadOnly(WHY_OTHER_TAB);
    return false;
  }
  toast(window.READ_ONLY ? LOCK_WHY
    : '起動時の確認が終わるまで保存できません。数秒待ってからやり直してください', 5000);
  return false;
}

/* ============================================================
   保存層（localStorage）
   削除は deleted_at を立てる論理削除のみ。
   保存に失敗したら false を返す。呼び出し側は「できたことにしない」
   ============================================================ */
const DB = {
  key:{ sv:'fs_surveys', st:'fs_stations', ca:'fs_catches',
        ind:'fs_individuals', nt:'fs_notes', si:'fs_sites',
        mc:'fs_meshcells' },

  /* 壊れていても空配列を返す。表示用 */
  load(k){ try{ const a=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(a)?a:[]; }
           catch(e){ return []; } },
  /* 壊れていたら例外にする。「本当に空」と「読めない」を区別する必要がある処理用
     （バックアップ・完全削除・書き出しなど、空を鵜呑みにすると記録を失うもの） */
  loadRaw(k){
    const raw = localStorage.getItem(k);
    if(raw===null || raw==='') return [];
    let a; try{ a=JSON.parse(raw); }
    catch(e){ throw new Error('保存された記録を読み取れません: '+k); }
    if(!Array.isArray(a)) throw new Error('保存された記録の形がおかしいです: '+k);
    return a;
  },
  save(k, arr){
    if(!writeAllowed()) return false;
    try{ localStorage.setItem(k, JSON.stringify(arr)); }
    catch(e){
      toast('保存できませんでした。端末の空き容量を確認してください', 6000);
      return false;
    }
    // 記録が変わった。少し置いてから、自動でドライブへ控えを送る
    //（2026-08-23 の実機の声・鳥アプリから）
    try{ autoBackupQueue(); }catch(e){}
    return true;
  },
  get(k,u){ return this.load(k).find(x=>x.uuid===u) || null; },
  /* 生きているものだけ返す。消したはずのものが画面に出ないよう、
     画面はこちらを使う（get はごみ箱・復元のためのもの） */
  getAlive(k,u){ const r=this.get(k,u); return (r && !r.deleted_at) ? r : null; },
  /* 箇所は、親の調査も生きているときだけ返す。
     調査を消したのに、中の箇所だけ開けてしまうのを防ぐ */
  liveStation(u){
    const st = this.getAlive(this.key.st, u);
    if(!st) return null;
    return this.getAlive(this.key.sv, st.survey_uuid) ? st : null;
  },
  alive(k){ return this.load(k).filter(x=>!x.deleted_at); },

  upsert(k, rec){
    if(!rec.uuid) rec.uuid = uuid();
    rec.updated_at = nowISO();
    let a; try{ a=this.loadRaw(k); }
    catch(e){ toast('保存された記録を読み取れないため、保存を中止しました', 6000); return false; }
    const i = a.findIndex(x=>x.uuid===rec.uuid);
    if(i<0){ rec.created_at = rec.created_at || nowISO(); a.push(rec); }
    else a[i] = rec;
    return this.save(k, a) ? rec : false;
  },
  softDelete(k, u, by){
    let a; try{ a=this.loadRaw(k); }
    catch(e){ toast('記録を読み取れないため、削除を中止しました', 6000); return false; }
    const t = nowISO();
    let hit=false;
    a.forEach(x=>{ if(x.uuid===u && !x.deleted_at){
      x.deleted_at=t; x.updated_at=t; if(by) x.deleted_by=by; hit=true; } });
    if(!hit) return true;
    return this.save(k, a);
  },
  restore(k, u){
    let a; try{ a=this.loadRaw(k); }catch(e){ return false; }
    a.forEach(x=>{ if(x.uuid===u){
      delete x.deleted_at; delete x.deleted_by; x.updated_at = nowISO(); } });
    return this.save(k, a);
  },

  /* 親子のたどり方 */
  surveys(){ return this.alive(this.key.sv)
    .sort((a,b)=> String(b.survey_date||'').localeCompare(String(a.survey_date||''))
               || String(b.created_at||'').localeCompare(String(a.created_at||''))); },
  stationsOf(sv){ return this.alive(this.key.st).filter(x=>x.survey_uuid===sv)
    .sort((a,b)=> (a.station_no||0)-(b.station_no||0)); },
  catchesOf(st){
    // 親の箇所（とその親の調査）が消えていれば、中の記録も見せない
    if(!this.liveStation(st)) return [];
    return this.alive(this.key.ca).filter(x=>x.station_uuid===st)
      .sort((a,b)=> String(a.created_at||'').localeCompare(String(b.created_at||'')));
  },
  /* メッシュのマス。親の箇所（とその親の調査）が生きているときだけ返す */
  meshCellsOf(st){
    if(!this.liveStation(st)) return [];
    return this.alive(this.key.mc).filter(x=>x.station_uuid===st)
      .sort((a,b)=> (a.row-b.row) || (a.col-b.col));
  },
  meshCellsOfSurvey(sv){
    const live = new Set(this.stationsOf(sv).map(x=>x.uuid));
    return this.alive(this.key.mc).filter(x=>live.has(x.station_uuid))
      .sort((a,b)=> (a.row-b.row) || (a.col-b.col));
  },
  /* 消した箇所にぶら下がる記録は見せない。
     子にも印を付けて回ると、途中で保存に失敗したとき迷子の記録が残る。
     印は親に1つだけ付け、見るときに親の生死で絞る（2026-08-16 の監査 Critical） */
  catchesOfSurvey(sv){
    const live = new Set(this.stationsOf(sv).map(x=>x.uuid));
    return this.alive(this.key.ca)
      .filter(x=>x.survey_uuid===sv && (!x.station_uuid || live.has(x.station_uuid)));
  },
  individualsOf(ca){ return this.alive(this.key.ind).filter(x=>x.catch_uuid===ca)
    .sort((a,b)=> (a.individual_number||0)-(b.individual_number||0)); },
  notesOf(sv){ return this.alive(this.key.nt).filter(x=>x.survey_uuid===sv); },
  /* 地点（河川ごとに登録して使い回す）。河川名を渡すとその川のものだけ */
  sites(river){
    const a = this.alive(this.key.si)
      .sort((x,y)=> String(x.river_name||'').localeCompare(String(y.river_name||''))
                 || String(x.name||'').localeCompare(String(y.name||'')));
    return river ? a.filter(x=>x.river_name===river) : a;
  },
};

/* ---------- 完全に消した記録の印（墓標） ----------
   後でデータベースへ「これは消した」と伝えるために残す。1件あたり数十バイト */
function tombstones(){ try{
  return (JSON.parse(localStorage.getItem('fs_tombstones')||'[]')||[])
    .filter(t=>t && typeof t.uuid==='string' && t.uuid);
}catch(e){ return []; } }
function tombstoneAdd(u){
  if(!u || !writeAllowed()) return false;
  const a=tombstones();
  if(!a.some(t=>t.uuid===u)) a.push({uuid:u, at:nowISO()});
  try{ localStorage.setItem('fs_tombstones', JSON.stringify(a)); return true; }catch(e){ return false; }
}

function themeApply(){
  document.documentElement.classList.toggle('light', themeMode()==='light');
}
function toggleTheme(){
  try{ localStorage.setItem('fs_theme', themeMode()==='light' ? '' : 'light'); }catch(e){}
  themeApply(); render();
}

/* 河川名から、地図を合わせる範囲を返す。無ければ null */
function riverBounds(name){
  const q = String(name||'').trim();
  if(!q) return null;
  let hit = RIVERS.find(r=>r.r===q);
  if(!hit){
    // 「尻別」で「尻別川」を見つけられるように、部分一致も見る
    const cand = RIVERS.filter(r=>r.r.indexOf(q)>=0 || q.indexOf(r.r)>=0);
    if(cand.length===1) hit = cand[0];
  }
  return hit ? hit.b : null;
}
function pastSitesOf(name){
  const q = String(name||'').trim();
  if(!q) return [];
  return PAST_SITES.filter(s=>s.r===q);
}
/* 表に無い川は、電波があれば国土地理院の地名検索で探す。
   圏外では静かに見つからないままにする（現場で邪魔をしない） */
function searchPlace(name){
  const q = String(name||'').trim();
  if(!q) return Promise.resolve(null);
  const url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q='
    + encodeURIComponent(q);
  return fetch(url, {cache:'no-store'})
    .then(r=>r.ok ? r.json() : null)
    .then(a=>{
      if(!Array.isArray(a) || !a.length) return null;
      const c = a[0] && a[0].geometry && a[0].geometry.coordinates;
      if(!c || !isFinite(c[0]) || !isFinite(c[1])) return null;
      return {lat:+c[1], lon:+c[0], title:(a[0].properties||{}).title||q};
    })
    .catch(()=>null);
}

/* 親魚と稚魚の区別（サクラマス FW050／ヤマメ FW050J、サケ FW044／サケ稚魚 FW044J）は
   2026-08-24 に正本（データベースの種マスタ）へ取り込んだ。
   ここでの手直しは不要になった（自動生成の区画に含まれて届く） */

function speciesById(id){ return SPECIES.find(s=>s.id===id) || null; }
/* 検索。正式な和名・科名に加えて、旧名や現場の呼び名（別名）でも見つかるようにする。
   別名で見つけても、保存されるのは常に種ID */
/* ひらがなをカタカナに直す（検索用）。魚の名前はカタカナで持っているので、
   「やまめ」と打ってもヤマメが出るようにする（2026-08-24 の実機の声） */
function kataOf(s){
  return String(s||'').replace(/[ぁ-ゖ]/g,
    ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}
function speciesSearch(q){
  q = String(q||'').trim();
  if(!q) return SPECIES;
  const qs = [q];
  const k = kataOf(q);
  if(k !== q) qs.push(k);          // ひらがなで打たれたら、カタカナでも探す
  const hit = name => qs.some(x=>String(name).indexOf(x)>=0);
  const hitIds = new Set();
  Object.keys(SPECIES_ALIAS).forEach(name=>{ if(hit(name)) hitIds.add(SPECIES_ALIAS[name]); });
  return SPECIES.filter(s=> hit(s.ja) || hit(s.fam||'') || hitIds.has(s.id));
}
function speciesAliasOf(id){
  return Object.keys(SPECIES_ALIAS).filter(n=>SPECIES_ALIAS[n]===id);
}

function isDetail(sv){ return !!sv && sv.detail_level==='詳細'; }

function surveyKind(sv){ return (sv && sv.survey_kind) === '物理環境' ? '物理環境' : '魚'; }
/* その記録が何のものか。1つの調査に魚と物理環境が同居するようになったので、
   調査ぜんぶの種類ではなく、記録ごとに決める（監査33回目 Major）。
   ・env_method を持つ → 物理環境（測点・ライン・メッシュ）
   ・unit_kind を持つ → 魚（E・P/F・P）
   ・is_spot → 地点（目印）
   ・どれでもない → 前のやり方の箇所。調査の種類に従う */
/* その記録が何のものか。
   env_method（環境の取り方）は、前のやり方で作った箇所にも付く。
   それだけで見分けると、魚の箇所が物理環境として扱われ、
   一覧からも集計からも消える（監査44回目 Critical）。
   これから作るものには record_kind を書き込み、そちらを先に見る。
   前の版のものは、印から見分けられる順に見る */
function stationKind(sv, st){
  if(!st) return surveyKind(sv);
  if(unitKindOf(st)) return '魚';           // 地図の単位（E・P/F・P）
  if(st.is_spot) return '地点';             // 「新しい調査」で置いた目印
  if(st.record_kind === 'env') return '物理環境';
  if(st.record_kind === 'fish') return '魚';
  if(isMesh(st)) return '物理環境';
  /* ここから先は前の版のもの。番号では見分けられない
     （地図で打った記録にも、保存の直前に番号が振られる。監査45回目 Critical）。
     見分けるのは「どちらの画面が作ったか」の跡:
     ・地図で作った記録だけが持つもの … 地点との紐づけ・つなげた元
     ・前のやり方の入力画面だけが書くもの … 調査方法・写真の欄
     どちらの跡も無いときは、物理環境として扱う（地図から手が届く方に寄せる） */
  if(st.env_method){
    if(isEnvSurvey(sv)) return '物理環境';
    if(st.spot_uuid || st.chained_from) return '物理環境';
    if(st.survey_method !== undefined || st.photos !== undefined) return '魚';
    return '物理環境';
  }
  return surveyKind(sv);
}

function isEnvRecord(sv, st){ return stationKind(sv, st) === '物理環境'; }

/* 物理環境の取り方。箇所ごとに持つ。未設定は「点」（いままでの取り方） */
function envMethod(st){
  const m = st && st.env_method;
  return (m==='ライン' || m==='メッシュ') ? m : '点';
}
function isLine(st){ return envMethod(st)==='ライン'; }
function isMesh(st){ return envMethod(st)==='メッシュ'; }

function stWord(sv){
  if(isDetail(sv)) return '地点';

  return '箇所';

function isLiveNow(sv){
  if(!sv || sv.status!=='調査中') return false;
  return surveyDays(sv).indexOf(dateValue()) >= 0;
}

const SURVEY_MAX_DAYS = 62;   // これより長い期間は保存のときに断る
/* 調査の期間。終了日が無ければ1日だけ */
function surveyDays(sv){
  const a = String(sv && sv.survey_date || '').slice(0,10);
  const b = String(sv && sv.survey_date_end || '').slice(0,10) || a;
  if(!a) return [];
  const out = [];
  const d0 = new Date(a+'T00:00:00'), d1 = new Date((b<a?a:b)+'T00:00:00');
  if(isNaN(d0) || isNaN(d1)) return a ? [a] : [];
  for(let d=new Date(d0); d<=d1 && out.length<=SURVEY_MAX_DAYS; d.setDate(d.getDate()+1)){
    out.push(dateValue(d));
  }
  return out.length ? out : [a];
}
function surveyIsMultiDay(sv){ return surveyDays(sv).length > 1; }
/* 期間の見せ方 */
function surveyPeriodText(sv){
  const days = surveyDays(sv);
  if(!days.length) return '—';
  if(days.length===1) return days[0];
  return `${days[0]} 〜 ${days[days.length-1]}（${days.length}日）`;
}
/* その箇所の日付。入っていなければ調査の開始日 */
/* その箇所の日付。
   1日だけの調査や、期間の外の日付が残っているときは、調査のはじめの日を使う */
function stationDate(st, sv){
  const base = String(sv && sv.survey_date || '').slice(0,10);
  const d = String(st && st.survey_date || '').slice(0,10);
  if(!d) return base;
  const days = surveyDays(sv);
  return days.indexOf(d) >= 0 ? d : base;
}

function seasonOf(dateStr){
  const m = parseInt(String(dateStr||'').slice(5,7),10);
  if(!m) return '';
  return m<=2||m===12 ? '冬' : m<=5 ? '春' : m<=8 ? '夏' : '秋';
}

/* ============================================================
   数えかた（ここ1本だけが尾数を決める）
   まとめて30尾  = 個体0件 ＋ 未計測30
   10尾測った    = 個体10件 ＋ 未計測は空欄
   10尾測って残り20尾は数えただけ = 個体10件 ＋ 未計測20
   ============================================================ */
/* inds を渡すと、その一覧から数える（書き出しのときは「壊れていたら止める」読み方で
   取った控えを渡す）。渡さないときは画面表示用の読み方 */
function catchTotal(c, inds){
  if(!c) return 0;
  const list = indsOf(inds, c.uuid);
  const measured = list.length;
  const un = countOf(c.count_unmeasured);
  return measured + (un==='' || un===null ? 0 : un);
}
function catchLengths(c, inds){
  return nums(indsOf(inds, c.uuid).map(i=>i.total_length_cm));
}
/* 1尾ずつの記録を取り出す。控え（記録ごとにまとめたもの）があればそれを使う */
function indsOf(inds, catchUuid){
  if(!inds) return DB.individualsOf(catchUuid);
  if(inds.byCatch) return inds.byCatch[catchUuid] || [];
  return inds.filter(i=>i.catch_uuid===catchUuid && !i.deleted_at);
}
function stationTotal(st){ return DB.catchesOf(st.uuid).reduce((a,c)=>a+catchTotal(c), 0); }
function surveyTotal(sv){ return DB.catchesOfSurvey(sv.uuid).reduce((a,c)=>a+catchTotal(c), 0); }

/* ============================================================
   集計（調査ぜんぶ）— 魚類調査イメージ.pptx の3枚目「▼ 集計（全体の）」
   出すのは2つだけ。ほかの集計（体長分布・努力量あたり）はデータベース側でやる
     1. 種ごとの尾数（多い順）と、その地点別の内訳
     2. 地点ごとの種数・尾数の一覧
   ============================================================ */
/* 記録はいちばん小さい単位にだけ入るので、単位ごとの記録をそのまま足せば
   二重に数えない。大きい単位の集計（unitTotals）はここでは使わない */
function surveyTally(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid) || {};
  const all = DB.stationsOf(svUuid);
  // 物理環境の記録（測点・ライン）は、魚の集計に混ぜない（監査32回目 Major）。
  // ただし前の版で魚の単位に「環境の取り方」が付いた分は、魚として数える
  // 描きかけの囲いは、まだ数えない（監査62回目 Major）
  const 対象 = all.filter(st=>!isMesh(st) && unitReady(st)
    && (st.is_spot || stationKind(sv, st) === '魚'));
  // 中に小さい単位があるもの（E1・P/F1 など）は、集計を出すだけの入れ物。
  // ただし、子を作る前にその親へ直接入れた記録は数え漏らさない
  const 親 = {};
  対象.forEach(st=>{ if(st.parent_uuid) 親[st.parent_uuid] = true; });
  const sts = 対象.slice().sort((a,b)=>(a.station_no||0)-(b.station_no||0));

  const sp = {};        // 種 → {name, 尾, 場所}
  const 場所 = [], 場所索引 = {};
  let 尾合計 = 0, 記録あり = 0;
  sts.forEach(st=>{
    const cs = DB.catchesOf(st.uuid);
    const 名 = st.name || '（名前なし）';
    // 内訳も地点でまとめる。まとめる鍵はIDにする
    // （地点の P1 と、地図のポイント P1 は別ものなので、名前では足さない）
    const 鍵 = st.is_spot ? st.uuid : (st.spot_uuid || st.uuid);
    const 親地点 = st.is_spot ? st : (st.spot_uuid ? DB.liveStation(st.spot_uuid) : null);
    const 内訳名 = 親地点 ? (親地点.name || (st.name||'')) : (st.name || '（名前なし）');
    const 種 = {};
    let n = 0;
    cs.forEach(c=>{
      const t = catchTotal(c);
      const key = c.species_id || c.species_name;
      if(!key || t <= 0) return;      // 0尾は種数に数えない（speciesCount と同じ決まり）
      種[key] = true;
      n += t; 尾合計 += t;
      const e = sp[key] || (sp[key] = {name: c.species_name || c.species_id || key, 尾:0, 場所:{}});
      e.尾 += t;
      const w = e.場所[鍵] || (e.場所[鍵] = {name:内訳名, 尾:0});
      w.尾 += t;
    });
    const 種数 = Object.keys(種).length;
    if(種数) 記録あり++;
    // 場所は「地点」でまとめる。地点の地図で作った E・P/F・P を別々に並べると、
    // 「地点ごとの種数・尾数」にならない（監査35回目 Major）。
    // 地点に属さない記録（調査から直接開いた地図の分・前のやり方の箇所）は、
    // それ自身を1つの場所として並べる
    const 場所鍵 = st.is_spot ? st.uuid : (st.spot_uuid || st.uuid);
    if(!(種数 || !親[st.uuid])) return;   // 記録の無い親は並べない
    const 既 = 場所索引[場所鍵];
    if(既){
      既.尾 += n;
      Object.keys(種).forEach(k=>{ 既.種集[k] = true; });
      既.種 = Object.keys(既.種集).length;
      return;
    }
    const 地点 = st.is_spot ? st : (st.spot_uuid ? DB.liveStation(st.spot_uuid) : null);
    const 見出し = 地点 ? (地点.name || 名) : 名;
    const 行 = {name: 見出し, 種: 種数, 尾: n, 種集: Object.assign({}, 種),
                鍵: 場所鍵,
                印: 地点 ? '' : (UNIT_MARK[unitKindOf(st)] || '')};
    場所索引[場所鍵] = 行;
    場所.push(行);
  });
  const 種一覧 = Object.keys(sp).map(k=>({id:k, name:sp[k].name, 尾:sp[k].尾, 場所:sp[k].場所}))
    // 多い順。同じ尾数なら名前順（並びが日によって変わらないように）
    .sort((a,b)=> b.尾 - a.尾 || String(a.name).localeCompare(String(b.name), 'ja'));
  return {種: 種一覧, 場所: 場所, 尾: 尾合計, 記録あり: 記録あり};
}
function surveyTallyShort(svUuid){
  const t = surveyTally(svUuid);
  return `${t.種.length}種 ${t.尾}尾 ／ ${t.場所.length}か所`;
}
/* 集計の中身。地図の画面と箇所ハブの両方で使う */
