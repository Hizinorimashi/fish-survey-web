    </tbody></table>
    ${(()=>{ const 無 = t.場所.filter(x=>!x.種).length;
      return 無 ? `<div class="dim small">${無}か所は、まだ魚の記録がありません。</div>` : ''; })()}`;

  return `<h3 style="margin-top:0">種ごとの尾数（多い順）</h3>
    <div class="dim small">名前の下は、どの場所で何尾とれたかです。</div>
    ${種表}
    <div class="hr"></div>
    <h3>場所ごとの種数・尾数</h3>
    ${場所表}
    <div class="dim small">体長の分布や努力量あたりの尾数は、
      書き出したCSVからデータベース側で出します。</div>`;
}

/* ============================================================
   川の環境（測点・河床材の割合・岸のカバー）
   ============================================================ */
function envPoints(st){ return (st && Array.isArray(st.env_points)) ? st.env_points : []; }

/* 測点から最小・最大・平均を出す。代表値は手入力があればそちら。
   0 を落とさないよう nums() を通す（淵の流速0・干出部の水深0は測った値） */
function pointStats(st, field, manualField){
  const v = nums(envPoints(st).map(p=>p[field]));
  const manual = numOf(st[manualField]);
  const avg = v.length ? v.reduce((a,b)=>a+b,0)/v.length : '';
  return {
    n: v.length,
    min: v.length ? Math.min.apply(null,v) : '',
    max: v.length ? Math.max.apply(null,v) : '',
    avg, manual,
    rep: manual!=='' ? manual : avg,
  };
}
function depthStats(st){ return pointStats(st, 'depth_cm', 'depth_rep_cm'); }
function velocityStats(st){ return pointStats(st, 'velocity_cms', 'velocity_rep_cms'); }

/* 河床材の割合（7区分） */
function substratePct(st){
  const o = st && st.substrate_pct;
  return (o && typeof o === 'object') ? o : {};
}
function substratePctSum(st){
  const p = substratePct(st);
  return OPT.substrate.reduce((a,k)=>{ const v=numOf(p[k]); return a + (v===''?0:v); }, 0);
}
/* 割合の多い順。優占・次優占を出すのに使う */
function substrateRank(st){
  const p = substratePct(st);
  return OPT.substrate
    .map(k=>({name:k, pct: numOf(p[k])===''?0:numOf(p[k])}))
    .filter(x=>x.pct>0)
    .sort((a,b)=>b.pct-a.pct);
}

/* 岸のカバー。side は 'left' か 'right' */
function coverList(st, side){
  const a = st && st['cover_'+side];
  return Array.isArray(a) ? a.filter(x=>x && x.type) : [];
}
function coverPctSum(st, side){
  return coverList(st, side).reduce((a,c)=>{ const v=numOf(c.pct); return a+(v===''?0:v); }, 0);
}
/* カバーがあるか。「なし」だけならカバー無し */
function coverPresent(st, side){
  const list = coverList(st, side);
  if(!list.length) return '';
  return list.some(c=>c.type && c.type!=='なし') ? 'あり' : 'なし';
}

/* ============================================================
   とった労力（通電秒数・歩いた距離・調べた面積）
   ============================================================ */
const TRACK_MIN_MOVE = 3;      // これ未満しか動いていなければ、軌跡に足さない（m）
const TRACK_SAVE_MS  = 15000;  // 軌跡を保存する間隔（書き込みすぎを防ぐ）

/* いまの通電秒数。押しっぱなしの分は、実際の時計で足す。
   秒数を数え続ける仕掛けを持たないので、画面を移してもアプリを閉じても狂わない */
function effortSeconds(st){
  if(!st) return 0;
  const base = numOf(st.effort_seconds);
  let n = base==='' ? 0 : base;
  if(st.effort_started_at){
    const t = Date.parse(st.effort_started_at);
    if(isFinite(t)) n += Math.max(0, (Date.now()-t)/1000);
  }
  return n;
}
function effortRunning(st){ return !!(st && st.effort_started_at); }

/* ============================================================
   採捕記録（漁具など）— 魚類調査イメージ.pptx の3枚目「▼ 採捕記録」
   漁具ごとに1行。記録する単位（いちばん小さい単位）にぶら下がる。
   通電・川幅・区間の長さ・面積も、この折りたたみの中にまとめた
   ============================================================ */
/* この単位で使った漁具の並び */
function gearsOf(st){ return (st && Array.isArray(st.gears)) ? st.gears : []; }
/* 漁具の名前だけを、重複なく並べる。
   書き出しの「調査方法」はここから作る。漁具を入れていない古い記録は、
   これまでの survey_method（選ぶボタン）をそのまま使う */
function stationMethods(st){
  const g = gearsOf(st).map(x=>String((x && x.gear) || '').trim()).filter(Boolean);
  if(g.length) return g.filter((v,i)=>g.indexOf(v)===i);
  return (st && Array.isArray(st.survey_method)) ? st.survey_method : [];
}
/* 名前の入っている漁具の数。足したばかりの空の行は数えない */
function gearCount(st){ return gearsOf(st).filter(g=>g && g.gear).length; }
function gearsShort(st){
  const l = stationMethods(st);
  if(!l.length) return '';
  return l.length<=2 ? l.join('・') : l.slice(0,2).join('・')+`ほか${l.length-2}`;
}
/* 1つぶんの入力欄。「その他」を選んだときだけ、名前の欄を使う */
function gearRowHtml(g, i, stUuid){
  g = g || {};
  const 既知 = OPT.method.indexOf(g.gear||'') >= 0;
  const 選び = (g.gear && !既知) ? 'その他' : (g.gear||'');
  return `<div class="card" style="padding:8px 10px;margin-bottom:8px">
    <div class="row">
      <div class="grow" style="font-weight:700">漁具 ${i+1}</div>
      <button class="btn ng" style="width:auto;margin:0;padding:6px 12px;font-size:13px"
        onclick="gearRemove('${stUuid}',${i})">消す</button>
    </div>
    <div onclick="setTimeout(function(){gearOtherSync(${i});},0)">
      ${segHtml('gear'+i, OPT.method.concat(['その他']), 選び)}</div>
    <input id="g_other_${i}" value="${esc(既知 ? '' : (g.gear||''))}"
      placeholder="漁具の名前" style="margin-top:6px${選び==='その他'?'':';display:none'}">
    <div class="row">
      <div class="grow"><label>数（台・枚）</label>
        <input id="g_cnt_${i}" inputmode="numeric" value="${esc(g.count!==undefined?g.count:'')}"></div>
      <div class="grow"><label>規格（目合いなど）</label>
        <input id="g_spec_${i}" value="${esc(g.spec||'')}"></div>
    </div>
    <div class="row">
      <div class="grow"><label>使った時間（分）</label>
        <input id="g_min_${i}" inputmode="decimal" value="${esc(g.minutes!==undefined?g.minutes:'')}"></div>
      <div class="grow"><label>回数</label>
        <input id="g_pass_${i}" inputmode="numeric" value="${esc(g.passes!==undefined?g.passes:'')}"></div>
    </div>
    <label>備考</label>
    <input id="g_note_${i}" value="${esc(g.note||'')}">
  </div>`;
}
/* 「その他」を選んだときだけ、名前の欄を出す */
function gearOtherSync(i){
  const el = $('#g_other_'+i); if(!el) return;
  el.style.display = (segVal('gear'+i)==='その他') ? '' : 'none';
}
function gearsHtml(st, stUuid){
  const l = gearsOf(st);
  return (l.length ? l.map((g,i)=>gearRowHtml(g, i, stUuid)).join('')
    : '<div class="dim small">まだありません。下の「＋ 漁具を足す」から入れてください。</div>')
    + `<button class="btn" onclick="gearAdd('${stUuid}')">＋ 漁具を足す</button>`;
}
/* 画面に出ている漁具の欄を、そのまま読み取る */
function collectGears(){
  const out = [];
  for(let i=0; ; i++){
    if(!$('#g_cnt_'+i)) break;
    const 選び = segVal('gear'+i);
    const 他 = strVal('#g_other_'+i);
    out.push({
      gear: (選び==='その他' || (!選び && 他)) ? 他 : 選び,
      count: strVal('#g_cnt_'+i), spec: strVal('#g_spec_'+i),
      minutes: strVal('#g_min_'+i), passes: strVal('#g_pass_'+i),
      note: strVal('#g_note_'+i),
    });
  }
  return out;
}
/* 数の欄を確かめて、しまえる形にする。おかしければ理由を返す */
function gearsNormalize(rows){
  const out = [];
  for(let i=0; i<rows.length; i++){
    const r = rows[i], n = i+1;
    const 空 = !r.gear && r.count==='' && r.spec==='' && r.minutes==='' && r.passes==='' && !r.note;
    // 何も入れていない行は、そのまま残す。足したばかりの行を勝手に消さないため。
    // 書き出しと集計は、名前の無い行を飛ばす
    if(空){ out.push({gear:''}); continue; }
    if(!r.gear) return {err:`漁具 ${n} の名前が入っていません`};
    if(r.count!=='' && countOf(r.count)===null) return {err:`漁具 ${n} の数は0以上の整数で入れてください`};
    if(r.passes!=='' && countOf(r.passes)===null) return {err:`漁具 ${n} の回数は0以上の整数で入れてください`};
    const e = rangeCheck([[`漁具 ${n} の数`, r.count, 0, 9999],
      [`漁具 ${n} の使った時間`, r.minutes, 0, 100000],
      [`漁具 ${n} の回数`, r.passes, 0, 9999]]);
    if(e) return {err:e};
    const o = {gear: r.gear};
    if(r.count!=='')   o.count   = countOf(r.count);
    if(r.spec)         o.spec    = r.spec;
    if(r.minutes!=='') o.minutes = numOf(r.minutes);
    if(r.passes!=='')  o.passes  = countOf(r.passes);
    if(r.note)         o.note    = r.note;
    out.push(o);
  }
  return {gears: out};
}
/* 漁具を1つ足す。いま打っている分を先にしまってから、行を増やす */
function gearAdd(stUuid){
  if(!saveEffort(stUuid, {quiet:true})) return;
  const st = DB.liveStation(stUuid); if(!st) return;
  st.gears = gearsOf(st).concat([{gear:''}]);
  if(!DB.upsert(DB.key.st, st)){
    toast('足せませんでした（端末の空き容量をご確認ください）', 8000); return;
  }
  render();
}
function gearRemove(stUuid, i){
  const st = DB.liveStation(stUuid); if(!st) return;
  const l = gearsOf(st);
  if(i<0 || i>=l.length) return;
  if(!confirm(`漁具 ${i+1}（${l[i].gear||'名前なし'}）を消します。よろしいですか？`)) return;
  // 消す行より前の入力は残したいので、先に打っている分をしまう。
  // しまえなかったら消さない（打った分が黙って消えるのを防ぐ）
  if(!saveEffort(stUuid, {quiet:true})) return;
  const now = DB.liveStation(stUuid); if(!now) return;
  const l2 = gearsOf(now).slice();
  l2.splice(i, 1);
  now.gears = l2;
  if(!DB.upsert(DB.key.st, now)){
    toast('消せませんでした（端末の空き容量をご確認ください）', 8000); return;
  }
  toast('消しました');
  render();
}

/* 区間の長さ。
   電気ショッカーは行きつ戻りつするので、軌跡の総延長をそのまま使うと
   同じ50mを3往復して150mになる。面積が3倍、単位努力量あたりの尾数が
   3分の1になり、労力を記録する意味が消える。
   だから既定は「始点から終点までの直線」。軌跡も残して、後から確かめられるようにする */
/* ===== メッシュ =====
   四隅を押さえて、縦と横の間隔（m）からマスを作る。
   （前の版は横を「分割数」で持っている。その記録もそのまま使える）
   マスの位置は四隅から計算で出す（1マスずつGPSを取ると、
   誤差で格子から外れてしまう）。
   四隅の順番は 上流左岸 → 上流右岸 → 下流右岸 → 下流左岸 */
const MESH_MAX_CELLS = 2000;      // これを超える格子は作らない
const MESH_MIN_EDGE_M = 0.5;      // これより短い辺は、押し間違いとみなす
const MESH_MAX_SPAN_DEG = 1;      // 1つの範囲が緯度経度で1度を超えることはない
/* 四隅の形を確かめる。おかしければ理由を返す（正しければ空文字）。
   validPt は isFinite で見るので、null や数字の文字列も通ってしまう。
   ここでは本物の数だけを受ける（2026-08-17 の監査 Major） */
function meshCornerError(c){
  if(!Array.isArray(c) || c.length!==4) return '四隅を4つとも押さえてください';
  for(const p of c){
    if(!Array.isArray(p) || p.length!==2) return '四隅の形がおかしいです';
    if(typeof p[0]!=='number' || typeof p[1]!=='number'
       || !isFinite(p[0]) || !isFinite(p[1])) return '四隅に数でないものが入っています';
    if(Math.abs(p[0])>90 || Math.abs(p[1])>180) return '四隅の位置が地球の外にあります';
  }
  const lats = c.map(p=>p[0]), lons = c.map(p=>p[1]);
  const span = Math.max(Math.max.apply(null,lats)-Math.min.apply(null,lats),
                        Math.max.apply(null,lons)-Math.min.apply(null,lons));
  // ここが広すぎるときは、押し間違いか、日付変更線をまたいでいる。どちらも受けない
  if(span > MESH_MAX_SPAN_DEG) return '四隅が離れすぎています。押し間違いかもしれません';
  // 辺の長さ。同じ点を2回押した・一直線に並んだ、を弾く
  for(let i=0;i<4;i++){
    const d = distMeters(c[i], c[(i+1)%4]);
    if(!(d >= MESH_MIN_EDGE_M)) return '四隅のうち2つが近すぎます（同じ場所を押していませんか）';
  }
  // 平らな面として見たときの向き。4つとも同じ向きに曲がっていれば、
  // ねじれても凹んでもいない（＝ふつうの四角）
  const x = c.map(p=>p[1]*Math.cos(c[0][0]*Math.PI/180)), y = c.map(p=>p[0]);
  let plus=0, minus=0, area=0;
  for(let i=0;i<4;i++){
    const a=i, b=(i+1)%4, d=(i+2)%4;
    const cr = (x[b]-x[a])*(y[d]-y[b]) - (y[b]-y[a])*(x[d]-x[b]);
    if(cr > 0) plus++; else if(cr < 0) minus++;
    area += x[a]*y[b] - x[b]*y[a];
  }
  if(plus && minus) return '四隅がねじれています。押した順番をご確認ください';
  if(Math.abs(area)/2 < 1e-12) return '四隅が一直線に並んでいます';
  return '';
}
function meshCorners(st){
  const c = st && st.mesh_corners;
  return meshCornerError(c) ? null : c;
}
/* 縦の長さ（上流の辺の中点から、下流の辺の中点まで）。
   左岸側と右岸側で長さが違うので、真ん中で測る */
function meshLength(st){
  const c = meshCorners(st); if(!c) return '';
  const up  = [(c[0][0]+c[1][0])/2, (c[0][1]+c[1][1])/2];
  const dn  = [(c[3][0]+c[2][0])/2, (c[3][1]+c[2][1])/2];
  return distMeters(up, dn);
}
/* 横の幅（上流の辺と下流の辺の平均） */
function meshWidth(st){
  const c = meshCorners(st); if(!c) return '';
  return (distMeters(c[0], c[1]) + distMeters(c[3], c[2])) / 2;
}
/* 縦に何行できるか。間隔で割って、1行未満なら1行 */
function meshRowsOf(st){
  const manual = countOf(st && st.mesh_rows);
  if(manual!==null && manual!=='' && manual>0) return manual;
  const L = meshLength(st), gap = numOf(st && st.mesh_row_m);
  if(L==='' || gap==='' || !(gap>0)) return 0;
  return Math.max(1, Math.round(L/gap));
}
/* 横に何列できるか。いまは「横の間隔m」（mesh_col_m）から数える。
   何m×何mでも作れるように（2026-08-24 の実機の声）。
   幅を間隔で割って丸めるので、全マスが同じ幅に少しずつ伸び縮みする
   （端に半端なマスを作らない。指定と多少ずれるのは承知のうえ）。
   前の版の「分割数」（mesh_cols）が入っていれば、そちらをそのまま使う */
function meshColsOf(st){
  const n = countOf(st && st.mesh_cols);
  if(n!==null && n!=='' && n>0) return n;
  const W = meshWidth(st), gap = numOf(st && st.mesh_col_m);
  if(W==='' || gap==='' || !(gap>0)) return 0;
  return Math.max(1, Math.round(W/gap));
}
/* 四隅の中を、行と列で分けたときのマスの中心。
   4つの角を「上下」「左右」で混ぜる（双線形内挿）。
   狭い範囲なので、緯度経度をそのまま混ぜてよい */
function meshCellCenter(c, rows, cols, row, col){
  const u = (col + 0.5) / cols;         // 左岸から右岸へ
  const v = (row + 0.5) / rows;         // 上流から下流へ
  const up = [c[0][0] + (c[1][0]-c[0][0])*u, c[0][1] + (c[1][1]-c[0][1])*u];
  const dn = [c[3][0] + (c[2][0]-c[3][0])*u, c[3][1] + (c[2][1]-c[3][1])*u];
  return [up[0] + (dn[0]-up[0])*v, up[1] + (dn[1]-up[1])*v];
}
/* 1マスの四隅（地図に描くため） */
function meshCellPoly(c, rows, cols, row, col){
  const at = (u,v)=>{
    const up = [c[0][0] + (c[1][0]-c[0][0])*u, c[0][1] + (c[1][1]-c[0][1])*u];
    const dn = [c[3][0] + (c[2][0]-c[3][0])*u, c[3][1] + (c[2][1]-c[3][1])*u];
    return [up[0] + (dn[0]-up[0])*v, up[1] + (dn[1]-up[1])*v];
  };
  const u0=col/cols, u1=(col+1)/cols, v0=row/rows, v1=(row+1)/rows;
  return [at(u0,v0), at(u1,v0), at(u1,v1), at(u0,v1)];
}
/* 格子の見積り。決める前に「何マスになるか」を見せるためのもの。
   上限を超えていても、超えた数のまま返す */
function meshPlan(st){
  const c = meshCorners(st);
  if(!c) return null;
  const rows = meshRowsOf(st), cols = meshColsOf(st);
  if(!(rows>0) || !(cols>0)) return null;
  return {corners:c, rows, cols, n: rows*cols,
          length: meshLength(st), width: meshWidth(st)};
}
/* 実際に使う格子。上限を超えていたら作らない。
   保存のときだけ止めていると、壊れた記録や古い記録で画面が固まる
   （2026-08-17 の監査 Major） */
function meshGeom(st){
  const g = meshPlan(st);
  if(!g) return null;
  if(!Number.isInteger(g.rows) || !Number.isInteger(g.cols)) return null;
  if(g.n > MESH_MAX_CELLS) return null;
  return g;
}
/* マスの位置。格子が決まっていなければ空 */
function meshCellPos(st, row, col){
  const g = meshGeom(st);
  if(!g || row<0 || col<0 || row>=g.rows || col>=g.cols) return null;
  return meshCellCenter(g.corners, g.rows, g.cols, row, col);
}
function meshCellsOf(stUuid){ return DB.meshCellsOf(stUuid); }
/* 格子には版がある。四隅や細かさを変えると、同じ「3行2列」でも
   川の別の場所を指すことになる。版を持たないと、古いマスが
   新しい格子のマスとして表示され、位置と集計が静かに壊れる
   （2026-08-17 の監査 Critical） */
function meshGridId(st){ return String((st && st.mesh_grid_id) || ''); }
/* その格子の定義を、文字にしたもの。同じなら版を変えない */
function meshGridSig(st){
  const c = (st && st.mesh_corners) || [];
  return JSON.stringify([c, numOf(st && st.mesh_row_m), countOf(st && st.mesh_cols),
                         numOf(st && st.mesh_col_m)]);
}
function meshIsCurrent(st, cell){
  return String((cell && cell.grid_id) || '') === meshGridId(st);
}
/* いまの格子のマスだけ */
function meshCurrentCells(st, cells){
  return (cells || meshCellsOf(st.uuid)).filter(c=>meshIsCurrent(st, c));
}
/* 前の格子で入れたマス。記録としては残すが、一覧や集計には混ぜない */
function meshOldCells(st, cells){
  return (cells || meshCellsOf(st.uuid)).filter(c=>!meshIsCurrent(st, c));
}
/* 入力済みのマスを、行×列で引けるようにする */
function meshCellMap(cells){
  const m = {};
  (cells||[]).forEach(x=>{ m[x.row+'_'+x.col] = x; });
  return m;
}
/* マスから水深・流速の最小・最大・代表を出す。0を落とさない */
function meshStats(cells, field, manual){
  const v = nums((cells||[]).map(x=>x[field]));
  const man = numOf(manual);
  if(!v.length) return {n:0, min:'', max:'', avg:'', manual:man, rep:man};
  const sum = v.reduce((a,b)=>a+b, 0);
  const avg = sum/v.length;
  return {n:v.length, min:Math.min.apply(null,v), max:Math.max.apply(null,v),
          avg, manual:man, rep: man!=='' ? man : avg};
}

/* その箇所の水深・流速。メッシュならマスから、それ以外は測点から。
   どちらも「手で入れた代表値があればそちらを使う」は同じ */
function stationDepth(st, snap){
  if(!isMesh(st)) return depthStats(st);
  return meshStats(meshCurrentCells(st, snapCells(st, snap)), 'depth_cm', st.depth_rep_cm);
}
function stationVelocity(st, snap){
  if(!isMesh(st)) return velocityStats(st);
  return meshStats(meshCurrentCells(st, snapCells(st, snap)), 'velocity_cms', st.velocity_rep_cms);
}
/* 書き出しの控えがあればそこから、無ければ保存から読む */
function snapCells(st, snap){
  if(snap && Array.isArray(snap.mc)) return snap.mc.filter(x=>x.station_uuid===st.uuid);
  return meshCellsOf(st.uuid);
}

/* ===== 物理環境の記録（地図の上で点と線を足していく） =====
   ポイントもラインも「箇所」1件。持っている項目は同じ。
   ちがうのは位置の持ち方だけ（点＝latitude/longitude、線＝始点と終点） */

/* 環境区分の略字。横一列に並べるため（早瀬→早） */
const HABITAT_SHORT = {'早瀬':'早','平瀬':'平','淵':'淵','瀬頭':'頭','トロ':'ト',
                       'たまり':'た','その他':'他'};
function habitatShort(v){
  // 「早瀬・淵」のように複数入っていても、1つずつ略す（2026-08-23 の実機の声）
  return String(v||'').split('・').map(x=>HABITAT_SHORT[x] || x).filter(Boolean).join('・');
}
function habitatLong(short){
  const hit = Object.keys(HABITAT_SHORT).find(k=>HABITAT_SHORT[k]===short);
  return hit || (short==='なし' ? '' : short);
}
/* 環境区分は複数選べる（「瀬と淵の境」のような場所がある。2026-08-23 の実機の声）。
   記録には「早瀬・淵」のように「・」でつないだ1つの文字として入れる。
   書き出しの列も、これまでの記録も、そのまま通る */
function habitatList(v){ return String(v||'').split('・').filter(Boolean); }
/* 環境区分のボタン。「なし」を押すと全部外れる */
function pickHabMulti(btn){
  const 皆 = btn.parentElement.querySelectorAll('button');
  if(btn.textContent === 'なし'){
    皆.forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
  }else{
    btn.classList.toggle('on');
    皆.forEach(b=>{ if(b.textContent==='なし') b.classList.remove('on'); });
    if(!Array.from(皆).some(b=>b.classList.contains('on'))){
      皆.forEach(b=>{ if(b.textContent==='なし') b.classList.add('on'); });
    }
  }
  draftTouch();
}
/* いま押されている環境区分（正式な名前で）。順番は選択肢の並びにそろえる */
function habMultiVal(){
  const on = $$(`[data-segmulti="envhab"] button.on`)
    .map(b=>b.textContent).filter(x=>x!=='なし').map(habitatLong);
  return OPT.habitat.filter(h=>on.indexOf(h)>=0).join('・');
}
function applyHabMulti(v){
  const wrap = document.querySelector(`[data-segmulti="envhab"]`); if(!wrap) return;
  const 選ばれ = habitatList(habitatShort(v||''));
  Array.from(wrap.querySelectorAll('button')).forEach(b=>{
    b.classList.toggle('on', b.textContent==='なし' ? !選ばれ.length
      : 選ばれ.indexOf(b.textContent)>=0);
  });
}

/* 画面は m・m/s、中は cm・cm/s。出し入れのときだけ直す。
   中を cm のままにしておくのは、魚の調査と書き出しがすでに cm で通っているため */
/* m を cm に。0.55 が 55.00000000000001 にならないようにする。
   端数のまま記録に入ると、書き出しにもそのまま出る（監査65回目のテストで判明） */
function mToCm(v){ const n = numOf(v); return n==='' ? '' : Math.round(n*100*1000)/1000; }
function cmToMDisp(v){
  const n = numOf(v);
  if(n==='') return '';
  // 0.253 のような値が 0.25300000000000003 にならないようにする
  return Math.round(n*1000)/100000;
}

/* 色分けの基準。地図の上で、どの項目で色を変えるか選べる */
const ENV_COLOR_BY = ['なし','環境区分','河床材料','礫の状況','流速','水深'];
function envColorBy(){ return prefs().env_color_by || 'なし'; }
function envSetColorBy(v){ prefSet('env_color_by', v); render(); }
/* 区分ごとの色。数が多くないので、見分けやすい色を並べる */
const ENV_CAT_COLORS = ['#4aa3ff','#3fb950','#f0883e','#d29922','#a371f7',
                        '#f778ba','#56d4dd','#8b949e'];
function envCatColor(list, v){
  const i = list.indexOf(v);
  return i < 0 ? '#8b949e' : ENV_CAT_COLORS[i % ENV_CAT_COLORS.length];
}
/* 数の大小を色にする。青（小）→黄→赤（大） */
function envRampColor(v, lo, hi){
  const n = numOf(v);
  if(n==='') return '#8b949e';          // 未記入だけを灰色にする
  // 入力が1件だけ、または全部同じ値のときは、幅が無い。
  // ここで灰色を返すと、入れてあるのに「未記入」に見える
  // （2026-08-18 の9回目の監査 Major）
  if(!(hi > lo)) return 'rgb(63,185,80)';
  const t = Math.max(0, Math.min(1, (n - lo) / (hi - lo)));
  const stops = [[74,163,255],[63,185,80],[210,153,34],[240,136,62],[248,81,73]];
  const x = t * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(x));
  const f = x - i;
  const c = [0,1,2].map(k => Math.round(stops[i][k] + (stops[i+1][k]-stops[i][k]) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
/* いまの基準で、その記録の色を決める */
function envColorOf(st, range){
  const by = envColorBy();
  if(by === '環境区分')  return envCatColor(OPT.habitat, habitatList(st.habitat_type)[0]);
  if(by === '河床材料')  return envCatColor(OPT.substrate, st.substrate1);
  if(by === '礫の状況')  return envCatColor(OPT.gravel, st.gravel_condition);
  if(by === '流速')      return envRampColor(st.velocity_rep_cms, range.vLo, range.vHi);
  if(by === '水深')      return envRampColor(st.depth_rep_cm, range.dLo, range.dHi);
  return null;             // 「なし」なら、これまでどおり種類で色を変える
}
/* 色の幅を決めるための、いちばん小さい値と大きい値 */
/* 色分けの幅は、いま地図に出している記録から作る。
   調査ぜんぶから作ると、別の地点の極端な値で色が偏る（監査39回目 Minor） */
function envColorRange(svUuid){
  const list = mapStations(svUuid, 'env');
  const v = nums(list.map(x=>x.velocity_rep_cms));
  const d = nums(list.map(x=>x.depth_rep_cm));
  return {vLo: v.length?Math.min.apply(null,v):0, vHi: v.length?Math.max.apply(null,v):0,
          dLo: d.length?Math.min.apply(null,d):0, dHi: d.length?Math.max.apply(null,d):0,
          vN: v.length, dN: d.length};
}
/* 何色が何を指すか。地図の下に出す */
function envLegendHtml(svUuid){
  const by = envColorBy();
  if(by === 'なし') return '';
  const wrap = (inner)=>`<div id="envLegend">${inner}</div>`;
  const chip = (col, label)=>`<span style="display:inline-flex;align-items:center;
    gap:4px;margin:0 8px 4px 0"><span style="width:12px;height:12px;border-radius:6px;
    background:${col};display:inline-block"></span>${esc(label)}</span>`;
  if(by === '流速' || by === '水深'){
    const r = envColorRange(svUuid);
    const lo = by==='流速' ? r.vLo : r.dLo, hi = by==='流速' ? r.vHi : r.dHi;
    const n  = by==='流速' ? r.vN : r.dN;
    if(!(hi > lo)){
      const why = n===0 ? 'まだ入っていないので、色は分かれません'
                : n===1 ? '値が1つだけなので、色は分かれません'
                        : 'どれも同じ値なので、色は分かれません';
      // 入っている分は同じ色で出る。その色も凡例に出さないと、
      // 地図の色が何を指すのか分からない（2026-08-18 の10回目の監査 Major）
      const 同値 = n===0 ? '' : chip(envRampColor(lo, lo, hi),
        fmtNum(cmToMDisp(lo),3)+(by==='流速'?' m/s':' m'));
      return wrap(`<div class="dim small">${esc(by)}：${why}　${同値}`
        + chip('#8b949e','未記入') + '</div>');
    }
    return wrap(`<div class="dim small">${esc(by)}　`
      + [0,0.25,0.5,0.75,1].map(t=>{
          const v = lo + (hi-lo)*t;
          return chip(envRampColor(v, lo, hi), fmtNum(cmToMDisp(v),3)+(by==='流速'?' m/s':' m'));
        }).join('') + '</div>');
  }
  const list = by==='環境区分' ? OPT.habitat : (by==='河床材料' ? OPT.substrate : OPT.gravel);
  return wrap(`<div class="dim small">${esc(by)}　`
    + list.map(o=>chip(envCatColor(list, o), o)).join('')
    + chip('#8b949e','未記入') + '</div>');
}

/* 地図に置く記号。鳥アプリと同じ、白フチのバッジに文字を入れる形。
   ただの丸だと、どれがどれだか地図の上で分からない */
function envBadge(txt, bg, size, strong, square){
  const fs = size <= 22 ? 10 : 12;
  return L.divIcon({className:'', iconSize:[size,size], iconAnchor:[size/2,size/2],
    html:`<div style="background:${bg};border:${strong?3:2}px solid #fff;
      border-radius:${square?'5px':'50%'};width:${size}px;height:${size}px;
      display:flex;align-items:center;justify-content:center;
      font-size:${fs}px;line-height:1;color:#fff;font-weight:700;
      box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap">${esc(txt)}</div>`});
}

/* 地図の見えている場所を、調査ごとに覚えておく。
   点を置くたびに全体表示へ戻ると、寄って作業しているときに邪魔になる */
const ENV_VIEW = {};
let ENV_MAP_SV = '';        // いま地図を出している調査
function envRememberView(svUuid){
  const map = MAPS.main.map; if(!map) return;
  try{
    const c = map.getCenter();
    ENV_VIEW[mapViewKey(svUuid)] = {lat:c.lat, lon:c.lng, zoom:map.getZoom(),
                        bearing: mapBearing(map)};
  }catch(e){}
}
/* 全体が入るように動かす。押したときだけ */
function envFitAll(svUuid){
  const map = MAPS.main.map; if(!map) return;
  const pts = envAllPoints(svUuid);
  if(!pts.length){ toast('まだ何も置かれていません'); return; }
  try{ map.fitBounds(L.latLngBounds(pts).pad(0.3), {animate:false}); }catch(e){}
  envRememberView(svUuid);
}
function envAllPoints(svUuid){
  const pts = [];
  mapStations(svUuid, 'env').forEach(st=>{
    if(envKindOf(st)==='L'){
      const a = linePt(st,'start'), b = linePt(st,'end');
      if(a) pts.push(a);
      if(b) pts.push(b);
    }else{
      const p = stationPt(st);
      if(p) pts.push(p);
    }
  });
  return pts;
}

/* 地図の大きさ。大きくしても、下の入力はそのまま使える */
function envMapBig(){ return !!prefs().env_map_big; }
function envToggleBig(){ prefSet('env_map_big', !envMapBig()); render(); }

/* その箇所が点か線か。物理環境の調査だけで使う */
function envKindOf(st){
  if(isMesh(st)) return 'M';        // メッシュはこの画面では扱わない
  return isLine(st) ? 'L' : 'P';
}
/* 開始だけで、終わっていないライン。LE のつなぎ先になる */
function envPendingLine(svUuid){
  const list = DB.stationsOf(svUuid).filter(st=>isLine(st)
    && linePt(st,'start') && !linePt(st,'end'));
  return list.length ? list[list.length-1] : null;
}
/* 箇所の通し番号。
   生きている件数＋1で決めると、消したあとや、手で大きい番号を付けたときに
   番号がぶつかる。消したものも含めた「いちばん大きい番号＋1」にする
   （2026-08-18 の監査 Major） */
function nextStationNo(svUuid, all){
  const list = (all || DB.load(DB.key.st)).filter(x=>x && x.survey_uuid===svUuid);
  const max = list.reduce((m,x)=>{
    const n = countOf(x.station_no);
    return (n===null || n==='') ? m : Math.max(m, n);
  }, 0);
  // これ以上は、数として正しく数えられない。黙って同じ番号を出し続けない
  if(max >= Number.MAX_SAFE_INTEGER) return null;
  return max + 1;
}
/* 地点（P1・P2…）の採番。地点だけを数える。
   全部の記録から数えると、地点P1の中に記録を作っただけで
   次の地点が P5 になる（監査41回目 Major）。
   消したものも数えて、番号は使い回さない */
function nextSpotNo(svUuid){
  // 番号は作ったときに決めて覚える（spot_no）。名前から数えると、
  // P1 を別の名前に変えたあとに置いた地点が、また P1 になる（監査68回目 Minor）。
  // 前の版のものは、名前から読み取る
  const used = DB.load(DB.key.st)
    .filter(st=>st.survey_uuid===svUuid && st.is_spot)
    .map(st=>{
      if(+st.spot_no > 0) return +st.spot_no;
      const m = String(st.name||'').match(/^P(\d+)$/); return m ? +m[1] : 0;
    });
  return (used.length ? Math.max.apply(null, used) : 0) + 1;
}
/* P1 / L1 の採番。種類ごとに数える。
   地点（目印）と魚の単位は、別の系列なので数に入れない */
function envAutoName(svUuid, kind){
  // 消したものも数える。消した番号を使い回すと、
  // 先に書き出したCSVの P2 と、あとから作った P2 が別物になる
  const used = DB.load(DB.key.st).filter(st=>st.survey_uuid===svUuid)
    .filter(st=>!st.is_spot && !unitKindOf(st) && st.env_method)
    .filter(st=>envKindOf(st)===kind)
    .map(st=>{
      const m = String(st.name||'').match(new RegExp('^'+kind+'(\\d+)$'));
      return m ? +m[1] : 0;
    });
  const max = used.length ? Math.max.apply(null, used) : 0;
  return kind + (max + 1);
}

/* つぎに足すもの。LS のあとは LE、LE のあとは LS、と自動で入れ替わる。
   同じものを続けて押すか、P を押すと、その入れ替えをやめる */
let ENV_NEXT = {kind:'P', auto:false, line:'', survey:''};
/* つなげる：ラインを閉じたら、その場所を次のラインの始まりにする。
   縦断で歩くとき、境目を1回たたくだけで次の区間が始まる */
function envChain(){ const v = prefs().env_chain; return v===undefined ? true : !!v; }
function envSetChain(on){
  prefSet('env_chain', !!on);
  toast(on ? 'ラインをつなげます（閉じた場所が、つぎの始まりになります）'
           : 'ラインをつなげません', 5000);
  if(!envSyncNextUI()) render();
}
/* 別の調査を開いたら、持ち越さずに最初から。
   持ち越すと、開いた早々のタップで別の調査のラインを閉じてしまう
   （2026-08-17 の監査 Major） */
function envUseSurvey(svUuid){
  if(ENV_NEXT.survey !== svUuid){
    ENV_NEXT = {kind:'P', auto:false, line:'', survey:svUuid};
    ENV_SEL = null;
  }
}
/* 足せるもの。V は「曲がり」 */
function envKindWord(k){
  return k==='P' ? 'ポイント' : k==='LS' ? 'ラインの始まり'
       : k==='LE' ? 'ラインの終わり' : '曲がり';
}
function envSetKind(k){
  const sv = ENV_NEXT.survey;
  // 同じものをもう一度押したら、入れ替えをやめる（同じものを続けて足したいとき）
  if(ENV_NEXT.kind === k) ENV_NEXT = {kind:k, auto:false, line:ENV_NEXT.line, survey:sv};
  else if(k === 'P')       ENV_NEXT = {kind:'P', auto:false, line:'', survey:sv};
  // 曲がりは、続けて置くもの。交互には入れない
  else if(k === 'V')       ENV_NEXT = {kind:'V', auto:false, line:ENV_NEXT.line, survey:sv};
  else                     ENV_NEXT = {kind:k, auto:true, line:ENV_NEXT.line, survey:sv};
  if(!envSyncNextUI()) render();
}
/* まとめて消すために選んでいる最中。{sv, set} を持つ（2026-08-18 の実機の声） */
let ENV_PICK = null;
function envPickOn(){ return !!(ENV_PICK && ENV_PICK.set); }
function envPickStart(svUuid){
  if(!writeAllowed()){
    toast('このタブでは消せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  ENV_PICK = {sv: svUuid, set: new Set()};
  render();
}
function envPickCancel(){ ENV_PICK = null; render(); }
function envPickToggle(u){
  if(!envPickOn()) return;
  if(ENV_PICK.set.has(u)) ENV_PICK.set.delete(u); else ENV_PICK.set.add(u);
  envPickSync();
}
/* 選んだ数と印を、その場で書き替える（画面ごと作り直すと地図がちらつく） */
function envPickSync(){
  const n = envPickOn() ? ENV_PICK.set.size : 0;
  document.querySelectorAll('[data-seg="envsel"] button[data-u]').forEach(b=>{
    b.classList.toggle('on', !!(envPickOn() && ENV_PICK.set.has(b.dataset.u)));
  });
  const btn = $('#envPickDel');
  if(btn){
    btn.textContent = n ? `選んだ ${n}件を消す` : '消すものを押してください';
    btn.disabled = !n;
  }
}
/* まとめて消す。1回の保存で書く。
   1件ずつ書くと、途中で失敗したときに「消えたもの・残ったもの」が混ざる */
function envPickDelete(svUuid){
  if(!envPickOn() || !ENV_PICK.set.size) return;
  if(!writeAllowed()){
    toast('このタブでは消せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  const ids = Array.from(ENV_PICK.set);
  const names = ids.map(u=>(DB.get(DB.key.st, u)||{}).name||'').filter(Boolean);
  const 並び = names.slice(0,5).join('・') + (names.length>5 ? `ほか${names.length-5}件` : '');
  if(!confirm(`${並び} の ${ids.length}件を消します。中の記録も一緒に見えなくなります。`
    + '\nよろしいですか？')) return;
  let all;
  try{ all = DB.loadRaw(DB.key.st); }
  catch(e){ toast('保存された記録を読み取れないため、消せませんでした', 7000); return; }
  const t = nowISO();
  let n = 0;
  all.forEach(x=>{
    if(x && ENV_PICK.set.has(x.uuid) && x.survey_uuid===svUuid && !x.deleted_at){
      x.deleted_at = t; x.updated_at = t; n++;
    }
  });
  if(!n){ toast('消せるものがありませんでした'); ENV_PICK = null; render(); return; }
  if(!DB.save(DB.key.st, all)){
    toast('消せませんでした（端末の空き容量をご確認ください）', 8000);
    return;                      // 何も変えない
  }
  ids.forEach(u=>{ try{ draftClearFor('箇所', u); }catch(e){} });
  ENV_PICK = null;
  if(ENV_SEL && !DB.getAlive(DB.key.st, ENV_SEL)) ENV_SEL = null;
  if(ENV_NEXT.line && !DB.getAlive(DB.key.st, ENV_NEXT.line)){
    ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
  }
  toast(`${n}件を消しました`);
  render();
}
/* いま選んでいるもの・つなげる・案内の一行を、その場で書き替える。
   画面ごと作り直すと地図がちらつくので、必要なところだけ直す
   （2026-08-18 の実機の声） */
function envSyncNextUI(){
  const bars = document.querySelectorAll('.mapicons a[data-k]');
  if(!bars.length) return false;
  bars.forEach(a=>{
    const k = a.dataset.k;
    const on = (k==='chain') ? envChain() : (ENV_NEXT.kind === k);
    a.classList.toggle('on', !!on);
  });
  const hint = $('#envHint');
  if(hint){
    const 名 = envKindWord(ENV_NEXT.kind);
    let 行き先 = '';
    if(ENV_NEXT.kind === 'V'){
      // どのラインに付くのかを出す。つなげたときは、選ばれているものと違うことがある
      const t = envBendTarget(ENV_NEXT.survey);
      行き先 = t ? `　<b>${esc(t.name||'')}</b> に足します`
                 : '　<span class="pill ng">どのラインに足すか決められません</span>';
    }
    hint.innerHTML = `つぎ：<b>${esc(名)}</b>${行き先}`
      + `　地図をタップ／狙いの印で置けます`
      + (ENV_NEXT.auto ? '（始まり→終わりで交互）' : '（同じものが続きます）');
  }
  const box = $('#envPending');
  if(box){
    const p = envPendingLine(ENV_NEXT.survey);
    box.innerHTML = p ? `<div class="warnbox">${esc(p.name)} は始まりだけです。`
      + `ラインの終わりを置いてください。</div>` : '';
  }
  return true;
}
/* 足したあとに、つぎを決める。LS のときは「どのラインを閉じるか」も覚える */
function envAdvance(added, lineUuid){
  const sv = ENV_NEXT.survey;
  if(added === 'LS'){
    ENV_NEXT = {kind: ENV_NEXT.auto ? 'LE' : ENV_NEXT.kind, auto:ENV_NEXT.auto,
                line: lineUuid || '', survey:sv};
  }else if(added === 'LE'){
    ENV_NEXT = {kind: ENV_NEXT.auto ? 'LS' : ENV_NEXT.kind, auto:ENV_NEXT.auto,
                line:'', survey:sv};
  }
}
/* LE でつなぐ相手を決める。
   末尾を機械的に閉じると、L1 を選んでいるのに L2 が閉じる（監査 Major） */
function envLineTarget(svUuid){
  // 地点から開いているときは、その地点で作ったラインだけをつなぎ先にする。
  // 限らないと、P2で押した「ラインの終わり」が P1 のラインを閉じる（監査34回目 Critical）
  const 未完 = st => st && isLine(st) && linePt(st,'start') && !linePt(st,'end')
    && ofSpot(st, MAP_SPOT);
  // 1) いま選んでいる記録。人が選んだものを、いちばん先に見る。
  //    自動で始まったラインを優先すると、古いラインを選んでも別のほうが閉じる
  //    （2026-08-17 の監査 Critical）
  const sel = ENV_SEL ? DB.getAlive(DB.key.st, ENV_SEL) : null;
  if(未完(sel) && sel.survey_uuid===svUuid) return sel;
  // 2) 直前に置いた LS
  if(ENV_NEXT.line){
    const st = DB.getAlive(DB.key.st, ENV_NEXT.line);
    if(未完(st) && st.survey_uuid===svUuid) return st;
  }
  // 3) 未完がちょうど1つならそれ。2つ以上なら決めない（当て推量で閉じない）
  const list = DB.stationsOf(svUuid).filter(未完);
  return list.length===1 ? list[0] : null;
}

/* いまの種類で1件足す。時刻はここで自動的に刻む */
/* 相手（どのラインに足すか）は、現在地を待ちはじめる前に決めて渡せる。
   待っている間に人が別のラインを選ぶと、返ってきた座標が
   そちらへ書かれてしまう（監査47回目 Critical） */
function envAddAt(svUuid, lat, lon, acc, targetUuid){
  // 「地点に属さない以前の記録」を見ているだけの画面では、新しく作らせない。
  // 作ると、どの地点にも属さない記録がまた増える（監査52回目 Major）
  if(MAP_LOOSE){
    toast('ここは、地点に属さない以前の記録を見る画面です。'
      + '新しく作るときは、地点を選んでから開いてください', 8000);
    return null;
  }

  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return null;
  envFlush();            // いま打っている分を、置く前に書いてしまう
  if(!writeAllowed()){
    toast('このタブでは追加できません。記録を入れているタブでお試しください', 6000);
    return null;
  }
  const k = ENV_NEXT.kind;
  const la = +(+lat).toFixed(6), lo = +(+lon).toFixed(6);
  if(!validPt([la, lo])){ toast('位置がおかしいので追加できません'); return null; }
  const now = timeValue();

  if(k === 'V'){
    return envAddBend(svUuid, la, lo, acc, targetUuid);
  }
  if(k === 'LE'){
    // 開始だけのラインにつなぐ。無ければ足さない（勝手に線を作らない）
    let st;
    if(targetUuid){
      // 待つ前に決めた相手。まだ「終わっていないライン」のままかを見る
      const t = DB.getAlive(DB.key.st, targetUuid);
      st = (t && t.survey_uuid===svUuid && isLine(t)
            && linePt(t,'start') && !linePt(t,'end')) ? t : null;
      if(!st){
        toast('現在地を取っている間に、つなぐ相手のラインが変わったので置いていません', 8000);
        return null;
      }
    }else{
      st = envLineTarget(svUuid);
    }
    if(!st){
      const 未完 = DB.stationsOf(svUuid).filter(x=>isLine(x)
        && linePt(x,'start') && !linePt(x,'end'));
      toast(未完.length > 1
        ? `終わっていないラインが${未完.length}本あります。`
          + 'どれにつなぐか、下のボタンで先に選んでください'
        : 'つなぐラインがありません。先に LS（ラインのスタート）を足してください', 8000);
      return null;
    }
    const 前の終了時刻 = st.survey_time_end || '';
    const 前のended = st.ended_at || '';
    st.line_end_lat = la; st.line_end_lon = lo;
    st.line_end_acc = (acc===undefined || acc===null) ? '' : Math.round(acc);
    if(!st.survey_time_end) st.survey_time_end = autoTime(sv);
    st.ended_at = st.ended_at || nowISO();

    // つなげる：閉じた場所を、次のラインの始まりにする。
    // 「閉じる」と「次を始める」を別々に保存すると、片方だけ成功したときに
    // 閉じたのに次が始まっていない半端な状態が残る（2026-08-17 の監査 Major）。
    // 1回の保存でまとめて書く
    // 交互かどうかに関わらず、「つなげる」が入っていればつなぐ。
    // 交互をやめた（P を押した等）とたんに、前の終わりから始められなくなっていた
    // （2026-08-18 の実機の声）
    const つなぐ = envChain();
    const nx = つなぐ ? {
      uuid: uuid(), survey_uuid: svUuid,
      station_no: 0,          // すぐ下で、いま読んだ一覧から決め直す
      started_at: nowISO(), env_points: [],
      survey_time_start: autoTime(sv),
      survey_type: sv.survey_type_default || '目視',
      record_kind: 'env',     // 物理環境の記録。前のやり方の箇所と混ぜない
      env_method: 'ライン', name: envAutoName(svUuid, 'L'),
      // どの地点で作ったか・いつの記録かは、元のラインから引き継ぐ。
      // あとから別に書くと、そちらだけ失敗して紐づかないことがある（監査34回目 Critical）
      spot_uuid: st.spot_uuid || MAP_SPOT || '',
      // 日付だけは引き継がない。1日目のラインを2日目に閉じてつないだとき、
      // 新しいラインまで1日目の記録になってしまう（監査46回目 Major）
      survey_date: recDay(sv),
      line_direction: st.line_direction || '上流→下流',
      line_start_lat: la, line_start_lon: lo,
      line_start_acc: (acc===undefined || acc===null) ? '' : Math.round(acc),
      chained_from: st.uuid,
    } : null;

    let all;
    try{ all = DB.loadRaw(DB.key.st); }
    catch(e){ toast('保存された記録を読み取れないため、置けませんでした', 7000); return null; }
    const i = all.findIndex(x=>x.uuid===st.uuid);
    if(i < 0){ toast('この区間が見つかりません'); return null; }
    st.updated_at = nowISO();
    all[i] = st;
    if(nx){
      // 番号は、いま読んだ一覧から決める（別に数えると食い違う）
      const nn = nextStationNo(svUuid, all);
      if(nn===null){ toast('番号が大きすぎて、これ以上つなげません', 7000); return null; }
      nx.station_no = nn;
      nx.created_at = nowISO(); nx.updated_at = nx.created_at;
      all.push(nx);
    }
    if(!DB.save(DB.key.st, all)) return null;   // 保存できていないので、何も変えない
    envHistPush({type:'終わり', sv:svUuid, uuid:st.uuid, name:st.name,
      next: nx ? nx.uuid : '', prevTime: 前の終了時刻, prevEnded: 前のended});
    envMarkPlaced();

    envAdvance('LE');
    let 続き = '';
    if(nx){
      // 交互にするかどうかは、人が決めたままにする（勝手に戻さない）
      ENV_NEXT = {kind:'LE', auto:ENV_NEXT.auto, line:nx.uuid, survey:svUuid};
      続き = `　つづけて ${nx.name} が始まりました`;
    }
    ENV_SEL = st.uuid;          // いま閉じたものを選ぶ（前の記録に書き込ませない）
    toast(`${st.name} の終わりを置きました（${fmtDist(lineDist(st))}）${続き}`,
      続き ? 5000 : 3000);
    return st.uuid;
  }

  const rec = {
    uuid: uuid(), survey_uuid: svUuid,
    station_no: 0,
    spot_uuid: MAP_SPOT || '',      // どの地点の地図で作ったか（書き出しの地点情報に使う）
    record_kind: 'env',             // 物理環境の記録。前のやり方の箇所と混ぜない
    survey_date: recDay(sv),
    started_at: nowISO(), env_points: [],
    survey_time_start: autoTime(sv),
    survey_type: sv.survey_type_default || '目視',
  };
  if(k === 'LS'){
    rec.env_method = 'ライン';
    rec.name = envAutoName(svUuid, 'L');
    rec.line_direction = '上流→下流';
    rec.line_start_lat = la; rec.line_start_lon = lo;
    rec.line_start_acc = (acc===undefined || acc===null) ? '' : Math.round(acc);
  }else{
    rec.env_method = '点';
    rec.name = envAutoName(svUuid, 'P');
    rec.latitude = la; rec.longitude = lo;
    rec.gps_accuracy = (acc===undefined || acc===null) ? '' : Math.round(acc);
    rec.position_source = (acc===undefined || acc===null) ? '地図' : 'GPS';
    rec.survey_time_end = rec.survey_time_start;   // 点は幅を持たない
    rec.ended_at = nowISO();
  }
  const no2 = nextStationNo(svUuid);
  if(no2===null){ toast('番号が大きすぎて、これ以上置けません', 7000); return null; }
  rec.station_no = no2;
  if(!DB.upsert(DB.key.st, rec)) return null;
  envHistPush({type:'置いた', sv:svUuid, uuid:rec.uuid, name:rec.name});
  envAdvance(k, rec.uuid);
  // 置いたものをそのまま選ぶ。選ばないと、前の記録の入力欄が出たままになり、
  // 新しい点のつもりで前の記録に書き込んでしまう（監査 Major）
  ENV_SEL = rec.uuid;
  toast(`${rec.name} を置きました`);
  return rec.uuid;
}
/* メッシュの範囲を、物理環境の地図から作る（地点ごとのメッシュ入口）。
   地点から開いていれば、その地点のメッシュとして作る。
   「取り方＝メッシュ」「どの地点か」「調査日」を最初の1回の保存で入れる
   （あとから入れる作りだと、途中で閉じたときに欠けた記録が残る。監査37回目 Major）。
   既存の地点（目印）をメッシュに作り替えることはしない。常に新しい記録を作る */
function meshCreate(svUuid){
  if(MAP_LOOSE){
    toast('ここは、地点に属さない以前の記録を見る画面です。'
      + '新しく作るときは、地点を選んでから開いてください', 8000);
    return null;
  }
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return null;
  envFlush();            // いま打っている分を、作る前に書いてしまう
  if(!writeAllowed()){
    toast('このタブでは作れません。記録を入れているタブでお試しください', 6000);
    return null;
  }
  const no = nextStationNo(svUuid);
  if(no === null){ toast('番号が大きすぎて、これ以上作れません', 7000); return null; }
  const rec = {
    uuid: uuid(), survey_uuid: svUuid,
    station_no: no,
    spot_uuid: MAP_SPOT || '',      // どの地点の地図で作ったか
    record_kind: 'env',             // 物理環境の記録。前のやり方の箇所と混ぜない
    survey_date: recDay(sv),
    started_at: nowISO(),
    survey_time_start: autoTime(sv),
    survey_type: sv.survey_type_default || '目視',
    env_method: 'メッシュ',
    name: envAutoName(svUuid, 'M'),
  };
  if(!DB.upsert(DB.key.st, rec)) return null;
  toast(rec.name + ' を作りました。川の四隅を押さえて格子を決めてください', 6000);
  nav('meshSetup', rec.uuid);
  return rec.uuid;
}

/* その箇所の位置。緯度と経度がそろって、地球上の値のときだけ返す。
   緯度だけで判ずると、経度が空の古い記録で [緯度, 0] を地図に渡してしまう
   （2026-08-18 の3回目の監査 Minor） */
function stationPt(st){
  const la = numOf(st && st.latitude), lo = numOf(st && st.longitude);
  if(la==='' || lo==='') return null;
  const pt = [la, lo];
  return validPt(pt) ? pt : null;
}
/* ラインの始点・終点。両方そろっていなければ距離は出さない */
function linePt(st, which){
  const la = numOf(st && st['line_'+which+'_lat']);
  const lo = numOf(st && st['line_'+which+'_lon']);
  if(la==='' || lo==='') return null;
  const pt = [la, lo];
  return validPt(pt) ? pt : null;
}
/* ============================================================
   魚の調査の記録の単位（魚類調査イメージ.pptx）
     E  … 調査範囲（囲い）
     PF … 河川区分・瀬淵（囲い）
     P  … ポイント（点）
   記録は「いちばん小さい単位」にだけ入れる。
   大きい単位は、中に入っている小さい単位の集計を出すだけ
   ============================================================ */
const UNIT_WORD = {E:'調査範囲', PF:'河川区分（瀬淵）', P:'ポイント'};
const UNIT_MARK = {E:'E', PF:'P/F', P:'P'};
function unitKindOf(st){
  const k = st && st.unit_kind;
  return (k==='E' || k==='PF' || k==='P') ? k : '';
}
function isUnitPoly(st){ const k = unitKindOf(st); return k==='E' || k==='PF'; }
/* 囲いの角。3つ以上そろって、はじめて囲いになる */
function polyPts(st){
  return ((st && st.poly) || []).map(v=>{
    const la = numOf(v && v.lat), lo = numOf(v && v.lon);
    if(la==='' || lo==='') return null;
    const pt = [la, lo];
    return validPt(pt) ? pt : null;
  }).filter(Boolean);
}
function polyClosed(st){ return polyPts(st).length >= 3; }
/* その点が囲いの中か（へりを横切る回数で決める）。
   圏外地図の pointInPoly(lat, lon, poly) とは別物なので、名前を分ける */
/* 経度を、基準の近くへそろえる。
   東経179度と西経179度は隣どうしなのに、そのまま引くと地球1周ぶんになる
   （2026-08-20 の監査 Major） */
function lonNear(lon, base){
  let d = lon - base;
  while(d > 180) d -= 360;
  while(d < -180) d += 360;
  return base + d;
}
function ptInPoly(pt, poly){
  if(!validPt(pt) || !poly || poly.length < 3) return false;
  const [y, x0] = pt;
  const x = x0;
  poly = poly.map(v=>[v[0], lonNear(v[1], x)]);
  let 中 = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const yi = poly[i][0], xi = poly[i][1];
    const yj = poly[j][0], xj = poly[j][1];
    const またぐ = (yi > y) !== (yj > y);
    if(またぐ && x < (xj - xi) * (y - yi) / (yj - yi) + xi) 中 = !中;
  }
  return 中;
}
/* 囲いの真ん中（角の平均）。囲い同士の入れ子を見るために使う */
function polyCenter(pts){
  if(!pts || !pts.length) return null;
  const n = pts.length;
  return [pts.reduce((a,p)=>a+p[0],0)/n, pts.reduce((a,p)=>a+p[1],0)/n];
}
/* その単位の代表の点。点はそのまま、囲いは真ん中 */
function unitPoint(st){
  if(unitKindOf(st)==='P') return stationPt(st);
  return polyCenter(polyPts(st));
}
/* 囲いの広さのめやす（同じ点を囲う囲いが複数あるとき、小さいほうを親にする） */
function polyArea(pts){
  if(!pts || pts.length < 3) return 0;
  const base = pts[0][1];
  pts = pts.map(v=>[v[0], lonNear(v[1], base)]);
  let a = 0;
  for(let i=0, j=pts.length-1; i<pts.length; j=i++){
    a += (pts[j][1] + pts[i][1]) * (pts[j][0] - pts[i][0]);
  }
  return Math.abs(a/2);
}
/* その単位が、その囲いの中にすっかり入っているか。
   真ん中だけで見ると、大きい囲いの真ん中に小さい囲いがあるとき、
   大きいほうが「中にある」と判じられてしまう（角を全部見る） */
function unitInside(st, pts){
  if(!pts || pts.length < 3) return false;
  if(unitKindOf(st) === 'P'){
    const pt = stationPt(st);
    return !!pt && ptInPoly(pt, pts);
  }
  const mine = polyPts(st);
  if(!mine.length) return false;
  return mine.every(v=>ptInPoly(v, pts));
}
/* いちばん内側の、その単位を囲んでいる囲い */
/* 段（E → P/F → P）。親になれるのは、自分より上の段だけ。
   段を見ないと、P/F が E の親になったり、輪ができたりする
   （2026-08-20 の監査 Major） */
const UNIT_RANK = {E:1, PF:2, P:3};
/* 単位の日。日付の欄が無い前の版のものは、調査の初日として扱う */
function unitDay(st){
  if(!st) return '';
  if(st.survey_date) return String(st.survey_date).slice(0,10);
  const sv = DB.getAlive(DB.key.sv, st.survey_uuid);
  return sv ? stationDate(st, sv) : '';
}
function unitParentOf(st, list){
  const 自分の段 = UNIT_RANK[unitKindOf(st)] || 9;
  let 親 = '', 広さ = Infinity;
  (list||[]).forEach(o=>{
    if(!o || o.uuid===st.uuid || !isUnitPoly(o)) return;
    if(polyDrawing(o)) return;      // 描きかけの囲いは、まだ親にしない
    // 別の地点で描いた囲いは親にしない。地図の上で重なっていても別ものなので、
    // 親子にすると集計が混ざる（監査34回目 Critical）
    if((o.spot_uuid||'') !== (st.spot_uuid||'')) return;
    // 別の日に置いた単位も親にしない。同じ場所に2日目の単位を置くと、
    // 1日目の囲いの子になって、集計が日をまたいで混ざる（監査49回目 Major）。
    // 前の版の単位は日付の欄を持たない。生のまま比べると、同じ日なのに
    // 親子にならない（監査50回目 Major）。調査の初日として揃えて比べる
    if(unitDay(o) !== unitDay(st)) return;
    if((UNIT_RANK[unitKindOf(o)] || 9) >= 自分の段) return;   // 同じ段・下の段は親にしない
    const pts = polyPts(o);
    if(pts.length < 3) return;
    if(!unitInside(st, pts)) return;
    const a = polyArea(pts);
    if(a < 広さ){ 広さ = a; 親 = o.uuid; }
  });
  return 親;
}
/* その単位の中に入っている単位（1つ下だけ） */
function unitChildren(u, list){
  return (list||[]).filter(x=>x && x.parent_uuid === u);
}
/* 囲いを1つの文字にする。「緯度 経度;緯度 経度;…」の並び。
   表計算でもGISでも読めるように、余計な記号を入れない */
function polyText(st){
  return polyPts(st).map(v=>fixCoord(v[0]) + ' ' + fixCoord(v[1])).join(';');
}
/* 名前は種類ごとの通し番号（E1・P/F1・P1） */
function unitAutoName(svUuid, kind, all){
  const list = (all || DB.stationsOf(svUuid)).filter(x=>unitKindOf(x)===kind);
  const mark = UNIT_MARK[kind] || '';
  let n = 0;
  list.forEach(x=>{
    const m = String(x.name||'').match(new RegExp('^' + mark.replace('/','\\/') + '(\\d+)$'));
    if(m) n = Math.max(n, +m[1]);
  });
  return mark + (n + 1);
}
/* その単位の中に入っているもの（孫も）。輪になっていても止まる */
function unitDescendants(u, list){
  const out = [];
  const 見た = new Set([u]);
  let 今 = [u];
  while(今.length){
    const 次 = [];
    今.forEach(x=>{
      unitChildren(x, list).forEach(c=>{
        if(見た.has(c.uuid)) return;
        見た.add(c.uuid); out.push(c); 次.push(c.uuid);
      });
    });
    今 = 次;
  }
  return out;
}
/* その単位の集計。中に入っているものを、ぜんぶ足す。
   記録は小さい単位にだけ入るので、足し合わせても二重にならない */
function unitTotals(u, list, snap){
  const 自分 = (list||[]).find(x=>x && x.uuid===u) || DB.liveStation(u);
  const みんな = (自分 ? [自分] : []).concat(unitDescendants(u, list));
  const 種 = new Set();
  let 尾 = 0;
  みんな.forEach(st=>{
    const cs = snap ? snap.ca.filter(c=>c.station_uuid===st.uuid) : DB.catchesOf(st.uuid);
    cs.forEach(c=>{
      const n = catchTotal(c, snap);
      尾 += n;
      // 0尾（いなかった記録）は種数に入れない。種IDが無く種名だけのものは数える
      //（監査48回目 Major）
      if(n > 0 && (c.species_id || c.species_name)) 種.add(c.species_id || c.species_name);
    });
  });
  return {尾, 種: 種.size, 単位: みんな.length};
}
/* 親子を、いまの囲いの形から付け直す。形を変えるたびに呼ぶ */
/* その単位に、自分の記録が入っているか。
   「記録はいちばん小さい単位にだけ入れる」の見張りに使う */
/* その地点に、実際の記録が入っているか。
   魚・漁具だけでなく、前の版で地点へ直接入れた環境の値や測点・写真も見る。
   見落とすと、箇所CSVには出るのに調査CSVでは0の行になる（監査39回目 Major） */
/* 地点そのものに直接入った記録があるか（地点情報・メモは数えない）。
   前の版で地点へ直に入れた分を拾うためのもの */
function spotOwnRecords(st){
  if(!st) return false;
  if(DB.catchesOf(st.uuid).length) return true;
  if(gearCount(st)) return true;
  if(st.env_method) return true;
  if(envPoints(st).length) return true;
  if((st.photos||[]).length) return true;
  if(envHasOwn(st)) return true;
  if(numOf(st.effort_seconds)!=='' || numOf(st.effort_passes)!=='') return true;
  if(numOf(st.width_m)!=='' || numOf(st.length_m_manual)!=='') return true;
  if(numOf(st.area_m2_manual)!=='') return true;
  return false;
}
function spotHasData(st){
  if(!st) return false;
  // 地点情報（区間名・地点名・河川形態A・天気・メモ）だけ入れた地点も、
  // 書き出しの対象にする。外すと、その地点の値が調査ぜんぶの値に化ける
  //（監査40回目 Major）
  if(st.section_name || st.site_name || st.river_morphology_a || st.weather) return true;
  if(DB.catchesOf(st.uuid).length) return true;
  if(gearCount(st)) return true;
  if(st.env_method) return true;
  if(envPoints(st).length) return true;
  if((st.photos||[]).length) return true;
  if(envHasOwn(st)) return true;
  if(numOf(st.effort_seconds)!=='' || numOf(st.effort_passes)!=='') return true;
  if(numOf(st.width_m)!=='' || numOf(st.length_m_manual)!=='') return true;
  if(numOf(st.area_m2_manual)!=='') return true;
  if(st.memo) return true;
  return false;
}
/* その記録に、川の環境の値が入っているか。入っていれば、その名前を返す。
   画面から入れられるものを1か所で見る。ばらばらに書くと、
   数え漏らした項目だけ手が届かなくなる（監査49回目 Major） */
function envHasOwn(st){
  if(!st) return '';
  if(numOf(st.depth_rep_cm)!=='' || numOf(st.velocity_rep_cms)!=='') return '水深・流速';
  if(st.habitat_type || st.substrate1 || st.gravel_condition) return '川底と流れ';
  if(numOf(st.water_temp)!=='' || numOf(st.flow_rate)!=='') return '水温・流量';
  // 空の配列でも「あり」になっていた。一度保存しただけで、
  // その単位に子を作れなくなる（監査62回目 Major）
  if(coverList(st,'left').length || coverList(st,'right').length) return '岸のカバー';
  if(numOf(st.cover_left_length_m)!=='' || numOf(st.cover_right_length_m)!=='') return '岸のカバー';
  const pct = st.substrate_pct;
  if(pct && typeof pct === 'object' && Object.keys(pct).some(k=>numOf(pct[k])!=='')) {
    return '河床材の割合';
  }
  if(envPoints(st).length) return '測点';
  return '';
}
/* 親に入っていると、中に小さい単位を作れなくなるもの。
   数えるのは「足し合わせると二重になるもの」だけ（2026-08-23 の実機の声）。

   48・49・62回目の監査に応じて「親の画面から入れられるものぜんぶ」に
   広げてしまったが、それは行きすぎだった。
   調査範囲について水温を測る・環境区分を選ぶ・写真を撮る・メモを書く、は
   現場のふつうの手順で、しかも足し算にならない。
   止めてしまうと、そのあと河川区分（瀬淵）に分けられなくなる。
   しかも「中の単位へ移す」道具が無いので、詰んでしまう */
function unitHasOwn(st){
  if(!st) return '';
  if(DB.catchesOf(st.uuid).length) return '魚の記録';
  if(gearCount(st)) return '漁具';
  // 0秒は「押してすぐ止めた」だけ。これで子を作れなくなると、消す手が無い
  //（監査49回目 Major）
  if(st.effort_started_at || +st.effort_seconds > 0) return '通電';
  if(numOf(st.length_m_manual)!=='' || numOf(st.area_m2_manual)!=='') return '距離・面積';
  if(numOf(st.effort_passes)!=='' || numOf(st.width_m)!=='') return '流した回数・川幅';
  return '';
}
/* 親に入っていても構わないもの（足し算にならない）。
   ただし、子ができると親の入力欄が隠れるので、
   入っていることは画面に出して、直せる道を残す（監査48・62回目の趣旨） */
function unitOwnInfo(st){
  if(!st) return '';
  const e = envHasOwn(st); if(e) return e;
  if((st.photos||[]).length) return '写真';
  if(st.memo) return 'メモ';
  return '';
}
/* 親になろうとしている単位に、自分の記録が入っていないか。
   入ったまま子を作ると、集計では親と子を両方足すのに、
   努力量や距離は片方しか数えず、数が食い違う（監査35回目 Major） */
function unitParentBlocked(st, list){
  const 親id = unitParentOf(st, list);
  if(!親id) return '';
  const 親 = (list||[]).filter(x=>x && x.uuid===親id)[0];
  const 何 = unitHasOwn(親);
  if(!何) return '';
  return `${親.name} に${何}が入っています。`
    + '中に小さい単位を作ると、数が合わなくなります。'
    + `先に ${親.name} の${何}を、中の単位へ移すか消してください`;
}
function unitRelink(svUuid){
  let all;
  try{ all = DB.loadRaw(DB.key.st); }catch(e){ return false; }
  const この調査 = all.filter(x=>x && !x.deleted_at && x.survey_uuid===svUuid && unitKindOf(x));
  // 描きかけの囲いは、親にも子にもしない。付けると、閉じる前から
  // 親が「子のいる入れ物」に見えて、箇所数が減る（監査63回目 Major）
  const 対象 = この調査.filter(unitReady);
  let 変わった = false;
  const 直した時 = nowISO();
  この調査.forEach(st=>{
    const 親 = unitReady(st) ? unitParentOf(st, 対象) : '';
    if((st.parent_uuid||'') !== 親){
      st.parent_uuid = 親;
      // 直した結び付きは、時刻も進めて保存する。進めないと、合成のとき
      // 他の端末に残る古い写し（消した囲いを親に指したまま）が選ばれ直し、
      // その囲いの完全削除に子まで巻き込まれる（監査83回目 Critical）
      st.updated_at = 直した時;
      変わった = true;
    }
  });
  if(!変わった) return true;
  return DB.save(DB.key.st, all);
}
/* ラインの途中の曲がり。川の形に沿わせるために置く（2026-08-19 の実機の声） */
function lineVias(st){
  return ((st && st.line_via) || []).map(v=>{
    const la = numOf(v && v.lat), lo = numOf(v && v.lon);
    if(la==='' || lo==='') return null;
    const pt = [la, lo];
    return validPt(pt) ? pt : null;
  }).filter(Boolean);
}
/* 始点 → 曲がり… → 終点。終点がまだなら、そこまでの形を返す */
function linePath(st){
  const a = linePt(st,'start');
  if(!a) return [];
  const b = linePt(st,'end');
  return [a].concat(lineVias(st), b ? [b] : []);
}
/* 始点から終点までの直線。曲がりを置いても、この値は変わらない
   （書き出しの「距離_始終点直線m」は、これまでと同じ意味のまま） */
function lineStraight(st){
  const a = linePt(st,'start'), b = linePt(st,'end');
  return (a && b) ? distMeters(a, b) : '';
}
/* 区間の長さ。曲がりを置いてあれば、その折れ線に沿って測る。
   歩いた向きは距離に関係しない */
function lineDist(st){
  const b = linePt(st,'end');
  if(!b) return '';
  const path = linePath(st);
  return path.length >= 2 ? pathLength(path) : '';
}
function stationLengths(st){
  const track = (st.track||[]).filter(validPt);
  // 2点未満では長さを測りようがない。0mと言わずに空欄にする。
  // 空欄を0にすると、歩いていないのに「距離0m」がCSVに出る
  const has = track.length >= 2;
  const trackLen = has ? pathLength(track) : '';
  const straight = has ? distMeters(track[0], track[track.length-1]) : '';
  const manual = numOf(st.length_m_manual);
  // 押さえた始点・終点があれば、軌跡から出した直線より信じる。
  // 使う順は 手入力 ＞ 押さえた始終点 ＞ 軌跡の直線 ＞ 軌跡の総延長
  const line = lineDist(st);
  const used = manual!=='' ? manual
             : (line!=='' ? line
             : (straight!=='' && straight>0 ? straight
             : (trackLen!=='' ? trackLen : '')));
  return {track:trackLen, straight, line, manual, used};
}
function stationAreas(st){
  const L = stationLengths(st).used;
  const w = numOf(st.width_m);
  const calc = (w==='' || L==='' || !isFinite(L)) ? '' : L * w;
  const manual = numOf(st.area_m2_manual);
  const used = manual!=='' ? manual : calc;
  return {calc, manual, used};
}
/* 調査ぜんぶの合計。箇所の「使う値」を足す */
/* 種数。尾数0の記録は数えない。
   種を選んだだけで戻ったときに空の記録が残るので、
   数えると箇所CSVと調査CSVの種数が食い違う（2026-08-17 の監査 Major） */
function speciesCount(catches, inds){
  const set = new Set();
  (catches||[]).forEach(c=>{
    if(!c || (!c.species_id && !c.species_name)) return;
    if(catchTotal(c, inds) <= 0) return;
    set.add(c.species_id || c.species_name);
  });
  return set.size;
}
function surveyLengths(sv){
  // 1つも測っていなければ空欄。0を返すと「調べたが0m」に見える
  const vals = DB.stationsOf(sv.uuid)
    .map(st=>stationLengths(st).used).filter(v=>v!=='' && isFinite(v));
  const auto = vals.length ? vals.reduce((a,b)=>a+b, 0) : '';
  const manual = numOf(sv.survey_length_m_manual);
  return {auto, manual, used: manual!=='' ? manual : auto};
}
function surveyAreas(sv){
  const vals = DB.stationsOf(sv.uuid)
    .map(st=>stationAreas(st).used).filter(v=>v!=='' && isFinite(v));
  const auto = vals.length ? vals.reduce((a,b)=>a+b, 0) : '';
  const manual = numOf(sv.survey_area_m2_manual);
  return {auto, manual, used: manual!=='' ? manual : auto};
}
/* 単位努力量あたりの尾数 */
function cpue(st){
  const n = stationTotal(st);
  const sec = effortSeconds(st);
  const area = stationAreas(st).used;
  return {
    per100s: sec>0 ? n/sec*100 : '',
    per100m2: (area!=='' && area>0) ? n/area*100 : '',
  };
}

/* ---- 歩いた道すじを記録する ---- */
let TRACK_SAVED_AT = 0;
/* いま軌跡を記録してよい箇所を返す。1つに決まらなければ null。
   「最初に見つかった調査中の調査」を使うと、去年の調査を終え忘れていたとき、
   いまの位置がそちらへ黙って入って距離・面積・CPUEを壊す（2026-08-17 の監査 Critical） */
function trackTarget(){
  const cand = DB.surveys().filter(sv=>
    sv.status==='調査中' && isLiveNow(sv) && !isDetail(sv));
  if(cand.length!==1) return null;         // 0件でも2件以上でも、当て推量しない
  const all = DB.stationsOf(cand[0].uuid);
  // まず「いま通電している単位」。人がボタンを押して始めたものなので、
  // どこを歩いているかがはっきりしている
  // 点（P）は置いた時点で「終わり」の印が付く。印で外すと、
  // Pで通電しているのに道すじが捨てられる（監査70回目 Major）
  const 通電中 = all.filter(x=>x.effort_started_at && !x.is_spot);
  if(通電中.length===1) return {sv:cand[0], st:通電中[0]};
  if(通電中.length>1) return null;
  // 地点（目印）は、終わりの印を持たないまま並ぶ。数に入れると、
  // 地点を2つ置いただけで行き先が決まらなくなり、道すじが黙って捨てられる
  //（監査67回目 Major）
  const sts = all.filter(x=>!x.ended_at && !x.is_spot);
  if(sts.length!==1) return null;
  return {sv:cand[0], st:sts[0]};
}
function trackTick(fix){
  if(!fix || !ownsLock()) return;
  if(fix.acc > GPS_MAX_ACC) return;        // 粗すぎる位置は使わない
  const t = trackTarget();
  if(!t) return;
  const st = t.st;
  const pt = [fix.lat, fix.lon];
  if(!validPt(pt)) return;
  const track = (st.track||[]).filter(validPt);
  const last = track.length ? track[track.length-1] : null;
  // 立ち止まっていても距離が伸びるのを防ぐ
  if(last && distMeters(last, pt) < TRACK_MIN_MOVE) return;
  track.push(pt);
  st.track = track;
  if(Date.now() - TRACK_SAVED_AT < TRACK_SAVE_MS){
    return;                                 // 書き込みすぎない。次の機会にまとめて保存
  }
  if(DB.upsert(DB.key.st, st)) TRACK_SAVED_AT = Date.now();
}

/* ============================================================
   下書き（画面を離れても書きかけを失わない）
   「開いただけ」で入る自動の値は下書きに数えない。
   数えてしまうと、開いて戻っただけで書きかけが残り続ける
   ============================================================ */
function draftAll(){ try{ return JSON.parse(localStorage.getItem('fs_draft_edit')||'{}')||{}; }
  catch(e){ return {}; } }
/* 書きかけを残せたかを返す。
   黙って握りつぶすと、「打った内容は残してあります」と出しながら
   何も残っていない、ということが起きる（監査33回目 Critical） */
function draftSave(key, obj){
  const a=draftAll();
  if(obj===null) delete a[key]; else a[key]=obj;
  try{ localStorage.setItem('fs_draft_edit', JSON.stringify(a)); return true; }
  catch(e){ return false; }
}
/* 控え（localStorage）にあるものだけを返す。
   画面の中に持っているだけの分（DRAFT_HOLD）はここに混ぜない。
   混ぜると「どこにも控えられていない」ことを手がかりにしている
   写真の救出が働かなくなる（2026-08-20 の決めごと） */
function draftGet(key){ return draftAll()[key] || null; }
/* 入力欄へ戻すときだけ使う。控えが無ければ、画面の中の分を使う */
/* 入力欄へ戻すときだけ使う。
   画面の中に持っている分のほうが新しいので、そちらを先に見る。
   控えを先に見ると、古い控えが残っているときに最新の入力が消える（監査36回目 Critical） */
function draftForForm(key){ return draftHeld(key) || draftGet(key); }
/* その記録の書きかけを、まとめて消す。
   消し忘れると、書きかけが写真を指したままになり、
   その写真が片付かないまま溜まる（2026-08-18 の13回目の監査 Major） */
function draftClearFor(kind, u){
  const keys = [];
  if(kind === 'メモ')  keys.push('note:'+u);
  if(kind === '魚')    keys.push('catch:'+u);
  if(kind === '箇所'){
    keys.push('station:'+u, 'envitem:'+u, 'effort:'+u, 'env:'+u);
    // その箇所の中の記録の分も。新規の魚の鍵（catch:new:<箇所>:<種>）も含める
    try{
      DB.load(DB.key.ca).forEach(c=>{
        if(c && c.station_uuid===u) keys.push('catch:'+c.uuid);
      });
    }catch(e){}
    try{
      Object.keys(draftAll()).forEach(k=>{
        if(k.indexOf('catch:new:'+u+':')===0) keys.push(k);
      });
    }catch(e){}
  }
  keys.forEach(k=>{ try{ draftClear(k); }catch(e){} });
  return keys.length;
}
function draftClear(key){
  // 書きかけを捨てるときは、その中の写真の「付ける先」の印も外す。
  // 残すと、捨てたはずの写真が開き直しで戻ってくる。
  // 画面の中に持っている分（DRAFT_HOLD）も、消す前に見る（監査39回目 Critical）
  try{
    // 保存された書きかけと、画面の中に持っている分の両方を見る。
    // どちらか一方だけだと、片方にしか無い写真の印が残る（監査47回目 Minor）
    const ids = {};
    [draftGet(key), draftHeld(key)].forEach(d=>{
      ((d && d.photos) || []).forEach(pp=>{ if(pp && pp.id) ids[pp.id] = pp; });
    });
    const l = Object.keys(ids).map(k=>ids[k]);
    if(l.length && typeof photoOwnerDone==='function') photoOwnerDone(l);
  }catch(e){}
  delete DRAFT_HOLD[key];
  draftSave(key, null);
}

/* 入力中の書きかけを控える。
   画面ごとに「どこから値を集めるか」を登録し、入力のたびに保存する。
   登録するだけで保存していなかったので、戻ったり読み込み直すと消えていた
   （2026-08-16 の監査 Major） */
let DRAFT_KEY=null, DRAFT_GET=null, DRAFT_BASE=null;
/* 画面を開いた時点の中身を控えておき、そこから変わったときだけ保存する。
   「どの欄なら書きかけとみなすか」を並べる方式だと、
   並べ忘れた欄（調査日・季節・同定の確からしさ など）だけを直したときに
   書きかけが消える（2026-08-16 の3回目の監査 Major） */
/* base を渡すと、それを「元の姿」とする。
   渡さないと、書きかけを戻した後の姿を元と勘違いし、
   同じ値に戻したときに書きかけを消してしまう（4回目の監査 Major） */
function draftBind(key, get, base){
  DRAFT_KEY=key; DRAFT_GET=get;
  try{ DRAFT_BASE = JSON.stringify(base!==undefined ? base : get()); }
  catch(e){ DRAFT_BASE=null; }
}
/* 決まった入力欄をまとめて集める／戻す。
   新しく足した画面（労力・環境・地点）は書きかけを持っていなかったので、
   測点を1点足しただけで、まだ保存していない入力が消えていた
   （2026-08-17 の監査 Major） */
function collectSels(sels){
  const o = {};
  sels.forEach(sel=>{ const el=$(sel); o[sel] = el ? String(el.value) : ''; });
  return o;
}
function applySels(o){
  if(!o) return;
  Object.keys(o).forEach(sel=>{
    if(sel.charAt(0)!=='#') return;
    const el=$(sel); if(el && o[sel]!==undefined && o[sel]!==null) el.value = o[sel];
  });
}
/* 労力（箇所ハブ）の入力欄 */
function effortSels(){
  const sels = ['#e_passes','#e_width','#e_len','#e_area'];
  // 漁具の欄は数が変わるので、画面に出ているものを数えて足す
  for(let i=0; $('#g_cnt_'+i); i++){
    ['g_other_','g_cnt_','g_spec_','g_min_','g_pass_','g_note_'].forEach(k=>sels.push('#'+k+i));
  }
  return sels;
}
function collectEffort(){
  const o = collectSels(effortSels());
  // 選ぶボタンは値を持たないので、別に控える
  for(let i=0; $('#g_cnt_'+i); i++) o['__gear'+i] = segVal('gear'+i);
  return o;
}
/* 労力の書きかけを戻す。漁具の選ぶボタンは applySels が触れないので、ここで当てる */
function applyEffort(o){
  if(!o) return;
  applySels(o);
  Object.keys(o).forEach(k=>{
    const m = /^__gear(\d+)$/.exec(k);
    if(m){ applySegRaw('gear'+m[1], o[k]); gearOtherSync(m[1]); }
  });
}
/* 川の環境の入力欄 */
function envSels(){
  const sels = ['#e_drep','#e_vrep','#p_d','#p_v','#p_note'];
  OPT.substrate.forEach(k=>sels.push('#sp_'+SUBSTRATE_NO[k]));
  ['left','right'].forEach(side=>{
    [0,1,2].forEach(i=>{ sels.push('#cv_'+side+'_'+i+'_t'); sels.push('#cv_'+side+'_'+i); });
    sels.push('#cv_'+side+'_len');
  });
  return sels;
}
function collectEnv(){
  const o = collectSels(envSels());
  o.__sub = segVal('p_sub');
  return o;

function draftUnbind(){ DRAFT_KEY=null; DRAFT_GET=null; DRAFT_BASE=null; }
/* 端末の空き容量が尽きると、localStorage の書きかけにも書けない。
   そのときは画面が開いている間だけ、ここに持つ。
   持たないと、画面を作り直した瞬間に打った内容が消える（監査35回目 Critical） */
let DRAFT_HOLD = {};
function draftHeld(key){ return DRAFT_HOLD[key] || null; }
function draftTouch(){
  if(!DRAFT_KEY || !DRAFT_GET) return;
  // 見ているだけのタブから触ると、記録を入れているタブの書きかけを
  // 上書き・削除してしまう（監査34回目 Critical）
  if(!ownsLock()) return;
  let d; try{ d=DRAFT_GET(); }catch(e){ return; }
  // 開いたときのまま（＝何も触っていない）なら、書きかけを残さない
  if(DRAFT_BASE!==null && JSON.stringify(d)===DRAFT_BASE){
    draftClear(DRAFT_KEY); delete DRAFT_HOLD[DRAFT_KEY]; return;
  }
  if(draftSave(DRAFT_KEY, d)) delete DRAFT_HOLD[DRAFT_KEY];
  else DRAFT_HOLD[DRAFT_KEY] = d;      // 書けなくても、画面の中には持つ
}

let STACK = [{name:'home', arg:null}];
/* 画面を描くたびに増える番号。GPSや写真のような時間のかかる処理は
   始めた時の番号を覚えておき、終わった時に変わっていたら何もしない。
   そうしないと、待っている間に別の記録を開いたとき、そちらに書き込んでしまう */
let SCREEN_SEQ = 0;
function screenGen(){ return SCREEN_SEQ; }
function screenStale(gen){ return gen !== SCREEN_SEQ; }
const SCREENS = {};

/* 画面を移った回数。描き直し（render）では増えない。
   「別の画面へ行って15秒以内に戻ってきた」を見分けるのに使う（監査54回目 Minor） */
let NAV_SEQ = 0;
function nav(name, arg){ NAV_SEQ++; STACK.push({name,arg}); render(); }
function goBack(){ if(STACK.length>1){ NAV_SEQ++; STACK.pop(); render(); } }
/* 履歴を丸ごと捨てる。起動時とホームへ戻すときだけに使う。
   保存のあとにこれを使うと、前の画面へ戻れなくなる（2026-08-16 の監査 Major） */
function reset(name,arg){ NAV_SEQ++; STACK=[{name:name||'home',arg:arg||null}]; render(); }

/* 保存のあとの行き先。履歴を捨てず、親までの道すじを組み直す。
   例) goTo('station', stUuid) → home > survey > station
   こうすると「戻る」で調査ハブ、もう一度でホームへ戻れる */
function goTo(name, arg){
  NAV_SEQ++;
  STACK = buildChain(name, arg);
  render();
}
/* 画面から親をたどって道すじを作る */
function buildChain(name, arg){
  const home = {name:'home', arg:null};
  if(name==='home') return [home];
  if(name==='survey') return [home, {name:'survey', arg:arg}];
  if(name==='station'){
    const st = DB.liveStation(arg);
    // 消された箇所なら、そこへは連れて行かない。ホームへ帰す
    return st ? [home, {name:'survey', arg:st.survey_uuid}, {name:'station', arg:arg}]
              : [home];
  }
  if(name==='spot'){
    const st = DB.liveStation(arg);
    // 地点で戻ると調査ハブを飛ばしてホームへ行っていた（監査49回目 Major）
    return st ? [home, {name:'survey', arg:st.survey_uuid}, {name:'spot', arg:arg}]
              : [home];
  }
  // 地図の画面。地点から開いたときは、ホーム > 調査 > 地点 > 地図 と組む
  if(name==='envMap' || name==='fishMap'){
    const m = mapArg(arg);
    if(m.spot && DB.liveStation(m.spot)){
      return [home, {name:'survey', arg:m.sv}, {name:'spot', arg:m.spot}, {name, arg:arg}];
    }
    return [home, {name:'survey', arg:m.sv}];
  }
  if(name==='mesh' || name==='meshSetup'){
    const st = DB.liveStation(arg);
    return st ? [home, {name:'survey', arg:st.survey_uuid},
                 {name:'station', arg:arg}, {name, arg}]
              : [home];
  }
  if(name==='meshCell'){
    const st = arg && DB.liveStation(arg.station);
    return st ? [home, {name:'survey', arg:st.survey_uuid},
                 {name:'station', arg:arg.station},
                 {name:'mesh', arg:arg.station}, {name, arg}]
              : [home];
  }
  return [home, {name, arg}];
}
/* いまの画面を別の画面に置き換える（積み上げない） */
function navReplace(name, arg){
  NAV_SEQ++;
  if(!STACK.length) STACK=[{name:'home',arg:null}];
  STACK[STACK.length-1] = {name, arg};
  render();
}

let EFFORT_TIMER = null;
let ENV_GPS_TIMER = null;
/* いま出ている画面の見分け。同じ画面を作り直すときは、見ていた位置を保つ */
let SCREEN_AT = '';
function screenKey(cur){
  if(!cur) return '';
  let a = '';
  try{ a = (cur.arg && typeof cur.arg === 'object') ? JSON.stringify(cur.arg)
                                                    : String(cur.arg||''); }catch(e){ a = ''; }
  // 地図の画面は、選んでいる記録が変わったら「別の画面」とみなす。
  // 入れないと、別の単位を選んでも前の位置に戻る（2026-08-20 の監査 Major）
  let 選び = '';
  try{
    if(cur.name === 'fishMap') 選び = '|' + (FISH_SEL || '');
    else if(cur.name === 'survey' || cur.name === 'envMap') 選び = '|' + (ENV_SEL || '') + (FISH_SEL || '');
  }catch(e){}
  return cur.name + '|' + a + 選び;
}
function render(){
  // 物理環境の画面で打ちかけの分があれば、先に書いてしまう
  try{ if(typeof envFlush==='function') envFlush(); }catch(e){}
  // 「新しい調査」の▼地点情報も同じ。画面を作り直す前に、打った分を書く
  try{ if(typeof spotInfoSave==='function') spotInfoSave(); }catch(e){}
  // 同じ画面を作り直すときのために、見ていた位置を控える。
  // 押すたびに先頭へ戻ると、下のほうの入力が打てない（2026-08-20 の実機の声）
  const 前の画面 = SCREEN_AT;
  const 前の位置 = window.scrollY || window.pageYOffset || 0;
  try{
    ENV_FORM = ''; ENV_DIRTY = false; PHOTO_OWNER = ''; PHOTO_OWNER_SV = '';
    PHOTO_OWNER_INFO = {mode:'', kind:'', station:'', species:''};
  }catch(e){}
  SCREEN_SEQ++;
  draftUnbind();
  closePhotoView();           // 大きく見ていた写真は、画面が変わったら閉じる
  revokePhotoUrls();          // 前の画面で開いた写真を、いつまでも抱えない
  if(EFFORT_TIMER){ clearInterval(EFFORT_TIMER); EFFORT_TIMER=null; }
  if(ENV_GPS_TIMER){ clearInterval(ENV_GPS_TIMER); ENV_GPS_TIMER=null; }
  destroyMaps();      // 先に、見ていた場所を地点ごとの控えへ書く
  MAP_SPOT = '';      // そのあとで、地図を開いている地点を立て直す
  const cur = STACK[STACK.length-1];
  const scr = SCREENS[cur.name] || SCREENS.home;
  let v;
  try{ v = scr(cur.arg); }
  catch(e){ console.error(e); toast('画面を開けませんでした'); v = SCREENS.home(); }
  if(!v){
    // 消された記録などで画面が作れないときは、ホームへ帰す
    STACK=[{name:'home',arg:null}]; v = SCREENS.home();
  }
  $('#title').textContent = v.title || '魚類調査記録';
  $('#backBtn').style.display = STACK.length>1 ? '' : 'none';
  const pills = (v.sub||[]).slice();
  if(window.READ_ONLY) pills.unshift({text:'閲覧のみ', cls:'ng'});
  else if(!window.WRITE_OK) pills.unshift({text:'確認中', cls:'warn'});
  $('#sub').innerHTML = pills.map(s=>
    `<span class="pill ${s.cls||''}">${esc(s.text)}</span>`).join('');
  $('#main').innerHTML = (window.READ_ONLY
      ? `<div class="ngbox">${esc(LOCK_WHY)}</div>` : '') + (v.html || '');
  const いまの画面 = screenKey(STACK[STACK.length-1]);
  if(いまの画面 !== 前の画面) PICK_SET = null;   // 画面を移ったら、選ぶのはやめる
  SCREEN_AT = いまの画面;
  // 同じ画面なら、見ていた位置に戻す。別の画面なら先頭から
  window.scrollTo(0, (いまの画面 && いまの画面 === 前の画面) ? 前の位置 : 0);
  if(v.onMount) try{ v.onMount(); }catch(e){ console.error(e); }
}

/* ============================================================
   位置（GPS）
   ============================================================ */
const GPS_MAX_ACC = 50;     // これより粗い位置は軌跡に使わない（m）
let lastFix = null;         // {lat, lon, acc, t}
let gpsWatchId = null;

function startGps(){
  if(gpsWatchId!=null || !navigator.geolocation) return;
  gpsWatchId = navigator.geolocation.watchPosition(p=>{
    lastFix = {lat:p.coords.latitude, lon:p.coords.longitude,
               acc:p.coords.accuracy, t:Date.now()};
    try{ trackTick(lastFix); }catch(e){}
  }, ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:20000});
}
function stopGps(){ if(gpsWatchId!=null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null; } }
/* 古い測位を使わない。前の地点の座標が付くのを防ぐ */
function freshFix(maxAgeMs){
  if(!lastFix) return null;
  return (Date.now()-lastFix.t) <= (maxAgeMs||30000) ? lastFix : null;
}
function validPt(p){ return Array.isArray(p) && p.length===2 && isFinite(p[0]) && isFinite(p[1])
  && Math.abs(p[0])<=90 && Math.abs(p[1])<=180; }
function distMeters(a,b){
  const R=6378137, rad=Math.PI/180;
  const y=(b[0]-a[0])*rad;
  const x=(b[1]-a[1])*rad*Math.cos((a[0]+b[0])/2*rad);
  return Math.sqrt(x*x+y*y)*R;
}
function pathLength(path){
  const p=(path||[]).filter(validPt); let d=0;
  for(let i=1;i<p.length;i++) d+=distMeters(p[i-1],p[i]);
  return d;
}
/* 位置を1回だけ取る。決め方（GPS/地図/手入力）は呼び出し側が書く。
   ここで position_source を書き換えない（上書きすると、地図で置いた位置がGPS扱いになる） */
/* opt.keep を立てると、待っている間に画面を描き直しても返す。
   描き直しの回数で切ると、待つ間に地図をタップしたり記録を選び直しただけで
   取ったばかりの現在地を捨ててしまう（監査53回目 Major）。
   置いてよいかは、呼ぶ側が fixGuard() で確かめる */
function getFixOnce(cb, opt){
  if(!navigator.geolocation){ cb(null); return; }
  const 描き直しでも = !!(opt && opt.keep);
  const g = screenGen();
  const 古い = ()=>!描き直しでも && screenStale(g);
  navigator.geolocation.getCurrentPosition(p=>{
    if(古い()) return;
    cb({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy});
  }, ()=>{ if(!古い()) cb(null); },
     {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
}

let OPOLYLAYER=null;   // 囲った範囲の線（destroyMaps が片付ける）
/* ============================================================
   地図
   画像ファイルを使わない作りにする（文字ボタン＋divIcon）。
   leaflet.css は images/*.png を参照するので、同梱しないと「？」に化ける
   ============================================================ */
const BASEMAPS = {
  '航空写真': {url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
               max:18, attr:'国土地理院'},

               max:18, attr:'国土地理院'},
};
function baseMapName(){ const v=prefs().basemap; return BASEMAPS[v] ? v : '航空写真'; }
/* 地図はここ1か所で持つ。let で宣言した変数を window['名前'] で触ると
   別のものになり、画面を離れても地図が残る（同じ場所に2つ目を作れず壊れる） */
const MAPS = { main:{map:null, layer:null}, off:{map:null, layer:null} };
function destroyMaps(){
  compassStop();          // 向きの追いかけを、地図と一緒に止める
  // 片付ける前に、見ている場所を覚えておく。
  // 地図の合図（moveend）で覚えると、片付けの最中に走って落ちることがある

  }

  FISHLAYER = [];

    if(s.map){ try{ s.map.remove(); }catch(e){} }
    s.map=null; s.layer=null;
  });
  OPOLYLAYER=null; SITEMARK=null; SVMARK=null; SVSITES=[];
}
/* 地図を寄せられる上限。タイルは18までなので、その先は引き伸ばして見せる。
   小さい川では写真がぼやけても、マスの線や囲いはくっきり大きくなるので、
   操作のしやすさを優先して深めに取る（2026-08-24 の実機の声） */
const MAP_MAX_ZOOM = 24;
/* この端末で地図を回せるか。部品が読めていれば回せる */
function canRotate(){
  return !!(window.L && L.Map && L.Map.prototype
    && typeof L.Map.prototype.setBearing === 'function');
}
function makeMap(elId, center, zoom, bearing){
  const el = document.getElementById(elId);
  if(!el || !window.L) return null;
  const opt = {zoomControl:true, attributionControl:true, maxZoom:MAP_MAX_ZOOM};
  if(canRotate()){
    // 指2本でひねると回る。自前の向きボタンを出すので、部品のボタンは出さない
    opt.rotate = true; opt.rotateControl = false;
    opt.touchRotate = true; opt.shiftKeyRotate = true;
    opt.bearing = numOf(bearing)==='' ? 0 : numOf(bearing);
  }
  const m = L.map(el, opt).setView(center||[43.06,141.35], zoom||14);
  if(canRotate()) addCompassControls(m);
  return m;
}
/* 地図の向き（北から時計回りの度）。回せない端末では 0 */
function mapBearing(map){
  try{ return (map && typeof map.getBearing==='function') ? map.getBearing() : 0; }
  catch(e){ return 0; }
}
/* 方位。北の針（押すと北が上に戻る）と、自分の向きに合わせる印 */
let COMPASS_ON = false, COMPASS_HANDLER = null, COMPASS_EV = 'deviceorientation';
let COMPASS_GEN = 0;
function addCompassControls(map){
  const C = L.Control.extend({
    options:{position:'topright'},
    onAdd(){
      const d = L.DomUtil.create('div','leaflet-bar mapicons');
      // 北の針。地図が回れば、北もその分だけ回った先にある
      const n = L.DomUtil.create('a','',d);
      n.href='#'; n.title='北を上に戻す'; n.setAttribute('aria-label','北を上に戻す');
      n.innerHTML = iconSvg('north');
      const upd = ()=>{
        const g = n.querySelector('svg');
        if(g) g.style.transform = 'rotate(' + mapBearing(map) + 'deg)';
      };
      map.on('rotate', upd); upd();
      L.DomEvent.on(n,'click',ev=>{
        L.DomEvent.stop(ev);
        compassStop();
        try{ map.setBearing(0); }catch(e){}
        upd();
        toast('北を上に戻しました');
      });
      // 自分の向きを上にする
      const c = L.DomUtil.create('a','',d);
      c.href='#'; c.title='自分の向きを上にする';
      c.setAttribute('aria-label','自分の向きを上にする');
      c.dataset.k = 'compass';
      c.innerHTML = iconSvg('compass');
      if(COMPASS_ON) c.classList.add('on');
      L.DomEvent.on(c,'click',ev=>{ L.DomEvent.stop(ev); compassToggle(map); });
      L.DomEvent.disableClickPropagation(d);
      return d;
    }
  });
  const ctl = new C();
  ctl.addTo(map);
  return ctl;
}
function compassMark(on){
  document.querySelectorAll('.mapicons a[data-k="compass"]').forEach(a=>{
    a.classList.toggle('on', !!on);
  });
}
function compassStop(){
  if(COMPASS_HANDLER){
    try{ window.removeEventListener(COMPASS_EV, COMPASS_HANDLER); }catch(e){}
    COMPASS_HANDLER = null;
  }
  COMPASS_ON = false;
  COMPASS_GEN++;            // 待っている許可が、あとから効かないように
  compassMark(false);
}
/* 端末の向き（北から時計回りの度）を出す。
   水平に持ったときは「上端の向き」、立てて持ったときは「画面の裏＝見ている向き」を使う。
   どちらか一方だけだと、持ち方によって出せない・大きくずれる */
function headingOf(e){
  if(typeof e.webkitCompassHeading === 'number' && isFinite(e.webkitCompassHeading)){
    return e.webkitCompassHeading;
  }
  if(!(e.absolute === true || COMPASS_EV === 'deviceorientationabsolute')) return null;
  const a = e.alpha, b = e.beta, g = e.gamma;
  if(!isFinite(a)) return null;
  if(!isFinite(b) || !isFinite(g)) return (360 - a) % 360;
  const d = Math.PI/180;
  const cA=Math.cos(a*d), sA=Math.sin(a*d), cB=Math.cos(b*d), sB=Math.sin(b*d),
        cG=Math.cos(g*d), sG=Math.sin(g*d);
  const Ey = -sA*cB, Ny = cA*cB;                    // 端末の上端が向く方向
  if(Math.hypot(Ey, Ny) > 0.15) return (Math.atan2(Ey, Ny)/d + 360) % 360;
  const Ez = sG*cA + sB*cG*sA, Nz = sG*sA - sB*cG*cA;   // ほぼ立てて持っているとき
  return (Math.atan2(-Ez, -Nz)/d + 360) % 360;
}
function compassStart(map){
  const gen = ++COMPASS_GEN;
  COMPASS_EV = ('ondeviceorientationabsolute' in window)
    ? 'deviceorientationabsolute' : 'deviceorientation';
  let 届いた = false, 前 = null;
  COMPASS_HANDLER = (e)=>{
    if(gen !== COMPASS_GEN) return;
    const h = headingOf(e);
    if(h === null) return;
    if(!届いた){
      届いた = true;
      compassMark(true);
      toast('自分の向きが画面の上になります（もう一度押すと戻ります）', 6000);
    }
    // 2度未満の揺れは無視する（じっとしていても地図が震える）
    if(前 !== null && Math.abs(((h - 前 + 540) % 360) - 180) < 2) return;
    前 = h;
    try{ map.setBearing(-h); }catch(err){}
  };
  window.addEventListener(COMPASS_EV, COMPASS_HANDLER);
  COMPASS_ON = true;
  compassMark(true);
  toast('方位を確かめています…');
  // 何も届かない端末（方位計が無い等）では、そのまま待たせない
  setTimeout(()=>{
    if(gen === COMPASS_GEN && COMPASS_ON && !届いた){
      compassStop();
      toast('この端末では方位を取れませんでした。指2本でひねると手で回せます', 9000);
    }
  }, 4000);
}
function compassToggle(map){
  if(COMPASS_ON || COMPASS_HANDLER){
    compassStop();
    toast('向きに合わせるのをやめました（地図の向きはそのまま）', 5000);
    return;
  }
  if(!canRotate()){ toast('この端末では地図を回せません'); return; }
  // iPhone は、押した流れの中でしか許可を聞けない
  const D = window.DeviceOrientationEvent;
  if(D && typeof D.requestPermission === 'function'){
    D.requestPermission().then(r=>{
      if(r === 'granted') compassStart(map);
      else toast('方位を使う許可が下りませんでした', 7000);
    }).catch(()=>toast('方位を使えませんでした', 7000));
    return;
  }
  compassStart(map);
}
function applyBaseMap(slot, name){
  const s = MAPS[slot];
  if(!s || !s.map) return;
  const b = BASEMAPS[name] || BASEMAPS['航空写真'];
  if(s.layer){ try{ s.map.removeLayer(s.layer); }catch(e){} }
  // crossOrigin を付けると、中身の分かる応答で返るので保存の可否が判断できる
  // 地理院タイルは18までしか無い。そこから先は引き伸ばして寄れるようにする
  // （川の中では、18では足りないことがある）
  s.layer = L.tileLayer(b.url, {maxZoom:MAP_MAX_ZOOM, maxNativeZoom:b.max,
                                attribution:b.attr, crossOrigin:true})
    .addTo(s.map);
  // タイルが無かったら、上の段のタイルを切り出して埋める。
  // 航空写真は場所によって17段階や16段階までしか無く、
  // そこへ拡大すると真っ暗になっていた（2026-08-23 の実機の声）
  s.layer.on('tileerror', ev=>{
    try{ tileErrorFill(ev.tile, ev.coords, b.url, 1); }catch(e){}
  });
}
/* 上の段のどのタイルの、どの部分を切り出すか */
function tileParentInfo(z, x, y, up){
  const 大きさ = 256 >> up;                 // 切り出す幅（ピクセル）
  return { z: z - up, x: x >> up, y: y >> up,
    sx: (x - ((x >> up) << up)) * 大きさ,
    sy: (y - ((y >> up) << up)) * 大きさ,
    size: 大きさ };
}
/* 失敗したタイルの場所に、上の段のタイルを切り出して入れる。
   上の段も無ければ、さらに上を試す（4段まで） */
function tileErrorFill(img, coords, url, up){
  if(!img || !coords || up > 4) return;
  const c = { z: coords.z, x: coords.x, y: coords.y };
  const 上 = tileParentInfo(c.z, c.x, c.y, up);
  if(上.z < 5) return;
  const src = url.replace('{z}', 上.z).replace('{x}', 上.x).replace('{y}', 上.y);
  const 親 = new Image();
  親.crossOrigin = 'anonymous';
  親.onload = ()=>{
    try{
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 256;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(親, 上.sx, 上.sy, 上.size, 上.size, 0, 0, 256, 256);
      img.src = cv.toDataURL('image/png');
    }catch(e){}
  };
  親.onerror = ()=>tileErrorFill(img, coords, url, up + 1);
  親.src = src;
}

/* 河川名にあわせて地図を動かす。
   1) 埋め込んだ表にあれば、その川の調査範囲へ
   2) 無ければ、電波があるときだけ地名検索
   何も見つからなければ動かさない（現場で勝手に飛ばない） */
/* 川の名前を打ち替えるたびに呼ばれる。
   電波で探しているあいだに次の名前を打つと、前の名前の答えが遅れて届く。
   そのまま使うと、いまの表示を上書きして前の川へ飛んでしまう
   （2026-08-19 に、テストの揺れとして表に出た） */
let FIT_RIVER_SEQ = 0;
function fitRiver(map, name, msgSel){
  const my = ++FIT_RIVER_SEQ;
  const gen = screenGen();
  const 古い = () => my !== FIT_RIVER_SEQ || screenStale(gen) || map !== MAPS.main.map;
  const say = t => { const el = msgSel && $(msgSel); if(el) el.textContent = t; };
  const b = riverBounds(name);
  if(b){
    try{ map.fitBounds(L.latLngBounds([[b[0],b[1]],[b[2],b[3]]]).pad(0.05)); }catch(e){}
    const past = pastSitesOf(name);
    say(`${esc(name)}：過去の調査の範囲に合わせました`
      + (past.length ? `（地点 ${past.length}件）` : ''));
    return Promise.resolve(true);
  }
  say(`${esc(name)}：記録に無い川です。電波があれば探します…`);
  return searchPlace(name).then(hit=>{
    if(古い()) return false;      // もっと新しい名前で探し直している
    if(!hit){ say(`${esc(name)}：場所が分かりませんでした。地図を動かして決めてください`); return false; }
    try{ map.setView([hit.lat, hit.lon], 13); }catch(e){}
    say(`${esc(hit.title)} のあたりに合わせました（地名検索）`);
    return true;
  });
}
/* 過去の調査地点を地図に出す（薄い青の丸） */
/* 過去の調査地点。河川名を変えるたびに呼ぶので、
   前に描いたものを必ず片付ける。片付けないと、前の川の点が重なって残る
   （2026-08-17 の監査 Minor） */
let PAST_LAYER = [];
function drawPastSites(map, name){
  try{ PAST_LAYER.forEach(x=>map.removeLayer(x)); }catch(e){}
  PAST_LAYER = [];
  const out = [];
  pastSitesOf(name).forEach(s=>{
    const m = L.circleMarker([s.y, s.x], {radius:4, color:'#4aa3ff', weight:1,
      fillOpacity:.5}).addTo(map);
    m.bindPopup(`過去の調査地点<br><b>${esc(s.s)}</b>`);
    out.push(m);
  });
  PAST_LAYER = out;
  return out;
}

let MEMARK = [];
const ME_MAX_ACC = 500;      // これより粗い位置は、輪を描いても意味がない
function meIcon(){
  return L.divIcon({className:'', iconSize:[20,20], iconAnchor:[10,10],
    html:`<div style="width:14px;height:14px;border-radius:50%;background:#2f81f7;

      ></div>`});

/* いまいる場所を描き直す。位置が取れていなければ、何も描かない */
/* いまいる場所を描き直す。
   取ったばかりの位置があれば、それを使う（取り直すと、飛んだ先と印がずれる）。
   どの地図に描くかも渡せるようにする（圏外用の地図にも出せるように）
   （2026-08-18 の監査 Major） */
function drawMe(slot, fix){
  const key = slot || 'main';
  const sl = MAPS[key];
  if(!sl || !sl.map) return false;
  const map = sl.map;
  try{ MEMARK.forEach(x=>map.removeLayer(x)); }catch(e){}
  MEMARK = [];
  const f = fix || freshFix(20000);
  if(!f) return false;
  const pt = [f.lat, f.lon];
  if(!validPt(pt)) return false;
  // どれくらい確かか。粗すぎるときは輪を出さない（画面が青一色になる）
  if(f.acc > 0 && f.acc <= ME_MAX_ACC){
    MEMARK.push(L.circle(pt, {radius:f.acc, color:'#2f81f7', weight:1,
      fillColor:'#2f81f7', fillOpacity:.08, interactive:false}).addTo(map));
  }
  MEMARK.push(L.marker(pt, {icon:meIcon(), interactive:false,
    zIndexOffset:2000}).addTo(map));
  return true;
}

/* ============================================================
   オフライン地図（範囲を囲って先に落としておく）
   ============================================================ */
function lon2tx(lon,z){ return Math.floor((lon+180)/360*Math.pow(2,z)); }
function lat2ty(lat,z){ const r=lat*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z)); }
function polyBounds(poly){
  const lats=poly.map(p=>p[0]), lons=poly.map(p=>p[1]);
  return {s:Math.min.apply(null,lats), n:Math.max.apply(null,lats),
          w:Math.min.apply(null,lons), e:Math.max.apply(null,lons)};
}
function pointInPoly(lat, lon, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const yi=poly[i][0], xi=poly[i][1], yj=poly[j][0], xj=poly[j][1];
    if(((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function tx2lon(x,z){ return x/Math.pow(2,z)*360-180; }
function ty2lat(y,z){ const n=Math.PI-2*Math.PI*y/Math.pow(2,z);
  return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))); }
/* 2本の線分が交わるか */
function segCross(a1,a2,b1,b2){
  const d=(p,q,r)=>(q[1]-p[1])*(r[0]-q[0])-(q[0]-p[0])*(r[1]-q[1]);
  const s1=d(a1,a2,b1), s2=d(a1,a2,b2), s3=d(b1,b2,a1), s4=d(b1,b2,a2);
  return ((s1>0)!==(s2>0)) && ((s3>0)!==(s4>0));
}
/* タイルが範囲にかかるか。
   四隅と中心を見るだけだと、
   ・囲った範囲がタイル1枚の中にすっぽり収まるとき
   ・細長い範囲がタイルを横切るだけのとき
   を取りこぼし、粗い倍率で地図が欠ける（2026-08-16 の監査 Major）。
   タイルの角が範囲に入るか／範囲の角がタイルに入るか／辺どうしが交わるか、の3つで見る */
function tileHitsPoly(x,y,z,poly){
  const w=tx2lon(x,z), e=tx2lon(x+1,z), n=ty2lat(y,z), s=ty2lat(y+1,z);
  // 1) タイルの角か中心が、囲った範囲の中にある
  const pts=[[n,w],[n,e],[s,w],[s,e],[(n+s)/2,(w+e)/2]];
  if(pts.some(p=>pointInPoly(p[0],p[1],poly))) return true;
  // 2) 囲った範囲の角が、タイルの中にある（範囲がタイルに収まる場合）
  const inTile=p=>p[0]>=s && p[0]<=n && p[1]>=w && p[1]<=e;
  if(poly.some(inTile)) return true;
  // 3) 辺どうしが交わる（横切るだけの場合）
  const corners=[[n,w],[n,e],[s,e],[s,w]];
  for(let i=0;i<poly.length;i++){
    const a1=poly[i], a2=poly[(i+1)%poly.length];
    for(let j=0;j<4;j++){
      if(segCross(a1,a2,corners[j],corners[(j+1)%4])) return true;
    }
  }
  return false;
}
function packTiles(poly, zmax){
  const out=[];
  for(let z=10; z<=zmax; z++){
    const b=polyBounds(poly);
    const x0=lon2tx(b.w,z), x1=lon2tx(b.e,z);
    const y0=lat2ty(b.n,z), y1=lat2ty(b.s,z);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
      if(tileHitsPoly(x,y,z,poly)) out.push([x,y,z]);
    }
  }
  return out;
}
function packTileUrls(poly, zmax, layers){

    tiles.forEach(([x,y,z])=>{

      urls.push(b.url.replace('{z}',z).replace('{x}',x).replace('{y}',y));

function migratePackIds(){
