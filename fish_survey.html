/* サービスワーカーに頼む（返事を待つ） */
function swAsk(msg, timeoutMs){
  return new Promise((res,rej)=>{
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
    if(!sw){ rej(new Error('オフライン用の仕組みが動いていません')); return; }
    const ch = new MessageChannel();
    const t = setTimeout(()=>{
      // 返事が無いだけで、向こうはまだ動いているかもしれない。
      // 「失敗した」とは違うので、呼び出し側が区別できるよう印を付ける
      const err = new Error('返事がありません');
      err.timeout = true;
      rej(err);
    }, timeoutMs||120000);
    ch.port1.onmessage = e=>{ clearTimeout(t); res(e.data); };
    sw.postMessage(msg, [ch.port2]);
  });
}

   ============================================================ */
const MEDIA_DB_NAME='fish_survey_media', MEDIA_DB_VER=1, MEDIA_STORE='photo';
let _mediaDB=null;
function openMediaDB(){
  if(_mediaDB) return Promise.resolve(_mediaDB);
  return new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('この端末では写真を保存できません')); return; }
    let q; try{ q=indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VER); }catch(e){ rej(e); return; }
    q.onupgradeneeded=()=>{ const db=q.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE,{keyPath:'id'}); };
    q.onsuccess=()=>{ _mediaDB=q.result; res(_mediaDB); };
    q.onerror=()=>rej(q.error);
  });
}
// 書き込みは tx.oncomplete まで待つ。ここで待たないと「保存したのに無い」が起きる
function idbRun(db, mode, fn){
  // トランザクションを作るところは Promise の外に出す。
  // 中に入れると、つながりが切れていても「作り損ね」が外へ伝わらず、
  // 開き直しが動かないまま写真の読み書きが止まる（2026-08-18 の9回目の監査 Critical）
  const tx=db.transaction(MEDIA_STORE, mode);
  return new Promise((res,rej)=>{
    let out;
    const r=fn(tx.objectStore(MEDIA_STORE));
    if(r && r.onsuccess!==undefined) r.onsuccess=()=>{ out=r.result; };
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error);
  });
}
function idbDo(mode, fn){
  // すでに開いているなら、待たずにその場で始める。
  // 一度でも待つと、確かめてから実際に消すまでの間に、ほかの用事が割り込む
  // （2026-08-18 の8回目の監査 Critical）
  if(_mediaDB){
    try{ return idbRun(_mediaDB, mode, fn); }
    catch(e){
      // つながりが切れていた。畳んでから開き直し、もう一度だけ試す
      try{ _mediaDB.close(); }catch(e2){}
      _mediaDB = null;
    }
  }
  return openMediaDB().then(db=>idbRun(db, mode, fn));
}
const PhotoDB = {
  put(rec){ return idbDo('readwrite', st=>st.put(rec)); },
  get(id){ return idbDo('readonly', st=>st.get(id)); },
  del(id){ return idbDo('readwrite', st=>st.delete(id)); },
  allIds(){ return idbDo('readonly', st=>st.getAllKeys()); },
  all(){ return idbDo('readonly', st=>st.getAll()); },
  /* どこからも使われていない写真を片付ける。
     「まだ保存していない写真」（いま開いている画面の分と、書きかけの分）も
     使っている数に入れる。入れないと、保存を押す前に消える。

     片付けは時間がかかるので、その間に新しい写真が入ってくる。
     一覧を取った時点の判断で消すと、間に入った写真を巻き添えにする
     （2026-08-17 の監査 Critical）。そこで
       ・取り込み中の写真（PHOTO_PENDING）は触らない
       ・入れたばかりの写真（PHOTO_GRACE_MS 以内）は触らない
       ・1枚消すごとに、使用権と参照を取り直す
     の3つで守る */
  async gc(){
    if(!ownsLock()) return 0;        // 見ているだけのタブでは消さない
    let refs = photoRefs();
    if(!refs) return 0;              // 1つでも読めなければ何もしない（消しすぎ防止）
    let recs; try{ recs = await this.all(); }catch(e){ return 0; }
    // まだ記録に付いていないが、付ける先が生きている写真は残す。
    // 空き容量が尽きた場面では、ここだけが手がかりになる
    let owners; try{ owners = livePhotoOwners(); }catch(e){ return 0; }
    if(!owners) return 0;
    // 記録に付いている写真のID（書きかけや画面の分は入れない）。
    // 付いているのに印が残っていたら、ここで外す
    let saved; try{ saved = savedPhotoIds(); }catch(e){ return 0; }
    const cut = Date.now() - PHOTO_GRACE_MS;
    let n=0;
    for(const r of recs){
      if(!r || !r.id) continue;
      if(refs.has(r.id) || PHOTO_PENDING.has(r.id)){
        // 記録に付いたのに印が残っている＝外し損ね。ここで後始末する。
        // 残したままだと、あとで写真を外しても実体が消えない
        // （2026-08-18 の5回目の監査 Major）
        if(r.owner && saved.has(r.id)) photoOwnerDone([{id:r.id}]);
        continue;
      }
      if(photoOwnerLiveIn(owners, r)) continue;      // 付ける先が待っている
      const at = Date.parse(r.added_at||'');
      if(isFinite(at) && at > cut) continue;   // 入れたばかりのものは残す
      // 対象を取り直してから、最後の確認をひととおり行う。
      // 確かめたあとに待つと、その待っている間の変化を見落とす
      // （2026-08-18 の6回目の監査 Critical）
      let cur=null; try{ cur = await this.get(r.id); }catch(e){ continue; }
      if(!cur) continue;                              // すでに無い
      if(!ownsLock()) return n;                // 途中で使用権を渡していたら止める
      const now = photoRefs();                 // 消す直前に、もう一度確かめる
      if(!now) return n;
      if(now.has(r.id) || PHOTO_PENDING.has(r.id)) continue;
      let own2; try{ own2 = livePhotoOwners(); }catch(e){ return n; }
      if(!own2) return n;
      if(photoOwnerLiveIn(own2, cur)) continue;      // 付ける先が待っている
      const at2 = Date.parse(cur.added_at||'');
      if(isFinite(at2) && at2 > cut) continue;        // 入れ直されたばかり
      // 確かめている間に使用権が移ることがある。消す直前に、もう一度だけ見る
      // （2026-08-18 の7回目の監査 Critical）
      if(!ownsLock()) return n;
      try{ await this.del(r.id); n++; }catch(e){}
    }
    return n;
  },
};

function photoOwnerMode(r, sets){
  if(r && r.owner_mode) return r.owner_mode;

function photoOwnerLiveIn(sets, r){
  if(!sets || !r || !r.owner) return false;
  if(sets.rec.has(r.owner)) return true;
  if(photoOwnerMode(r, sets) !== 'draft') return false;
  return !!(r.owner_sv && sets.sv.has(r.owner_sv));

function photoOwnerResetAll(){
  if(!ownsLock()) return Promise.resolve(false);
  return Promise.resolve().then(()=>PhotoDB.all()).then(recs=>{
    const 印つき = (recs||[]).filter(r=>r && r.id && r.owner).map(r=>({id:r.id}));
    return photoOwnerDone(印つき);
  }).catch(()=>false);

function photoOwnerDone(list){
  // 見ているだけのタブでは、印を外さない。
  // 外すと、記録を入れているタブがまだ保存していない写真の守りを解いてしまう
  // （2026-08-18 の11回目の監査 Critical）
  if(!ownsLock()) return Promise.resolve(false);
  return Promise.all((list||[]).map(pp=>{
    if(!pp || !pp.id) return Promise.resolve(true);
    // 写真を入れる口（PhotoDB.put）は通さない。
    // 通すと「何枚入れたか」を数えている所で、印外しまで数えてしまう
    return Promise.resolve().then(()=>PhotoDB.get(pp.id)).then(r=>{
      if(!r || !r.owner) return true;
      delete r.owner;
      return idbDo('readwrite', st=>st.put(r)).then(()=>true);
    }).catch(()=>false);
  })).then(a=>a.every(Boolean));

   ここで守られているので失われない（2026-08-18 の9回目の監査への回答） */
function photoRefs(){
  try{
    const refs = new Set();
    // 写真を持ちうる入れ物を数え漏らすと、その写真が消える。
    // 個別に並べず、保存している入れ物を全部見る

    });

    (SCREENS._photos||[]).forEach(pp=>pp && pp.id && refs.add(pp.id));
    return refs;
  }catch(e){ return null; }
}
function photoIdsOf(rec){
  return ((rec && rec.photos) || []).map(pp=>pp && pp.id).filter(Boolean);

// 現場写真はそのままだと1枚数MBあり端末を圧迫するので、長辺1600pxのJPEGに縮める
const PHOTO_MAX_PX = 1600;
async function shrinkImage(file){
  if(!/^image\//.test(file.type||'')) return file;
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, PHOTO_MAX_PX/Math.max(bmp.width, bmp.height));
    if(scale>=1 && file.size < 1.5*1024*1024){ if(bmp.close) bmp.close(); return file; }
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return (blob && blob.size < file.size) ? blob : file;
  }catch(e){ return file; }   // 変換できない端末では元のまま保存する
}
/* 実際の中身に合った拡張子を付ける。中身がPNGなのに .jpg だと開けないソフトがある。
   縮小できなかった形式（GIF・BMPなど）を一律に .jpg と名づけると、
   書き出したZIPの中身と名前が食い違う（2026-08-17 の監査 Major） */
const PHOTO_EXT = [['jpeg','jpg'], ['jpg','jpg'], ['png','png'], ['webp','webp'],
  ['heic','heic'], ['heif','heic'], ['avif','avif'], ['gif','gif'],
  ['bmp','bmp'], ['tiff','tif'], ['svg','svg']];
function blobExt(blob){
  const t=((blob&&blob.type)||'').toLowerCase();
  for(const [key, ext] of PHOTO_EXT){ if(t.indexOf(key)>=0) return ext; }
  return '';
}
/* 受け取ってよいファイルか。分からない形式は入れない
   （名前と中身が食い違うくらいなら、その場で断るほうがよい） */
function fileExt(f){
  if(!f || !/^image\//.test(f.type||'')) return '';
  return blobExt(f);
}

async function pickPhotos(input){

    toast('このタブでは写真を追加できません。記録を入れているタブでお試しください', 6000);
    return;

  const startForm = (typeof ENV_FORM!=='undefined') ? ENV_FORM : '';

    const ext = fileExt(f);

    try{
      const blob = await shrinkImage(f);
      const useExt = blobExt(blob) || ext;

      // 待つたびに確かめないと、書いてはいけないタブが書きかけを上書きする

      // そのとき手がかりが何も残らないと、画面を移った時点で写真が失われる
      // （2026-08-18 の4回目の監査 Critical）
      await PhotoDB.put({ id, blob, ext:useExt, size:blob.size, added_at:nowISO(),
        owner: PHOTO_OWNER||'', owner_sv: PHOTO_OWNER_SV||'',
        owner_mode: PHOTO_OWNER_INFO.mode||'', owner_kind: PHOTO_OWNER_INFO.kind||'',
        owner_st: PHOTO_OWNER_INFO.station||'', owner_sp: PHOTO_OWNER_INFO.species||'',
        owner_st_name: photoOwnerNameNow()||'',
        owner_sp_name: PHOTO_OWNER_INFO.sp_name||'' });
      if(screenStale(gen) || !ownsLock()){
        // 入れたが行き場がない。ここで片付ける（後の掃除任せにしない）
        if(!ownsLock()) lost=true;
        try{ await PhotoDB.del(id); }catch(e){}
        continue;
      }
      SCREENS._photos = (SCREENS._photos||[]).concat([{ id, ext:useExt, size:blob.size }]);
      // 1枚ごとに控える。全部終えてからだと、2枚目の変換中に画面が変わったとき
      // 1枚目まで消える（2026-08-17 の監査 Critical）
      draftTouch();

      // 待つ形だと、撮った直後に画面を閉じたとき記録に付かない。
      // 入ったかどうかは、全部終えてから記録を読んで確かめる
      // （途中の1枚が失敗しても、次の1枚の保存で一緒に入ることがあるため）
      addedIds.push(id);

      ok++;
    }catch(e){
      ng++;

      try{ await PhotoDB.del(id); }catch(e2){}

  }
  if(screenStale(gen)) return;
  // 記録を読み直して、入っていない写真があれば、もう一度だけ試す。
  // 読み直しは、使用権を失っていても必ずする。

  // （2026-08-18 の3回目の監査 Major）
  if(startForm && ENV_FORM === startForm && addedIds.length){
    const 入っているか = ()=>{

      const set = new Set(photoIdsOf(st));
      return addedIds.filter(x=>!set.has(x));
    };

    if(残り.length && ownsLock()){

      残り = 入っているか();

    // 言ってしまうと、閉じたあとで写真が消えていても気づけない。
    // 「選び直して」とは言わない。選び直すと同じ写真が二重に入る
    // （2026-08-18 の3回目の監査 Major）
    toast(`写真 ${notSaved}枚を記録に保存できませんでした。`
      + (lost
        ? '別のタブで記録が開かれたためです。そちらのタブでお試しください'
        : '写真は画面に残っています。選び直さずに、'
          + '「写真をもう一度保存」を押してください'
          + '（端末の空き容量もご確認ください）')

      + '別のタブで記録が開かれたため追加できませんでした。'
      + 'そちらのタブでお試しください', 9000);
  }else if(badType.length){
    toast(`次のファイルは扱えない形式でした：${badType.slice(0,3).join('・')}`
      + (badType.length>3?`ほか${badType.length-3}件`:''), 9000);
  }else if(ng){
    toast(`写真 ${ok}枚を追加しました。${ng}枚は保存できませんでした`
      + '（端末の空き容量をご確認ください）', 8000);
  }else{
    toast(ok+'枚を追加しました');
  }
}

/* 写真の見え方の後片付け。

function revokePhotoUrls(now){
  const list = SCREENS._photoUrls||[];
  SCREENS._photoUrls=[];

  const go = ()=>list.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });

}

async function renderPhotoPanel(){

  const list = SCREENS._photos||[];
  const cnt = $('#photoCount');
  if(cnt) cnt.textContent = list.length ? `　${list.length}枚` : '';
  if(!list.length){
    if(!screenStale(gen) && my===PHOTO_RENDER_SEQ){ revokePhotoUrls(); box.innerHTML=''; }
    return;
  }
  const parts=[];
  // 自分が作った参照だけを手元に持つ。まとめ置き場に入れてしまうと、
  // 読んでいる間に画面が変わったとき、次の画面の写真まで消してしまう
  const mine=[];
  for(const pp of list){
    let rec=null; try{ rec=await PhotoDB.get(pp.id); }catch(e){}
    if(!rec||!rec.blob) continue;

  // 自分が作った参照だけを捨てて何も出さない
  if(screenStale(gen) || my!==PHOTO_RENDER_SEQ){
    mine.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
    return;
  }
  revokePhotoUrls();        // ここまで出ていた分を手放す（画面から消えた後で）
  SCREENS._photoUrls = mine;

function download(filename, text, mime){
  downloadBlob(filename, new Blob([text], {type: mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function csvCell(v){
  v = v==null ? '' : String(v);
  // Excelの数式として読まれるのを防ぐ。数値（マイナスの緯度経度など）はそのまま通す
  if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d+(\.\d+)?$/.test(v)) v = "'"+v;
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCsv(cols, rows){
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n');
}
/* 緯度経度は全部の行で同じ文字列にする。

/* 内部は cm・cm/s で持ち、書き出す瞬間に m・m/s に直す */

  '調査日','季節','天気','緯度','経度','河川形態A'];

/* データベース取り込み用の行を組み立てる。
   1行 = 1種の結果。落とすものは黙って落とさず、理由と件数を返す */
/* 書き出しのための控えを取る。
   ここは「読めない」を「空」と取り違えてはいけない場所なので、
   壊れていたら例外にする読み方（loadRaw）を使う。
   表示用の読み方だと、体長の記録が壊れていたとき尾数を少なく出してしまう
   （2026-08-16 の監査 Critical） */
function exportSnapshot(){
  const box = {};
  [['st', DB.key.st, '箇所'], ['ca', DB.key.ca, '魚の記録'],
   ['ind', DB.key.ind, '1尾ずつの記録'],
   ['mc', DB.key.mc, 'メッシュのマス']].forEach(([k, key, label])=>{
    try{ box[k] = DB.loadRaw(key).filter(x=>x && !x.deleted_at); }
    catch(e){ throw new Error(label + 'を読み取れません。書き出しを中止しました'); }
  });
  // 1尾ずつの記録は、記録ごとにまとめておく。
  // 毎回すべてを見に行くと、記録が増えたときに時間がかかりすぎる
  box.byCatch = {};
  box.ind.forEach(i=>{
    const k = i.catch_uuid;
    if(!k) return;
    (box.byCatch[k] || (box.byCatch[k]=[])).push(i);
  });
  return box;
}

  try{ snap = exportSnapshot(); }
  catch(e){
    // 読めないものがある。空として出すと記録を取りこぼすので、何も作らずに止める
    return {rows:[], excluded:[], warnings:[], blocked:[e.message]};
  }

  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid && unitReady(x))
    .sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  // 代表点が空でも、地点が置いてあれば取り直す（前回M6の直しを入口でも効かせる）
  const pos = surveyPos(sv);
  const lat = fixCoord(pos.lat), lon = fixCoord(pos.lon);
  if(lat==='' || lon===''){
    blocked.push('調査の位置（緯度経度）が入っていません');
  }
  stations.forEach(st=>{
    // 開始・終了時刻が空だと、取り込み側が別々の箇所を1つにまとめてしまう。
    // ただし見るのは「実際に31列CSVの行になる箇所」だけ。
    // 地点の目印や物理環境の記録まで見ると、魚は入っているのに
    // 書き出せない、ということが起きる（監査50回目 Critical）
    const 行になる = snap.ca.some(c=>c.station_uuid===st.uuid
      && c.species_id && catchTotal(c, snap) > 0 && !badCount(c, snap));
    if(行になる && !st.survey_time_start){
      blocked.push(`${st.name||'箇所'}：開始時刻が入っていません`);
    }
    snap.ca.filter(c=>c.station_uuid===st.uuid)
      .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')))
      .forEach(c=>{
      const name = c.species_name || '(種名なし)';
      const bad = badCount(c, snap);
      if(bad){ blocked.push(`${name}：${bad}`); return; }
      const n = catchTotal(c, snap);
      if(!c.species_id){ excluded.push(`${name}（種IDがありません）`); return; }
      if(n<=0){ excluded.push(`${name}（尾数が0です）`); return; }
      rows.push(dbRowOf(sv, st, c, snap));
    });
  });
  // 別々の箇所が1つにまとめられてしまう組み合わせを探す。
  // 実際に書き出す文字で見る（画面の値ではなく、CSVに載る形で比べる）。
  // 調査そのものが分かれていれば（日付や地点名が違えば）まとまらないので、
  // 調査の手がかりも一緒に見る
  const seen = {};
  stations.forEach(st=>{
    const src = dbRowOf(sv, st, null, snap);
    const k = FS_EVENT_KEY.concat(FS_HABITAT_KEY)
      .map(c=>String(src[c]==null?'':src[c])).join(String.fromCharCode(1));
    const hasFish = snap.ca.some(c=>c.station_uuid===st.uuid
      && c.species_id && catchTotal(c, snap)>0);
    if(seen[k]){
      const msg = `${seen[k].name} と ${st.name} は、取り込み側で1つの箇所にまとめられます`;
      // どちらにも魚が入っているなら、まとまると記録が混ざる。書き出しを止める
      if(hasFish && seen[k].hasFish){
        blocked.push(msg + '。日付・時刻・環境のどれかを変えてください');
      }else{
        warnings.push(msg);
      }
      // 魚があったことを覚えておく。覚えないと、魚なしの箇所を先に見たあと
      // 魚ありが2つ続いても、ぶつかりを見逃す（監査34回目 Major）
      if(hasFish) seen[k].hasFish = true;
    }else{
      seen[k] = {name:st.name, hasFish};
    }
  });

  return {rows, excluded, blocked, warnings};
}
/* 地点情報（区間名・地点名・河川形態A）は、地点に入っていればそれを使い、
   空なら調査ぜんぶの値を使う。地点ごとに入れられるようにしたのは 2026-08-20 */
/* この調査の代表点。空のままだと31列CSVを書き出せない。
   地点の保存はできたのに調査の更新だけ失敗した（容量不足など）ときのために、
   使うときに最初の地点から取り直す（監査32回目 Major） */
/* 31列CSVを出せる調査か。
   「何を調べますか」の欄を消したので、前に作った物理環境の調査でも
   地点から魚の地図に入って魚を記録できる。調査の種類ではなく、
   実際に魚の記録があるかで決める（監査33回目 Critical） */
function hasFishRecords(svUuid){
  return DB.stationsOf(svUuid).some(st=>DB.catchesOf(st.uuid)
    .some(c=>c.species_id && catchTotal(c) > 0));
}
function canExportDbCsv(sv){
  return !!sv && hasFishRecords(sv.uuid);
}
/* 現在地を待っている間に、画面や地点が変わっていないか確かめる。
   変わっていたら置かない。置くと、閉じた画面から記録が増えたり、
   P1で押した操作が P2 のものになる（監査33回目 Major）。
   使い方: const g = fixGuard(svUuid); … getFixOnce(f=>{ if(!g()) return; … }) */
/* 現在地を待っている最中かどうか。待っている間にもう一度押されると、
   同じ場所へ二重に置かれる（監査66回目 Major）。
   取れても取れなくても、終わったら必ず外す */
let FIX_BUSY = false;
function fixBusy(){
  if(FIX_BUSY){
    toast('いま現在地を取っています。少しお待ちください', 5000);
    return true;
  }
  FIX_BUSY = true;
  return false;
}
function fixDone(){ FIX_BUSY = false; }
function fixGuard(svUuid){
  // 見るのは「どの画面のどの記録を開いているか」。
  // 描き直しの回数（screenGen）で見ると、待っている間に地図をタップしただけで
  // 弾いてしまい、あとから返った現在地を取りこぼす
  const at = STACK[STACK.length-1] || {};
  const 画面 = at.name;
  let 引数 = ''; try{ 引数 = JSON.stringify(at.arg || ''); }catch(e){}
  const spot = MAP_SPOT;
  // 画面を移った回数。別の画面へ行って戻ってくると、名前と引数は同じでも
  // ここが変わる（監査54回目 Minor）
  const 移り = NAV_SEQ;
  // どの日の記録にするか。待つ間に変えられると、別の日の記録になる
  //（監査54回目 Major）
  const 日 = svUuid ? recDay(DB.getAlive(DB.key.sv, svUuid)) : '';
  // 何を足そうとしていたかも控える。待つ間に種類や相手が変わると、
  // 返ってきた座標が別の操作に使われる（監査34回目 Major）
  const 何を = [FISH_NEXT.kind, FISH_NEXT.draw, ENV_NEXT.kind, ENV_NEXT.line].join('|');
  return function(){
    const now = STACK[STACK.length-1] || {};
    let a2 = ''; try{ a2 = JSON.stringify(now.arg || ''); }catch(e){}
    if(now.name !== 画面 || a2 !== 引数){
      toast('現在地を取っている間に別の画面へ移ったので、置いていません', 7000);
      return false;
    }
    if(NAV_SEQ !== 移り){
      toast('現在地を取っている間に画面を移ったので、置いていません', 7000);
      return false;
    }
    if(MAP_SPOT !== spot){
      toast('現在地を取っている間に地点が変わったので、置いていません', 7000);
      return false;
    }
    if(svUuid && recDay(DB.getAlive(DB.key.sv, svUuid)) !== 日){
      toast('現在地を取っている間に記録する日が変わったので、置いていません', 7000);
      return false;
    }
    if([FISH_NEXT.kind, FISH_NEXT.draw, ENV_NEXT.kind, ENV_NEXT.line].join('|') !== 何を){
      toast('現在地を取っている間に、つぎに足すものが変わったので置いていません', 7000);
      return false;
    }
    if(!writeAllowed()){
      toast('このタブでは置けません。記録を入れているタブでお試しください', 6000);
      return false;
    }
    return true;
  };
}
/* 調査の代表の位置を、地点から決め直す。
   代表は「いちばん番号の小さい、生きている地点」に決め打ちする。
   消した順・戻した順で代表が変わると、書き出しの調査の見分けまで揺れる
   （監査66回目 Major）。手入力やGPSで決めた位置は触らない */
function spotPosFix(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return true;
  if(sv.position_source && sv.position_source !== '地点') return true;
  // 昔の版には「位置の決め方」欄そのものが無い記録がある。
  // 位置が入っているのに欄が空だからといって「地点由来」と決めつけると、
  // 手入力した位置を消したり別の位置に動かしたりしてしまう（監査83回目 Critical）。
  // 欄が空で位置も空のときだけ、地点から補ってよい
  if(!sv.position_source
     && numOf(sv.latitude) !== '' && numOf(sv.longitude) !== '') return true;
  const 地点 = spotList(svUuid).filter(x=>x.is_spot)
    .slice().sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  const 先頭 = 地点.map(stationPt).filter(Boolean)[0];
  const 新lat = 先頭 ? +(+先頭[0]).toFixed(6) : '';
  const 新lon = 先頭 ? +(+先頭[1]).toFixed(6) : '';
  const 新src = 先頭 ? '地点' : '';
  if(fixCoord(sv.latitude) === fixCoord(新lat)
     && fixCoord(sv.longitude) === fixCoord(新lon)
     && (sv.position_source||'') === 新src) return true;
  sv.latitude = 新lat; sv.longitude = 新lon; sv.position_source = 新src;
  if(!DB.upsert(DB.key.sv, sv)) return false;
  // 画面に隠してある値もそろえる（監査60回目 Major）
  applyVals({'#f_lat': fixCoord(sv.latitude), '#f_lon': fixCoord(sv.longitude)});
  const el = $('#posInfo');
  if(el) el.textContent = sv.position_source ? ('決め方：' + sv.position_source) : '';
  if(typeof surveyDrawPos === 'function'){
    try{ surveyDrawPos(sv.latitude, sv.longitude); }catch(e){}
  }
  return true;
}
function surveyPos(sv){
  if(!sv) return {lat:'', lon:''};
  if(numOf(sv.latitude)!=='' && numOf(sv.longitude)!=='') {
    return {lat: sv.latitude, lon: sv.longitude};
  }
  const sp = spotList(sv.uuid).map(stationPt).filter(Boolean)[0];
  return sp ? {lat: sp[0], lon: sp[1]} : {lat:'', lon:''};
}
function spotInfoOf(sv, st){
  const s = st || {};
  // 地図で作った記録は、自分では地点情報を持たない。
  // どの地点の地図で作ったか（spot_uuid）をたどって、その地点の値を使う
  // 指している地点が消えていたら（liveStation が null）、調査ぜんぶの値を使う。
  // 別の調査の地点を指していたら使わない
  let sp = {};
  if(s.spot_uuid && s.spot_uuid !== s.uuid){
    const t = DB.liveStation(s.spot_uuid);
    if(t && t.survey_uuid === sv.uuid) sp = t;
  }
  // 地点にぶら下がっている記録は、地点の値を先に見る。
  // 記録自身の古い値を先に見ると、地点で入れ直した天気・区間名が
  // 書き出しに出てこない（監査36回目 Major）
  const 地点あり = !!sp.uuid;
  const pick = k => 地点あり ? (sp[k] || sv[k] || '') : (s[k] || sv[k] || '');
  return {
    section: pick('section_name'),
    site:    pick('site_name'),
    formA:   pick('river_morphology_a'),
    weather: pick('weather'),
    memo:    pick('memo'),
    spot:    (sp.name || (s.is_spot ? (s.name||'') : '')),
    // 消えた地点や別の調査の地点を指していたら、地点IDも空にする。
    // 残すと、書き出しの地点IDが存在しない地点を指す（監査37回目 Major）
    spotId:  (sp.uuid || (s.is_spot ? s.uuid : '')),
  };
}
/* CSVの1行を組み立てる。c が null なら魚の欄は空のまま（箇所の鍵を調べるときに使う） */
function dbRowOf(sv, st, c, inds){
  const ls = c ? catchLengths(c, inds) : [];
  const si = spotInfoOf(sv, st);
  const pos = surveyPos(sv);
  return {
    '緯度': fixCoord(pos.lat), '経度': fixCoord(pos.lon),
    // 何日かにわたる調査では、その箇所の日付を使う。
    // 取り込み側は調査日で調査を分けるので、日ごとに別の調査として入る
    '調査日': stationDate(st, sv), '季節':sv.season||'', '天気':si.weather,
    // 水温は、その箇所に無ければ地点の水温を使う（地点情報で測るため。
    // 2026-08-23 の実機の声）
    '水温': (()=>{
      const own = numOf(st.water_temp);
      if(own !== '') return own;
      const sp = st.spot_uuid ? DB.liveStation(st.spot_uuid) : null;
      return (sp && sp.survey_uuid === sv.uuid) ? numOf(sp.water_temp) : '';
    })(),
    // 代表値は「手入力があればそれ、無ければ測点の平均」
    '水深': cmToM(stationDepth(st, inds).rep),
    '流速': cmToM(stationVelocity(st, inds).rep),
    '河川名':sv.river_name||'', '地点名':si.site, '区間名':si.section,
    '河川形態A':si.formA, '河川形態B':st.river_morphology_b||'',
    '河床材料':st.substrate1||'', '礫の状況':st.gravel_condition||'',
    '環境区分':st.habitat_type||'',
    '調査区分':st.survey_type||'', '調査方法':stationMethods(st).join(','),
    '種ID': c ? (c.species_id||'') : '', '個体数': c ? catchTotal(c, inds) : '',
    '最大体長': ls.length ? Math.max.apply(null,ls) : '',
    '最小体長': ls.length ? Math.min.apply(null,ls) : '',
    '同定確度': c ? (c.identification_confidence||'') : '',
    'コピー数':'', '在不在':'',
    '流量': numOf(st.flow_rate),
    '開始時刻':st.survey_time_start||'', '終了時刻':st.survey_time_end||'',
    '備考': c ? (c.notes||'') : '',
    '業務番号':sv.project_number||'', '業務名':sv.project_name||'',
  };
}
/* 1尾ずつの記録（1行＝1尾） */
function buildIndRows(sv, snap){

            '尾叉長cm': numOf(i.fork_length_cm),
            '記録した時刻': i.recorded_at ? fmtTime(i.recorded_at) : '',
            '調査ID':sv.uuid, '箇所ID':st.uuid, '記録ID':c.uuid,
          });
        });
    });
  });
  return rows;
}

/* 測点ごと（1行＝1測点） */
const FS_POINT_COLS = ['調査日','河川名','地点名','箇所','測点番号',
  '水深cm','流速cms','河床材料','備考',

function buildPointRows(sv, snap){

          '調査ID':sv.uuid, '箇所ID':st.uuid,

      if(!pts.length && stationKind(sv, st)==='物理環境'

  return rows;

/* 箇所ごと（1行＝1箇所） */
function buildStationRows(sv, snap){
  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid && unitReady(x))
    .sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  return stations.map(st=>{
    const len = stationLengths(st), area = stationAreas(st);
    // メッシュのときは、マスから水深・流速をまとめる
    const d = stationDepth(st, snap), v = stationVelocity(st, snap);
    const mg = meshGeom(st);
    const pct = substratePct(st);
    const L = coverList(st,'left'), R = coverList(st,'right');
    const cs = snap.ca.filter(c=>c.station_uuid===st.uuid);
    const n = cs.reduce((a,c)=>a+catchTotal(c, snap), 0);
    // その行の秒数は、ここで1回だけ決める。通電の最中は呼ぶたびに増えるので、
    // 別々に呼ぶと、出した秒数で計算し直した値と食い違う（監査63回目 Major）
    const 秒 = Math.round(stationEffortRaw(st));
    const cp = {
      per100s: 秒>0 ? n/秒*100 : '',
      per100m2: (area.used!=='' && area.used>0) ? n/area.used*100 : '',
    };
    const si = spotInfoOf(sv, st);
    return {
      '調査日': stationDate(st, sv), '河川名':sv.river_name||'', '地点名':si.site,
      '区間名':si.section, '河川形態A':si.formA,

      '箇所':st.name||'', '記録のしかた':sv.detail_level||'一般',
      '調べたもの': exportKind(sv, st),
      // 「環境の取り方」は物理環境の記録だけ。地点や魚の単位に既定の「点」を
      // 出すと、地点が測点のように読める（監査43回目 Major）
      '環境の取り方': stationKind(sv, st)==='物理環境' ? envMethod(st) : '',
      '向き': isLine(st) ? (st.line_direction||'') : '',
      '始点緯度': fixCoord(st.line_start_lat), '始点経度': fixCoord(st.line_start_lon),
      '始点GPS精度m': numOf(st.line_start_acc),
      '終点緯度': fixCoord(st.line_end_lat), '終点経度': fixCoord(st.line_end_lon),
      '終点GPS精度m': numOf(st.line_end_acc),
      '記録の単位': UNIT_MARK[unitKindOf(st)] || '',
      '単位の呼び名': UNIT_WORD[unitKindOf(st)] || '',

      '囲いの角数': isUnitPoly(st) ? polyPts(st).length : '',
      '囲い座標': isUnitPoly(st) ? polyText(st) : '',
      // 親子は調査の中でしか結ばないので、ここで調査ごとに絞る必要はない
      '中の記録の種数': unitKindOf(st) ? unitTotals(st.uuid, snap.st, snap).種 : '',
      '中の記録の尾数': unitKindOf(st) ? unitTotals(st.uuid, snap.st, snap).尾 : '',
      '距離_始終点直線m': round1(lineStraight(st)),
      '距離_区間折れ線m': round1(stationLengths(st).line),
      '曲がり数': isLine(st) ? lineVias(st).length : '',
      '流量': numOf(st.flow_rate),
      'メッシュ縦間隔m': numOf(st.mesh_row_m), 'メッシュ横間隔m': numOf(st.mesh_col_m),

      'メッシュ格子ID': meshGridId(st),
      'メッシュ縦m': mg ? round1(mg.length) : '', 'メッシュ横m': mg ? round1(mg.width) : '',
      '緯度': fixCoord(st.latitude), '経度': fixCoord(st.longitude),
      'GPS精度m': numOf(st.gps_accuracy), '位置の決め方': st.position_source||'',
      '環境区分':st.habitat_type||'',
      '河川形態B':st.river_morphology_b||'',
      '調査区分':st.survey_type||'', '調査方法':stationMethods(st).join(','),
      '漁具の件数': gearCount(st),
      '開始時刻':st.survey_time_start||'', '終了時刻':st.survey_time_end||'',
      '水温': numOf(st.water_temp),
      '測点数': envPoints(st).length,
      '位置つき測点数': envPoints(st).filter(x=>numOf(x.latitude)!=='').length,
      '水深_最小cm': round1(d.min), '水深_最大cm': round1(d.max),
      '水深_平均cm': round1(d.avg), '水深_代表cm': round1(d.rep),
      '流速_最小cms': round1(v.min), '流速_最大cms': round1(v.max),
      '流速_平均cms': round1(v.avg), '流速_代表cms': round1(v.rep),
      '河床材_砂泥%': numOf(pct['砂泥']), '河床材_小礫%': numOf(pct['小礫']),
      '河床材_中礫%': numOf(pct['中礫']), '河床材_大礫%': numOf(pct['大礫']),
      '河床材_巨礫%': numOf(pct['巨礫']), '河床材_岩盤%': numOf(pct['岩盤']),
      '河床材_コンクリート%': numOf(pct['コンクリート']),
      '河床材_割合合計%': round1(substratePctSum(st)),
      '左岸カバー1': (L[0]||{}).type||'', '左岸カバー割合1%': numOf((L[0]||{}).pct),
      '左岸カバー2': (L[1]||{}).type||'', '左岸カバー割合2%': numOf((L[1]||{}).pct),
      '左岸カバー3': (L[2]||{}).type||'', '左岸カバー割合3%': numOf((L[2]||{}).pct),
      '左岸カバー長m': numOf(st.cover_left_length_m), '左岸カバーあり': coverPresent(st,'left'),
      '右岸カバー1': (R[0]||{}).type||'', '右岸カバー割合1%': numOf((R[0]||{}).pct),
      '右岸カバー2': (R[1]||{}).type||'', '右岸カバー割合2%': numOf((R[1]||{}).pct),
      '右岸カバー3': (R[2]||{}).type||'', '右岸カバー割合3%': numOf((R[2]||{}).pct),
      '右岸カバー長m': numOf(st.cover_right_length_m), '右岸カバーあり': coverPresent(st,'right'),
      '河床材料':st.substrate1||'', '次に多い河床材料':st.substrate2||'',
      '礫の状況':st.gravel_condition||'',
      // 箇所CSVは、入っている値をそのまま出す（集計の二重数え防止とは分ける）
      '通電秒数': 秒,
      '通電回数': numOf(st.effort_passes),
      '川幅m': numOf(st.width_m),
      '距離_軌跡m': round1(len.track), '距離_直線m': round1(len.straight),
      '距離_手入力m': len.manual, '距離_使う値m': round1(len.used),
      '面積_計算m2': round1(area.calc), '面積_手入力m2': area.manual,
      '面積_使う値m2': round1(area.used),
      '種数': speciesCount(cs, snap), '尾数': n,
      '100秒あたり尾数': round1(cp.per100s), '100m2あたり尾数': round1(cp.per100m2),
      // その箇所そのものに打ったメモを先に出す。
      // 地点のメモで上書きすると、単位に入れたメモが黙って落ちる（監査48回目 Major）
      'メモ': (st.memo || si.memo), '地点': si.spot, '調査ID':sv.uuid, '箇所ID':st.uuid,
    };
  });
}

/* 努力量（箇所数・通電）を数える単位。
   1つの調査に、地点の目印・地図の単位（親と子）・物理環境の記録・メッシュが同居する。
   そのまま足すと、同じ現場の労力を何度も数える（監査32回目 Major）。
   数えるのは「記録を入れる、いちばん小さい単位」だけ:
     ・メッシュの範囲は除く（別のCSVに出す）
     ・中に小さい単位がある親は除く（子で数える）
     ・地点の目印は除く。ただし、その調査に地図の単位も物理環境の記録も
       無いときだけ、地点そのものを数える（前のやり方で地点に直接入れた場合） */
/* 地点（目印）は通電を持たない決まり。
   ただし前の版で地点へ直接入った秒数は、消さずに書き出す。
   集計で二重に数えないよう、その地点の地図で作った記録が
   1つも無いときだけ数える（監査56回目 Critical） */
function spotEffort(st){
  if(!st || !st.is_spot) return effortSeconds(st);
  return spotFishChildren(st) ? 0 : effortSeconds(st);
}
/* 書き出しの「調べたもの」。箇所CSVと調査CSVで同じ見方をする（監査60回目 Major） */
function exportKind(sv, st){
  return spotCountsAsFish(st) ? '魚' : stationKind(sv, st);
}
/* 前の版で地点へ直に入れた魚・漁具・通電があり、まだ魚の単位を作っていない地点。
   この地点は、集計でも書き出しでも「魚」として扱う（監査59回目 Major） */
function spotCountsAsFish(st){
  if(!st || !st.is_spot) return false;
  // 子の単位があるかは見ない。見ると、新しい単位を1つ作っただけで
  // その地点の直接の魚が「地点」と書き出される（監査61回目 Major）
  return !!(DB.catchesOf(st.uuid).length || gearCount(st) || +st.effort_seconds > 0);
}
/* 労力（通電・箇所数・距離・面積）を、この地点の分として数えるか。
   魚の単位を作ったら、そちらで数えるので地点側は数えない */
function spotEffortCounts(st){
  return spotCountsAsFish(st) && !spotFishChildren(st);
}
/* その地点の地図で作った「魚の単位」があるか。
   物理環境の測点やラインは、通電とは別のものなので数に入れない。
   入れると、測点を1つ置いただけで地点の通電が集計から消える（監査58回目 Major） */
function spotFishChildren(st){
  if(!st) return 0;
  return DB.stationsOf(st.survey_uuid)
    .filter(x=>x.uuid!==st.uuid && x.spot_uuid===st.uuid && unitKindOf(x) && unitReady(x)).length;
}
/* 書き出しに「そのまま出す」ための値。集計とは分ける */
function stationEffortRaw(st){ return effortSeconds(st); }
function effortStations(stations, all){
  const 生き = (stations||[]).filter(st=>!isMesh(st) && unitReady(st));
  // 種類は env_method だけでは決まらない（前の版で魚の単位にも付いた）。
  // stationKind に合わせないと、その単位の通電・距離・面積が漏れる（監査44回目 Major）
  const sv0 = DB.getAlive(DB.key.sv, (生き[0]||{}).survey_uuid) || null;
  const 種 = (st)=>stationKind(sv0, st);
  // 親子は調査ぜんぶから見る。その日・その地点の分だけで見ると、
  // 別の日に子を作った親を「子のない単位」と取り違える（監査36回目 Major）
  const 親 = {};
  (all || stations || []).filter(unitReady)
    .forEach(st=>{ if(st && st.parent_uuid) 親[st.parent_uuid] = true; });
  // 子を作る前に親へ直接入れた記録があれば、その親も数える。
  // 除くと、魚は集計に出るのに通電・箇所数だけ消える（監査34回目 Major）。
  // これから先は unitParentBlocked が新しく作らせないので、
  // 残るのは前の版で作った分だけ
  const 葉 = 生き.filter(st=>!親[st.uuid] || !!unitHasOwn(st));
  // 上から順に、あるものを使う
  // 前の版で地点へ直に入れた魚・漁具・通電は、魚の側に数える。
  // 物理環境の測点を1つ置いただけで、その地点の通電・箇所数が
  // 集計から落ちていた（監査58回目 Major）
  const 旧地点 = 葉.filter(spotEffortCounts);
  const 魚 = 葉.filter(st=>種(st)==='魚').concat(旧地点);
  if(魚.length) return 魚;
  const 環境 = 葉.filter(st=>種(st)==='物理環境');
  if(環境.length) return 環境;
  return 葉;                       // 地点しか無い調査
}

/* 調査ぜんぶ（1行） */
/* 調査CSVは、日ごとに1行にする。
   31列CSVは箇所の日付で調査が分かれるので、期間全体を1行にまとめると
   件数も日別の集計も食い違う（2026-08-17 の監査 Major） */
/* 調査CSVは「日ごと」に1行だった。
   地点ごとに 地点名・区間名・天気・河川形態A を持てるようにしたので、
   同じ日でも地点が違えば、取り込み側は別の調査として扱う。
   31列CSVのまとまり方と食い違わないよう、日付＋地点で1行にする（監査33回目 Major） */
function buildSurveyRow(sv, snap){
  // 描きかけの囲いは、書き出しに混ぜない（監査62回目 Major）
  const all = snap.st.filter(x=>x.survey_uuid===sv.uuid && unitReady(x));
  const 組 = {};
  // 地点の目印そのものは、記録を持っていなければ数えない。
  // 数えると「箇所数1・尾数0」の架空の行ができ、31列CSVと食い違う（監査38回目 Major）
  // 目印だけの地点は、その地点の記録があれば単独の行にしない。
  // 出すと、置いた日の「0件の行」と、記録した日の行に分かれる（監査44回目 Major）。
  // 地点情報は spotInfoOf で子の行へ渡る
  const 子あり = {};
  all.forEach(st=>{ if(st.spot_uuid) 子あり[st.spot_uuid] = true; });
  const 対象all = all.filter(st=>{
    if(!st.is_spot) return true;
    if(spotOwnRecords(st)) return true;
    if(子あり[st.uuid]) return false;
    return spotHasData(st);
  });
  対象all.forEach(st=>{
    const day = stationDate(st, sv);
    const spot = spotInfoOf(sv, st).spotId || '';
    // まとめる鍵は、31列CSVが「同じ調査」とみなすのと同じものを使う。
    // 日付＋地点で分けると、同じ鍵に潰れる別地点や、同じ地点なのに
    // 鍵が違う記録があったときに、2つのCSVの調査の数が食い違う（監査34回目 Major）
    const src = dbRowOf(sv, st, null, snap);
    const k = FS_EVENT_KEY.map(c=>String(src[c]==null?'':src[c]))
      .join(String.fromCharCode(1));
    const g = 組[k] || (組[k] = {day, spot, spots:{}, memos:{}, sts:[], 空:false});
    g.sts.push(st);
    const si = spotInfoOf(sv, st);
    if(spot){
      g.spots[spot] = si.spot || spot;
      if(si.memo) g.memos[spot] = si.memo;
    }else{
      // 地点に属さない前のやり方の箇所。同じ組に混ざると、
      // その分まで地点のものとして書き出されてしまう（監査47回目 Major）
      g.空 = true;
      if(st.memo) g.memos['st:'+st.uuid] = st.memo;
      g.spots['st:'+st.uuid] = st.name || '';
    }
  });
  const keys = Object.keys(組).sort();
  if(!keys.length){
    snap.__rowCount = 1;
    // メモは空文字を渡さない。渡すと「地点の値が無ければ調査の値」が働かず、
    // 調査に書いたメモが書き出しから落ちる（監査55回目 Major）
    return [surveyRowOfDay(sv, snap, String(sv.survey_date||'').slice(0,10), [], '', '',
                           undefined)];

  }
  snap.__rowCount = keys.length;
  return keys.map(k=>{
    const g = 組[k];
    const ids = Object.keys(g.spots);
    const 地点ids = ids.filter(i=>i.indexOf('st:') !== 0);
    // 同じ「1つの調査」に地点が複数まとまることがある。
    // どれか1つに寄せると、ほかの地点の分がその地点のものとして出る（監査38回目 Major）。
    // 地点に属さない箇所が混ざっているときも、地点IDは出さない（監査47回目 Major）
    const 地点ID = (地点ids.length === 1 && !g.空) ? 地点ids[0] : '';
    // 地点に属さない箇所が混ざっているときは、その箇所の名前も出す。
    // 地点の名前だけ出すと、混ざった分まで その地点のものに見える（監査48回目 Major）
    const 名前ids = g.空 ? ids : 地点ids;
    const 地点名 = 名前ids.length
      ? 名前ids.map(i=>g.spots[i]).filter(Boolean).sort().join('・') : '';
    // 地点ごと・箇所ごとのメモを落とさない。1つならそのまま、
    // 複数なら「P1: …／St.1: …」（監査43回目 Major・監査47回目 Major）
    const 持つ = ids.filter(i=>g.memos[i]).sort();
    const メモ = 持つ.length === 0 ? undefined
      : (持つ.length === 1 && ids.length === 1) ? g.memos[持つ[0]]
      : 持つ.map(i=>`${g.spots[i] || ''}: ${g.memos[i]}`)
          .sort().join(String.fromCharCode(65295));
    return surveyRowOfDay(sv, snap, g.day, g.sts, 地点ID, 地点名, メモ);
  });
}
function surveyRowOfDay(sv, snap, day, stations, spotId, spotName, spotMemo){
  const ids = new Set(stations.map(x=>x.uuid));
  const cs = snap.ca.filter(c=>ids.has(c.station_uuid));
  const n = cs.reduce((a,c)=>a+catchTotal(c, snap), 0);
  const measured = cs.reduce((a,c)=>a+indsOf(snap, c.uuid).length, 0);
  // 距離・面積はその日の箇所だけを足す
  // 親子の両方から足すと二重になる。努力量と同じ集合から出す（監査35回目 Major）
  const 対象 = effortStations(stations, snap.st.filter(x=>x.survey_uuid===sv.uuid));
  const dayLen = 対象.map(st=>stationLengths(st).used).filter(v=>v!=='' && isFinite(v));
  const dayArea = 対象.map(st=>stationAreas(st).used).filter(v=>v!=='' && isFinite(v));
  // 行を日付＋地点で分けたので、調査ぜんぶの合計を各行に繰り返すと
  // 足したときに何倍にもなる。その組の箇所だけから出す（監査34回目 Major）。
  // 手入力の合計は、行が1つのときだけ使う
  const 一行 = (snap.__rowCount || 0) <= 1;
  const len = {auto: dayLen.length ? dayLen.reduce((a,b)=>a+b,0) : '', manual:'', used:''};
  const area = {auto: dayArea.length ? dayArea.reduce((a,b)=>a+b,0) : '', manual:'', used:''};
  len.used = len.auto; area.used = area.auto;
  if(一行){
    // 手で入れた値があるときだけ、そちらを使う。
    // 「調査ぜんぶの合計」で置き換えると、親子や別系統を二重に数える（監査37回目 Major）
    const L = surveyLengths(sv), A = surveyAreas(sv);
    len.manual = L.manual; area.manual = A.manual;
    if(L.manual!=='' ) len.used = L.manual;
    if(A.manual!=='' ) area.used = A.manual;
  }
  // その組（日付＋地点）を代表する記録から、地点情報を取る
  const 代表 = stations[0] || null;
  const si = spotInfoOf(sv, 代表);
  return {
    '調査日': day||'', '終了日':sv.survey_date_end||'',
    '日数': surveyDays(sv).length,
    '季節':sv.season||'', '天気': si.weather,
    '河川名':sv.river_name||'', '地点名': si.site, '区間名': si.section,
    '河川形態A': si.formA, '地点': (spotName === undefined ? si.spot : spotName),
    // 1つの調査に魚と物理環境が同居するので、その組の中身から決める
    '調べたもの': (()=>{
      const k = {};
      stations.forEach(st=>{
        // 前の版で地点へ直に入れた魚は、書き出しでも「魚」と出す。
        // 出さないと、尾数と通電がある行が「物理環境」になる（監査59回目 Major）
        k[exportKind(sv, st)] = true;
      });
      delete k['地点'];
      const l = Object.keys(k);
      return l.length ? l.join('・') : surveyKind(sv);
    })(),
    '記録のしかた':sv.detail_level||'一般',
    '環境の取り方': (()=>{
      const m = {};
      stations.forEach(st=>{
        if(stationKind(sv, st)==='物理環境' && st.env_method) m[st.env_method] = true; });
      return Object.keys(m).join('・');
    })(),
    '緯度': fixCoord(surveyPos(sv).lat), '経度': fixCoord(surveyPos(sv).lon),
    'GPS精度m': numOf(sv.gps_accuracy), '位置の決め方':sv.position_source||'',
    '調査者':sv.investigator||'', '何回目調査':sv.survey_round||'',
    '業務番号':sv.project_number||'', '業務名':sv.project_name||'',
    '箇所数': 対象.length,
    '種数': speciesCount(cs, snap),
    '尾数': n, '測った尾数': measured,
    '通電秒数_合計': Math.round(対象.reduce((a,st)=>a+spotEffort(st), 0)),
    '距離_合計m': round1(len.auto), '距離_手入力m': len.manual, '距離_使う値m': round1(len.used),
    '面積_合計m2': round1(area.auto), '面積_手入力m2': area.manual,
    '面積_使う値m2': round1(area.used),
    '開始': sv.started_at ? fmtTime(sv.started_at) : '',
    '終了': sv.finished_at ? fmtTime(sv.finished_at) : '',
    'メモ': (spotMemo === undefined ? si.memo : spotMemo),
    '調査ID':sv.uuid, '地点ID': spotId||'',
  };
}
/* 数の範囲を見る。おかしいものがあれば、その説明を返す。無ければ空文字。
   負の距離や100%を超える割合が入ると、面積・CPUE・河床材の割合が
   静かに壊れる（2026-08-17 の監査 Major） */
function rangeCheck(list){
  for(const it of list){
    const label = it[0], v = it[1], lo = it[2], hi = it[3];
    if(v==='' || v===null || v===undefined) continue;
    const n = numOf(v);
    if(n==='' || !isFinite(n)) return `${label}は数で入れてください`;
    if(n < lo || n > hi) return `${label}は ${lo}〜${hi} の間で入れてください（いま ${n}）`;
  }
  return '';
}
/* 大きさを読みやすくする */
function fmtBytes(n){
  n = numOf(n); if(n==='' || !isFinite(n)) return '—';
  if(n >= 1024*1024*1024) return (n/1024/1024/1024).toFixed(1)+' GB';
  if(n >= 1024*1024) return Math.round(n/1024/1024)+' MB';
  if(n >= 1024) return Math.round(n/1024)+' KB';
  return n+' B';
}
function round1(v){
  const n = numOf(v);
  return n==='' || !isFinite(n) ? '' : Math.round(n*10)/10;
}

function exportFileBase(sv){
  const d=(sv.survey_date||dateValue()).replace(/-/g,'');
  const r=(sv.river_name||'調査').replace(/[\\/:*?"<>|\s]/g,'');
  return `魚類調査_${d}_${r}_${(sv.uuid||'').slice(0,8)}`;
}
/* 31列のCSVに乗らない項目は、こちらの3本に出す。
   列名はデータベースの表に合わせてある（Phase 5 の取り込みスクリプトで使う）
     個体.csv  → body_lengths（individual_number / total_length / fork_length）
     箇所.csv  → survey_habitats（habitat_area / habitat_length ほか）
     調査.csv  → survey_events（survey_area / survey_length ほか） */
const FS_IND_COLS = ['調査日','河川名','地点名','箇所','種ID','種名',
  '個体番号','全長cm','尾叉長cm','記録した時刻','調査ID','箇所ID','記録ID'];

const FS_STATION_COLS = ['調査日','河川名','地点名','区間名','河川形態A','天気',
  '調査者','何回目調査',
  '箇所','記録のしかた',
  '調べたもの','環境の取り方','向き',
  '始点緯度','始点経度','始点GPS精度m','終点緯度','終点経度','終点GPS精度m',
  '記録の単位','単位の呼び名','親の単位','囲いの角数','囲い座標',

function buildGearRows(sv, snap){
  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid && unitReady(x))
    .sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  const rows = [];
  stations.forEach(st=>{
    // 空の行を飛ばしたあとに番号を振る。元の並びの番号を使うと、
    // 1件しかないのに「2」と出る（監査49回目 Minor）
    gearsOf(st).filter(g=>g && g.gear).forEach((g,i)=>{
      rows.push({
        '調査日': stationDate(st, sv), '河川名':sv.river_name||'',
        '地点名': spotInfoOf(sv, st).site, '箇所':st.name||'',
        '漁具の番号': i+1, '漁具': g.gear,
        '数': numOf(g.count), '規格': g.spec||'',
        '使った分': numOf(g.minutes), '回数': numOf(g.passes),
        '備考': g.note||'', '調査ID':sv.uuid, '箇所ID':st.uuid,
      });
    });
  });
  return rows;
}

/* メッシュのマス。1行＝1マス。
   データベースには、いまマスを入れる表が無い（Phase 5 で作る）。
   列名は、あとで表を作るときそのまま使えるようにしてある */
const FS_MESH_COLS = ['調査日','河川名','地点名','範囲','行','列','いまの格子か',
  '緯度','経度','水深cm','流速cms','河床材料','環境区分','礫の状況','カバー',
  '河床材_砂泥%','河床材_小礫%','河床材_中礫%','河床材_大礫%','河床材_巨礫%',
  '河床材_岩盤%','河床材_コンクリート%',
  '備考','記録した時刻','調査ID','箇所ID','マスID','格子ID'];

function buildMeshRows(sv, snap){
  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid);
  const byId = {};
  stations.forEach(st=>{ byId[st.uuid] = st; });
  const out = [];
  (snap.mc||[]).forEach(c=>{
    const st = byId[c.station_uuid];
    if(!st) return;                       // 消した箇所のマスは出さない
    const pct = (c.substrate_pct && typeof c.substrate_pct==='object') ? c.substrate_pct : {};
    const row = {
      '調査日': stationDate(st, sv), '河川名':sv.river_name||'',
      '地点名':spotInfoOf(sv, st).site, '範囲':st.name||'',
      '行': countOf(c.row)===null ? '' : c.row+1,
      '列': countOf(c.col)===null ? '' : c.col+1,
      // 前の格子で入れたマスも残す。ただし、いまの格子の分と混ぜて集計されないよう印を付ける
      'いまの格子か': meshIsCurrent(st, c) ? 'はい' : 'いいえ（前の格子）',
      '緯度': fixCoord(c.latitude), '経度': fixCoord(c.longitude),
      '水深cm': numOf(c.depth_cm), '流速cms': numOf(c.velocity_cms),
      '河床材料': c.substrate||'', '環境区分': c.habitat_type||'',
      '礫の状況': c.gravel_condition||'', 'カバー': c.cover||'',
      '備考': c.note||'', '記録した時刻': c.measured_at ? fmtTime(c.measured_at) : '',
      '調査ID': sv.uuid, '箇所ID': st.uuid, 'マスID': c.uuid,
      '格子ID': c.grid_id || '',
    };
    OPT.substrate.forEach(k=>{ row['河床材_'+k+'%'] = numOf(pct[k]); });
    out.push(row);
  });
  return out.sort((a,b)=> String(a['範囲']).localeCompare(String(b['範囲']))
                       || (a['行']-b['行']) || (a['列']-b['列']));
}

/* ---------- 調査の作成・編集 ---------- */
/* ============================================================
   新しい調査（魚類調査イメージ.pptx の1枚目）
   ▼業務情報 → 調査日 → 季節 → 河川名 → 地図（調査地点を置く）
   → 地点のチップ → ▼地点情報。ほかの設定は「▼くわしい設定」にたたむ
   ============================================================ */
/* この調査に置いた調査地点。囲い（E・P/F）とメッシュは、地点として数えない */
/* 「新しい調査」の地図で置いた調査地点。
   物理環境の記録（測点・ライン）は置いたときに env_method が必ず入るので混ざらない。
   前のやり方で作った箇所（印も単位も env_method も無いもの）は、
   地点の地図を開けないので oldStations() のほうへ分ける（監査39回目 Critical） */
function spotList(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid) || {};
  const l = DB.stationsOf(svUuid)
    .filter(x=>!isMesh(x) && !unitKindOf(x) && stationKind(sv, x) !== '物理環境');
  const 印あり = l.filter(x=>x.is_spot);
  return 印あり.length ? 印あり : l;
}
/* 前のやり方で作った箇所。地点の印が付いていないもの。
   地点を1つでも置いた調査では、地点の並びから外れるので、別枠で出す */
function oldStations(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid) || {};
  const l = DB.stationsOf(svUuid)
    .filter(x=>!isMesh(x) && !unitKindOf(x) && stationKind(sv, x) !== '物理環境');
  return l.some(x=>x.is_spot) ? l.filter(x=>!x.is_spot) : [];
}
/* 「新しい調査」の画面で扱う地点。印のあるものだけ。
   ここで前のやり方の箇所まで拾うと、地図の印を押しただけで
   その箇所が地点として扱われる（監査42回目 Major） */
function editSpots(svUuid){ return spotList(svUuid).filter(x=>x.is_spot); }
/* いま選んでいる地点。消えていたら先頭に戻す */
function spotCur(svUuid, list){
  const l = list || editSpots(svUuid);
  const u = SPOTS_SEL[svUuid];
  const hit = u ? l.filter(x=>x.uuid===u)[0] : null;
  return hit || l[0] || null;
}
/* 地点の一覧（枚数の見出しも中に入れる。置くたびにここだけ描き直す） */
function spotCardHtml(list, sel){
  return `<h3 style="margin-top:0">地点　<span class="dim small">${list.length}件</span></h3>`
    + spotChipsHtml(list, sel);
}
function spotChipsHtml(list, sel){
  if(!list.length) return '<div class="dim small">まだありません。'
    + '地図をタップすると、その場所に調査地点を置きます。</div>';
  return `<div class="seg">` + list.map(st=>`<button type="button"
    class="${sel && st.uuid===sel.uuid ? 'on' : ''}"
    onclick="spotSelect('${st.uuid}')">${esc(st.name||'')}
    <span class="fsub">${(()=>{ const t = spotTotals(st.uuid);
      return t.尾 ? `${t.種}種 ${t.尾}尾` : '—'; })()}</span></button>`).join('') + `</div>`;
}
/* ▼地点情報。選んでいる地点の 区間名・地点名・河川形態A を入れる。
   空のままなら、調査ぜんぶの値（▼くわしい設定）を使う */

let SPOT_HOLD = {};
function spotInfoHtml(sel, sv){

    <button class="btn ng" onclick="spotRemove('${sel.uuid}')">この地点を削除する</button>
  `, true);

/* 地点情報を、選んでいる地点へ書く。打つたびに保存する（保存ボタンを押さなくても残る） */
/* 地点情報を保存できたかを返す。
   保存できなかったときは、打った内容を書きかけとして残す。
   残さずに画面を作り直すと、区間名・天気・メモが黙って消える（監査32回目 Critical） */
/* いま画面に打たれている地点情報を読む。読めないときは null */
function spotInfoVals(){
  if(!SPOT_SV || !$('#sp_section')) return null;
  const sel = spotCur(SPOT_SV); if(!sel) return null;
  return {uuid: sel.uuid, v: {
    section_name: strVal('#sp_section'), site_name: strVal('#sp_site'),
    river_morphology_a: segVal('spotFormA'), weather: segVal('spotWeather'),
    water_temp: strVal('#sp_wt'),
    memo: strVal('#sp_memo')}};
}
/* 打っているそばから控える。
   欄から指を離す前にアプリが閉じられると、onchange が来ないまま
   打った内容がどこにも残らなかった（監査47回目 Critical）。
   本保存はすこし待ってからまとめて行う（一文字ごとに全部を書き直さない） */
let SPOT_TYPE_T = null;
function spotInfoTouch(){
  if(!writeAllowed()) return;
  const cur = spotInfoVals(); if(!cur) return;
  SPOT_HOLD[cur.uuid] = cur.v;                 // 画面には必ず持ち続ける
  try{ draftSave('spotinfo:'+cur.uuid, cur.v); }catch(e){}
  if(SPOT_TYPE_T) clearTimeout(SPOT_TYPE_T);
  SPOT_TYPE_T = setTimeout(()=>{ SPOT_TYPE_T = null; spotInfoSave(); }, 900);
}
/* 閉じる・裏へ回るときは、待たずに書いてしまう */
function spotInfoDrop(uu){
  if(SPOT_TYPE_T){ clearTimeout(SPOT_TYPE_T); SPOT_TYPE_T = null; }
  try{ draftClear('spotinfo:'+uu); }catch(e){}
  delete SPOT_HOLD[uu];
}
function spotInfoFlush(){
  if(SPOT_TYPE_T){ clearTimeout(SPOT_TYPE_T); SPOT_TYPE_T = null; }
  try{ return spotInfoSave(); }catch(e){ return false; }
}
function spotInfoSave(){
  if(SPOT_TYPE_T){ clearTimeout(SPOT_TYPE_T); SPOT_TYPE_T = null; }
  if(!SPOT_SV || !$('#sp_section')) return true;   // 画面に出ていないときは触らない
  // 見ているだけのタブでは、書きかけの置き場（全タブ共通）にも触らない。
  // 触ると、記録を入れているタブの書きかけを消してしまう
  if(!writeAllowed()) return true;
  const sel = spotCur(SPOT_SV); if(!sel) return true;
  const st = DB.liveStation(sel.uuid); if(!st) return true;
  const v = {section_name: strVal('#sp_section'), site_name: strVal('#sp_site'),
             river_morphology_a: segVal('spotFormA'), weather: segVal('spotWeather'),
             water_temp: strVal('#sp_wt'),
             memo: strVal('#sp_memo')};
  // 水温はおかしな値を先に断る（-5〜45℃）
  const 難 = rangeCheck([['水温', v.water_temp, -5, 45]]);
  if(難){ toast(難, 6000); SPOT_HOLD[sel.uuid] = v; return false; }
  const 同じ = Object.keys(v).every(k => String(st[k]===undefined||st[k]===null?'':st[k]) === String(v[k]));
  if(同じ){ draftClear('spotinfo:'+sel.uuid); return true; }
  Object.keys(v).forEach(k=>{ st[k] = (k==='water_temp') ? numOf(v[k]) : v[k]; });
  if(!DB.upsert(DB.key.st, st)){
    const 残せた = draftSave('spotinfo:'+sel.uuid, v);
    SPOT_HOLD[sel.uuid] = v;      // 控えも取れなくても、画面には持ち続ける
    toast(残せた
      ? '地点情報を保存できませんでした（端末の空き容量をご確認ください）。'
        + '打った内容は残してあります'
      : '地点情報を保存できず、控えも取れませんでした。'
        + '打った内容はこのまま画面に残します。'
        + 'いらない写真や記録を消してから、もう一度お試しください', 10000);
    return false;
  }
  draftClear('spotinfo:'+sel.uuid);
  delete SPOT_HOLD[sel.uuid];
  return true;
}
function spotSelect(uu){
  const st = DB.liveStation(uu);
  if(!st || !st.is_spot) return;  // 印の無い箇所は、地点として扱わない
  if(!spotInfoSave()) return;     // 選び替える前に、打った分を先に書く。書けなければ動かさない
  if(SPOT_SV) SPOTS_SEL[SPOT_SV] = uu;

}
/* 地点の並びと地点情報だけ描き直す。
   画面ごと作り直すと、合わせた地図と書きかけが巻き添えになる */
function spotRefresh(){
  const svUuid = SPOT_SV; if(!svUuid) return;
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  const list = editSpots(svUuid);
  const sel  = spotCur(svUuid, list);
  const a = $('#f_spotList'); if(a) a.innerHTML = spotCardHtml(list, sel);
  const b = $('#f_spotInfo'); if(b) b.innerHTML = spotInfoHtml(sel, sv);
  spotsDrawAll(svUuid, sel ? sel.uuid : '');

function spotOpen(uu){ if(spotInfoSave()) nav('spot', uu); }
function spotRemove(uu){
  const st = DB.liveStation(uu); if(!st || !st.is_spot) return;
  const n = DB.catchesOf(uu).length;
  // この地点の地図で作った記録があるうちは消させない。
  // 消すと、その記録は残るのに地点から開く道が無くなり、手が届かなくなる
  //（監査38回目 Major）。文字をつなぐ + を落として実行時エラーになっていたのも直す
  //（監査38回目 Critical）
  const 連れ = spotStations(uu).filter(x=>x.uuid!==uu);
  if(連れ.length){
    const 名 = 連れ.slice(0,5).map(x=>x.name).join('・') + (連れ.length>5 ? ' ほか' : '');
    toast(`${st.name||'この地点'}の地図で作った記録が ${連れ.length}件あります`
      + `（${名}）。先にそれらを消すか、別の地点へ移してから、`
      + 'この地点を削除してください', 10000);
    return;
  }
  if(!confirm(`${st.name||'この地点'}を削除します。`
    + `${n>0?`記録${n}件も一緒に見えなくなります。`:''}よろしいですか？（ごみ箱に入ります）`)) return;
  if(!flushBeforeDelete(uu)){
    toast('打ちかけを保存できないので、消しませんでした。'
      + '足りないところを直すか、端末の空き容量をご確認ください', 9000);
    return;
  }
  if(!DB.softDelete(DB.key.st, uu)) return;
  // 代表の位置は、そのつど決め直す（監査66回目 Major）
  if(!spotPosFix(st.survey_uuid)){
    DB.restore(DB.key.st, uu);      // 半端な形を残さない
    toast('調査の位置を直せなかったので、削除をやめました', 8000);
    return;
  }
  draftClearFor('箇所', uu);
  spotInfoDrop(uu);         // 地点情報の打ちかけも片付ける（監査48回目 Minor）
  if(SPOT_SV) delete SPOTS_SEL[SPOT_SV];
  toast('削除しました');
  spotRefresh();
}
/* 地図で調査地点を置く。置いたら、それを選んだ状態にする */
/* 画面の調査日と、保存されている調査日が食い違っていないか。
   食い違ったまま地点を置くと、古い日付の地点ができ、
   そのあと保存すると「期間の外」と断られる（監査69回目 Major） */
function svDateDirty(sv){
  if(!sv || !$('#f_date')) return false;
  // いま開いているのが、その調査の設定画面のときだけ見る。
  // 別の調査の画面が開いているのに比べると、置けなくなってしまう
  const at = STACK[STACK.length-1] || {};
  if(at.name !== 'surveyEdit' || at.arg !== sv.uuid) return false;
  const d1 = strVal('#f_date'), d2 = strVal('#f_date2');
  // 開始日を消した場合も「変えた」とみなす。見逃すと、画面は空なのに
  // 保存済みの古い日付で地点ができる（監査70回目 Major）
  return d1 !== String(sv.survey_date||'').slice(0,10)
      || d2 !== String(sv.survey_date_end||'');
}
function svSpotAdd(svUuid, lat, lon, acc){
  const sv0 = DB.getAlive(DB.key.sv, svUuid);
  if(svDateDirty(sv0)){
    toast('調査日を変えています。先に下の「保存する」を押してから、'
      + '地点を置いてください', 9000);
    return null;
  }
  if(!spotInfoSave()) return null;   // 選んでいる地点の打ちかけを、先に書く
  const u = spotsAdd(svUuid, lat, lon, acc);
  if(!u) return null;
  SPOTS_SEL[svUuid] = u;
  // この調査の代表点がまだ空なら、はじめに置いた地点の位置を入れる。
  // 空のままだと、書き出しも取り込みも位置なしになる
  // 代表の位置を直せなかったら、置いた地点も戻す（半端な形を残さない）
  if(!spotPosFix(svUuid)){
    DB.softDelete(DB.key.st, u);
    toast('調査の位置を直せなかったので、地点を置けませんでした。'
      + '端末の空き容量をご確認ください', 9000);
    return null;
  }
  spotRefresh();
  return u;
}

   地点の印と重なって紛らわしいので、地図には別の印を描かない（2026-08-21） */
function surveyDrawPos(){}
/* 登録した地点（緑の丸）と、過去の調査地点（薄い青）を出す */
function surveyDrawSites(){
  const map = MAPS.main.map; if(!map) return;
  SVSITES.forEach(x=>{ try{ map.removeLayer(x); }catch(e){} });
  SVSITES = [];
  const river = strVal('#f_river');
  DB.sites(river).forEach(si=>{
    if(numOf(si.latitude)==='' || numOf(si.longitude)==='') return;
    const r = numOf(si.radius_m) || 100;
    const at = [+si.latitude, +si.longitude];
    const popup = `<b>${esc(si.name)}</b><br>`
      + `<a href="#" onclick="useSite('${si.uuid}');return false;">この地点にする</a>`;
    // 実際の広さの丸。川全体を映すと数ピクセルになって見えない
    const c = L.circle(at, {radius:r, color:'#3fb950', weight:2, fillOpacity:.10}).addTo(map);
    c.bindPopup(popup);
    // どの縮尺でも見える目印。これが無いと、飛んだ先で地点が見つからない
    const m = L.marker(at, {icon:dotIcon('#3fb950',14)}).addTo(map);
    m.bindPopup(popup);
    const label = L.marker(at, {icon: L.divIcon({className:'', iconSize:[120,16],
      iconAnchor:[-10,8],
      html:`<div style="color:#3fb950;font-size:11px;font-weight:700;
        text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap">${esc(si.name)}</div>`})}).addTo(map);
    SVSITES.push(c, m, label);
  });
  SVSITES = SVSITES.concat(drawPastSites(map, river));
}
/* 河川名が変わったら、地図をその川へ */
function surveyRiverChanged(){
  siteCheck();          // 河川が変わったら、そぐわない登録地点は外す
  draftTouch();
  const name = strVal('#f_river');
  // 画面ごと作り直すと、せっかく合わせた地図が元に戻ってしまう。
  // 地点の並びだけを入れ替える
  const box = $('#f_siteList');
  if(box) box.innerHTML = sitePickHtml(name, window._siteUuid || '');
  surveyDrawSites();
  const map = MAPS.main.map;
  if(map && name) fitRiver(map, name, '#f_mapMsg');
}
/* 登録した地点を使う */
/* 登録した地点を選ぶ。
   することは「地図をそこへ移す」だけ。
   隠れている地点名・緯度経度を書き換えると、そのあとに置いた
   最初の調査地点の位置が代表点にならず、書き出しの座標が
   実際に置いた場所と食い違う（監査40回目 Major） */
/* 選んでいる登録地点が、いまの河川のものでなければ外す。
   残すと、別の河川の地点IDと地点名を持った調査になる（監査48回目 Major） */
function siteCheck(){
  const uu = window._siteUuid; if(!uu) return;
  const si = DB.getAlive(DB.key.si, uu);
  const river = strVal('#f_river');
  if(si && (!river || si.river_name === river)) return;
  // 外すのは「どの登録地点を選んだか」だけ。
  // 地点名の欄は、選んでも外しても触らない（監査51・52・57回目）
  window._siteUuid = '';
  const msg=$('#f_siteMsg');
  if(msg) msg.textContent = '河川を変えたので、選んでいた登録地点を外しました。';
}
function useSite(uu){
  const si = DB.getAlive(DB.key.si, uu); if(!si) return;
  window._siteUuid = uu;
  // 地点名の欄は、もう画面に出していない（地点ごとの地点情報へ移した）。
  // ここで入れると、いままでの地点名を黙って別の名前に変えてしまう
  //（監査57回目 Major）。緯度経度も入れない（監査40回目 Major）。
  // ここでするのは、河川名をそろえて地図をその場所へ動かすことだけ
  applyVals({'#f_river': si.river_name});
  const msg=$('#f_siteMsg');
  if(msg) msg.textContent = `地図を「${si.name}」の場所へ移しました。`
    + '位置も地点名も、地図をタップして置いた調査地点から決まります。';
  const map = MAPS.main.map;
  if(map) try{ map.setView([+si.latitude, +si.longitude], 15); }catch(e){}
  draftTouch();
}
function pickSurveySite(btn, uu){
  pickSeg(btn);
  useSite(uu);
}

function onSurveyDate(){
  const s = seasonOf(strVal('#f_date'));
  const wrap = $('#f_season_wrap');
  if(wrap && s) wrap.innerHTML = segHtml('season', OPT.season, s, true);
  const info = $('#f_daysInfo');

    info.textContent = days.length>1
      ? `${days.length}日にわたる調査です。箇所（地点）ごとに日付を選べます。`
        + `データベースには日ごとに分かれて入ります。`
      : '';
  }
  draftTouch();      // 入れ直した季節も控える
}
function saveSurvey(svUuid){
  // ▼地点情報に打ちかけがあれば、先に書く。書けなければ「保存しました」と出さない
  if(!spotInfoSave()) return;
  const rec = svUuid ? (DB.get(DB.key.sv, svUuid)||{uuid:svUuid}) : {uuid:uuid(), status:'未開始'};
  const f = collectSurvey();
  // 一般と詳細では、箇所（地点）の意味も見せ方もCSVも変わる。
  // 作ったあとに切り替えると、既存の箇所の意味が黙って変わる（2026-08-17 の監査 Major）
  if(svUuid && f.survey_kind && surveyKind(rec)!==(f.survey_kind==='物理環境'?'物理環境':'魚')
     && DB.stationsOf(svUuid).length){
    toast(`すでに${DB.stationsOf(svUuid).length}件つくってあるので、調べるものは変えられません。`
      + '変えるには、新しい調査を作ってください', 8000);
    return;
  }
  if(svUuid && rec.detail_level && f.detail_level && rec.detail_level!==f.detail_level
     && DB.stationsOf(svUuid).length){
    toast(`すでに${DB.stationsOf(svUuid).length}件つくってあるので、記録のしかたは変えられません。`
      + '変えるには、新しい調査を作ってください', 8000);
    return;
  }
  rec.survey_date        = f.survey_date;
  rec.survey_date_end    = f.survey_date_end;
  if(rec.survey_date_end && rec.survey_date_end < rec.survey_date){
    toast('終わりの日が、はじめの日より前になっています'); return;
  }
  if(surveyDays(rec).length > SURVEY_MAX_DAYS){
    toast(`期間が長すぎます（${SURVEY_MAX_DAYS}日まで）。調査を分けてください`, 6000);
    return;
  }
  // 期間を縮めたとき、期間の外になる箇所が無いか見る。
  // 黙って直すと、いつ取ったかが変わってしまう
  if(svUuid){
    const days = surveyDays(rec);
    const out = DB.stationsOf(svUuid).filter(st=>{
      const d = String(st.survey_date||'').slice(0,10);
      return d && days.indexOf(d)<0;
    });
    if(out.length){
      toast(`期間の外になる箇所があります：${out.map(x=>x.name).join('・')}。`
        + '先にその箇所の日付を直してください', 8000);
      return;
    }
  }
  const rerr = rangeCheck([['緯度', f.latitude, 20, 50], ['経度', f.longitude, 120, 155],
    ['調査距離（手入力）', f.survey_length_m_manual, 0, 1000000],
    ['調査面積（手入力）', f.survey_area_m2_manual, 0, 100000000]]);
  if(rerr){ toast(rerr, 6000); return; }
  rec.season             = f.season;
  rec.river_name         = f.river_name;
  // 地点名の欄は、もう画面に出していない（地点ごとの地点情報へ移した）。
  // すでにある調査では、いままでの値をそのまま残す（監査57回目 Major）。
  // 新しく作るときだけ、選んだ登録地点の名前を写す
  if(!svUuid){
    const siN = f.site_uuid ? DB.getAlive(DB.key.si, f.site_uuid) : null;
    rec.site_name = (siN && siN.name) || f.site_name || '';
  }
  // 天気・区間名・河川形態A・調査区分・メモは、地点ごとに入れる形にしたので
  // 調査の設定から欄を外した。取れないときは、いまの値をそのまま残す（2026-08-21）
  if(f.weather !== undefined)            rec.weather            = f.weather;
  if(f.section_name !== undefined)       rec.section_name       = f.section_name;
  if(f.river_morphology_a !== undefined) rec.river_morphology_a = f.river_morphology_a;
  if(f.memo !== undefined)               rec.memo               = f.memo;
  rec.latitude           = numOf(f.latitude);
  rec.longitude          = numOf(f.longitude);
  if(window._posSource){ rec.position_source = window._posSource; rec.gps_accuracy = window._posAcc; }
  rec.project_number     = f.project_number;
  rec.project_name       = f.project_name;
  rec.investigator       = f.investigator;
  rec.survey_round       = f.survey_round;
  rec.survey_type_default= f.survey_type_default || rec.survey_type_default || '採取';
  // 「何を調べますか」と「記録のしかた」は、調査の設定から欄を外した（2026-08-21）。
  // 地点ごとに魚類調査と物理環境調査のどちらへも入れるようになったため。
  // 画面から取れないときは、いまの値をそのまま残す。
  // ここで既定へ倒すと、前に作った「物理環境の調査」や「詳細」が黙って作り替わる
  rec.detail_level       = f.detail_level || rec.detail_level || '一般';
  rec.survey_kind        = f.survey_kind
    ? (f.survey_kind === '物理環境' ? '物理環境' : '魚')
    : (rec.survey_kind || '魚');
  // 「環境の取り方」の欄は無くした（2026-08-23）。
  // 前の版の調査に入っている値は、保存しても書き替えない
  if(f.env_method_default) rec.env_method_default = f.env_method_default;
  else if(!svUuid) rec.env_method_default = '点';
  // 物理環境の調査に「詳細」は無い。詳細は魚を点ごとに記録するための形。
  // ただし画面から取れないときは触らない。触ると、前に作った「詳細」の調査が
  // 開いて保存しただけで一般に変わってしまう（監査34回目 Critical）
  if(rec.survey_kind === '物理環境' && (f.detail_level || !svUuid)) rec.detail_level = '一般';
  // 登録地点は、この画面にある項目。空なら消す。
  // 残すと「新しい河川＋前の河川の地点ID」という食い違いになる（監査49回目 Major）
  const si2 = f.site_uuid ? DB.getAlive(DB.key.si, f.site_uuid) : null;
  if(si2 && (!rec.river_name || si2.river_name === rec.river_name)){
    rec.site_uuid = f.site_uuid;
  }else{
    delete rec.site_uuid;
  }
  if(!rec.river_name && !rec.site_name){ toast('河川名か地点名のどちらかは入れてください'); return; }
  const ok = DB.upsert(DB.key.sv, rec);
  if(!ok) return;                       // 保存できていないので画面も動かさない
  window._posSource=null; window._posAcc=null; window._siteUuid='';
  prefSet('project_number', rec.project_number);
  prefSet('project_name', rec.project_name);
  prefSet('investigator', rec.investigator);
  prefSet('survey_round', rec.survey_round);
  draftClear('survey:'+(svUuid||'new'));
  draftUnbind();
  if(svUuid){ toast('保存しました'); goBack(); return; }
  // つくったあとも、この画面にとどまる。地図で調査地点を置くのはここ（PPT1枚目）。
  // 戻るで調査ハブへ行けるように、道すじを組んでから置き換える
  toast('調査をつくりました。地図をタップして、調査地点を置いてください', 7000);
  STACK = buildChain('survey', rec.uuid).concat([{name:'surveyEdit', arg:rec.uuid}]);
  render();
}
function deleteSurvey(u){
  if(!confirm('この調査を削除します。よろしいですか？（ごみ箱に入ります）')) return;
  if(DB.softDelete(DB.key.sv, u)){ toast('削除しました'); reset('home'); }

/* ---------- 調査ハブ ---------- */
/* 物理環境の調査は、地図が主役の画面に差し替える。
   箇所のフォームと「川の環境」を通らずに、地図の上で点と線を足していく */
/* その調査を、地図から開くか。
   一度でも「地図で記録する」を使った調査だけ、つぎからは地図で開く。
   前からある調査を勝手に変えない（2026-08-19） */
function fishMapEntry(sv){
  // 地点を置いた調査では、地図へ直行しない。
  // 直行させると、そこで作った単位が地点に紐づかず、
  // 地点別の集計・書き出しから外れた別系統の記録が増える（監査40回目 Major）
  if(sv && spotList(sv.uuid).some(x=>x.is_spot)) return false;
  return !!(sv && !isEnvSurvey(sv) && sv.entry === 'map');
}
function fishUseMap(svUuid, on){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return false;
  sv.entry = on ? 'map' : 'list';
  if(!DB.upsert(DB.key.sv, sv)){
    toast('切り替えられませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  return true;
}
SCREENS.survey = (svUuid)=>{
  const sv0 = DB.getAlive(DB.key.sv, svUuid);
  // 地点を置いてある調査は、種類にかかわらず調査ハブ（地点の並び）へ。
  // 地点が無い前の版の物理環境の調査だけ、これまでどおり地図へ直行する
  if(isEnvSurvey(sv0) && !spotList(svUuid).length
     && !isMesh({env_method: sv0.env_method_default})){
    return SCREENS.envMap(svUuid);
  }
  if(fishMapEntry(sv0)) return SCREENS.fishMap(svUuid);
  return SCREENS.surveyHub(svUuid);
};
SCREENS.surveyHub = (svUuid)=>{
  const sv = DB.getAlive(DB.key.sv, svUuid);
  if(!sv) return null;
  const 単位あり = DB.stationsOf(svUuid).some(x=>unitKindOf(x));
  // 一覧に並べるのは地点だけ。物理環境の測点や、地図の単位（E・P/F・P）は
  // それぞれの地図の画面で見る（混ぜると、測点を置くたびに箇所が増えて見える）
  // 地点を置いてある調査は、種類にかかわらず地点の並びで開く。
  // 前に作った物理環境の調査でも、地点 → 魚類／物理環境 の道を使えるように
  //（監査36回目 Major）
  const 地点たち = spotList(svUuid);
  const 前のやり方 = oldStations(svUuid);
  const 地点あり = 地点たち.some(x=>x.is_spot);
  const stations = 地点たち.length ? 地点たち
    : (isEnvSurvey(sv) ? DB.stationsOf(svUuid) : 地点たち);
  // 「記録中」は、いま現場にいるときだけの言い方。
  // あとから書き起こしているときに「記録中」と出ると、何かが動いている誤解になる。
  // 詳細（点を打つ形）では、点に「途中」という状態が無いので使わない
  const running  = (isLiveNow(sv) && !isDetail(sv))
    ? stations.find(s=>!s.ended_at) : null;
  const W = stWord(sv);
  const svLen = surveyLengths(sv), svArea = surveyAreas(sv);
  const svSec = effortStations(DB.stationsOf(svUuid))
    .reduce((a,st)=>a+spotEffort(st), 0);
  const nSp = new Set(DB.catchesOfSurvey(svUuid).map(c=>c.species_id).filter(Boolean)).size;
  // 「何を調べますか」は設定から消した。前に作った調査の種類で入口を閉じるのは、
  // 地点も魚の単位も無い、前の版のままの調査だけにする（監査39回目 Major）
  const envOnly = isEnvSurvey(sv) && !地点あり && !単位あり;
  const stCards = stations.map(st=>{
    const n = stationTotal(st);
    const sp = DB.catchesOf(st.uuid).length;
    return `<div class="card tap" onclick="nav('${st.is_spot?'spot':'station'}','${st.uuid}')">
      <div class="row">
        <div class="grow">
          <div style="font-weight:700">${esc(st.name)}　<span class="dim small">${esc(st.habitat_type||'区分なし')}</span></div>
          <div class="dim small">${surveyIsMultiDay(sv)
            ? esc(String(stationDate(st, sv)).slice(5))+'　' : ''}${st.survey_time_start
            ? esc(st.survey_time_start)+'〜'+esc(st.survey_time_end||'')
            : '<span class="pill ng">時刻なし</span>'}　${sp}種 ${n}尾${
            effortSeconds(st)>0 ? '　通電'+esc(fmtDur(effortSeconds(st))) : ''}${
            isDetail(sv) ? (numOf(st.latitude)!=='' ? '　±'+fmtNum(numOf(st.gps_accuracy),0)+'m'
                                                    : '　<span class="pill ng">位置なし</span>') : ''}${
            (st.photos||[]).length ? '　写真'+(st.photos||[]).length+'枚' : ''}</div>
        </div>
        ${(isLiveNow(sv) && !isDetail(sv) && !st.ended_at)
          ? '<span class="pill ok">記録中</span>' : ''}
      </div></div>`;
  }).join('');
  return {
    title: `${sv.river_name||''} ${sv.site_name||''}`.trim() || '調査',
    sub:[{text:surveyPeriodText(sv)}, {text:sv.status||'未開始', cls: sv.status==='調査中'?'ok':''},
         envOnly ? {text:'物理環境'} : {text:`${nSp}種 ${surveyTotal(sv)}尾`}],
    html:`
      ${地点あり ? `<button class="btn pri"
        onclick="nav('surveyEdit','${svUuid}')">地図で地点を置く（調査の設定へ）</button>`
        : (running
          ? `<button class="btn pri" onclick="nav('station','${running.uuid}')">記録中の ${esc(running.name)} を開く</button>`
          : `<button class="btn pri" onclick="newStation('${svUuid}')">${W}を追加する</button>`)}
      ${地点あり || envOnly ? '' : `<button class="btn"
        onclick="nav('surveyEdit','${svUuid}')">地図で地点を置く（調査の設定へ）</button>`}
      ${地点あり || envOnly ? '' : `<button class="btn ${単位あり?'ok':''}"
        onclick="if(fishUseMap('${svUuid}', true)) nav('fishMap','${svUuid}')"
        >地図で記録する${単位あり ? '（つづきから）' : '（調査範囲・瀬淵・ポイント）'}</button>`}
      ${地点あり && 単位あり && DB.stationsOf(svUuid).some(x=>unitKindOf(x) && !x.spot_uuid)
        ? `<button class="btn"
            onclick="nav('fishMap',{survey:'${svUuid}',loose:1})"
            >地点に属さない以前の記録を見る（魚の地図）</button>` : ''}
      ${地点あり && DB.stationsOf(svUuid).some(x=>!x.spot_uuid && !x.is_spot
          && !isMesh(x) && stationKind(sv, x)==='物理環境')
        ? `<button class="btn"
            onclick="nav('envMap',{survey:'${svUuid}',loose:1})"
            >地点に属さない以前の記録を見る（物理環境の地図）</button>` : ''}

      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="dim small">いま現場にいるとき</div>
            <div>${sv.status!=='調査中'
              ? '「はじめる」を押すと、時刻が自動で入り、道すじを記録します'
              : ((()=>{ const t = trackTarget();
                  return t && t.sv.uuid === svUuid
                    ? `GPSで歩いた道すじを ${esc(t.st.name||'')} に記録しています`
                    : '道すじの行き先が決まらないので、いまは記録していません。'
                      + '記録したい単位で「通電」をはじめてください'; })())}</div>
          </div>
          ${sv.status==='調査中'
            ? `<button class="btn" style="width:auto;margin:0" onclick="endSurvey('${svUuid}')">終える</button>`
            : `<button class="btn ok" style="width:auto;margin:0" onclick="startSurvey('${svUuid}')">はじめる</button>`}
        </div>
        <div class="dim small">押さなくても記録はできます。
          あとから書き起こすときは、そのまま「${W}を追加する」へどうぞ。</div>
      </div>

      ${isDetail(sv) ? '' : `<div class="card">
        <div class="row">
          <div class="grow"><div class="dim small">調べた距離（合計）</div>
            <div>${esc(fmtDist(svLen.used))}</div></div>
          <div class="grow"><div class="dim small">調べた面積（合計）</div>
            <div>${svArea.used===''||!svArea.used?'—':esc(fmtNum(svArea.used,1))+' m²'}</div></div>
          <div class="grow"><div class="dim small">通電（合計）</div>
            <div>${esc(fmtDur(svSec))}</div></div>
        </div>
        <div class="dim small">箇所ごとの「使う値」を足したものです。</div>
      </div>`}

      <h3>${地点あり ? '地点' : (isDetail(sv) ? '地点（打った点）' : '箇所（瀬淵ごと）')}</h3>
      ${stations.length ? stCards : `<div class="card dim">まだ${W}がありません。</div>`}

      ${前のやり方.length ? foldHtml('oldst', '前のやり方で作った記録',

function startSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; sv.started_at = sv.started_at || nowISO();
  if(DB.upsert(DB.key.sv, sv)){ startGps(); render(); }
}
function endSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  // 通電を押しっぱなしのまま終えると、そのあとも秒数が増え続けて
  // 単位努力量あたりの尾数が狂う（2026-08-17 の監査 Major）
  const running = DB.stationsOf(u).filter(effortRunning);
  for(const st of running){
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
    if(!DB.upsert(DB.key.st, st)){
      toast(`${st.name} の通電を止められませんでした。調査を終えていません`, 8000);
      return;                    // 半端な状態で終えない
    }
  }
  if(running.length) toast(`${running.length}件の通電を止めました`);
  sv.status='終了'; sv.finished_at = nowISO();
  if(DB.upsert(DB.key.sv, sv)){ stopGps(); toast('調査を終えました'); render(); }
}
function reopenSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; delete sv.finished_at;
  if(DB.upsert(DB.key.sv, sv)){ render(); }
}

   「調査中」は、GPSで道すじを記録するかどうかの合図にすぎない */
function newStation(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  nav('stationEdit', {survey:svUuid});
}

/* 始点・終点の見せ方。押さえていなければ、そう言う */
function lineFixText(st, which){
  const pt = linePt(st, which);
  if(!pt) return '<span class="pill ng">まだ押さえていません</span>';
  const acc = numOf(st['line_'+which+'_acc']);
  return esc(pt[0].toFixed(6)+', '+pt[1].toFixed(6))
    + (acc==='' ? '' : ' <span class="dim small">±'+Math.round(acc)+'m</span>');
}
/* いまいる場所を、区間の始点／終点として押さえる */
function grabLinePt(which){
  const key = which==='start' ? 'ls' : 'le';
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので押さえていません。`
        + '空の見えるところでお試しください', 8000);
      return;
    }
    applyVals({['#s_'+key+'_lat']: f.lat.toFixed(6),
               ['#s_'+key+'_lon']: f.lon.toFixed(6),
               ['#s_'+key+'_acc']: String(Math.round(f.acc))});
    const box = $(which==='start' ? '#s_lineStart' : '#s_lineEnd');
    if(box) box.innerHTML = esc(f.lat.toFixed(6)+', '+f.lon.toFixed(6))
      + ' <span class="dim small">±'+Math.round(f.acc)+'m</span>';
    showLineDist();
    draftTouch();
    toast((which==='start'?'始点':'終点')+'を押さえました');
  });
}
/* いま押さえてある始点・終点から、区間の長さを出して見せる */
function showLineDist(){
  const box = $('#s_lineDist'); if(!box) return;
  const tmp = {
    line_start_lat: numVal('#s_ls_lat'), line_start_lon: numVal('#s_ls_lon'),
    line_end_lat: numVal('#s_le_lat'), line_end_lon: numVal('#s_le_lon'),
  };
  const d = lineDist(tmp);
  box.textContent = d==='' ? '始点と終点の両方を押さえると、区間の長さが出ます。'
                           : `始点から終点まで ${fmtDist(d)}`;

/* 取り方を変えたら、出す欄を入れ替える */

  const mesh = $('#s_meshCard');

function grabStationPos(){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    applyVals({'#s_lat': f.lat.toFixed(6), '#s_lon': f.lon.toFixed(6)});
    const el=$('#stPos');
    if(el) el.textContent = `決め方：GPS（±${Math.round(f.acc)}m）`;
    window._stPosSource='GPS'; window._stPosAcc=Math.round(f.acc);

function nowInto(sel){

function saveStation(svUuid, stUuid, opt){
  const isNew = !stUuid;
  const sv = DB.getAlive(DB.key.sv, svUuid);
  const noNew = isNew ? nextStationNo(svUuid) : null;
  if(isNew && noNew===null){ toast('番号が大きすぎて、これ以上作れません', 7000); return; }
  // 画面を開いてから保存するまでに、ほかで記録が増えていることがある。
  // 出した番号と食い違ったまま保存すると、名前と番号がずれる
  const noShown = isNew ? countOf(strVal('#s_no')) : null;
  const 名前がずれる = isNew && noShown!==null && noShown!=='' && noShown!==noNew;
  const rec = isNew
    ? {uuid:uuid(), survey_uuid:svUuid, station_no: noNew,
       started_at:nowISO(), env_points:[]}
    : (DB.get(DB.key.st, stUuid)||{uuid:stUuid, survey_uuid:svUuid});
  const f = collectStation();
  const 既定名 = (n)=>(isDetail(sv)?'P.':'St.')+n;
  // 名前を打っていない、または出した番号のままの既定名なら、新しい番号に直す
  rec.name = (f.name && !(名前がずれる && f.name===既定名(noShown)))
    ? f.name : 既定名(rec.station_no||1);
  if(名前がずれる){
    toast(`ほかで記録が増えたため、番号を ${noShown} から ${noNew} に直しました`, 7000);
  }
  rec.survey_time_start = f.survey_time_start;
  rec.survey_time_end   = f.survey_time_end;
  if(surveyIsMultiDay(sv)){
    // 何日かにわたる調査では、その箇所がどの日か覚えておく
    rec.survey_date = f.survey_date || stationDate(rec, sv);
  }
  // いま現場にいる調査で、開始の時刻が空のままなら、いまの時刻を入れる。
  // 調査日が今日でないときは入れない（あとから書き起こしている最中なので、
  // 今の時刻を入れると実際の調査時刻と食い違う）
  if(isNew && !rec.survey_time_start && isLiveNow(sv)) rec.survey_time_start = timeValue();
  // 地点（目印）に「環境の取り方」を書くと、物理環境の記録として扱われ、
  // 地点の並びからも地図からも消える。子の記録だけが残って手が届かなくなる
  //（監査40回目 Critical）。地点では、この画面から環境まわりを書き戻さない
  // 地点（目印）と、魚の単位（E・P/F・P）には環境の取り方を書き戻さない。
  // 書くと、同じ記録が魚の単位でありながら物理環境の記録にもなり、
  // 書き出しで二重に扱われる（監査41回目 Major）
  if(!rec.is_spot && !unitKindOf(rec)){
  rec.env_method        = (f.env_method==='ライン' || f.env_method==='メッシュ')
                            ? f.env_method : '点';
  if(rec.env_method==='ライン'){
    rec.line_direction  = f.line_direction || '上流→下流';
    rec.line_start_lat  = numOf(f.line_start_lat);
    rec.line_start_lon  = numOf(f.line_start_lon);
    rec.line_start_acc  = numOf(f.line_start_acc);
    rec.line_end_lat    = numOf(f.line_end_lat);
    rec.line_end_lon    = numOf(f.line_end_lon);
    rec.line_end_acc    = numOf(f.line_end_acc);
    rec.flow_rate       = numOf(f.flow_rate);
  }
  }
  // 地点（目印）には、川の環境の値も書き戻さない。
  // 書けてしまうと、地図で入れた記録と二重になる（監査42回目 Major）
  if(!rec.is_spot) rec.habitat_type = f.habitat_type;
  // 地点では、調査区分・調査方法の欄も出していない。
  // 出していない欄を書き戻さない（監査49回目 Critical）
  if(!rec.is_spot){
    rec.survey_type     = f.survey_type || '採取';
    rec.survey_method   = f.survey_method;
  }
  const serr = rangeCheck([['水温', f.water_temp, -5, 45],
    ['代表の水深', f.depth_rep_cm, 0, 2000], ['代表の流速', f.velocity_rep_cms, 0, 1000],
    ['緯度', f.latitude, 20, 50], ['経度', f.longitude, 120, 155],
    ['流量', f.flow_rate, 0, 100000],
    ['始点の緯度', f.line_start_lat, 20, 50], ['始点の経度', f.line_start_lon, 120, 155],
    ['終点の緯度', f.line_end_lat, 20, 50], ['終点の経度', f.line_end_lon, 120, 155]]);
  if(serr){ toast(serr, 6000); return; }
  if(!rec.is_spot){
    rec.water_temp      = numOf(f.water_temp);
    rec.substrate1      = f.substrate1;
    rec.gravel_condition= f.gravel_condition;
  }
  // 地点には水深・流速も入れない。入ると、地図で入れた測点と二重系統になる
  //（監査43回目 Major）
  // 地点のメモは「地点情報」の欄だけで直す。2か所から書けると、
  // 古い打ちかけが新しいメモを上書きする（監査44回目 Major）
  if(!rec.is_spot) rec.memo = f.memo;
  // 地点には新しく写真を付けない。ただし前の版で付いた写真は、
  // 画面に出している間だけ、消したり並べ替えたりできる（監査50回目 Major）
  if(!rec.is_spot || (rec.photos||[]).length){
    rec.photos = (SCREENS._photos||[]).slice();
  }
  // 地点（目印）では、この先をまるごと通さない。
  // 緯度経度の欄を画面から消したのに書き戻していたため、
  // 「この地点の設定」を保存するだけで地点の位置が消え、
  // 勝手に終わった扱いにもなっていた（監査44回目 Critical）
  if(isDetail(sv) && !rec.is_spot){
    // 点は打った時点で1つの記録。区間のように「はじめて終える」ものではない
    rec.ended_at = rec.ended_at || nowISO();
    // 時刻の幅を持たないので、終わりは始まりと同じにする。
    // 空のままだと、取り込み側が別々の点を1つの箇所にまとめてしまう
    if(rec.survey_time_start && !rec.survey_time_end) rec.survey_time_end = rec.survey_time_start;
    rec.latitude         = numOf(f.latitude);
    rec.longitude        = numOf(f.longitude);
    rec.depth_rep_cm     = numOf(f.depth_rep_cm);
    rec.velocity_rep_cms = numOf(f.velocity_rep_cms);
    if(window._stPosSource){
      rec.position_source = window._stPosSource;
      rec.gps_accuracy    = window._stPosAcc;
    }
    // 新しい地点で、まだ位置が無ければ、いま立っている場所を入れる
    if(isNew && rec.latitude==='' && isLiveNow(sv)){
      const fix = freshFix(20000);
      if(fix && fix.acc<=GPS_MAX_ACC){
        rec.latitude = +fix.lat.toFixed(6);
        rec.longitude = +fix.lon.toFixed(6);
        rec.gps_accuracy = Math.round(fix.acc);
        rec.position_source = 'GPS';
      }
    }
  }
  const ok = DB.upsert(DB.key.st, rec);
  // 一時値は、保存できてから消す。先に消すと、保存に失敗して
  // やり直したときに位置の決め方と精度が落ちる（監査70回目 Minor）
  if(ok){ window._stPosSource=null; window._stPosAcc=null; }
  if(ok) photoOwnerDone(rec.photos);       // 付いたので、印は外す
  if(!ok) return;                       // 保存できていないので書きかけを消さない
  draftClear('station:'+(stUuid || ('new:'+svUuid)));
  draftUnbind();
  toast(isNew ? (stWord(sv)+'をはじめました') : '保存しました');
  // 保存したあとで別の画面へ行きたいことがある（格子を決めるなど）
  if(opt && opt.then){ goTo(opt.then, rec.uuid); return; }
  if(isNew) goTo('station', rec.uuid); else goBack();
}
function deleteStation(u){
  // 地点は、この道からは消さない。子の記録が取り残される（監査56回目 Critical）
  const st0 = DB.liveStation(u);
  if(st0 && st0.is_spot){ spotRemove(u); return; }
  const st = DB.get(DB.key.st, u);
  const W = stWordOf(st);
  // メッシュは「採捕記録」ではなく「入力済みのマス」を数えて知らせる
  //（2026-08-24 の実機の声：間違えて作った範囲を消す仕組み）
  let 文;
  if(st && isMesh(st)){
    const n = meshCellsOf(u).length;
    文 = `この${W}を削除します。`
      + (n>0 ? `入力済みのマス${n}件も一緒に見えなくなります。` : '')
      + 'ごみ箱から戻せます。よろしいですか？';
  }else{
    const n = DB.catchesOf(u).length;
    文 = `この${W}を削除します。${n>0?`記録${n}件も一緒に見えなくなります。`:''}よろしいですか？`;
  }
  if(!confirm(文)) return;
  // 印を付けるのは箇所1つだけ。中の記録は「親が消えている」ことで隠れる。
  // 何件も書き込むと、途中で失敗したときに迷子の記録が残る
  if(!DB.softDelete(DB.key.st, u)) return;
  draftClearFor('箇所', u);      // 書きかけが写真を抱えたままにならないように
  toast('削除しました');
  goTo('survey', st ? st.survey_uuid : null);
}

          el.textContent = fmtDur(effortSeconds(now));

      }
    }
  };
