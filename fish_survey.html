/* ============================================================
   写真の保存（IndexedDB）
   写真そのものは localStorage に入らないので IndexedDB に置き、
   記録側には「どの写真か」を示す小さな情報だけを持たせる。
   置き場の名前は魚アプリ専用にする（同じ場所に鳥・産卵床のアプリが並ぶため）
   ============================================================ */
const MEDIA_DB_NAME='fish_survey_media', MEDIA_DB_VER=1, MEDIA_STORE='photo';
let _mediaDB=null;
function openMediaDB(){
  if(_mediaDB) return Promise.resolve(_mediaDB);
  return new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('この端末では写真を保存できません')); return; }
    let q; try{ q=indexedDB.open(MEDIA_DB_NAME, MEDIA_DB_VER); }catch(e){ rej(e); return; }
    q.onupgradeneeded=()=>{ const db=q.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE,{keyPath:'id'}); };
    q.onsuccess=()=>{ _mediaDB=q.result; res(_mediaDB); };
    q.onerror=()=>rej(q.error);
  });
}
// 書き込みは tx.oncomplete まで待つ。ここで待たないと「保存したのに無い」が起きる
function idbRun(db, mode, fn){
  // トランザクションを作るところは Promise の外に出す。
  // 中に入れると、つながりが切れていても「作り損ね」が外へ伝わらず、
  // 開き直しが動かないまま写真の読み書きが止まる（2026-08-18 の9回目の監査 Critical）
  const tx=db.transaction(MEDIA_STORE, mode);
  return new Promise((res,rej)=>{
    let out;
    const r=fn(tx.objectStore(MEDIA_STORE));
    if(r && r.onsuccess!==undefined) r.onsuccess=()=>{ out=r.result; };
    tx.oncomplete=()=>res(out);
    tx.onerror=()=>rej(tx.error);
    tx.onabort=()=>rej(tx.error);
  });
}
function idbDo(mode, fn){
  // すでに開いているなら、待たずにその場で始める。
  // 一度でも待つと、確かめてから実際に消すまでの間に、ほかの用事が割り込む
  // （2026-08-18 の8回目の監査 Critical）
  if(_mediaDB){
    try{ return idbRun(_mediaDB, mode, fn); }
    catch(e){
      // つながりが切れていた。畳んでから開き直し、もう一度だけ試す
      try{ _mediaDB.close(); }catch(e2){}
      _mediaDB = null;
    }
  }
  return openMediaDB().then(db=>idbRun(db, mode, fn));
}
const PhotoDB = {
  put(rec){ return idbDo('readwrite', st=>st.put(rec)); },
  get(id){ return idbDo('readonly', st=>st.get(id)); },
  del(id){ return idbDo('readwrite', st=>st.delete(id)); },
  allIds(){ return idbDo('readonly', st=>st.getAllKeys()); },
  all(){ return idbDo('readonly', st=>st.getAll()); },
  /* どこからも使われていない写真を片付ける。
     「まだ保存していない写真」（いま開いている画面の分と、書きかけの分）も
     使っている数に入れる。入れないと、保存を押す前に消える。

     片付けは時間がかかるので、その間に新しい写真が入ってくる。
     一覧を取った時点の判断で消すと、間に入った写真を巻き添えにする
     （2026-08-17 の監査 Critical）。そこで
       ・取り込み中の写真（PHOTO_PENDING）は触らない
       ・入れたばかりの写真（PHOTO_GRACE_MS 以内）は触らない
       ・1枚消すごとに、使用権と参照を取り直す
     の3つで守る */
  async gc(){
    if(!ownsLock()) return 0;        // 見ているだけのタブでは消さない
    let refs = photoRefs();
    if(!refs) return 0;              // 1つでも読めなければ何もしない（消しすぎ防止）
    let recs; try{ recs = await this.all(); }catch(e){ return 0; }
    // まだ記録に付いていないが、付ける先が生きている写真は残す。
    // 空き容量が尽きた場面では、ここだけが手がかりになる
    let owners; try{ owners = livePhotoOwners(); }catch(e){ return 0; }
    if(!owners) return 0;
    // 記録に付いている写真のID（書きかけや画面の分は入れない）。
    // 付いているのに印が残っていたら、ここで外す
    let saved; try{ saved = savedPhotoIds(); }catch(e){ return 0; }
    const cut = Date.now() - PHOTO_GRACE_MS;
    let n=0;
    for(const r of recs){
      if(!r || !r.id) continue;
      if(refs.has(r.id) || PHOTO_PENDING.has(r.id)){
        // 記録に付いたのに印が残っている＝外し損ね。ここで後始末する。
        // 残したままだと、あとで写真を外しても実体が消えない
        // （2026-08-18 の5回目の監査 Major）
        if(r.owner && saved.has(r.id)) photoOwnerDone([{id:r.id}]);
        continue;
      }
      if(photoOwnerLiveIn(owners, r)) continue;      // 付ける先が待っている
      const at = Date.parse(r.added_at||'');
      if(isFinite(at) && at > cut) continue;   // 入れたばかりのものは残す
      // 対象を取り直してから、最後の確認をひととおり行う。
      // 確かめたあとに待つと、その待っている間の変化を見落とす
      // （2026-08-18 の6回目の監査 Critical）
      let cur=null; try{ cur = await this.get(r.id); }catch(e){ continue; }
      if(!cur) continue;                              // すでに無い
      if(!ownsLock()) return n;                // 途中で使用権を渡していたら止める
      const now = photoRefs();                 // 消す直前に、もう一度確かめる
      if(!now) return n;
      if(now.has(r.id) || PHOTO_PENDING.has(r.id)) continue;
      let own2; try{ own2 = livePhotoOwners(); }catch(e){ return n; }
      if(!own2) return n;
      if(photoOwnerLiveIn(own2, cur)) continue;      // 付ける先が待っている
      const at2 = Date.parse(cur.added_at||'');
      if(isFinite(at2) && at2 > cut) continue;        // 入れ直されたばかり
      // 確かめている間に使用権が移ることがある。消す直前に、もう一度だけ見る
      // （2026-08-18 の7回目の監査 Critical）
      if(!ownsLock()) return n;
      try{ await this.del(r.id); n++; }catch(e){}
    }
    return n;
  },
};
/* 保存された記録から指されている写真のID。書きかけや画面の分は入れない。

function livePhotoOwners(){

/* その写真の付け先が、いまも生きているか。
     ・もう記録になっている分（record）＝その記録が生きているときだけ。
       調査が生きているからと守り続けると、消した記録の写真が永久に残る
       （2026-08-18 の11回目の監査 Major）
     ・まだ画面だけの分（draft）＝その調査が生きているあいだは守る */
function photoOwnerMode(r, sets){
  if(r && r.owner_mode) return r.owner_mode;
  // 古い写真には印が無い。いま記録として在るなら record、無ければ鍵の形で見分ける
  if(sets && r && sets.rec.has(r.owner)) return 'record';
  return (r && String(r.owner||'').indexOf(':')>=0) ? 'draft' : 'record';
}
function photoOwnerLiveIn(sets, r){
  if(!sets || !r || !r.owner) return false;
  if(sets.rec.has(r.owner)) return true;
  if(photoOwnerMode(r, sets) !== 'draft') return false;
  return !!(r.owner_sv && sets.sv.has(r.owner_sv));
}
function photoOwnerAlive(u, svu){
  if(!u) return false;
  try{
    return photoOwnerLiveIn(livePhotoOwners(),
      {owner:u, owner_sv:svu, owner_mode:PHOTO_OWNER_INFO.mode||''});
  }catch(e){ return false; }
}
/* 記録に付いた写真からは、付け先の印を外す。
   外さないと、あとで写真を外しても実体が残り続ける */
function photoOwnerDone(list){
  // 見ているだけのタブでは、印を外さない。
  // 外すと、記録を入れているタブがまだ保存していない写真の守りを解いてしまう
  // （2026-08-18 の11回目の監査 Critical）
  if(!ownsLock()) return Promise.resolve(false);
  return Promise.all((list||[]).map(pp=>{
    if(!pp || !pp.id) return Promise.resolve(true);
    // 写真を入れる口（PhotoDB.put）は通さない。
    // 通すと「何枚入れたか」を数えている所で、印外しまで数えてしまう
    return Promise.resolve().then(()=>PhotoDB.get(pp.id)).then(r=>{
      if(!r || !r.owner) return true;
      delete r.owner;
      return idbDo('readwrite', st=>st.put(r)).then(()=>true);
    }).catch(()=>false);
  })).then(a=>a.every(Boolean));
}
/* 記録に付けられなかった写真を、画面に戻す。
   空き容量が尽きたときは記録にも書きかけにも残らないので、
   写真そのものに付けた印だけが手がかりになる */
async function photoRestorePending(stUuid){
  if(!stUuid) return 0;
  const gen = screenGen();
  // いま取り込んでいる最中の写真には触らない。
  // 触ると、取り込み側が「画面が変わったから片付ける」と決めた写真を
  // こちらが拾い上げてしまい、中身の無い写真が画面に残る
  const 取り込み中 = new Set(PHOTO_PENDING);
  let recs=null; try{ recs = await PhotoDB.all(); }catch(e){ return 0; }
  if(!recs || screenStale(gen) || PHOTO_OWNER !== stUuid) return 0;
  // 待っている間に、別のタブへ使用権が移っていることがある。
  // そのまま書くと、記録を入れているタブの書きかけを上書きしてしまう
  // （2026-08-18 の5回目の監査 Critical）
  if(!ownsLock() || !photoOwnerAlive(stUuid, PHOTO_OWNER_SV)) return 0;
  const now = new Set((SCREENS._photos||[]).map(pp=>pp && pp.id));
  // すでにどこかの記録に付いている分は、印の外し損ね。戻さずに後始末する
  let saved; try{ saved = savedPhotoIds(); }catch(e){ return 0; }
  const stale = recs.filter(r=>r && r.id && r.owner===stUuid && saved.has(r.id));
  if(stale.length) photoOwnerDone(stale.map(r=>({id:r.id})));
  const add = recs.filter(r=>r && r.id && r.blob && r.owner===stUuid
      && !now.has(r.id) && !saved.has(r.id) && !PHOTO_REMOVED.has(r.id)
      && !取り込み中.has(r.id) && !PHOTO_PENDING.has(r.id))
    .sort((a,b)=>String(a.added_at||'').localeCompare(String(b.added_at||'')))
    .map(r=>({id:r.id, ext:r.ext||'', size:r.size||0}));
  if(!add.length) return 0;
  SCREENS._photos = (SCREENS._photos||[]).concat(add);
  draftTouch();
  renderPhotoPanel();
  toast(`保存できていなかった写真 ${add.length}枚を戻しました。`
    + (ENV_FORM ? '「写真をもう一度保存」を押してください'
                : '「保存する」を押してください'), 9000);
  return add.length;
}
/* いま取り込んでいる最中の写真。片付けの対象から外す */
const PHOTO_PENDING = new Set();
/* 入れたばかりの写真は片付けない。取り込みと片付けが重なっても巻き添えにしない */
const PHOTO_GRACE_MS = 30*60*1000;
/* いま使われている写真のID。1つでも読めなければ null を返す（消しすぎ防止） */
/* ここでは「消した記録」も数える（deleted_at で外さない）。
   外すと、ごみ箱から戻したときに写真だけ無い記録ができる。
   片付けの最中に記録が戻ってくる筋があっても、写真そのものは
   ここで守られているので失われない（2026-08-18 の9回目の監査への回答） */
function photoRefs(){
  try{
    const refs = new Set();
    // 写真を持ちうる入れ物を数え漏らすと、その写真が消える。
    // 個別に並べず、保存している入れ物を全部見る
    Object.keys(DB.key).forEach(kk=>{
      DB.loadRaw(DB.key[kk]).forEach(x=>photoIdsOf(x).forEach(id=>refs.add(id)));
    });
    draftAllPhotoIds().forEach(id=>refs.add(id));
    (SCREENS._photos||[]).forEach(pp=>pp && pp.id && refs.add(pp.id));
    return refs;
  }catch(e){ return null; }
}
function photoIdsOf(rec){
  return ((rec && rec.photos) || []).map(pp=>pp && pp.id).filter(Boolean);
}
/* 書きかけに控えてある写真のID。保存を押す前に消えないようにするため */
function draftAllPhotoIds(){
  const out = [];
  const all = draftAll();
  Object.keys(all).forEach(k=>photoIdsOf(all[k]).forEach(id=>out.push(id)));
  return out;
}

// 現場写真はそのままだと1枚数MBあり端末を圧迫するので、長辺1600pxのJPEGに縮める
const PHOTO_MAX_PX = 1600;
async function shrinkImage(file){
  if(!/^image\//.test(file.type||'')) return file;
  try{
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, PHOTO_MAX_PX/Math.max(bmp.width, bmp.height));
    if(scale>=1 && file.size < 1.5*1024*1024){ if(bmp.close) bmp.close(); return file; }
    const w=Math.max(1,Math.round(bmp.width*scale)), h=Math.max(1,Math.round(bmp.height*scale));
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return (blob && blob.size < file.size) ? blob : file;
  }catch(e){ return file; }   // 変換できない端末では元のまま保存する
}
/* 実際の中身に合った拡張子を付ける。中身がPNGなのに .jpg だと開けないソフトがある。
   縮小できなかった形式（GIF・BMPなど）を一律に .jpg と名づけると、
   書き出したZIPの中身と名前が食い違う（2026-08-17 の監査 Major） */
const PHOTO_EXT = [['jpeg','jpg'], ['jpg','jpg'], ['png','png'], ['webp','webp'],
  ['heic','heic'], ['heif','heic'], ['avif','avif'], ['gif','gif'],
  ['bmp','bmp'], ['tiff','tif'], ['svg','svg']];
function blobExt(blob){
  const t=((blob&&blob.type)||'').toLowerCase();
  for(const [key, ext] of PHOTO_EXT){ if(t.indexOf(key)>=0) return ext; }
  return '';
}
/* 受け取ってよいファイルか。分からない形式は入れない
   （名前と中身が食い違うくらいなら、その場で断るほうがよい） */
function fileExt(f){
  if(!f || !/^image\//.test(f.type||'')) return '';
  return blobExt(f);
}

/* ---------- 写真パネル（魚の記録・箇所・メモで共用） ----------
   SCREENS._photos = いま開いている記録の写真の並び */
function photoPanelHtml(label, auto){
  return `<div class="card">
    <h3 style="margin-top:0">写真<span class="dim small" id="photoCount"></span></h3>
    <div class="dim small">${esc(label||'')}</div>
    <input type="file" id="fPhotoIn" accept="image/*" capture="environment" multiple
      style="display:none" onchange="pickPhotos(this)">
    <button class="btn" onclick="document.getElementById('fPhotoIn').click()">
      写真を撮る／端末から選ぶ</button>
    <div class="mediagrid" id="photoGrid"></div>
    <button class="btn ng" id="photoRetry" style="display:none"
      onclick="photoRetrySave()">写真をもう一度保存</button>
    <div class="dim small">${auto
      ? '入れたそばから、この記録に付きます。'
      : '保存を押すまで、この記録には結びつきません。'}</div>
  </div>`;
}
async function pickPhotos(input){
  const files = Array.from(input.files||[]);
  input.value='';
  if(!files.length) return;
  if(!writeAllowed()){
    toast('このタブでは写真を追加できません。記録を入れているタブでお試しください', 6000);
    return;
  }
  const gen = screenGen();          // 取り込み中に別の記録へ移ったら、そちらには足さない
  toast('写真を取り込んでいます…');
  let ok=0, ng=0, lost=false, notSaved=0;
  const badType=[];
  const addedIds=[];
  const startForm = (typeof ENV_FORM!=='undefined') ? ENV_FORM : '';
  for(const f of files){
    const ext = fileExt(f);
    if(!ext){ badType.push(f.name||'(名前なし)'); ng++; continue; }
    const id = uuid();
    PHOTO_PENDING.add(id);           // 入れ終わるまで、片付けの対象にしない
    try{
      const blob = await shrinkImage(f);
      const useExt = blobExt(blob) || ext;
      // 縮めている間に画面が変わったり、別のタブへ使用権を渡していることがある。
      // 待つたびに確かめないと、書いてはいけないタブが書きかけを上書きする
      // （2026-08-17 の再監査 Critical）
      if(screenStale(gen) || !ownsLock()){ if(!ownsLock()) lost=true; continue; }
      // 「どの記録のために撮ったか」を写真そのものに持たせる。
      // 端末の空きが尽きると、記録にも書きかけにも控えられない。
      // そのとき手がかりが何も残らないと、画面を移った時点で写真が失われる
      // （2026-08-18 の4回目の監査 Critical）
      await PhotoDB.put({ id, blob, ext:useExt, size:blob.size, added_at:nowISO(),
        owner: PHOTO_OWNER||'', owner_sv: PHOTO_OWNER_SV||'',
        owner_mode: PHOTO_OWNER_INFO.mode||'', owner_kind: PHOTO_OWNER_INFO.kind||'',
        owner_st: PHOTO_OWNER_INFO.station||'', owner_sp: PHOTO_OWNER_INFO.species||'',
        owner_st_name: photoOwnerNameNow()||'',
        owner_sp_name: PHOTO_OWNER_INFO.sp_name||'' });
      if(screenStale(gen) || !ownsLock()){
        // 入れたが行き場がない。ここで片付ける（後の掃除任せにしない）
        if(!ownsLock()) lost=true;
        try{ await PhotoDB.del(id); }catch(e){}
        continue;
      }
      SCREENS._photos = (SCREENS._photos||[]).concat([{ id, ext:useExt, size:blob.size }]);
      // 1枚ごとに控える。全部終えてからだと、2枚目の変換中に画面が変わったとき
      // 1枚目まで消える（2026-08-17 の監査 Critical）
      draftTouch();
      // 物理環境の画面では、1枚ごとに、待たずにその記録へ保存する。
      // 待つ形だと、撮った直後に画面を閉じたとき記録に付かない。
      // 入ったかどうかは、全部終えてから記録を読んで確かめる
      // （途中の1枚が失敗しても、次の1枚の保存で一緒に入ることがあるため）
      addedIds.push(id);
      if(ENV_FORM){ try{ envSavePhotosNow(); }catch(e){} }
      ok++;
    }catch(e){
      ng++;
      // 入れたあとで転んだ場合に備えて片付ける。無ければ何も起きない
      try{ await PhotoDB.del(id); }catch(e2){}
    }
    finally{ PHOTO_PENDING.delete(id); }
  }
  if(screenStale(gen)) return;
  // 記録を読み直して、入っていない写真があれば、もう一度だけ試す。
  // 読み直しは、使用権を失っていても必ずする。
  // 省くと、途中で権利を失ったとき「追加しました」と嘘を伝えてしまう
  // （2026-08-18 の3回目の監査 Major）
  if(startForm && ENV_FORM === startForm && addedIds.length){
    const 入っているか = ()=>{
      const st = DB.liveStation(startForm);
      const set = new Set(photoIdsOf(st));
      return addedIds.filter(x=>!set.has(x));
    };
    let 残り = 入っているか();
    // やり直すのは、いまも自分が書いてよいときだけ
    if(残り.length && ownsLock()){
      try{ envSavePhotosNow(); }catch(e){}
      残り = 入っているか();
    }
    notSaved = 残り.length;
    ok = addedIds.length - notSaved;
  }
  renderPhotoPanel();      // ここで、やり直しの口も数え直される
  if(notSaved){
    // 保存できていないのに「追加しました」と言わない。
    // 言ってしまうと、閉じたあとで写真が消えていても気づけない。
    // 「選び直して」とは言わない。選び直すと同じ写真が二重に入る
    // （2026-08-18 の3回目の監査 Major）
    toast(`写真 ${notSaved}枚を記録に保存できませんでした。`
      + (lost
        ? '別のタブで記録が開かれたためです。そちらのタブでお試しください'
        : '写真は画面に残っています。選び直さずに、'
          + '「写真をもう一度保存」を押してください'
          + '（端末の空き容量もご確認ください）')
      + (ok ? `（${ok}枚は保存できています）` : ''), 12000);
  }else if(lost){
    toast((ok ? `写真 ${ok}枚を追加しました。残りは、` : '')
      + '別のタブで記録が開かれたため追加できませんでした。'
      + 'そちらのタブでお試しください', 9000);
  }else if(badType.length){
    toast(`次のファイルは扱えない形式でした：${badType.slice(0,3).join('・')}`
      + (badType.length>3?`ほか${badType.length-3}件`:''), 9000);
  }else if(ng){
    toast(`写真 ${ok}枚を追加しました。${ng}枚は保存できませんでした`
      + '（端末の空き容量をご確認ください）', 8000);
  }else{
    toast(ok+'枚を追加しました');
  }
}
/* 写真そのものはここでは消さない。保存せずに戻った場合に、記録が
   「無い写真」を指してしまうため。実体は使われなくなった時点で gc() が片付ける */
async function delPhoto(id){
  // 見ているだけのタブでは外せない。
  // 外せてしまうと、共有している書きかけから写真が消える
  // （2026-08-18 の11回目の監査 Critical）
  if(!writeAllowed()){
    toast('このタブでは写真を外せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  // 物理環境の画面は入れたそばから保存されるので、案内を分ける
  const auto = (typeof ENV_FORM!=='undefined') && ENV_FORM;
  if(!confirm(auto ? 'この写真を外しますか？'
                   : 'この写真を外しますか？（保存を押すと反映されます）')) return;
  // 外したことを、その場で控える。印を外し終えるまでの間に画面を開き直しても、
  // 外したはずの写真を戻さないため（2026-08-18 の9回目の監査 Major）
  PHOTO_REMOVED.add(id);
  const 元 = (SCREENS._photos||[]).slice();
  SCREENS._photos = (SCREENS._photos||[]).filter(pp=>pp.id!==id);
  draftTouch();
  if(!ENV_FORM){
    // 物理環境でない画面は、ここで保存はしない（保存を押したときに入る）。
    // ただし印は外す。残すと、開き直したときに外した写真が戻ってくる
    // （2026-08-18 の10回目の監査 Major）
    renderPhotoPanel();
    let 済んだ = false;
    try{ 済んだ = await photoOwnerDone([{id}]); }catch(e){}
    if(済んだ) PHOTO_REMOVED.delete(id);
    else toast('外した写真の後始末が終わりませんでした。'
      + 'アプリを開き直すと、その写真が戻ってくることがあります', 9000);
    return;
  }
  if(ENV_FORM){
    let 外せた = false;
    try{ 外せた = envSavePhotosNow(); }catch(e){}
    if(!外せた){
      SCREENS._photos = 元;        // 消えたように見せない
      draftTouch();
      PHOTO_REMOVED.delete(id);
      toast('外せませんでした。端末の空き容量をご確認ください', 8000);
      renderPhotoPanel();
      return;
    }
    // 外した写真の印も外す。残すと、開き直したときに戻ってきてしまい、
    // 片付けの対象からも永久に外れる（2026-08-18 の6回目の監査 Major）
    renderPhotoPanel();            // 見た目は待たせない
    let 済んだ = false;
    try{ 済んだ = await photoOwnerDone([{id}]); }catch(e){}
    if(済んだ) PHOTO_REMOVED.delete(id);
    else toast('外した写真の後始末が終わりませんでした。'
      + 'アプリを開き直すと、その写真が戻ってくることがあります', 9000);
    return;
  }
  renderPhotoPanel();
}
/* 写真の見え方の後片付け。
   まだ読み込み中のうちに手放すと、画面に「読めません」の跡が残る。
   画面から消えるのを待ってから手放す（既定は3秒後） */
function revokePhotoUrls(now){
  const list = SCREENS._photoUrls||[];
  SCREENS._photoUrls=[];
  if(!list.length) return;
  const go = ()=>list.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
  if(now) go(); else setTimeout(go, 3000);
}
/* 写真の並びを描いた回数。同じ画面で描き直しが重なったとき、
   遅れて終わったほうが古い並びを出してしまうのを防ぐ
   （2026-08-17 の再監査 Critical） */
let PHOTO_RENDER_SEQ = 0;
/* 保存できなかった写真を、選び直さずにもう一度保存する。
   選び直すと同じ写真が別の名前で入り、次に保存できたとき二重になる
   （2026-08-18 の3回目の監査 Major） */
function photoRetrySave(){
  if(!ENV_FORM){ toast('この画面では使えません'); return; }
  if(!writeAllowed()){
    toast('このタブでは保存できません。記録を入れているタブでお試しください', 7000);
    return;
  }
  try{ envSavePhotosNow(); }catch(e){}
  const set = new Set(photoIdsOf(DB.liveStation(ENV_FORM)));
  const 残り = (SCREENS._photos||[]).filter(pp=>pp && pp.id && !set.has(pp.id));
  photoShowRetry(残り.length);
  toast(残り.length
    ? `まだ ${残り.length}枚が保存できていません。端末の空き容量をご確認ください`
    : '写真を保存しました', 残り.length ? 9000 : 3000);
}
/* いま画面にある写真のうち、記録に入っていない数を数え直して出し入れする。
   数を持ち回すと、あとから保存できた分だけ口が出しっぱなしになる */
function photoRefreshRetry(){
  if(!ENV_FORM){ photoShowRetry(0); return; }
  const set = new Set(photoIdsOf(DB.liveStation(ENV_FORM)));
  photoShowRetry((SCREENS._photos||[]).filter(pp=>pp && pp.id && !set.has(pp.id)).length);
}
/* 「写真をもう一度保存」を出す／しまう */
function photoShowRetry(n){
  const b = $('#photoRetry'); if(!b) return;
  b.style.display = n ? '' : 'none';
  b.textContent = n ? `写真 ${n}枚をもう一度保存` : '写真をもう一度保存';
}
async function renderPhotoPanel(){
  // 口の出し入れは、そのつど数え直す。
  // 取り込んだ枚数だけで決めると、前に入らなかった分が置き去りになる
  // （2026-08-18 の4回目の監査 Major）
  photoRefreshRetry();
  const gen = screenGen();
  const my = ++PHOTO_RENDER_SEQ;
  const box=$('#photoGrid'); if(!box) return;
  const list = SCREENS._photos||[];
  const cnt = $('#photoCount');
  if(cnt) cnt.textContent = list.length ? `　${list.length}枚` : '';
  if(!list.length){
    if(!screenStale(gen) && my===PHOTO_RENDER_SEQ){ revokePhotoUrls(); box.innerHTML=''; }
    return;
  }
  const parts=[];
  // 自分が作った参照だけを手元に持つ。まとめ置き場に入れてしまうと、
  // 読んでいる間に画面が変わったとき、次の画面の写真まで消してしまう
  const mine=[];
  for(const pp of list){
    let rec=null; try{ rec=await PhotoDB.get(pp.id); }catch(e){}
    if(!rec||!rec.blob) continue;
    const url=URL.createObjectURL(rec.blob);
    mine.push(url);
    parts.push(`<div class="mediathumb"><img src="${url}" alt="写真"
        onclick="viewPhoto('${pp.id}')">
      <button class="mediadel" onclick="delPhoto('${pp.id}')" title="外す">&times;</button></div>`);
  }
  // 読んでいる間に画面が変わったり、もっと新しい描き直しが始まっていたら、
  // 自分が作った参照だけを捨てて何も出さない
  if(screenStale(gen) || my!==PHOTO_RENDER_SEQ){
    mine.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch(e){} });
    return;
  }
  revokePhotoUrls();        // ここまで出ていた分を手放す（画面から消えた後で）
  SCREENS._photoUrls = mine;
  box.innerHTML = parts.join('');
}
/* 大きく見る。現場で写りを確かめられないと、撮り直しに気づけない。
   同じ画面で続けて2枚たたいたとき、先にたたいたほうの読み出しが遅れて終わると、
   あとからたたいた写真を閉じて古いほうを出してしまう。
   そこで「たたいた順番」を持ち、最後にたたいた分だけを出す
   （2026-08-17 の3回目の監査 Major） */
let PHOTO_VIEW = null, PHOTO_VIEW_SEQ = 0;
async function viewPhoto(id){
  const gen = screenGen();
  const my = ++PHOTO_VIEW_SEQ;
  let rec=null; try{ rec=await PhotoDB.get(id); }catch(e){}
  // 読んでいる間に別の記録へ移ったり、別の写真をたたいていたら出さない
  if(screenStale(gen) || my!==PHOTO_VIEW_SEQ) return;
  if(!rec||!rec.blob){ toast('写真が見つかりません'); return; }
  closePhotoView(true);          // いま出ているものだけ閉じる（順番は進めない）
  const url=URL.createObjectURL(rec.blob);
  const box=document.createElement('div');
  box.className='photoview';
  box.innerHTML=`<img src="${url}" alt="写真">
    <button class="btn" style="max-width:320px">閉じる</button>`;
  box.addEventListener('click', ()=>closePhotoView());
  PHOTO_VIEW = {box, url};
  document.body.appendChild(box);
}
/* keepSeq を付けないときは順番を進める。
   読み出しを待っている分があれば、それも出さないようにするため */
function closePhotoView(keepSeq){
  if(keepSeq!==true) PHOTO_VIEW_SEQ++;
  if(!PHOTO_VIEW) return;
  const {box, url} = PHOTO_VIEW;
  PHOTO_VIEW = null;
  try{ box.remove(); }catch(e){}
  try{ URL.revokeObjectURL(url); }catch(e){}
}
/* いま開いている記録の写真を用意する。書きかけがあればそちらを使う */
function photosBegin(rec, draft, opt){
  const d = draft && Array.isArray(draft.photos) ? draft.photos : null;
  SCREENS._photos = (d || (rec && rec.photos) || []).slice();
  // これから撮る写真の「付ける先」。
  // まだ記録になっていない画面（新規）でも、書きかけの鍵を付ける先にする。
  // 空のままだと、端末の空きが尽きたときに手がかりが何も残らない
  // （2026-08-18 の10回目の監査 Critical）
  PHOTO_OWNER = (rec && rec.uuid) || (opt && opt.key) || '';
  PHOTO_OWNER_SV = (opt && opt.survey) || (rec && rec.survey_uuid) || '';
  const stName = (opt && opt.station)
    ? ((DB.get(DB.key.st, opt.station)||{}).name || '') : '';
  const spName = (opt && opt.species)
    ? ((speciesById(opt.species)||{}).ja || '') : '';
  PHOTO_OWNER_INFO = {

    // 撮ったときの呼び名も控える。あとで箇所を消したり魚種を変えても、
    // 書き出しで「どの写真か」が分かるようにするため
    // （2026-08-18 の12回目の監査 Major）
    st_name: stName, sp_name: spName,
    // まだ記録になっていない箇所は、画面に打った名前が頼り。
    // 開いた時点では空なので、撮るときに読み直す
    // （2026-08-18 の13回目の監査 Major）
    nameSel: (opt && opt.nameSel) || '',
  };
  renderPhotoPanel();
  // 前に付けられなかった写真があれば、画面に戻す
  if(PHOTO_OWNER && ownsLock()) photoRestorePending(PHOTO_OWNER);

function download(filename, text, mime){
  downloadBlob(filename, new Blob([text], {type: mime||'text/plain;charset=utf-8'}));
}
function downloadBlob(filename, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
function csvCell(v){
  v = v==null ? '' : String(v);
  // Excelの数式として読まれるのを防ぐ。数値（マイナスの緯度経度など）はそのまま通す
  if(/^[=+\-@\t\r]/.test(v) && !/^[+-]?\d+(\.\d+)?$/.test(v)) v = "'"+v;
  return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function toCsv(cols, rows){
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>csvCell(r[c])).join(','))).join('\r\n');
}
/* 緯度経度は全部の行で同じ文字列にする。
   桁がばらつくと、取り込み側が別々の調査として分けてしまう */
function fixCoord(v){ const n=numOf(v); return n==='' ? '' : n.toFixed(6); }
/* 内部は cm・cm/s で持ち、書き出す瞬間に m・m/s に直す */
function cmToM(v){ const n=numOf(v); return n==='' ? '' : (n/100); }

/* 取り込み側が「同じ箇所」とみなす手がかり。
   この12項目の文字が全部同じだと、別々の箇所が1つにまとめられてしまう。
   魚類データベース app/pages/4_資料管理.py の _HABITAT_KEY と同じ並び */
const FS_HABITAT_KEY = ['環境区分','河川形態B','水温','水深','流速','流量',
  '河床材料','礫の状況','調査区分','調査方法','開始時刻','終了時刻'];
/* 取り込み側が「同じ調査」とみなす手がかり。
   魚類データベース app/pages/4_資料管理.py の _EVENT_KEY と同じ並び */
const FS_EVENT_KEY = ['業務番号','業務名','河川名','地点名','区間名',
  '調査日','季節','天気','緯度','経度','河川形態A'];

/* データベース取り込み用の行を組み立てる。
   1行 = 1種の結果。落とすものは黙って落とさず、理由と件数を返す */
/* 書き出しのための控えを取る。
   ここは「読めない」を「空」と取り違えてはいけない場所なので、
   壊れていたら例外にする読み方（loadRaw）を使う。
   表示用の読み方だと、体長の記録が壊れていたとき尾数を少なく出してしまう
   （2026-08-16 の監査 Critical） */
function exportSnapshot(){
  const box = {};
  [['st', DB.key.st, '箇所'], ['ca', DB.key.ca, '魚の記録'],
   ['ind', DB.key.ind, '1尾ずつの記録'],
   ['mc', DB.key.mc, 'メッシュのマス']].forEach(([k, key, label])=>{
    try{ box[k] = DB.loadRaw(key).filter(x=>x && !x.deleted_at); }
    catch(e){ throw new Error(label + 'を読み取れません。書き出しを中止しました'); }
  });
  // 1尾ずつの記録は、記録ごとにまとめておく。
  // 毎回すべてを見に行くと、記録が増えたときに時間がかかりすぎる
  box.byCatch = {};
  box.ind.forEach(i=>{
    const k = i.catch_uuid;
    if(!k) return;
    (box.byCatch[k] || (box.byCatch[k]=[])).push(i);
  });
  return box;
}

function buildDbRows(sv){
  const rows=[], excluded=[], blocked=[], warnings=[];

  let snap;
  try{ snap = exportSnapshot(); }
  catch(e){
    // 読めないものがある。空として出すと記録を取りこぼすので、何も作らずに止める
    return {rows:[], excluded:[], warnings:[], blocked:[e.message]};
  }

  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid)
    .sort((a,b)=>(a.station_no||0)-(b.station_no||0));
  const lat = fixCoord(sv.latitude), lon = fixCoord(sv.longitude);
  if(lat==='' || lon===''){
    blocked.push('調査の位置（緯度経度）が入っていません');
  }
  stations.forEach(st=>{
    // 開始・終了時刻が空だと、取り込み側が別々の箇所を1つにまとめてしまう
    if(!st.survey_time_start){
      blocked.push(`${st.name||'箇所'}：開始時刻が入っていません`);
    }
    snap.ca.filter(c=>c.station_uuid===st.uuid)
      .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')))
      .forEach(c=>{
      const name = c.species_name || '(種名なし)';
      const bad = badCount(c, snap);
      if(bad){ blocked.push(`${name}：${bad}`); return; }
      const n = catchTotal(c, snap);
      if(!c.species_id){ excluded.push(`${name}（種IDがありません）`); return; }
      if(n<=0){ excluded.push(`${name}（尾数が0です）`); return; }
      rows.push(dbRowOf(sv, st, c, snap));
    });
  });
  // 別々の箇所が1つにまとめられてしまう組み合わせを探す。
  // 実際に書き出す文字で見る（画面の値ではなく、CSVに載る形で比べる）。
  // 調査そのものが分かれていれば（日付や地点名が違えば）まとまらないので、
  // 調査の手がかりも一緒に見る
  const seen = {};
  stations.forEach(st=>{
    const src = dbRowOf(sv, st, null, snap);
    const k = FS_EVENT_KEY.concat(FS_HABITAT_KEY)
      .map(c=>String(src[c]==null?'':src[c])).join(String.fromCharCode(1));
    const hasFish = snap.ca.some(c=>c.station_uuid===st.uuid
      && c.species_id && catchTotal(c, snap)>0);
    if(seen[k]){
      const msg = `${seen[k].name} と ${st.name} は、取り込み側で1つの箇所にまとめられます`;
      // どちらにも魚が入っているなら、まとまると記録が混ざる。書き出しを止める
      if(hasFish && seen[k].hasFish){
        blocked.push(msg + '。日付・時刻・環境のどれかを変えてください');
      }else{
        warnings.push(msg);
      }
    }else{
      seen[k] = {name:st.name, hasFish};
    }
  });

  return {rows, excluded, blocked, warnings};
}
/* CSVの1行を組み立てる。c が null なら魚の欄は空のまま（箇所の鍵を調べるときに使う） */
function dbRowOf(sv, st, c, inds){
  const ls = c ? catchLengths(c, inds) : [];
  return {
    '緯度': fixCoord(sv.latitude), '経度': fixCoord(sv.longitude),
    // 何日かにわたる調査では、その箇所の日付を使う。
    // 取り込み側は調査日で調査を分けるので、日ごとに別の調査として入る
    '調査日': stationDate(st, sv), '季節':sv.season||'', '天気':sv.weather||'',
    '水温': numOf(st.water_temp),
    // 代表値は「手入力があればそれ、無ければ測点の平均」
    '水深': cmToM(stationDepth(st, inds).rep),
    '流速': cmToM(stationVelocity(st, inds).rep),
    '河川名':sv.river_name||'', '地点名':sv.site_name||'', '区間名':sv.section_name||'',
    '河川形態A':sv.river_morphology_a||'', '河川形態B':st.river_morphology_b||'',
    '河床材料':st.substrate1||'', '礫の状況':st.gravel_condition||'',
    '環境区分':st.habitat_type||'',
    '調査区分':st.survey_type||'', '調査方法':(st.survey_method||[]).join(','),
    '種ID': c ? (c.species_id||'') : '', '個体数': c ? catchTotal(c, inds) : '',
    '最大体長': ls.length ? Math.max.apply(null,ls) : '',
    '最小体長': ls.length ? Math.min.apply(null,ls) : '',
    '同定確度': c ? (c.identification_confidence||'') : '',
    'コピー数':'', '在不在':'',
    '流量': numOf(st.flow_rate),
    '開始時刻':st.survey_time_start||'', '終了時刻':st.survey_time_end||'',
    '備考': c ? (c.notes||'') : '',
    '業務番号':sv.project_number||'', '業務名':sv.project_name||'',
  };
}
/* 1尾ずつの記録（1行＝1尾） */
function buildIndRows(sv, snap){

function buildStationRows(sv, snap){

    const len = stationLengths(st), area = stationAreas(st);
    // メッシュのときは、マスから水深・流速をまとめる

    const n = cs.reduce((a,c)=>a+catchTotal(c, snap), 0);
    const cp = {
      per100s: effortSeconds(st)>0 ? n/effortSeconds(st)*100 : '',
      per100m2: (area.used!=='' && area.used>0) ? n/area.used*100 : '',
    };
    return {
      '調査日': stationDate(st, sv), '河川名':sv.river_name||'', '地点名':sv.site_name||'',

}

/* 調査ぜんぶ（1行） */
/* 調査CSVは、日ごとに1行にする。
   31列CSVは箇所の日付で調査が分かれるので、期間全体を1行にまとめると
   件数も日別の集計も食い違う（2026-08-17 の監査 Major） */
function buildSurveyRow(sv, snap){
  const all = snap.st.filter(x=>x.survey_uuid===sv.uuid);
  // 実際に箇所がある日だけ出す。箇所が1つも無ければ、はじめの日で1行
  const days = Array.from(new Set(all.map(st=>stationDate(st, sv)))).sort();
  const list = days.length ? days : [String(sv.survey_date||'').slice(0,10)];
  return list.map(day=>surveyRowOfDay(sv, snap, day, all));
}
function surveyRowOfDay(sv, snap, day, all){
  const stations = all.filter(st=>stationDate(st, sv)===day);
  const ids = new Set(stations.map(x=>x.uuid));
  const cs = snap.ca.filter(c=>ids.has(c.station_uuid));
  const n = cs.reduce((a,c)=>a+catchTotal(c, snap), 0);
  const measured = cs.reduce((a,c)=>a+indsOf(snap, c.uuid).length, 0);
  // 距離・面積はその日の箇所だけを足す
  const dayLen = stations.map(st=>stationLengths(st).used).filter(v=>v!=='' && isFinite(v));
  const dayArea = stations.map(st=>stationAreas(st).used).filter(v=>v!=='' && isFinite(v));
  const oneDay = surveyDays(sv).length <= 1;
  const len = oneDay ? surveyLengths(sv)
    : {auto: dayLen.length ? dayLen.reduce((a,b)=>a+b,0) : '', manual:'', used:''};
  const area = oneDay ? surveyAreas(sv)
    : {auto: dayArea.length ? dayArea.reduce((a,b)=>a+b,0) : '', manual:'', used:''};
  if(!oneDay){ len.used = len.auto; area.used = area.auto; }
  return {
    '調査日': day||'', '終了日':sv.survey_date_end||'',
    '日数': surveyDays(sv).length,
    '季節':sv.season||'', '天気':sv.weather||'',
    '河川名':sv.river_name||'', '地点名':sv.site_name||'', '区間名':sv.section_name||'',
    '河川形態A':sv.river_morphology_a||'',
    '調べたもの': surveyKind(sv), '記録のしかた':sv.detail_level||'一般',
    '環境の取り方': isEnvSurvey(sv) ? (sv.env_method_default||'点') : '',
    '緯度': fixCoord(sv.latitude), '経度': fixCoord(sv.longitude),
    'GPS精度m': numOf(sv.gps_accuracy), '位置の決め方':sv.position_source||'',
    '調査者':sv.investigator||'',
    '業務番号':sv.project_number||'', '業務名':sv.project_name||'',
    '箇所数': stations.length,
    '種数': speciesCount(cs, snap),
    '尾数': n, '測った尾数': measured,
    '通電秒数_合計': Math.round(stations.reduce((a,st)=>a+effortSeconds(st), 0)),
    '距離_合計m': round1(len.auto), '距離_手入力m': len.manual, '距離_使う値m': round1(len.used),
    '面積_合計m2': round1(area.auto), '面積_手入力m2': area.manual,
    '面積_使う値m2': round1(area.used),
    '開始': sv.started_at ? fmtTime(sv.started_at) : '',
    '終了': sv.finished_at ? fmtTime(sv.finished_at) : '',
    'メモ':sv.memo||'', '調査ID':sv.uuid,
  };
}
/* 数の範囲を見る。おかしいものがあれば、その説明を返す。無ければ空文字。
   負の距離や100%を超える割合が入ると、面積・CPUE・河床材の割合が
   静かに壊れる（2026-08-17 の監査 Major） */
function rangeCheck(list){
  for(const it of list){
    const label = it[0], v = it[1], lo = it[2], hi = it[3];
    if(v==='' || v===null || v===undefined) continue;
    const n = numOf(v);
    if(n==='' || !isFinite(n)) return `${label}は数で入れてください`;
    if(n < lo || n > hi) return `${label}は ${lo}〜${hi} の間で入れてください（いま ${n}）`;
  }
  return '';
}
/* 大きさを読みやすくする */
function fmtBytes(n){
  n = numOf(n); if(n==='' || !isFinite(n)) return '—';
  if(n >= 1024*1024*1024) return (n/1024/1024/1024).toFixed(1)+' GB';
  if(n >= 1024*1024) return Math.round(n/1024/1024)+' MB';
  if(n >= 1024) return Math.round(n/1024)+' KB';
  return n+' B';
}
function round1(v){
  const n = numOf(v);
  return n==='' || !isFinite(n) ? '' : Math.round(n*10)/10;
}

function exportFileBase(sv){
  const d=(sv.survey_date||dateValue()).replace(/-/g,'');
  const r=(sv.river_name||'調査').replace(/[\\/:*?"<>|\s]/g,'');
  return `魚類調査_${d}_${r}_${(sv.uuid||'').slice(0,8)}`;
}

  '河床材_岩盤%','河床材_コンクリート%',
  '備考','記録した時刻','調査ID','箇所ID','マスID','格子ID'];

function buildMeshRows(sv, snap){
  const stations = snap.st.filter(x=>x.survey_uuid===sv.uuid);
  const byId = {};
  stations.forEach(st=>{ byId[st.uuid] = st; });
  const out = [];
  (snap.mc||[]).forEach(c=>{
    const st = byId[c.station_uuid];
    if(!st) return;                       // 消した箇所のマスは出さない
    const pct = (c.substrate_pct && typeof c.substrate_pct==='object') ? c.substrate_pct : {};
    const row = {
      '調査日': stationDate(st, sv), '河川名':sv.river_name||'',
      '地点名':sv.site_name||'', '範囲':st.name||'',
      '行': countOf(c.row)===null ? '' : c.row+1,
      '列': countOf(c.col)===null ? '' : c.col+1,
      // 前の格子で入れたマスも残す。ただし、いまの格子の分と混ぜて集計されないよう印を付ける
      'いまの格子か': meshIsCurrent(st, c) ? 'はい' : 'いいえ（前の格子）',
      '緯度': fixCoord(c.latitude), '経度': fixCoord(c.longitude),
      '水深cm': numOf(c.depth_cm), '流速cms': numOf(c.velocity_cms),
      '河床材料': c.substrate||'', '環境区分': c.habitat_type||'',
      '礫の状況': c.gravel_condition||'', 'カバー': c.cover||'',
      '備考': c.note||'', '記録した時刻': c.measured_at ? fmtTime(c.measured_at) : '',
      '調査ID': sv.uuid, '箇所ID': st.uuid, 'マスID': c.uuid,
      '格子ID': c.grid_id || '',
    };
    OPT.substrate.forEach(k=>{ row['河床材_'+k+'%'] = numOf(pct[k]); });
    out.push(row);
  });
  return out.sort((a,b)=> String(a['範囲']).localeCompare(String(b['範囲']))
                       || (a['行']-b['行']) || (a['列']-b['列']));
}

      // 地図は、書きかけを戻したあとに組み立てる。
      // 先に作ると、戻した河川名や位置が地図に反映されない
      const river = strVal('#f_river');
      const la = numVal('#f_lat'), lo = numVal('#f_lon');
      const c = (la!=='' && lo!=='') ? [la, lo] : [43.06, 141.35];
      MAPS.main.map = makeMap('svmap', c, (la!=='') ? 14 : 8);
      const map = MAPS.main.map;
      if(map){
        applyBaseMap('main', baseMapName());
        addLocateControl(map);
        const box = $('#f_siteList');
        if(box) box.innerHTML = sitePickHtml(river, window._siteUuid || '');
        surveyDrawSites();
        if(la!=='') surveyDrawPos(c[0], c[1]);
        else if(river) fitRiver(map, river, '#f_mapMsg');
        map.on('click', e=>{
          applyVals({'#f_lat': e.latlng.lat.toFixed(6), '#f_lon': e.latlng.lng.toFixed(6)});
          surveyDrawPos(e.latlng.lat, e.latlng.lng);
          window._posSource = '地図'; window._posAcc = '';
          const el=$('#posInfo'); if(el) el.textContent = '決め方：地図';
          draftTouch();
        });
      }
    }
  };
};
/* 入力欄から値を集める。下書きの保存と、保存ボタンの両方で使う */
function collectSurvey(){
  return {
    survey_date: strVal('#f_date'), survey_date_end: strVal('#f_date2'),
    season: segVal('season'), weather: segVal('weather'),
    river_name: strVal('#f_river'), site_name: strVal('#f_site'),
    section_name: strVal('#f_section'), river_morphology_a: segVal('formA'),
    latitude: strVal('#f_lat'), longitude: strVal('#f_lon'),
    project_number: strVal('#f_pno'), project_name: strVal('#f_pname'),
    investigator: strVal('#f_inv'), survey_type_default: segVal('svtype'),
    detail_level: segVal('detail'),
    survey_kind: segVal('kind'), env_method_default: segVal('envm'),
    // 選ぶボタンは文字しか返さないので、選んだ地点のIDは別に覚えておく
    site_uuid: (window._siteUuid || ''),
    memo: strVal('#f_memo'),
  };
}
let SVMARK = null, SVSITES = [];
/* その河川に登録した地点の並び。河川名を変えたら、ここだけ入れ替える */
function sitePickHtml(river, chosen){
  const ss = DB.sites(river);
  if(!ss.length) return '<div class="dim small">この河川に登録した地点がありません。'
    + '下の「地点を登録する」から作れます。</div>';
  return `<div class="seg" data-seg="sitepick">` + ss.map(x=>
    `<button type="button" class="${x.uuid===chosen?'on':''}"
      onclick="pickSurveySite(this,'${x.uuid}')">${esc(x.name)}</button>`).join('') + `</div>`;
}
/* 調査の位置を地図に描く */
function surveyDrawPos(lat, lon){
  const map = MAPS.main.map; if(!map) return;
  if(SVMARK){ try{ map.removeLayer(SVMARK); }catch(e){} }
  SVMARK = L.marker([lat,lon], {icon:dotIcon('#f0883e',16)}).addTo(map);
}
/* 登録した地点（緑の丸）と、過去の調査地点（薄い青）を出す */
function surveyDrawSites(){
  const map = MAPS.main.map; if(!map) return;
  SVSITES.forEach(x=>{ try{ map.removeLayer(x); }catch(e){} });
  SVSITES = [];
  const river = strVal('#f_river');
  DB.sites(river).forEach(si=>{
    if(numOf(si.latitude)==='' || numOf(si.longitude)==='') return;
    const r = numOf(si.radius_m) || 100;
    const at = [+si.latitude, +si.longitude];
    const popup = `<b>${esc(si.name)}</b><br>`
      + `<a href="#" onclick="useSite('${si.uuid}');return false;">この地点にする</a>`;
    // 実際の広さの丸。川全体を映すと数ピクセルになって見えない
    const c = L.circle(at, {radius:r, color:'#3fb950', weight:2, fillOpacity:.10}).addTo(map);
    c.bindPopup(popup);
    // どの縮尺でも見える目印。これが無いと、飛んだ先で地点が見つからない
    const m = L.marker(at, {icon:dotIcon('#3fb950',14)}).addTo(map);
    m.bindPopup(popup);
    const label = L.marker(at, {icon: L.divIcon({className:'', iconSize:[120,16],
      iconAnchor:[-10,8],
      html:`<div style="color:#3fb950;font-size:11px;font-weight:700;
        text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap">${esc(si.name)}</div>`})}).addTo(map);
    SVSITES.push(c, m, label);
  });
  SVSITES = SVSITES.concat(drawPastSites(map, river));
}
/* 河川名が変わったら、地図をその川へ */
function surveyRiverChanged(){
  draftTouch();
  const name = strVal('#f_river');
  // 画面ごと作り直すと、せっかく合わせた地図が元に戻ってしまう。
  // 地点の並びだけを入れ替える
  const box = $('#f_siteList');
  if(box) box.innerHTML = sitePickHtml(name, window._siteUuid || '');
  surveyDrawSites();
  const map = MAPS.main.map;
  if(map && name) fitRiver(map, name, '#f_mapMsg');
}
/* 登録した地点を使う */
function useSite(uu){
  const si = DB.getAlive(DB.key.si, uu); if(!si) return;
  window._siteUuid = uu;
  applyVals({'#f_river': si.river_name, '#f_site': si.name,
             '#f_lat': fixCoord(si.latitude), '#f_lon': fixCoord(si.longitude)});
  window._posSource = '登録地点'; window._posAcc = '';
  const el=$('#posInfo'); if(el) el.textContent = '決め方：登録地点';
  const msg=$('#f_siteMsg'); if(msg) msg.textContent = `「${si.name}」の名前と位置を入れました。`;
  surveyDrawPos(+si.latitude, +si.longitude);
  const map = MAPS.main.map;
  if(map) try{ map.setView([+si.latitude, +si.longitude], 15); }catch(e){}

/* 「何を調べますか」で出す欄を入れ替える。

function grabPos(){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    const la=$('#f_lat'), lo=$('#f_lon');

function saveSurvey(svUuid){
  const rec = svUuid ? (DB.get(DB.key.sv, svUuid)||{uuid:svUuid}) : {uuid:uuid(), status:'未開始'};
  const f = collectSurvey();
  // 一般と詳細では、箇所（地点）の意味も見せ方もCSVも変わる。
  // 作ったあとに切り替えると、既存の箇所の意味が黙って変わる（2026-08-17 の監査 Major）
  if(svUuid && f.survey_kind && surveyKind(rec)!==(f.survey_kind==='物理環境'?'物理環境':'魚')
     && DB.stationsOf(svUuid).length){
    toast(`すでに${DB.stationsOf(svUuid).length}件つくってあるので、調べるものは変えられません。`
      + '変えるには、新しい調査を作ってください', 8000);
    return;
  }
  if(svUuid && rec.detail_level && f.detail_level && rec.detail_level!==f.detail_level
     && DB.stationsOf(svUuid).length){
    toast(`すでに${DB.stationsOf(svUuid).length}件つくってあるので、記録のしかたは変えられません。`
      + '変えるには、新しい調査を作ってください', 8000);
    return;
  }
  rec.survey_date        = f.survey_date;
  rec.survey_date_end    = f.survey_date_end;
  if(rec.survey_date_end && rec.survey_date_end < rec.survey_date){
    toast('終わりの日が、はじめの日より前になっています'); return;
  }
  if(surveyDays(rec).length > SURVEY_MAX_DAYS){
    toast(`期間が長すぎます（${SURVEY_MAX_DAYS}日まで）。調査を分けてください`, 6000);
    return;
  }
  // 期間を縮めたとき、期間の外になる箇所が無いか見る。
  // 黙って直すと、いつ取ったかが変わってしまう
  if(svUuid){
    const days = surveyDays(rec);
    const out = DB.stationsOf(svUuid).filter(st=>{
      const d = String(st.survey_date||'').slice(0,10);
      return d && days.indexOf(d)<0;
    });
    if(out.length){
      toast(`期間の外になる箇所があります：${out.map(x=>x.name).join('・')}。`
        + '先にその箇所の日付を直してください', 8000);
      return;
    }
  }
  const rerr = rangeCheck([['緯度', f.latitude, 20, 50], ['経度', f.longitude, 120, 155],
    ['調査距離（手入力）', f.survey_length_m_manual, 0, 1000000],
    ['調査面積（手入力）', f.survey_area_m2_manual, 0, 100000000]]);
  if(rerr){ toast(rerr, 6000); return; }
  rec.season             = f.season;
  rec.weather            = f.weather;
  rec.river_name         = f.river_name;
  rec.site_name          = f.site_name;
  rec.section_name       = f.section_name;
  rec.river_morphology_a = f.river_morphology_a;
  rec.latitude           = numOf(f.latitude);
  rec.longitude          = numOf(f.longitude);
  if(window._posSource){ rec.position_source = window._posSource; rec.gps_accuracy = window._posAcc; }
  rec.project_number     = f.project_number;
  rec.project_name       = f.project_name;
  rec.investigator       = f.investigator;
  rec.survey_type_default= f.survey_type_default || '採取';
  rec.detail_level       = f.detail_level || '一般';
  rec.survey_kind        = f.survey_kind === '物理環境' ? '物理環境' : '魚';
  rec.env_method_default = f.env_method_default || '点';
  // 物理環境の調査に「詳細」は無い。詳細は魚を点ごとに記録するための形
  if(rec.survey_kind === '物理環境') rec.detail_level = '一般';
  if(f.site_uuid) rec.site_uuid = f.site_uuid;
  rec.memo               = f.memo;
  if(!rec.river_name && !rec.site_name){ toast('河川名か地点名のどちらかは入れてください'); return; }
  const ok = DB.upsert(DB.key.sv, rec);
  if(!ok) return;                       // 保存できていないので画面も動かさない
  window._posSource=null; window._posAcc=null; window._siteUuid='';
  prefSet('project_number', rec.project_number);
  prefSet('project_name', rec.project_name);
  prefSet('investigator', rec.investigator);
  draftClear('survey:'+(svUuid||'new'));
  draftUnbind();
  toast('保存しました');
  if(svUuid) goBack(); else goTo('survey', rec.uuid);
}
function deleteSurvey(u){
  if(!confirm('この調査を削除します。よろしいですか？（ごみ箱に入ります）')) return;

}

/* ---------- 調査ハブ ---------- */
/* 物理環境の調査は、地図が主役の画面に差し替える。
   箇所のフォームと「川の環境」を通らずに、地図の上で点と線を足していく */
SCREENS.survey = (svUuid)=>{
  const sv0 = DB.getAlive(DB.key.sv, svUuid);
  if(isEnvSurvey(sv0) && !isMesh({env_method: sv0.env_method_default})){
    return SCREENS.envMap(svUuid);
  }
  return SCREENS.surveyHub(svUuid);
};
SCREENS.surveyHub = (svUuid)=>{
  const sv = DB.getAlive(DB.key.sv, svUuid);
  if(!sv) return null;
  const stations = DB.stationsOf(svUuid);
  // 「記録中」は、いま現場にいるときだけの言い方。
  // あとから書き起こしているときに「記録中」と出ると、何かが動いている誤解になる。
  // 詳細（点を打つ形）では、点に「途中」という状態が無いので使わない
  const running  = (isLiveNow(sv) && !isDetail(sv))
    ? stations.find(s=>!s.ended_at) : null;
  const W = stWord(sv);
  const svLen = surveyLengths(sv), svArea = surveyAreas(sv);
  const svSec = stations.reduce((a,st)=>a+effortSeconds(st), 0);
  const nSp = new Set(DB.catchesOfSurvey(svUuid).map(c=>c.species_id).filter(Boolean)).size;
  const envOnly = isEnvSurvey(sv);
  const stCards = stations.map(st=>{
    const n = stationTotal(st);
    const sp = DB.catchesOf(st.uuid).length;
    return `<div class="card tap" onclick="nav('station','${st.uuid}')">
      <div class="row">
        <div class="grow">
          <div style="font-weight:700">${esc(st.name)}　<span class="dim small">${esc(st.habitat_type||'区分なし')}</span></div>
          <div class="dim small">${surveyIsMultiDay(sv)
            ? esc(String(stationDate(st, sv)).slice(5))+'　' : ''}${st.survey_time_start
            ? esc(st.survey_time_start)+'〜'+esc(st.survey_time_end||'')
            : '<span class="pill ng">時刻なし</span>'}　${sp}種 ${n}尾${
            effortSeconds(st)>0 ? '　通電'+esc(fmtDur(effortSeconds(st))) : ''}${
            isDetail(sv) ? (numOf(st.latitude)!=='' ? '　±'+fmtNum(numOf(st.gps_accuracy),0)+'m'
                                                    : '　<span class="pill ng">位置なし</span>') : ''}${
            (st.photos||[]).length ? '　写真'+(st.photos||[]).length+'枚' : ''}</div>
        </div>
        ${(isLiveNow(sv) && !isDetail(sv) && !st.ended_at)
          ? '<span class="pill ok">記録中</span>' : ''}
      </div></div>`;
  }).join('');
  return {
    title: `${sv.river_name||''} ${sv.site_name||''}`.trim() || '調査',
    sub:[{text:surveyPeriodText(sv)}, {text:sv.status||'未開始', cls: sv.status==='調査中'?'ok':''},
         envOnly ? {text:'物理環境'} : {text:`${nSp}種 ${surveyTotal(sv)}尾`}],
    html:`
      ${running
        ? `<button class="btn pri" onclick="nav('station','${running.uuid}')">記録中の ${esc(running.name)} を開く</button>`
        : `<button class="btn pri" onclick="newStation('${svUuid}')">${W}を追加する</button>`}

      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="dim small">いま現場にいるとき</div>
            <div>${sv.status==='調査中'
              ? 'GPSで歩いた道すじを記録しています'
              : '「はじめる」を押すと、時刻が自動で入り、道すじを記録します'}</div>
          </div>
          ${sv.status==='調査中'
            ? `<button class="btn" style="width:auto;margin:0" onclick="endSurvey('${svUuid}')">終える</button>`
            : `<button class="btn ok" style="width:auto;margin:0" onclick="startSurvey('${svUuid}')">はじめる</button>`}
        </div>
        <div class="dim small">押さなくても記録はできます。
          あとから書き起こすときは、そのまま「${W}を追加する」へどうぞ。</div>
      </div>

      ${isDetail(sv) ? '' : `<div class="card">
        <div class="row">
          <div class="grow"><div class="dim small">調べた距離（合計）</div>
            <div>${esc(fmtDist(svLen.used))}</div></div>
          <div class="grow"><div class="dim small">調べた面積（合計）</div>
            <div>${svArea.used===''||!svArea.used?'—':esc(fmtNum(svArea.used,1))+' m²'}</div></div>
          <div class="grow"><div class="dim small">通電（合計）</div>
            <div>${esc(fmtDur(svSec))}</div></div>
        </div>
        <div class="dim small">箇所ごとの「使う値」を足したものです。</div>
      </div>`}

      <h3>${isDetail(sv) ? '地点（打った点）' : '箇所（瀬淵ごと）'}</h3>
      ${stations.length ? stCards : `<div class="card dim">まだ${W}がありません。</div>`}

      <div class="hr"></div>
      <button class="btn" onclick="nav('notes','${svUuid}')">メモ（${DB.notesOf(svUuid).length}件）</button>
      <button class="btn" onclick="nav('map','${svUuid}')">地図で見る</button>
      <button class="btn" onclick="nav('exportHub','${svUuid}')">書き出す</button>
      <button class="btn" onclick="nav('surveyEdit','${svUuid}')">調査の設定</button>
    `,
    onMount(){ startGps(); }
  };
};
function startSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; sv.started_at = sv.started_at || nowISO();
  if(DB.upsert(DB.key.sv, sv)){ startGps(); render(); }
}
function endSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  // 通電を押しっぱなしのまま終えると、そのあとも秒数が増え続けて
  // 単位努力量あたりの尾数が狂う（2026-08-17 の監査 Major）
  const running = DB.stationsOf(u).filter(effortRunning);
  for(const st of running){
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
    if(!DB.upsert(DB.key.st, st)){
      toast(`${st.name} の通電を止められませんでした。調査を終えていません`, 8000);
      return;                    // 半端な状態で終えない
    }
  }
  if(running.length) toast(`${running.length}件の通電を止めました`);
  sv.status='終了'; sv.finished_at = nowISO();
  if(DB.upsert(DB.key.sv, sv)){ stopGps(); toast('調査を終えました'); render(); }
}
function reopenSurvey(u){
  const sv = DB.get(DB.key.sv, u); if(!sv) return;
  sv.status='調査中'; delete sv.finished_at;
  if(DB.upsert(DB.key.sv, sv)){ render(); }
}

function collectStation(){
  return {
    photos: (SCREENS._photos||[]).slice(),
    name: strVal('#s_name'), habitat_type: segVal('habitat'),
    survey_time_start: strVal('#s_t1'), survey_time_end: strVal('#s_t2'),
    survey_date: (segVal('stdate') || strVal('#s_date')),
    survey_type: segVal('svtype2'), survey_method: segMultiVal('method'),
    env_method: segVal('envm2'), line_direction: segVal('linedir'),
    flow_rate: strVal('#s_flow'),
    line_start_lat: strVal('#s_ls_lat'), line_start_lon: strVal('#s_ls_lon'),
    line_start_acc: strVal('#s_ls_acc'),
    line_end_lat: strVal('#s_le_lat'), line_end_lon: strVal('#s_le_lon'),
    line_end_acc: strVal('#s_le_acc'),
    latitude: strVal('#s_lat'), longitude: strVal('#s_lon'),
    depth_rep_cm: strVal('#s_depth'), velocity_rep_cms: strVal('#s_vel'),
    water_temp: strVal('#s_wt'), substrate1: segVal('sub1'),
    gravel_condition: segVal('gravel'), memo: strVal('#s_memo'),
  };
}

/* 始点・終点の見せ方。押さえていなければ、そう言う */
function lineFixText(st, which){
  const pt = linePt(st, which);
  if(!pt) return '<span class="pill ng">まだ押さえていません</span>';
  const acc = numOf(st['line_'+which+'_acc']);
  return esc(pt[0].toFixed(6)+', '+pt[1].toFixed(6))
    + (acc==='' ? '' : ' <span class="dim small">±'+Math.round(acc)+'m</span>');
}
/* いまいる場所を、区間の始点／終点として押さえる */
function grabLinePt(which){
  const key = which==='start' ? 'ls' : 'le';
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので押さえていません。`
        + '空の見えるところでお試しください', 8000);
      return;
    }
    applyVals({['#s_'+key+'_lat']: f.lat.toFixed(6),
               ['#s_'+key+'_lon']: f.lon.toFixed(6),
               ['#s_'+key+'_acc']: String(Math.round(f.acc))});
    const box = $(which==='start' ? '#s_lineStart' : '#s_lineEnd');
    if(box) box.innerHTML = esc(f.lat.toFixed(6)+', '+f.lon.toFixed(6))
      + ' <span class="dim small">±'+Math.round(f.acc)+'m</span>';
    showLineDist();
    draftTouch();
    toast((which==='start'?'始点':'終点')+'を押さえました');
  });
}
/* いま押さえてある始点・終点から、区間の長さを出して見せる */
function showLineDist(){
  const box = $('#s_lineDist'); if(!box) return;
  const tmp = {
    line_start_lat: numVal('#s_ls_lat'), line_start_lon: numVal('#s_ls_lon'),
    line_end_lat: numVal('#s_le_lat'), line_end_lon: numVal('#s_le_lon'),
  };
  const d = lineDist(tmp);
  box.textContent = d==='' ? '始点と終点の両方を押さえると、区間の長さが出ます。'
                           : `始点から終点まで ${fmtDist(d)}`;
}
/* 取り方を変えたら、出す欄を入れ替える */
function onStationMethod(){
  const m = segVal('envm2');
  const line = $('#s_lineCard');
  if(line) line.style.display = (m==='ライン') ? '' : 'none';
  const mesh = $('#s_meshCard');
  if(mesh) mesh.style.display = (m==='メッシュ') ? '' : 'none';
  showLineDist();
  draftTouch();
}

function grabStationPos(){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    applyVals({'#s_lat': f.lat.toFixed(6), '#s_lon': f.lon.toFixed(6)});
    const el=$('#stPos');
    if(el) el.textContent = `決め方：GPS（±${Math.round(f.acc)}m）`;
    window._stPosSource='GPS'; window._stPosAcc=Math.round(f.acc);
    draftTouch();
    toast('現在地を入れました');
  });
}
function nowInto(sel){
  const el = $(sel);
  if(!el) return;
  el.value = timeValue();
  draftTouch();
  toast('いまの時刻を入れました');
}
function saveStation(svUuid, stUuid, opt){
  const isNew = !stUuid;
  const sv = DB.getAlive(DB.key.sv, svUuid);
  const noNew = isNew ? nextStationNo(svUuid) : null;
  if(isNew && noNew===null){ toast('番号が大きすぎて、これ以上作れません', 7000); return; }
  // 画面を開いてから保存するまでに、ほかで記録が増えていることがある。
  // 出した番号と食い違ったまま保存すると、名前と番号がずれる
  const noShown = isNew ? countOf(strVal('#s_no')) : null;
  const 名前がずれる = isNew && noShown!==null && noShown!=='' && noShown!==noNew;
  const rec = isNew
    ? {uuid:uuid(), survey_uuid:svUuid, station_no: noNew,
       started_at:nowISO(), env_points:[]}
    : (DB.get(DB.key.st, stUuid)||{uuid:stUuid, survey_uuid:svUuid});
  const f = collectStation();
  const 既定名 = (n)=>(isDetail(sv)?'P.':'St.')+n;
  // 名前を打っていない、または出した番号のままの既定名なら、新しい番号に直す
  rec.name = (f.name && !(名前がずれる && f.name===既定名(noShown)))
    ? f.name : 既定名(rec.station_no||1);
  if(名前がずれる){
    toast(`ほかで記録が増えたため、番号を ${noShown} から ${noNew} に直しました`, 7000);
  }
  rec.survey_time_start = f.survey_time_start;
  rec.survey_time_end   = f.survey_time_end;
  if(surveyIsMultiDay(sv)){
    // 何日かにわたる調査では、その箇所がどの日か覚えておく
    rec.survey_date = f.survey_date || stationDate(rec, sv);
  }
  // いま現場にいる調査で、開始の時刻が空のままなら、いまの時刻を入れる。
  // 調査日が今日でないときは入れない（あとから書き起こしている最中なので、
  // 今の時刻を入れると実際の調査時刻と食い違う）
  if(isNew && !rec.survey_time_start && isLiveNow(sv)) rec.survey_time_start = timeValue();
  rec.env_method        = (f.env_method==='ライン' || f.env_method==='メッシュ')
                            ? f.env_method : '点';
  if(rec.env_method==='ライン'){
    rec.line_direction  = f.line_direction || '上流→下流';
    rec.line_start_lat  = numOf(f.line_start_lat);
    rec.line_start_lon  = numOf(f.line_start_lon);
    rec.line_start_acc  = numOf(f.line_start_acc);
    rec.line_end_lat    = numOf(f.line_end_lat);
    rec.line_end_lon    = numOf(f.line_end_lon);
    rec.line_end_acc    = numOf(f.line_end_acc);
    rec.flow_rate       = numOf(f.flow_rate);
  }
  rec.habitat_type      = f.habitat_type;
  rec.survey_type       = f.survey_type || '採取';
  rec.survey_method     = f.survey_method;
  const serr = rangeCheck([['水温', f.water_temp, -5, 45],
    ['代表の水深', f.depth_rep_cm, 0, 2000], ['代表の流速', f.velocity_rep_cms, 0, 1000],
    ['緯度', f.latitude, 20, 50], ['経度', f.longitude, 120, 155],
    ['流量', f.flow_rate, 0, 100000],
    ['始点の緯度', f.line_start_lat, 20, 50], ['始点の経度', f.line_start_lon, 120, 155],
    ['終点の緯度', f.line_end_lat, 20, 50], ['終点の経度', f.line_end_lon, 120, 155]]);
  if(serr){ toast(serr, 6000); return; }
  rec.water_temp        = numOf(f.water_temp);
  rec.substrate1        = f.substrate1;
  rec.gravel_condition  = f.gravel_condition;
  rec.memo              = f.memo;
  rec.photos            = (SCREENS._photos||[]).slice();
  if(isDetail(sv)){
    // 点は打った時点で1つの記録。区間のように「はじめて終える」ものではない
    rec.ended_at = rec.ended_at || nowISO();
    // 時刻の幅を持たないので、終わりは始まりと同じにする。
    // 空のままだと、取り込み側が別々の点を1つの箇所にまとめてしまう
    if(rec.survey_time_start && !rec.survey_time_end) rec.survey_time_end = rec.survey_time_start;
    rec.latitude         = numOf(f.latitude);
    rec.longitude        = numOf(f.longitude);
    rec.depth_rep_cm     = numOf(f.depth_rep_cm);
    rec.velocity_rep_cms = numOf(f.velocity_rep_cms);
    if(window._stPosSource){
      rec.position_source = window._stPosSource;
      rec.gps_accuracy    = window._stPosAcc;
    }
    // 新しい地点で、まだ位置が無ければ、いま立っている場所を入れる
    if(isNew && rec.latitude==='' && isLiveNow(sv)){
      const fix = freshFix(20000);
      if(fix && fix.acc<=GPS_MAX_ACC){
        rec.latitude = +fix.lat.toFixed(6);
        rec.longitude = +fix.lon.toFixed(6);
        rec.gps_accuracy = Math.round(fix.acc);
        rec.position_source = 'GPS';
      }
    }
  }
  window._stPosSource=null; window._stPosAcc=null;
  const ok = DB.upsert(DB.key.st, rec);
  if(ok) photoOwnerDone(rec.photos);       // 付いたので、印は外す
  if(!ok) return;                       // 保存できていないので書きかけを消さない
  draftClear('station:'+(stUuid || ('new:'+svUuid)));
  draftUnbind();
  toast(isNew ? (stWord(sv)+'をはじめました') : '保存しました');
  // 保存したあとで別の画面へ行きたいことがある（格子を決めるなど）
  if(opt && opt.then){ goTo(opt.then, rec.uuid); return; }
  if(isNew) goTo('station', rec.uuid); else goBack();
}
function deleteStation(u){
  const st = DB.get(DB.key.st, u);
  const n = DB.catchesOf(u).length;
  const W = stWordOf(st);
  if(!confirm(`この${W}を削除します。${n>0?`記録${n}件も一緒に見えなくなります。`:''}よろしいですか？`)) return;
  // 印を付けるのは箇所1つだけ。中の記録は「親が消えている」ことで隠れる。
  // 何件も書き込むと、途中で失敗したときに迷子の記録が残る
  if(!DB.softDelete(DB.key.st, u)) return;
  draftClearFor('箇所', u);      // 書きかけが写真を抱えたままにならないように
  toast('削除しました');
  goTo('survey', st ? st.survey_uuid : null);
}

/* ---------- 箇所ハブ ---------- */
SCREENS.station = (stUuid)=>{
  const st = DB.liveStation(stUuid);
  if(!st) return null;
  const sv = DB.get(DB.key.sv, st.survey_uuid);
  const cs = DB.catchesOf(stUuid);
  const len = stationLengths(st), area = stationAreas(st), cp = cpue(st);
  const dep = stationDepth(st), vel = stationVelocity(st);
  const detail = isDetail(sv), W = stWordOf(st);
  const rows = cs.map(c=>{
    const ls = catchLengths(c);
    return `<tr onclick="nav('catchEdit',{uuid:'${c.uuid}'})" style="cursor:pointer">
      <td>${esc(c.species_name||'(種名なし)')}${c.species_id?'':' <span class="pill ng">種IDなし</span>'}</td>
      <td class="num">${catchTotal(c)}</td>
      <td class="num dim small">${ls.length
        ? `${fmtNum(Math.min.apply(null,ls),1)}〜${fmtNum(Math.max.apply(null,ls),1)}` : '—'}</td>
      <td class="dim small">${esc(c.identification_confidence||'')}</td>
    </tr>`;
  }).join('');
  return {
    title: st.name || W,

/* 通電のスタート・ストップ。押した時刻だけを覚え、表示は時計から作る */
function toggleEffort(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  if(effortRunning(st)){
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
    if(DB.upsert(DB.key.st, st)){ toast(`通電 ${fmtDur(st.effort_seconds)}`); render(); }
  }else{
    st.effort_started_at = nowISO();
    if(DB.upsert(DB.key.st, st)){ toast('通電をはじめました'); render(); }
  }
}
function saveEffort(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  const passes = strVal('#e_passes');
  if(countOf(passes)===null){ toast('流した回数は0以上の整数で入れてください'); return; }
  const err = rangeCheck([
    ['流した回数', passes, 0, 999],
    ['平均の川幅', strVal('#e_width'), 0, 2000],
    ['区間の長さ', strVal('#e_len'), 0, 100000],
    ['面積', strVal('#e_area'), 0, 10000000]]);
  if(err){ toast(err, 6000); return; }
  st.effort_passes    = countOf(passes);
  st.width_m          = numVal('#e_width');
  st.length_m_manual  = numVal('#e_len');
  st.area_m2_manual   = numVal('#e_area');
  if(DB.upsert(DB.key.st, st)){
    draftClear('effort:'+stUuid);
    toast('保存しました'); render();
  }
}
function endStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  const sv = DB.getAlive(DB.key.sv, st.survey_uuid);
  if(effortRunning(st)){          // 押しっぱなしのまま終わらせない
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
  }
  st.ended_at = nowISO();
  // 終了の時刻は、いま現場にいるときだけ自動で入れる。
  // あとから書き起こしているときは、手で入れた時刻を上書きしない
  if(isLiveNow(sv) && !st.survey_time_end) st.survey_time_end = timeValue();
  if(DB.upsert(DB.key.st, st)){ toast(stWordOf(st)+'を終えました'); goTo('survey', st.survey_uuid); }
}
function reopenStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  delete st.ended_at;   // 入れた終了時刻は消さない（手で入れたものかもしれない）
  if(DB.upsert(DB.key.st, st)){ render(); }
}

      <div class="hr"></div>

          ${sv.status==='調査中'

        </div>

    `,

      if(ENV_PICK && ENV_PICK.sv !== svUuid) ENV_PICK = null;

      envHistClear(svUuid);       // ほかの調査の分は持ち越さない
      ENV_FORM = cur ? cur.uuid : '';
      ENV_DIRTY = false;
      if(cur){
        const key = 'envitem:'+cur.uuid;
        SCREENS._photos = ((cur.photos)||[]).slice();
        const base = collectEnvItem();
        // 見ているだけのタブでは、書きかけを持たない。
        // 持つと、記録を入れているタブの書きかけを上書きしてしまう（監査 Major）
        const d = ownsLock() ? draftGet(key) : null;
        if(d){
          applySels(d);
          applySegRaw('envhab', d.__hab);
          applySeg('envsub', d.__sub); applySeg('envgr', d.__gr);
          toast('書きかけを戻しました');
        }
        photosBegin(cur, d, {key, survey:sv.uuid, kind:'箇所'});
        if(ownsLock()) draftBind(key, collectEnvItem, base);
        envShowError(envItemError());
        // 入力のたびに、少し待ってから保存する
        const box = $('#envItemForm');
        if(box && ownsLock()){
          box.addEventListener('input',  ()=>envAutoSave(cur.uuid));
          box.addEventListener('change', ()=>envAutoSave(cur.uuid));
          // 選ぶボタン（環境区分・河床材料・礫の状況）は input も change も出さない。
          // 拾わないと、押したのに記録にも書き出しにも入らない
          // （2026-08-17 の監査 Critical）
          // 押したボタンそのものだけを拾う（枠の余白を押しても数えない）。
          // pickSeg はボタン自身の onclick なので、ここへ来る時点で選び終わっている。
          // ひと呼吸置くと、その間に画面が変わって取りこぼす（2026-08-18 の監査 Major）
          box.addEventListener('click', e=>{
            if(e.target && e.target.closest && e.target.closest('[data-seg] button')){
              envAutoSave(cur.uuid);
            }
          });
        }
      }

      // 地図。前に見ていた場所があればそこへ戻す（勝手に動かさない）
      const v = ENV_VIEW[svUuid];
      const c = v ? [v.lat, v.lon] : envMapCenter(sv, cur);
      MAPS.main.map = makeMap('envmap', c, v ? v.zoom : 17, v ? v.bearing : 0);
      const map = MAPS.main.map;
      if(!map) return;
      applyBaseMap('main', baseMapName());
      addLocateControl(map);
      addMapIconBar(map, [
        {icon: envMapBig()?'shrink':'expand',
         title: envMapBig()?'地図を小さく':'地図を大きく', tap:()=>envToggleBig()},

      // 足すものは、押しやすい下側に置く

        {icon:'lineStart', key:'LS', title:'つぎはラインの始まり', tap:()=>envSetKind('LS')},
        {icon:'lineEnd',   key:'LE', title:'つぎはラインの終わり', tap:()=>envSetKind('LE')},
        {icon:'lineBend',  key:'V',  title:'つぎはラインの曲がり', tap:()=>envSetKind('V')},

      addMapIconBar(map, [
        {icon:'addHere', title:'いまいる場所に足す', tap:()=>envAddHere(svUuid)},
        {icon:'chain',   key:'chain', title:'ラインをつなげる／つなげない',
         tap:()=>envSetChain(!envChain())},
        {icon:'undo', title:'1つ戻す（直前に置いた・動かした分）',
         tap:()=>{ if(envUndo(svUuid)) render(); }},
      ], 'bottomright');
      envSyncNextUI();
      envDrawAll(svUuid);
      drawMe('main');            // 開いた時点でも、いる場所を出す
      ENV_MAP_SV = svUuid;      // 片付ける直前に、見ている場所を覚えるため
      map.on('click', e=>{
        // 直す待ちのときは、新しく置かずに動かす
        if(ENV_MOVE){
          const m = ENV_MOVE;
          // すぐ近くに置いてあるものがあれば、そこへ重ねる
          const sn = envSnapTo(svUuid, e.latlng.lat, e.latlng.lng, m.uuid);
          const la = sn ? sn.lat : e.latlng.lat, lo = sn ? sn.lon : e.latlng.lng;
          if(envMoveTo(m.uuid, m.which, la, lo, null)){ envSnapTell(sn); render(); }
          return;
        }
        if(envPickOn()){ toast('消すものを選んでいます。先に「やめる」を押してください', 6000); return; }
        const sn = envSnapTo(svUuid, e.latlng.lat, e.latlng.lng, null);
        const la = sn ? sn.lat : e.latlng.lat, lo = sn ? sn.lon : e.latlng.lng;
        if(envAddAt(svUuid, la, lo, null)) envSnapTell(sn);
        render();
      });
      // はじめて開いたときだけ、置いてあるものが入るようにする
      if(!v){
        const pts = envAllPoints(svUuid);
        if(pts.length>1){
          try{ map.fitBounds(L.latLngBounds(pts).pad(0.3), {animate:false}); }catch(e){}
        }
        envRememberView(svUuid);
      }
    }
  };
};

function envMapCenter(sv, cur){
  if(cur){
    const p = envKindOf(cur)==='L' ? (linePt(cur,'start') || linePt(cur,'end'))
                                   : stationPt(cur);
    if(p) return p;
  }
  const list = DB.stationsOf(sv.uuid).filter(x=>!isMesh(x));
  for(let i=list.length-1;i>=0;i--){
    const st = list[i];
    const p = envKindOf(st)==='L' ? (linePt(st,'start') || linePt(st,'end'))
                                  : stationPt(st);
    if(p) return p;
  }
  const svp = stationPt(sv);      // 調査そのものの位置（緯度だけで決めない）
  if(svp) return svp;
  return [43.06, 141.35];
}

/* 地図に点・線・名前を描く */
function envDrawAll(svUuid){
  const map = MAPS.main.map; if(!map) return;
  try{ ENVLAYER.forEach(x=>map.removeLayer(x)); }catch(e){}
  ENVLAYER = [];
  const pts = [];
  const range = envColorRange(svUuid);
  DB.stationsOf(svUuid).filter(x=>!isMesh(x)).forEach(st=>{
    const on = st.uuid === ENV_SEL;
    const byCol = envColorOf(st, range);
    // 色分けを選んでいるときは、選んでいるものは大きさで見せる（色は基準のまま）
    const col = byCol || (on ? '#f0883e' : (envKindOf(st)==='L' ? '#4aa3ff' : '#3fb950'));
    const nm = st.name || '';
    const put = (pt, txt, square)=>{
      // 記号は L.marker。図形とちがって、クリックが地図に伝わらない
      ENVLAYER.push(L.marker(pt, {icon:envBadge(txt, col, on?30:24, on, square),
        zIndexOffset: on ? 1000 : 0})
        .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
      pts.push(pt);
    };
    if(envKindOf(st)==='L'){
      const a = linePt(st,'start'), b = linePt(st,'end');
      if(a) put(a, nm, false);
      if(b) put(b, '終', true);
      // 曲がりは小さな丸で出す。名前は付けない（数が増えると読めなくなる）
      lineVias(st).forEach(v=>{
        ENVLAYER.push(L.circleMarker(v, {radius:on?6:4, color:'#fff', weight:2,
          fillColor:col, fillOpacity:1, bubblingMouseEvents:false})
          .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
        pts.push(v);
      });
      const path = linePath(st);
      if(path.length >= 2) ENVLAYER.push(L.polyline(path,
        {color:col, weight:on?6:4, opacity:.9, bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
    }else{
      const pt = stationPt(st);
      if(pt) put(pt, nm, false);
    }
  });
  // ここでは地図を動かさない。
  // 点を置くたびに全体表示へ戻ると、寄って作業しているときに邪魔になる
}

/* いまいる場所に足す */
function envAddHere(svUuid){
  if(envPickOn()){
    toast('消すものを選んでいます。先に「やめる」を押してください', 6000);
    return;
  }
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした。地図をタップしても置けます', 6000); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので置いていません。`
        + '空の見えるところでお試しいただくか、地図をタップしてください', 9000);
      return;
    }
    envAddAt(svUuid, f.lat, f.lon, f.acc);
    render();
  });
}
function envSelect(u){
  if(ENV_SEL === u) return;
  envFlush();            // 打ちかけの分を、切り替える前に書いてしまう
  ENV_SEL = u;
  render();
}
function envDelete(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  if(!confirm(`${st.name} を消します。中の記録も消えます。よろしいですか？`)) return;
  if(DB.softDelete(DB.key.st, u)){
    draftClearFor('箇所', u);
    if(ENV_SEL === u) ENV_SEL = null;
    toast('消しました'); render();
  }
}

function envItemSels(){
  const sels = ['#ev_v','#ev_d','#ev_memo','#ev_t1','#ev_t2'];
  OPT.substrate.forEach(k=>sels.push('#evp_'+SUBSTRATE_NO[k]));
  ['left','right'].forEach(side=>{
    [0,1,2].forEach(i=>{ sels.push('#evc_'+side+'_'+i+'_t'); sels.push('#evc_'+side+'_'+i); });
    sels.push('#evc_'+side+'_len');
  });
  return sels;
}
function collectEnvItem(){
  const o = collectSels(envItemSels());
  o.__hab = segRaw('envhab');       // 略字のまま控える
  o.__sub = segVal('envsub');
  o.__gr  = segVal('envgr');
  o.photos = (SCREENS._photos||[]).slice();
  return o;
}

/* いま画面に入っている値が、おかしくないか。おかしければ理由を返す */
function envItemError(){
  return rangeCheck([['水深', strVal('#ev_d'), 0, 20], ['流速', strVal('#ev_v'), 0, 10]]
    .concat(OPT.substrate.map(k=>[k+'の割合', strVal('#evp_'+SUBSTRATE_NO[k]), 0, 100]))
    .concat(['left','right'].map(side=>{
      const label = side==='left' ? '左岸' : '右岸';
      return [label+'のカバー長', strVal('#evc_'+side+'_len'), 0, 100000];
    }))
    .concat(['left','right'].reduce((a,side)=>{
      const label = side==='left' ? '左岸' : '右岸';
      [0,1,2].forEach(i=>a.push([label+'のカバーの割合', strVal('#evc_'+side+'_'+i), 0, 100]));
      return a;
    }, [])));
}

/* 記入の途中でも保存する。
   保存ボタンだけに頼ると、打ったのに書き出しに出ない、が起きる。
   点を置いた時点で記録は作られ、時刻も自動で入るのに、
   中身だけ手で保存というのはちぐはぐでもある */
let ENV_FORM = '';              // いま画面に出ている入力欄の持ち主
let ENV_DIRTY = false;          // その入力欄を、人が触ったか
let ENV_AUTO_TIMER = null;
const ENV_AUTO_MS = 600;        // 打ち終わるのを少し待ってから
function envAutoSave(stUuid){
  ENV_DIRTY = true;
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  ENV_AUTO_TIMER = setTimeout(()=>{
    ENV_AUTO_TIMER = null;
    envAutoSaveNow(stUuid);
  }, ENV_AUTO_MS);
}
/* 書きかけの「開いたときの姿」を、いまの中身にそろえる。
   保存したのに古い姿のままだと、次に何か触ったとき
   「保存済みの値」が新しい書きかけとして作られ、あとで古い値を運んでくる
   （2026-08-18 の監査 Major） */
function envRebaseDraft(key, obj){
  if(DRAFT_KEY !== key) return false;
  try{ DRAFT_BASE = JSON.stringify(obj); return true; }catch(e){ return false; }
}
/* 写真だけを、待たずにその場で保存する。
   600ミリ秒待つ形だと、撮った直後にアプリを閉じたとき記録に付かない
   （2026-08-18 の監査 Major） */
function envSavePhotosNow(){
  if(!ENV_FORM) return false;
  if(!ownsLock()) return false;
  const st = DB.liveStation(ENV_FORM);
  if(!st) return false;
  st.photos = (SCREENS._photos||[]).slice();
  if(!DB.upsert(DB.key.st, st)) return false;   // 失敗なら、書きかけを残したまま
  photoOwnerDone(st.photos);         // 付いたので、印は外す
  // 書きかけの「開いたときの姿」も、いまの写真に合わせる。
  // 合わせないと、あとで書きかけを戻したときに古い写真の並びへ戻ってしまう
  // （2026-08-18 の監査 Major）
  try{
    if(DRAFT_KEY === 'envitem:'+ENV_FORM && DRAFT_BASE){
      const b = JSON.parse(DRAFT_BASE);
      b.photos = (SCREENS._photos||[]).slice();
      DRAFT_BASE = JSON.stringify(b);
    }
  }catch(e){}
  draftTouch();      // 写真のほかに差が無ければ、書きかけは消える
  const mark = $('#ev_saved');
  if(mark) mark.textContent = '写真を保存しました（' + timeValue() + '）';
  return true;
}
/* 直前にしたことを控えておき、1つずつ戻せるようにする。
   置き間違いは現場で必ず起きる（2026-08-19 の実機の声）。
   アプリを閉じるまでの間だけ覚える（記録そのものは消さずに、印を付け外しする） */
let ENV_HIST = [];
const ENV_HIST_MAX = 30;
function envHistPush(item){
  if(!item) return;
  ENV_HIST.push(item);
  if(ENV_HIST.length > ENV_HIST_MAX) ENV_HIST.shift();
}
function envHistClear(svUuid){
  ENV_HIST = ENV_HIST.filter(x=>x && x.sv === svUuid);
}
function envCanUndo(svUuid){
  return ENV_HIST.some(x=>x && x.sv === svUuid);
}
/* 1つ戻す。戻せたら true */
function envUndo(svUuid){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return false;
  }
  let i = ENV_HIST.length - 1;
  while(i >= 0 && !(ENV_HIST[i] && ENV_HIST[i].sv === svUuid)) i--;
  if(i < 0){ toast('戻せるものがありません'); return false; }
  const h = ENV_HIST[i];
  ENV_HIST.splice(i, 1);

  if(h.type === '置いた'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    if(!DB.softDelete(DB.key.st, h.uuid)){
      toast('戻せませんでした（端末の空き容量をご確認ください）', 8000);
      return false;
    }
    draftClearFor('箇所', h.uuid);
    if(ENV_SEL === h.uuid) ENV_SEL = null;
    if(ENV_NEXT.line === h.uuid){
      ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
    }
    toast(`${h.name||''} を取り消しました`);
    return true;
  }
  if(h.type === '終わり'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    let all;
    try{ all = DB.loadRaw(DB.key.st); }
    catch(e){ toast('保存された記録を読み取れないため、戻せませんでした', 7000); return false; }
    const t = nowISO();
    all.forEach(x=>{
      if(!x) return;
      if(x.uuid === h.uuid){
        x.line_end_lat = ''; x.line_end_lon = ''; x.line_end_acc = '';
        x.survey_time_end = h.prevTime || '';
        x.ended_at = h.prevEnded || '';
        x.updated_at = t;
      }
      // つなげるで自動的に始まったラインも、一緒に取り消す
      if(h.next && x.uuid === h.next && !x.deleted_at) x.deleted_at = t;
    });
    if(!DB.save(DB.key.st, all)){
      toast('戻せませんでした（端末の空き容量をご確認ください）', 8000);
      return false;
    }
    if(h.next){
      draftClearFor('箇所', h.next);
      if(ENV_SEL === h.next) ENV_SEL = h.uuid;
    }
    ENV_NEXT = {kind:'LE', auto:ENV_NEXT.auto, line:h.uuid, survey:svUuid};
    toast(`${h.name||''} の終わりを取り消しました`);
    return true;
  }
  if(h.type === '曲がり'){
    if(!envUndoBend(h.uuid)) return false;
    return true;
  }
  if(h.type === '動かした'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    if(!envMoveTo(h.uuid, h.which, h.prev.lat, h.prev.lon, h.prev.acc, true)) return false;
    toast(`${h.name||''} の${h.which}を元に戻しました`);
    return true;
  }
  return false;
}
/* 曲がりを足す相手のライン。
   1) いま選んでいるライン（終わっていてもよい。あとから形を整えられる）
   2) 直前に置いた始まり
   3) 終わっていないラインがちょうど1本ならそれ */
function envBendTarget(svUuid){
  const 線 = st => st && isLine(st) && linePt(st,'start');
  const sel = ENV_SEL ? DB.getAlive(DB.key.st, ENV_SEL) : null;
  if(線(sel) && sel.survey_uuid===svUuid) return sel;
  if(ENV_NEXT.line){
    const st = DB.getAlive(DB.key.st, ENV_NEXT.line);
    if(線(st) && st.survey_uuid===svUuid) return st;
  }
  const 未完 = DB.stationsOf(svUuid).filter(x=>線(x) && !linePt(x,'end'));
  if(未完.length===1) return 未完[0];
  const 線ぜんぶ = DB.stationsOf(svUuid).filter(線);
  return 線ぜんぶ.length===1 ? 線ぜんぶ[0] : null;
}
/* 曲がりを1つ足す。終点があるラインでは、終点の手前に入れる */
function envAddBend(svUuid, la, lo, acc){
  const st = envBendTarget(svUuid);
  if(!st){
    toast('どのラインを曲げるか決められません。'
      + '先にラインを選ぶか、ラインの始まりを置いてください', 8000);
    return null;
  }
  const v = {lat: la, lon: lo};
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  if(a!=='') v.acc = a;
  st.line_via = (st.line_via||[]).concat([v]);
  if(!DB.upsert(DB.key.st, st)){
    toast('曲がりを置けませんでした（端末の空き容量をご確認ください）', 8000);
    return null;
  }
  ENV_SEL = st.uuid;
  envHistPush({type:'曲がり', sv:svUuid, uuid:st.uuid, name:st.name});
  toast(`${st.name||''} に曲がりを置きました（${(st.line_via||[]).length}個目）`);
  return st.uuid;
}
/* 直前に置いた曲がりを取り消す */
function envUndoBend(u){
  const st = DB.liveStation(u); if(!st) return false;
  const via = (st.line_via||[]).slice();
  if(!via.length){ toast('取り消す曲がりがありません'); return false; }
  via.pop();
  st.line_via = via;
  if(!DB.upsert(DB.key.st, st)){
    toast('取り消せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  toast(`曲がりを1つ取り消しました（残り ${via.length}個）`);
  return true;
}
function envClearBends(u){
  const st = DB.liveStation(u); if(!st) return false;
  const n = (st.line_via||[]).length;
  if(!n){ toast('消す曲がりがありません'); return false; }
  if(!confirm(`${st.name||''} の曲がり ${n}個をすべて消します。よろしいですか？`)) return false;
  st.line_via = [];
  if(!DB.upsert(DB.key.st, st)){
    toast('消せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  toast('曲がりをすべて消しました');
  return true;
}
/* 指では、すでにある点とまったく同じ場所を狙えない。
   すぐ近く（指1本ぶん）に置いてあるものがあれば、そこへぴったり重ねる
   （2026-08-19 の実機の声）。
   もっと寄れば、この幅は実際の距離としては小さくなるので、
   近くに別の点を置きたいときは地図を拡大すればよい */
const ENV_SNAP_PX = 18;
function envSnapTo(svUuid, lat, lon, 除く){
  const map = MAPS.main.map;
  if(!map || typeof map.latLngToContainerPoint !== 'function') return null;
  let here; try{ here = map.latLngToContainerPoint([lat, lon]); }catch(e){ return null; }
  let 近い = null, 距離 = ENV_SNAP_PX;
  DB.stationsOf(svUuid).filter(x=>!isMesh(x)).forEach(st=>{
    if(除く && st.uuid === 除く) return;
    const 角 = [];
    if(envKindOf(st) === 'L'){
      const a = linePt(st,'start'), b = linePt(st,'end');
      if(a) 角.push({pt:a, w:'始点'});
      if(b) 角.push({pt:b, w:'終点'});
    }else{
      const pt = stationPt(st);
      if(pt) 角.push({pt, w:''});
    }
    角.forEach(c=>{
      let d;
      try{ d = here.distanceTo(map.latLngToContainerPoint(c.pt)); }catch(e){ return; }
      if(d <= 距離){ 距離 = d; 近い = {lat:c.pt[0], lon:c.pt[1], name:st.name||'', w:c.w}; }
    });
  });
  return 近い;
}
/* 重ねたことを知らせる。何に重ねたか分からないと、狙いどおりか確かめられない */
function envSnapTell(sn){
  if(!sn) return;
  toast(`${sn.name}${sn.w ? 'の'+sn.w : ''} に重ねました`, 4000);
}

   別の記録を選んだら、たたんだ状態で出す（2026-08-19 の実機の声） */
let ENV_FIX_FOR = '';
function envFixFold(u){
  if(!u) return;
  if(ENV_FIX_FOR === u) return;
  ENV_FIX_FOR = u;
  try{ if(foldOpen('envfix', false)) foldSet('envfix', false); }catch(e){}
}
/* いま「地図をタップして直す」を待っている相手。
   {uuid, which} which は '点' / '始点' / '終点'（2026-08-18 の実機の声） */
let ENV_MOVE = null;
function envMoveOn(u, which){
  return !!(ENV_MOVE && ENV_MOVE.uuid === u && (!which || ENV_MOVE.which === which));
}
function envMoveStart(u, which){
  if(!writeAllowed()){
    toast('このタブでは直せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  if(envMoveOn(u, which)){ ENV_MOVE = null; toast('直すのをやめました'); render(); return; }
  ENV_MOVE = {uuid:u, which:which};
  toast(`地図をタップすると、${which}をそこへ動かします（もう一度押すとやめます）`, 8000);
  render();
}
/* 位置を書き替える。lat/lon が空なら「位置なし」に戻す */
function envMoveTo(u, which, la, lo, acc, 戻すとき){
  const st = DB.liveStation(u); if(!st) return false;
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  // 動かす前の場所を控える（1つ戻すため）
  const 前 = which === '始点' ? {lat:st.line_start_lat, lon:st.line_start_lon, acc:st.line_start_acc}
           : which === '終点' ? {lat:st.line_end_lat, lon:st.line_end_lon, acc:st.line_end_acc}
           : {lat:st.latitude, lon:st.longitude, acc:st.gps_accuracy};
  if(which === '始点'){
    st.line_start_lat = la; st.line_start_lon = lo; st.line_start_acc = a;
  }else if(which === '終点'){
    st.line_end_lat = la; st.line_end_lon = lo; st.line_end_acc = a;
    // 終わりを入れたら、終わりの時刻も入れておく（無いときだけ）
    if(!st.survey_time_end) st.survey_time_end = timeValue();
  }else{
    st.latitude = la; st.longitude = lo; st.gps_accuracy = a;
  }
  if(!DB.upsert(DB.key.st, st)){
    toast('直せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  ENV_MOVE = null;
  if(!戻すとき){
    envHistPush({type:'動かした', sv:st.survey_uuid, uuid:u, which, name:st.name, prev:前});
    toast(`${st.name||''} の${which}を直しました`);
  }
  return true;
}

}

function envAutoSaveNow(stUuid){
  if(!stUuid) return false;

function saveEnvItem(stUuid, opt){
  const quiet = !!(opt && opt.quiet);
  const st = DB.liveStation(stUuid); if(!st) return false;
  // 画面は m。範囲の検査も m でそろえる
  const err = envItemError();
  if(err){ envShowError(err); if(!quiet) toast(err, 6000); return false; }

  st.habitat_type     = habitatLong(segVal('envhab'));
  st.substrate1       = segVal('envsub');
  st.gravel_condition = segVal('envgr');
  st.depth_rep_cm     = mToCm(strVal('#ev_d'));
  st.velocity_rep_cms = mToCm(strVal('#ev_v'));
  st.memo             = strVal('#ev_memo');
  st.photos           = (SCREENS._photos||[]).slice();
  // 時刻。欄が出ているときだけ書く（出ていない画面から呼ばれても消さない）
  if($('#ev_t1')) st.survey_time_start = strVal('#ev_t1');
  if($('#ev_t2')) st.survey_time_end   = strVal('#ev_t2');

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#evp_'+SUBSTRATE_NO[k]); });
  st.substrate_pct = pct;
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    st.substrate1 = rank[0].name;
    st.substrate2 = rank[1] ? rank[1].name : '';
  }
  ['left','right'].forEach(side=>{
    const arr = [];
    [0,1,2].forEach(i=>{
      const type = strVal('#evc_'+side+'_'+i+'_t');
      const p = numVal('#evc_'+side+'_'+i);
      if(type) arr.push({type, pct:p});
    });
    st['cover_'+side] = arr;
    st['cover_'+side+'_length_m'] = numVal('#evc_'+side+'_len');
  });

  if(!DB.upsert(DB.key.st, st)) return false;   // 保存できていないので書きかけを消さない
  // 「開いたときの姿」も、いま保存した中身にそろえる。
  // そろえないと、次に何か触ったとき保存済みの値が書きかけとして作り直される
  photoOwnerDone(st.photos);         // 付いたので、印は外す
  envRebaseDraft('envitem:'+stUuid, collectEnvItem());
  draftClear('envitem:'+stUuid);
  // ふつうの保存でも写真は一緒に入る。入ったなら、やり直しの口はしまう
  photoRefreshRetry();
  envShowError('');
  ENV_DIRTY = false;
  if(quiet){
    // 打っている最中なので、画面は作り直さない。地図の色だけ追いつかせる
    envDrawAll(st.survey_uuid);
    const mark = $('#ev_saved');
    if(mark) mark.textContent = '保存しました（' + timeValue() + '）';
    return true;
  }
  draftUnbind();
  toast('保存しました');
  render();
  return true;
}
