function envMapCenter(sv, cur){
  if(cur){
    const p = envKindOf(cur)==='L' ? (linePt(cur,'start') || linePt(cur,'end'))
                                   : stationPt(cur);
    if(p) return p;
  }
  const list = DB.stationsOf(sv.uuid).filter(x=>!isMesh(x));
  for(let i=list.length-1;i>=0;i--){
    const st = list[i];
    const p = envKindOf(st)==='L' ? (linePt(st,'start') || linePt(st,'end'))
                                  : stationPt(st);
    if(p) return p;
  }
  const svp = stationPt(sv);      // 調査そのものの位置（緯度だけで決めない）
  if(svp) return svp;
  return [43.06, 141.35];
}

/* 地図に点・線・名前を描く */
function envDrawAll(svUuid){
  const map = MAPS.main.map; if(!map) return;
  try{ ENVLAYER.forEach(x=>map.removeLayer(x)); }catch(e){}
  ENVLAYER = [];
  const pts = [];
  const range = envColorRange(svUuid);
  mapStations(svUuid, 'env').forEach(st=>{
    const on = st.uuid === ENV_SEL;
    const byCol = envColorOf(st, range);
    // 色分けを選んでいるときは、選んでいるものは大きさで見せる（色は基準のまま）
    const col = byCol || (on ? '#f0883e' : (envKindOf(st)==='L' ? '#4aa3ff' : '#3fb950'));
    const nm = st.name || '';
    const put = (pt, txt, square)=>{
      // 記号は L.marker。図形とちがって、クリックが地図に伝わらない
      ENVLAYER.push(L.marker(pt, {icon:envBadge(txt, col, on?30:24, on, square),
        zIndexOffset: on ? 1000 : 0})
        .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
      pts.push(pt);
    };
    if(envKindOf(st)==='L'){
      const a = linePt(st,'start'), b = linePt(st,'end');
      if(a) put(a, nm, false);
      if(b) put(b, '終', true);
      // 曲がりは小さな丸で出す。名前は付けない（数が増えると読めなくなる）
      lineVias(st).forEach(v=>{
        ENVLAYER.push(L.circleMarker(v, {radius:on?6:4, color:'#fff', weight:2,
          fillColor:col, fillOpacity:1, bubblingMouseEvents:false})
          .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
        pts.push(v);
      });
      const path = linePath(st);
      if(path.length >= 2) ENVLAYER.push(L.polyline(path,
        {color:col, weight:on?6:4, opacity:.9, bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); envSelect(st.uuid); }).addTo(map));
    }else{
      const pt = stationPt(st);
      if(pt) put(pt, nm, false);
    }
  });
  // ここでは地図を動かさない。
  // 点を置くたびに全体表示へ戻ると、寄って作業しているときに邪魔になる
}

/* いまいる場所に足す */
function envAddHere(svUuid){
  if(envPickOn()){
    toast('消すものを選んでいます。先に「やめる」を押してください', 6000);
    return;
  }
  if(fixBusy()) return;      // 待っている間の二度押しで、二重に置かない
  toast('現在地を取っています…');
  const 確かめ = fixGuard(svUuid);
  // どのラインに足すかは、いま決めておく。待っている間に選び直されても、
  // 返ってきた座標が別のラインへ行かないようにする（監査47回目 Critical）
  const 相手 = ENV_NEXT.kind === 'LE' ? envLineTarget(svUuid)
             : ENV_NEXT.kind === 'V'  ? envBendTarget(svUuid) : null;
  const 相手UU = 相手 ? 相手.uuid : '';
  getFixOnce(f=>{
    fixDone();
    if(!確かめ()) return;
    if(!f){ toast('現在地を取れませんでした。地図をタップしても置けます', 6000); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので置いていません。`
        + '空の見えるところでお試しいただくか、地図をタップしてください', 9000);
      return;
    }
    envAddAt(svUuid, f.lat, f.lon, f.acc, 相手UU);
    render();
  }, {keep:true});     // 置いてよいかは 確かめ() が見る
}
function envSelect(u){
  if(ENV_SEL === u) return;
  envFlush();            // 打ちかけの分を、切り替える前に書いてしまう
  ENV_SEL = u;
  envMarkSelected();     // 人が選んだ。曲がりの行き先は、これを先に見る
  render();
}
function envDelete(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  if(!confirm(`${st.name} を消します。中の記録も消えます。よろしいですか？`)) return;
  if(!flushBeforeDelete(u)){
    toast('打ちかけを保存できないので、消しませんでした。'
      + '足りないところを直すか、端末の空き容量をご確認ください', 9000);
    return;
  }
  if(DB.softDelete(DB.key.st, u)){
    draftClearFor('箇所', u);
    if(ENV_SEL === u) ENV_SEL = null;
    toast('消しました'); render();
  }
}

function envItemSels(){
  const sels = ['#ev_v','#ev_d','#ev_memo','#ev_t1','#ev_t2'];
  OPT.substrate.forEach(k=>sels.push('#evp_'+SUBSTRATE_NO[k]));
  ['left','right'].forEach(side=>{
    [0,1,2].forEach(i=>{ sels.push('#evc_'+side+'_'+i+'_t'); sels.push('#evc_'+side+'_'+i); });
    sels.push('#evc_'+side+'_len');
  });
  return sels;
}
function collectEnvItem(){
  const o = collectSels(envItemSels());
  o.__hab = habMultiVal();          // 正式な名前でつないで控える
  o.__sub = segVal('envsub');
  o.__gr  = segVal('envgr');
  o.photos = (SCREENS._photos||[]).slice();
  return o;
}

/* いま画面に入っている値が、おかしくないか。おかしければ理由を返す */
function envItemError(){
  return rangeCheck([['水深', strVal('#ev_d'), 0, 20], ['流速', strVal('#ev_v'), 0, 10]]
    .concat(OPT.substrate.map(k=>[k+'の割合', strVal('#evp_'+SUBSTRATE_NO[k]), 0, 100]))
    .concat(['left','right'].map(side=>{
      const label = side==='left' ? '左岸' : '右岸';
      return [label+'のカバー長', strVal('#evc_'+side+'_len'), 0, 100000];
    }))
    .concat(['left','right'].reduce((a,side)=>{
      const label = side==='left' ? '左岸' : '右岸';
      [0,1,2].forEach(i=>a.push([label+'のカバーの割合', strVal('#evc_'+side+'_'+i), 0, 100]));
      return a;
    }, [])));
}

/* 記入の途中でも保存する。
   保存ボタンだけに頼ると、打ったのに書き出しに出ない、が起きる。
   点を置いた時点で記録は作られ、時刻も自動で入るのに、
   中身だけ手で保存というのはちぐはぐでもある */
let ENV_FORM = '';              // いま画面に出ている入力欄の持ち主
let ENV_DIRTY = false;          // その入力欄を、人が触ったか
let ENV_AUTO_TIMER = null;
const ENV_AUTO_MS = 600;        // 打ち終わるのを少し待ってから
function envAutoSave(stUuid){
  ENV_DIRTY = true;
  // 書きかけの「いま見ている欄」は1つしか覚えられないので、
  // 同じ画面にある採捕記録に取られていることがある。
  // 取られていても消えないよう、この欄の控えは自分で直に書く（監査51回目 Critical）
  if(ownsLock()){
    try{
      const v = collectEnvItem();
      DRAFT_HOLD['envitem:'+stUuid] = v;
      draftSave('envitem:'+stUuid, v);
    }catch(e){}
  }
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  ENV_AUTO_TIMER = setTimeout(()=>{
    ENV_AUTO_TIMER = null;
    envAutoSaveNow(stUuid);
  }, ENV_AUTO_MS);
}
/* 書きかけの「開いたときの姿」を、いまの中身にそろえる。
   保存したのに古い姿のままだと、次に何か触ったとき
   「保存済みの値」が新しい書きかけとして作られ、あとで古い値を運んでくる
   （2026-08-18 の監査 Major） */
function envRebaseDraft(key, obj){
  if(DRAFT_KEY !== key) return false;
  try{ DRAFT_BASE = JSON.stringify(obj); return true; }catch(e){ return false; }
}
/* 写真だけを、待たずにその場で保存する。
   600ミリ秒待つ形だと、撮った直後にアプリを閉じたとき記録に付かない
   （2026-08-18 の監査 Major） */
function envSavePhotosNow(){
  if(!ENV_FORM) return false;
  if(!ownsLock()) return false;
  const st = DB.liveStation(ENV_FORM);
  if(!st) return false;
  st.photos = (SCREENS._photos||[]).slice();
  if(!DB.upsert(DB.key.st, st)) return false;   // 失敗なら、書きかけを残したまま
  photoOwnerDone(st.photos);         // 付いたので、印は外す
  // 書きかけの「開いたときの姿」も、いまの写真に合わせる。
  // 合わせないと、あとで書きかけを戻したときに古い写真の並びへ戻ってしまう
  // （2026-08-18 の監査 Major）
  try{
    if(DRAFT_KEY === 'envitem:'+ENV_FORM && DRAFT_BASE){
      const b = JSON.parse(DRAFT_BASE);
      b.photos = (SCREENS._photos||[]).slice();
      DRAFT_BASE = JSON.stringify(b);
    }
  }catch(e){}
  draftTouch();      // 写真のほかに差が無ければ、書きかけは消える
  const mark = $('#ev_saved');
  if(mark) mark.textContent = '写真を保存しました（' + timeValue() + '）';
  return true;
}
/* 直前にしたことを控えておき、1つずつ戻せるようにする。
   置き間違いは現場で必ず起きる（2026-08-19 の実機の声）。
   アプリを閉じるまでの間だけ覚える（記録そのものは消さずに、印を付け外しする） */
let ENV_HIST = [];
const ENV_HIST_MAX = 30;
function envHistPush(item){
  if(!item) return;
  // どの地点で行った操作かも覚える。覚えないと、P2で「1つ戻す」を押したときに
  // P1の操作を取り消してしまう（監査39回目 Critical）
  item.spot = MAP_SPOT || '';
  ENV_HIST.push(item);
  if(ENV_HIST.length > ENV_HIST_MAX) ENV_HIST.shift();
}
/* いまの調査・いまの地点の操作か */
function envHistMine(x, svUuid){
  return !!x && x.sv === svUuid && (x.spot||'') === (MAP_SPOT||'');
}
function envHistClear(svUuid){
  ENV_HIST = ENV_HIST.filter(x=>x && x.sv === svUuid);
}
function envCanUndo(svUuid){
  return ENV_HIST.some(x=>envHistMine(x, svUuid));
}
/* 1つ戻す。戻せたら true */
function envUndo(svUuid){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return false;
  }
  let i = ENV_HIST.length - 1;
  while(i >= 0 && !envHistMine(ENV_HIST[i], svUuid)) i--;
  if(i < 0){ toast('戻せるものがありません'); return false; }
  const h = ENV_HIST[i];
  ENV_HIST.splice(i, 1);

  if(h.type === '置いた'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    if(!DB.softDelete(DB.key.st, h.uuid)){
      toast('戻せませんでした（端末の空き容量をご確認ください）', 8000);
      return false;
    }
    draftClearFor('箇所', h.uuid);
    if(ENV_SEL === h.uuid) ENV_SEL = null;
    if(ENV_NEXT.line === h.uuid){
      ENV_NEXT = {kind:ENV_NEXT.kind, auto:ENV_NEXT.auto, line:'', survey:ENV_NEXT.survey};
    }
    toast(`${h.name||''} を取り消しました`);
    return true;
  }
  if(h.type === '終わり'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    let all;
    try{ all = DB.loadRaw(DB.key.st); }
    catch(e){ toast('保存された記録を読み取れないため、戻せませんでした', 7000); return false; }
    const t = nowISO();
    all.forEach(x=>{
      if(!x) return;
      if(x.uuid === h.uuid){
        x.line_end_lat = ''; x.line_end_lon = ''; x.line_end_acc = '';
        x.survey_time_end = h.prevTime || '';
        x.ended_at = h.prevEnded || '';
        x.updated_at = t;
      }
      // つなげるで自動的に始まったラインも、一緒に取り消す
      if(h.next && x.uuid === h.next && !x.deleted_at){ x.deleted_at = t; x.updated_at = t; }
    });
    if(!DB.save(DB.key.st, all)){
      toast('戻せませんでした（端末の空き容量をご確認ください）', 8000);
      return false;
    }
    if(h.next){
      draftClearFor('箇所', h.next);
      if(ENV_SEL === h.next) ENV_SEL = h.uuid;
    }
    ENV_NEXT = {kind:'LE', auto:ENV_NEXT.auto, line:h.uuid, survey:svUuid};
    toast(`${h.name||''} の終わりを取り消しました`);
    return true;
  }
  if(h.type === '曲がり'){
    if(!envUndoBend(h.uuid)) return false;
    return true;
  }
  if(h.type === '動かした'){
    const st = DB.liveStation(h.uuid);
    if(!st){ toast('その記録はもうありません'); return true; }
    if(!envMoveTo(h.uuid, h.which, h.prev.lat, h.prev.lon, h.prev.acc, true)) return false;
    toast(`${h.name||''} の${h.which}を元に戻しました`);
    return true;
  }
  return false;
}
/* 「選んだ」のと「置いた」のと、どちらが後かを覚えておく。
   つなげたときは、閉じたラインが選ばれたまま次のラインが始まるので、
   選ばれているほうを先に見ると、曲がりが前のラインに付く
   （2026-08-19 の実機の声） */
let ENV_SEQ = 0, ENV_SEL_SEQ = 0, ENV_PLACE_SEQ = 0;
function envMarkSelected(){ ENV_SEL_SEQ = ++ENV_SEQ; }
function envMarkPlaced(){ ENV_PLACE_SEQ = ++ENV_SEQ; }
/* 曲がりを足す相手のライン。
   1) 人が選び直した直後なら、その記録（古いラインの形を整えたいとき）
   2) いま引いている途中のライン
   3) 選んでいるライン（終わっていてもよい）
   4) 終わっていないラインがちょうど1本ならそれ
   5) ラインがちょうど1本ならそれ */
function envBendTarget(svUuid){
  const 線 = st => st && isLine(st) && linePt(st,'start') && ofSpot(st, MAP_SPOT);
  const 未完 = st => 線(st) && !linePt(st,'end');
  const sel = ENV_SEL ? DB.getAlive(DB.key.st, ENV_SEL) : null;
  const この調査 = st => st && st.survey_uuid===svUuid;
  if(ENV_SEL_SEQ > ENV_PLACE_SEQ && 線(sel) && この調査(sel)) return sel;
  if(ENV_NEXT.line){
    const st = DB.getAlive(DB.key.st, ENV_NEXT.line);
    if(未完(st) && この調査(st)) return st;
  }
  if(線(sel) && この調査(sel)) return sel;
  const 未完たち = mapStations(svUuid, 'env').filter(未完);
  if(未完たち.length===1) return 未完たち[0];
  const 線ぜんぶ = mapStations(svUuid, 'env').filter(線);
  return 線ぜんぶ.length===1 ? 線ぜんぶ[0] : null;
}
/* 曲がりを1つ足す。終点があるラインでは、終点の手前に入れる */
function envAddBend(svUuid, la, lo, acc, targetUuid){
  let st;
  if(targetUuid){
    const t = DB.getAlive(DB.key.st, targetUuid);
    st = (t && t.survey_uuid===svUuid && isLine(t) && linePt(t,'start')) ? t : null;
    if(!st){
      toast('現在地を取っている間に、曲げる相手のラインが変わったので置いていません', 8000);
      return null;
    }
  }else{
    st = envBendTarget(svUuid);
  }
  if(!st){
    toast('どのラインを曲げるか決められません。'
      + '先にラインを選ぶか、ラインの始まりを置いてください', 8000);
    return null;
  }
  const v = {lat: la, lon: lo};
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  if(a!=='') v.acc = a;
  st.line_via = (st.line_via||[]).concat([v]);
  if(!DB.upsert(DB.key.st, st)){
    toast('曲がりを置けませんでした（端末の空き容量をご確認ください）', 8000);
    return null;
  }
  ENV_SEL = st.uuid;
  envHistPush({type:'曲がり', sv:svUuid, uuid:st.uuid, name:st.name});
  // 曲がりは「置いた」に数えない。数えると、ラインを選んで曲がりを1つ足しただけで、
  // つぎの曲がりが別のライン（引いている途中のもの）へ行ってしまう
  toast(`${st.name||''} に曲がりを置きました（${(st.line_via||[]).length}個目）`);
  return st.uuid;
}
/* 直前に置いた曲がりを取り消す */
function envUndoBend(u){
  const st = DB.liveStation(u); if(!st) return false;
  const via = (st.line_via||[]).slice();
  if(!via.length){ toast('取り消す曲がりがありません'); return false; }
  via.pop();
  st.line_via = via;
  if(!DB.upsert(DB.key.st, st)){
    toast('取り消せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  toast(`曲がりを1つ取り消しました（残り ${via.length}個）`);
  return true;
}
function envClearBends(u){
  const st = DB.liveStation(u); if(!st) return false;
  const n = (st.line_via||[]).length;
  if(!n){ toast('消す曲がりがありません'); return false; }
  if(!confirm(`${st.name||''} の曲がり ${n}個をすべて消します。よろしいですか？`)) return false;
  st.line_via = [];
  if(!DB.upsert(DB.key.st, st)){
    toast('消せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  toast('曲がりをすべて消しました');
  return true;
}
/* 指では、すでにある点とまったく同じ場所を狙えない。
   すぐ近く（指1本ぶん）に置いてあるものがあれば、そこへぴったり重ねる
   （2026-08-19 の実機の声）。
   もっと寄れば、この幅は実際の距離としては小さくなるので、
   近くに別の点を置きたいときは地図を拡大すればよい */
const ENV_SNAP_PX = 18;
function envSnapTo(svUuid, lat, lon, 除く){
  const map = MAPS.main.map;
  if(!map || typeof map.latLngToContainerPoint !== 'function') return null;
  let here; try{ here = map.latLngToContainerPoint([lat, lon]); }catch(e){ return null; }
  let 近い = null, 距離 = ENV_SNAP_PX;
  mapStations(svUuid, 'env').forEach(st=>{
    if(除く && st.uuid === 除く) return;
    const 角 = [];
    if(envKindOf(st) === 'L'){
      const a = linePt(st,'start'), b = linePt(st,'end');
      if(a) 角.push({pt:a, w:'始点'});
      if(b) 角.push({pt:b, w:'終点'});
    }else{
      const pt = stationPt(st);
      if(pt) 角.push({pt, w:''});
    }
    角.forEach(c=>{
      let d;
      try{ d = here.distanceTo(map.latLngToContainerPoint(c.pt)); }catch(e){ return; }
      if(d <= 距離){ 距離 = d; 近い = {lat:c.pt[0], lon:c.pt[1], name:st.name||'', w:c.w}; }
    });
  });
  return 近い;
}
/* 重ねたことを知らせる。何に重ねたか分からないと、狙いどおりか確かめられない */
function envSnapTell(sn){
  if(!sn) return;
  toast(`${sn.name}${sn.w ? 'の'+sn.w : ''} に重ねました`, 4000);
}
/* 「位置と時刻を直す」を開いたままにしておく相手。
   別の記録を選んだら、たたんだ状態で出す（2026-08-19 の実機の声） */
let ENV_FIX_FOR = '';
function envFixFold(u){
  if(!u) return;
  if(ENV_FIX_FOR === u) return;
  ENV_FIX_FOR = u;
  try{ if(foldOpen('envfix', false)) foldSet('envfix', false); }catch(e){}
}
/* いま「地図をタップして直す」を待っている相手。
   {uuid, which} which は '点' / '始点' / '終点'（2026-08-18 の実機の声） */
let ENV_MOVE = null;
function envMoveOn(u, which){
  return !!(ENV_MOVE && ENV_MOVE.uuid === u && (!which || ENV_MOVE.which === which));
}
function envMoveStart(u, which){
  if(!writeAllowed()){
    toast('このタブでは直せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  if(envMoveOn(u, which)){ ENV_MOVE = null; toast('直すのをやめました'); render(); return; }
  ENV_MOVE = {uuid:u, which:which};
  toast(`地図をタップすると、${which}をそこへ動かします（もう一度押すとやめます）`, 8000);
  render();
}
/* 位置を書き替える。lat/lon が空なら「位置なし」に戻す */
function envMoveTo(u, which, la, lo, acc, 戻すとき){
  const st = DB.liveStation(u); if(!st) return false;
  const a = (acc===undefined || acc===null || acc==='') ? '' : Math.round(acc);
  // 動かす前の場所を控える（1つ戻すため）
  const 前 = which === '始点' ? {lat:st.line_start_lat, lon:st.line_start_lon, acc:st.line_start_acc}
           : which === '終点' ? {lat:st.line_end_lat, lon:st.line_end_lon, acc:st.line_end_acc}
           : {lat:st.latitude, lon:st.longitude, acc:st.gps_accuracy};
  if(which === '始点'){
    st.line_start_lat = la; st.line_start_lon = lo; st.line_start_acc = a;
  }else if(which === '終点'){
    st.line_end_lat = la; st.line_end_lon = lo; st.line_end_acc = a;
    // 終わりを入れたら、終わりの時刻も入れておく（無いときだけ）
    if(!st.survey_time_end) st.survey_time_end = timeValue();
  }else{
    st.latitude = la; st.longitude = lo; st.gps_accuracy = a;
  }
  if(!DB.upsert(DB.key.st, st)){
    toast('直せませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  ENV_MOVE = null;
  if(!戻すとき){
    envHistPush({type:'動かした', sv:st.survey_uuid, uuid:u, which, name:st.name, prev:前});
    toast(`${st.name||''} の${which}を直しました`);
  }
  return true;
}
/* いまいる場所へ直す */
function envGrabHere(u, which){
  if(!writeAllowed()){
    toast('このタブでは直せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした。地図で直すこともできます', 7000); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので直していません。`
        + '空の見えるところでお試しいただくか、地図で直してください', 9000);
      return;
    }
    if(envMoveTo(u, which, f.lat, f.lon, f.acc)) render();
  });
}
/* すぐ保存する。記録を選び替える前や、画面を離れる前に使う */
function envAutoSaveNow(stUuid){
  if(!stUuid) return false;
  // 画面に出ている入力欄の持ち主だけに書く。
  // 選び替えた直後は ENV_SEL が先に変わるので、それで判断すると別の記録へ書いてしまう
  if(stUuid !== ENV_FORM) return false;
  // 触っていない入力欄は書き戻さない。
  // 書き戻すと、ほかから変えた中身を、画面に出ていた古い値で上書きしてしまう
  if(!ENV_DIRTY) return false;
  if(!$('#ev_d')) return false;             // その記録の入力欄が出ていない
  if(!ownsLock()) return false;             // 見ているだけのタブでは書かない
  const err = envItemError();
  envShowError(err);
  if(err) return false;                     // おかしい値があるうちは保存しない
  return saveEnvItem(stUuid, {quiet:true});
}
/* おかしい値の理由を、画面に出しつづける（消えるお知らせでは見落とす） */
function envShowError(err){
  const box = $('#ev_err'); if(!box) return;
  box.innerHTML = err
    ? `<div class="ngbox">${esc(err)}<br>直すまで、この記録は保存されません。
        打った内容は消えません。</div>`
    : '';
}
/* いま自動保存を待っている分があれば、先に書いてしまう */
function envFlush(){
  if(ENV_AUTO_TIMER){ clearTimeout(ENV_AUTO_TIMER); ENV_AUTO_TIMER = null; }
  if(ENV_FORM) return envAutoSaveNow(ENV_FORM);
  return true;
}

function saveEnvItem(stUuid, opt){
  const quiet = !!(opt && opt.quiet);
  const st = DB.liveStation(stUuid); if(!st) return false;
  // 画面は m。範囲の検査も m でそろえる
  const err = envItemError();
  if(err){ envShowError(err); if(!quiet) toast(err, 6000); return false; }

  st.habitat_type     = habMultiVal();
  st.substrate1       = segVal('envsub');
  st.gravel_condition = segVal('envgr');
  st.depth_rep_cm     = mToCm(strVal('#ev_d'));
  st.velocity_rep_cms = mToCm(strVal('#ev_v'));
  st.memo             = strVal('#ev_memo');
  st.photos           = (SCREENS._photos||[]).slice();
  // 時刻。欄が出ているときだけ書く（出ていない画面から呼ばれても消さない）
  if($('#ev_t1')) st.survey_time_start = strVal('#ev_t1');
  if($('#ev_t2')) st.survey_time_end   = strVal('#ev_t2');

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#evp_'+SUBSTRATE_NO[k]); });
  st.substrate_pct = pct;
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    st.substrate1 = rank[0].name;
    st.substrate2 = rank[1] ? rank[1].name : '';
  }
  ['left','right'].forEach(side=>{
    const arr = [];
    [0,1,2].forEach(i=>{
      const type = strVal('#evc_'+side+'_'+i+'_t');
      const p = numVal('#evc_'+side+'_'+i);
      if(type) arr.push({type, pct:p});
    });
    st['cover_'+side] = arr;
    st['cover_'+side+'_length_m'] = numVal('#evc_'+side+'_len');
  });

  if(!DB.upsert(DB.key.st, st)) return false;   // 保存できていないので書きかけを消さない
  // 「開いたときの姿」も、いま保存した中身にそろえる。
  // そろえないと、次に何か触ったとき保存済みの値が書きかけとして作り直される
  photoOwnerDone(st.photos);         // 付いたので、印は外す
  envRebaseDraft('envitem:'+stUuid, collectEnvItem());
  draftClear('envitem:'+stUuid);
  // ふつうの保存でも写真は一緒に入る。入ったなら、やり直しの口はしまう
  photoRefreshRetry();
  envShowError('');
  ENV_DIRTY = false;
  if(quiet){
    // 打っている最中なので、画面は作り直さない。地図の色だけ追いつかせる
    envDrawAll(st.survey_uuid);
    const mark = $('#ev_saved');
    if(mark) mark.textContent = '保存しました（' + timeValue() + '）';
    return true;
  }
  draftUnbind();
  toast('保存しました');
  render();
  return true;
}

  //（監査56回目 Critical）
  if(st.is_spot) return null;
  const sv = DB.get(DB.key.sv, st.survey_uuid);
  const c = meshCorners(st);
  const pr = prefs();

               : (pr.mesh_row_m!==undefined ? pr.mesh_row_m : '');
  const colDef = st.mesh_col_m!==undefined && st.mesh_col_m!=='' ? st.mesh_col_m
               : (pr.mesh_col_m!==undefined ? pr.mesh_col_m : '');

    html:`

        <div class="dim small">川の四隅を、この順で押さえてください。
          地図をタップしても決められます。</div>
        <table><tbody>
          ${['上流の左岸','上流の右岸','下流の右岸','下流の左岸'].map((nm,i)=>`
            <tr>
              <td class="dim">${i+1}. ${nm}</td>
              <td class="num small" id="mc_${i}">${c ? esc(c[i][0].toFixed(6)+', '+c[i][1].toFixed(6))
                : '<span class="pill ng">まだ</span>'}</td>
              <td style="text-align:right">
                <button class="btn ok sm" style="width:auto;margin:0;padding:4px 10px"
                  onclick="grabMeshCorner(${i})">いまここ</button></td>
            </tr>`).join('')}
        </tbody></table>
        <div class="dim small" id="mesh_gps"></div>
        <div class="row">
          <button class="btn sm" onclick="undoMeshCorner()">1つ戻す</button>
          <button class="btn sm" onclick="clearMeshCorners()">四隅を消してやり直す</button>
        </div>
      </div>

      ${baseMapButtonsHtml()}
      <div id="meshmap" class="map"></div>
      <div class="dim small" style="margin-top:8px">地図をタップすると、
        1→2→3→4 の順で四隅が決まります。</div>

      <div class="card">
        <h3 style="margin-top:0">格子の細かさ</h3>
        <label>縦の間隔（m）</label>
        <input id="mesh_gap" inputmode="decimal" value="${esc(gapDef)}"
          oninput="showMeshPlan()" placeholder="例）5">
        <label>横の間隔（m）</label>
        <input id="mesh_colm" inputmode="decimal" value="${esc(colDef)}"
          oninput="showMeshPlan()" placeholder="例）5">
        <div class="dim small" style="margin-top:8px" id="mesh_plan"></div>
        <div class="dim small">前に使った値を初期値にしています。現場に合わせて変えてください。<br>
          割り切れない分は、全部のマスに均して少しずつ伸び縮みします
          （端にだけ半端なマスは作りません）。</div>
        ${(st.mesh_cols && (st.mesh_col_m===undefined || st.mesh_col_m===''))
          ? `<div class="dim small">この範囲はいま「横${esc(st.mesh_cols)}分割」です。
             横の間隔を入れて決め直すと、間隔での持ち方に変わります。</div>` : ''}
      </div>

      <button class="btn pri" onclick="saveMesh('${stUuid}')">この格子で決める</button>
      ${cells ? `<div class="warnbox">すでに <b>${cells}マス</b> 入力しています。<br>
        四隅や細かさを変えると、同じ「3行2列」でも川の別の場所を指すことになります。
        そのため<b>前の格子で入れたマスは、新しい格子の一覧・まとめには混ぜません</b>。<br>

    `,
    onMount(){

        box.textContent = gpsHint();
      }, 2000);
      window._meshCorners = (meshCorners(st)||[]).slice();
      showMeshPlan();
      const first = (window._meshCorners[0]) || stationPt(st)
        || (sv ? stationPt(sv) : null) || [43.06, 141.35];
      MAPS.main.map = makeMap('meshmap', first, 17);
      const map = MAPS.main.map;
      if(!map) return;
      applyBaseMap('main', baseMapName());
      addLocateControl(map);
      drawMeshSetup();
      map.on('click', e=>{
        const list = window._meshCorners || [];
        if(list.length>=4) list.length = 0;      // 4つそろっていたら、押し直しで作り直す
        list.push([+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]);
        window._meshCorners = list;
        drawMeshSetup();
        showMeshPlan();
      });

};
/* いまいる場所を四隅の1つとして押さえる */
function grabMeshCorner(i){
  toast('現在地を取っています…');
  getFixOnce(f=>{
    if(!f){ toast('現在地を取れませんでした'); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので押さえていません`, 8000);
      return;
    }
    const list = (window._meshCorners||[]).slice();
    while(list.length < i) list.push(null);
    list[i] = [+f.lat.toFixed(6), +f.lon.toFixed(6)];
    window._meshCorners = list;
    drawMeshSetup();
    showMeshPlan();
    toast(`${i+1}つ目を押さえました`);
  });
}
/* 押さえた四隅を、最後の1つだけ取り消す（2026-08-24 の実機の声）。
   「いまここ」で順番を飛ばして押さえた場合の空きは数えず、
   入っている中でいちばん後ろの1つを外す */
function undoMeshCorner(){
  const list = (window._meshCorners||[]).slice();
  let i = list.length - 1;
  while(i >= 0 && !list[i]) i--;
  if(i < 0){ toast('戻す四隅がありません'); return; }
  list.length = i;               // その1つと、後ろの空きをまとめて外す
  // 前に残った空き（順番を飛ばして押さえた分）も片付ける。残すと、
  // 次の地図タップが1つ目ではなく2つ目として入ってしまう（監査85回目 minor）
  while(list.length && !list[list.length-1]) list.pop();
  window._meshCorners = list;
  drawMeshSetup();
  showMeshPlan();
  toast(`${i+1}つ目を取り消しました`);
}
function clearMeshCorners(){
  if(!confirm('押さえた四隅を消します。よろしいですか？')) return;
  window._meshCorners = [];
  drawMeshSetup();
  showMeshPlan();
}
/* 四隅と格子を地図に描く */
function drawMeshSetup(){
  const map = MAPS.main.map; if(!map) return;
  try{ MESHLAYER.forEach(x=>map.removeLayer(x)); }catch(e){}
  MESHLAYER = [];
  const list = (window._meshCorners||[]).filter(Boolean);
  list.forEach((pt,i)=>{
    if(!validPt(pt)) return;
    MESHLAYER.push(L.marker(pt, {icon:dotIcon('#4aa3ff',13)}).addTo(map));
    MESHLAYER.push(L.marker(pt, {icon:L.divIcon({className:'',
      html:`<div style="color:#4aa3ff;font-weight:700;text-shadow:0 0 3px #000">${i+1}</div>`,
      iconSize:[16,16], iconAnchor:[-6,16]})}).addTo(map));
  });
  const tmp = tmpMeshStation();
  const g = meshPlan(tmp);
  if(g){
    MESHLAYER.push(L.polygon(g.corners, {color:'#4aa3ff', weight:2, fillOpacity:.06}).addTo(map));
    // 細かすぎるとぼやけるので、線は最大30本ずつ。
    // ただし引く場所は本当の境目にする（間引いた本数で割ると、線が実際とずれる）
    const pickLines = (total)=>{
      const out = [];
      const step = Math.max(1, Math.ceil((total-1)/30));
      for(let i=step;i<total;i+=step) out.push(i);
      return out;
    };
    pickLines(g.rows).forEach(r=>{
      const v = r/g.rows;
      const p1 = [g.corners[0][0]+(g.corners[3][0]-g.corners[0][0])*v,
                  g.corners[0][1]+(g.corners[3][1]-g.corners[0][1])*v];
      const p2 = [g.corners[1][0]+(g.corners[2][0]-g.corners[1][0])*v,
                  g.corners[1][1]+(g.corners[2][1]-g.corners[1][1])*v];
      MESHLAYER.push(L.polyline([p1,p2], {color:'#4aa3ff', weight:1, opacity:.5}).addTo(map));
    });
    pickLines(g.cols).forEach(c2=>{
      const u = c2/g.cols;
      const p1 = [g.corners[0][0]+(g.corners[1][0]-g.corners[0][0])*u,
                  g.corners[0][1]+(g.corners[1][1]-g.corners[0][1])*u];
      const p2 = [g.corners[3][0]+(g.corners[2][0]-g.corners[3][0])*u,
                  g.corners[3][1]+(g.corners[2][1]-g.corners[3][1])*u];
      MESHLAYER.push(L.polyline([p1,p2], {color:'#4aa3ff', weight:1, opacity:.5}).addTo(map));
    });
    try{ map.fitBounds(L.latLngBounds(g.corners).pad(0.25), {animate:false}); }catch(e){}
  }
  // 押さえた分だけ画面の表にも書き戻す
  [0,1,2,3].forEach(i=>{
    const el = $('#mc_'+i); if(!el) return;
    const pt = list[i] || (window._meshCorners||[])[i];
    el.innerHTML = (pt && validPt(pt))
      ? esc(pt[0].toFixed(6)+', '+pt[1].toFixed(6))
      : '<span class="pill ng">まだ</span>';
  });
}
/* いま画面にある値だけで作った、仮の箇所 */
function tmpMeshStation(){
  return {
    mesh_corners: (window._meshCorners||[]).filter(Boolean),
    mesh_row_m: strVal('#mesh_gap'), mesh_col_m: strVal('#mesh_colm'),
  };
}
/* 何マスになるかを、決める前に見せる */
function showMeshPlan(){
  const box = $('#mesh_plan'); if(!box) return;
  const tmp = tmpMeshStation();
  const list = (window._meshCorners||[]).filter(Boolean);
  const cerr = list.length===4 ? meshCornerError(list) : '';
  if(cerr){ box.textContent = cerr; drawMeshSetup(); return; }
  const c = meshCorners(tmp);
  if(!c){ box.textContent = '四隅を4つとも押さえると、マスの数が出ます。'; drawMeshSetup(); return; }
  const g = meshPlan(tmp);
  if(!g){ box.textContent = `縦 ${fmtDist(meshLength(tmp))}／横 ${fmtDist(meshWidth(tmp))}。`
    + '縦の間隔と横の間隔を入れてください。'; drawMeshSetup(); return; }
  box.textContent = `縦 ${fmtDist(g.length)}（${g.rows}行）× 横 ${fmtDist(g.width)}（${g.cols}列）`
    + ` ＝ ${g.n}マス`
    + `（1マス およそ 縦${(g.length/g.rows).toFixed(1)}m × 横${(g.width/g.cols).toFixed(1)}m）`
    + (g.n > MESH_MAX_CELLS ? `　※${MESH_MAX_CELLS}マスを超えるので決められません` : '');
  drawMeshSetup();
}
/* 格子を決めて保存する */
function saveMesh(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  // 地点（目印）には格子を作らせない。作ると、地点と物理環境の記録が混ざる
  //（監査56回目 Critical）
  if(st.is_spot){
    toast('地点には格子を作れません。物理環境調査の地図から作ってください', 8000);
    return;
  }
  const tmp = tmpMeshStation();
  const cerr = meshCornerError((window._meshCorners||[]).filter(Boolean));
  if(cerr){ toast(cerr, 6000); return; }
  const c = meshCorners(tmp);
  if(!c){ toast('四隅を4つとも押さえてください', 5000); return; }
  const err = rangeCheck([['縦の間隔', strVal('#mesh_gap'), 0.1, 1000],
                          ['横の間隔', strVal('#mesh_colm'), 0.1, 1000]]);
  if(err){ toast(err, 6000); return; }
  const g = meshPlan(tmp);
  if(!g){ toast('縦の間隔と横の間隔を入れてください', 5000); return; }
  if(g.n > MESH_MAX_CELLS){
    toast(`${g.n}マスは多すぎます（${MESH_MAX_CELLS}マスまで）。`
      + '間隔を広げるか、範囲を分けてください', 8000);
    return;
  }
  const before = meshGridSig(st);
  st.mesh_corners = c;
  st.mesh_row_m   = numOf(strVal('#mesh_gap'));
  st.mesh_col_m   = numOf(strVal('#mesh_colm'));
  delete st.mesh_cols;                    // 前の「分割数」は、間隔の持ち方に置き換える
  delete st.mesh_rows;                    // 間隔から数え直す
  // 中身が変わったときだけ版を新しくする。
  // 版が変われば、前の格子で入れたマスは一覧にも集計にも混ざらない
  if(!st.mesh_grid_id || meshGridSig(st)!==before) st.mesh_grid_id = uuid();
  if(!DB.upsert(DB.key.st, st)) return;
  // 次に作るときの初期値として覚えておく（この端末だけ）
  prefSet('mesh_row_m', st.mesh_row_m);
  prefSet('mesh_col_m', st.mesh_col_m);
  toast(`${g.rows}行 × ${g.cols}列 ＝ ${g.n}マスにしました`);
  goTo('mesh', stUuid);
}
/* 箇所を保存してから格子の画面へ。保存できなければ動かない */
function toMeshSetup(svUuid, stUuid){
  // 地点（目印）には格子を作らせない。作ると、地点と物理環境の記録が混ざる
  //（監査56回目 Critical）
  const st0 = stUuid ? DB.liveStation(stUuid) : null;
  if(st0 && st0.is_spot){
    toast('地点には格子を作れません。物理環境調査の地図から作ってください', 8000);
    return;
  }
  if(stUuid){ nav('meshSetup', stUuid); return; }
  toast('先にこの記録を保存します…');
  saveStation(svUuid, '', {then:'meshSetup'});
}

function meshCellSels(){
  const sels = ['#mx_d','#mx_v','#mx_note'];
  OPT.substrate.forEach(k=>sels.push('#mxp_'+SUBSTRATE_NO[k]));
  return sels;
}
function collectMeshCell(){
  const o = collectSels(meshCellSels());
  o.__sub = segVal('mx_sub'); o.__hab = segVal('mx_hab');
  o.__gr  = segVal('mx_gr');  o.__cov = segRaw('mx_cov');
  return o;
}
function saveMeshCell(stUuid, row, col, next){
  const st = DB.liveStation(stUuid); if(!st) return;
  const g = meshGeom(st); if(!g) return;
  const checks = [['水深', strVal('#mx_d'), 0, 2000], ['流速', strVal('#mx_v'), 0, 1000]];
  OPT.substrate.forEach(k=>checks.push([k+'の割合', strVal('#mxp_'+SUBSTRATE_NO[k]), 0, 100]));
  const err = rangeCheck(checks);
  if(err){ toast(err, 6000); return; }

  // いまの格子のマスだけを「同じマス」とみなす。
  // 前の格子の同じ行・列に上書きすると、別の場所の記録を書き換えてしまう
  const cells = meshCurrentCells(st);
  const cur = meshCellMap(cells)[row+'_'+col];
  const rec = cur ? (DB.get(DB.key.mc, cur.uuid) || {uuid:cur.uuid})
                  : {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
                     row, col, measured_at:nowISO()};
  rec.grid_id = meshGridId(st);
  // 記録した時刻は、最初の保存のときに自動で付く。あとから直しても
  // 上書きしない（現場で測った時刻の意味を守る）。前の版で時刻の無い
  // マスだけ、ここで穴埋めする
  if(!rec.measured_at) rec.measured_at = nowISO();
  rec.survey_uuid = rec.survey_uuid || st.survey_uuid;
  rec.station_uuid = rec.station_uuid || stUuid;
  rec.row = row; rec.col = col;
  const pos = meshCellCenter(g.corners, g.rows, g.cols, row, col);
  rec.latitude = +pos[0].toFixed(6);
  rec.longitude = +pos[1].toFixed(6);
  rec.depth_cm = numVal('#mx_d');
  rec.velocity_cms = numVal('#mx_v');
  // 「なし」は空欄の合図。ただしカバーだけは正本の一覧に「なし」が実在するので、
  // そのまま受ける（2026-08-16 の監査で同じ取り違えがあった）
  rec.substrate = segVal('mx_sub');
  rec.habitat_type = segVal('mx_hab');
  rec.gravel_condition = segVal('mx_gr');
  rec.cover = segRaw('mx_cov');
  rec.note = strVal('#mx_note');
  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#mxp_'+SUBSTRATE_NO[k]); });
  rec.substrate_pct = pct;
  // 何も入っていないマスは作らない（開いただけで増えないように）
  if(!cur && rec.depth_cm==='' && rec.velocity_cms==='' && !rec.substrate
     && !rec.habitat_type && !rec.gravel_condition && !rec.cover && !rec.note
     && !Object.keys(pct).some(k=>pct[k]!=='')){
    toast('何か入れてから保存してください');
    return;
  }
  if(!DB.upsert(DB.key.mc, rec)) return;
  draftClear('meshcell:'+stUuid+':'+row+':'+col);
  draftUnbind();
  toast('保存しました');
  if(next){
    // 右へ。行の終わりなら次の行の左へ。最後なら一覧へ戻る
    let r = row, c = col + 1;
    if(c >= g.cols){ c = 0; r += 1; }
    if(r >= g.rows){ goTo('mesh', stUuid); return; }
    navReplace('meshCell', {station:stUuid, row:r, col:c});
  }else{
    goTo('mesh', stUuid);
  }
}
/* 1つ前のマス（左どなり。行の頭なら前の行の右端）の中身を写す */
function copyPrevMeshCell(stUuid, row, col){
  const st = DB.liveStation(stUuid); if(!st) return;
  const g = meshGeom(st); if(!g) return;
  let r = row, c = col - 1;
  if(c < 0){ r = row - 1; c = g.cols - 1; }
  if(r < 0){ toast('1つ前のマスがありません'); return; }
  const prev = meshCellMap(meshCurrentCells(st))[r+'_'+c];
  if(!prev){ toast('1つ前のマスは、まだ入力されていません'); return; }
  applyVals({'#mx_d': prev.depth_cm!==undefined?prev.depth_cm:'',
             '#mx_v': prev.velocity_cms!==undefined?prev.velocity_cms:'',
             '#mx_note': prev.note||''});
  applySeg('mx_sub', prev.substrate); applySeg('mx_hab', prev.habitat_type);
  applySeg('mx_gr', prev.gravel_condition); applySegRaw('mx_cov', prev.cover);
  const pct = (prev.substrate_pct && typeof prev.substrate_pct==='object') ? prev.substrate_pct : {};
  OPT.substrate.forEach(k=>{
    const el = $('#mxp_'+SUBSTRATE_NO[k]);
    if(el) el.value = (pct[k]!==undefined ? pct[k] : '');
  });
  draftTouch();
  toast(`${r+1}行 ${c+1}列 の中身を写しました`);
}
function delMeshCell(uu){
  if(!confirm('このマスの記録を消します。よろしいですか？')) return;
  const rec = DB.get(DB.key.mc, uu);
  if(DB.softDelete(DB.key.mc, uu)){
    draftClear('meshcell:'+(rec?rec.station_uuid:'')+':'+(rec?rec.row:'')+':'+(rec?rec.col:''));
    toast('消しました');
    if(rec) goTo('mesh', rec.station_uuid); else goBack();
  }
}

        <input id="spq" placeholder="和名・科名・昔の呼び名で探す"
          oninput="renderSpeciesList('${stUuid}','${then}')" autocomplete="off">
        <div class="dim small" style="margin-top:6px">昔の呼び名（エゾイワナ・ヤマメなど）でも探せます。保存されるのは正式な種です。</div>
      </div>
      <div id="splist"></div>
    `,
    onMount(){ renderSpeciesList(stUuid, then); const q=$('#spq'); if(q) q.focus(); }
  };
};
function renderSpeciesList(stUuid, then){
  const q = strVal('#spq');
  const list = speciesSearch(q).slice(0, 200);
  const box = $('#splist'); if(!box) return;
  if(!list.length){
    box.innerHTML = `<div class="card dim">見つかりませんでした。魚類データベースの種リストに無い種かもしれません。</div>`;
    return;
  }
  box.innerHTML = `<div class="splist">` + list.map(s=>{
    const al = speciesAliasOf(s.id);
    return `<div class="spitem" onclick="pickSpecies('${stUuid}','${s.id}','${then||''}')">
      ${esc(s.ja)}<span class="fam">${esc(s.fam||'')}</span>
      ${al.length?`<div class="dim small">別名：${esc(al.join('・'))}</div>`:''}
    </div>`;
  }).join('') + `</div>`;
}
function pickSpecies(stUuid, spId, then){
  if(then!=='individuals'){ nav('catchEdit', {station:stUuid, species:spId}); return; }
  // 測りながら魚種を足すとき。すでにこの箇所にある種なら、そこへ戻るだけ
  const found = DB.catchesOf(stUuid).find(c=>c.species_id===spId);
  if(found){ navReplace('individuals', found.uuid); return; }
  const st = DB.liveStation(stUuid); if(!st) return;
  const sp = speciesById(spId);
  const rec = {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
    recorded_at:nowISO(),
    species_id:spId||'', species_name:sp?sp.ja:'', species_family:sp?sp.fam:'',
    count_unmeasured:'', identification_confidence:'確実', notes:''};
  if(!DB.upsert(DB.key.ca, rec)) return;
  navReplace('individuals', rec.uuid);
}

/* ---------- 尾数を入れる ---------- */

  if(!st) return null;

      <div class="card">

            <div class="dim small">この魚種の合計</div>

          </div>
          <div class="grow dim small">
            測った ${nInd}尾<br>数えただけ ${esc(c.count_unmeasured!==undefined&&c.count_unmeasured!==''?c.count_unmeasured:0)}尾
          </div>
        </div>
        <button class="btn ok" onclick="toIndividuals('${stUuid}','${arg.uuid||''}','${spId||''}')">

        <label>数えただけの尾数（測らない分）</label>

          placeholder="例）30">
        <div class="dim small">測った分と足して尾数になります。全部測るならここは空のままで構いません。</div>
        <label>同定の確からしさ</label>
        ${segHtml('conf', OPT.confidence, c.identification_confidence||'確実')}
        <label>備考</label>
        <textarea id="c_note">${esc(c.notes||'')}</textarea>
      </div>
      ${photoPanelHtml('同定の証拠に。魚を並べた写真、特徴の分かる写真など。')}
      ${sp?'':'<div class="ngbox">この記録には種IDがありません。データベース取り込み用のCSVからは除かれます。</div>'}

      // （2026-08-17 の監査 Critical）
      SCREENS._photos = ((c && c.photos)||[]).slice();

function collectCatch(){
  return {
    count_unmeasured: strVal('#c_n'),
    identification_confidence: segVal('conf'),
    notes: strVal('#c_note'),
    photos: (SCREENS._photos||[]).slice(),
  };
}

function saveCatch(stUuid, caUuid, spId, next){
  const st = DB.get(DB.key.st, stUuid); if(!st) return;
  const sp = speciesById(spId);
  const rec = caUuid ? (DB.get(DB.key.ca, caUuid)||{uuid:caUuid})
                     : {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
                        recorded_at:nowISO()};
  rec.survey_uuid  = rec.survey_uuid  || st.survey_uuid;
  rec.station_uuid = rec.station_uuid || stUuid;
  if(spId){ rec.species_id=spId; rec.species_name=sp?sp.ja:''; rec.species_family=sp?sp.fam:''; }
  const raw = strVal('#c_n');
  if(countOf(raw)===null){
    toast('尾数は0以上の整数で入れてください（小数やマイナスは入れられません）', 5000);
    return;                       // 保存もせず、画面も動かさない
  }
  rec.count_unmeasured        = countOf(raw);
  rec.identification_confidence = segVal('conf');
  rec.notes                   = strVal('#c_note');
  rec.photos                  = (SCREENS._photos||[]).slice();
  const draftKey = 'catch:'+(caUuid || ('new:'+stUuid+':'+(spId||'')));
  if(catchTotalOf(rec)<=0){
    toast('尾数を入れてください（0だと書き出しから除かれます）');
  }
  if(!DB.upsert(DB.key.ca, rec)) return;   // 保存できていないので書きかけを消さない
  photoOwnerDone(rec.photos);              // 付いたので、印は外す
  draftClear(draftKey);
  draftUnbind();
  toast('保存しました');
  if(next){
    // 「次の魚種へ」。1つ下がすでに魚種選びなら、そこへ戻るだけ。
    // 積み上げると「戻る」で同じ画面を何度も通ることになる
    if(STACK.length>1 && STACK[STACK.length-2].name==='speciesPick'){ STACK.pop(); render(); }
    else navReplace('speciesPick', stUuid);
  }
  else { goTo('station', stUuid); }
}
/* 「1尾ずつ測る」へ。記録がまだ無ければ先に作る（個体は記録にぶら下がるため） */
function toIndividuals(stUuid, caUuid, spId){
  if(caUuid){ nav('individuals', caUuid); return; }
  const st = DB.getAlive(DB.key.st, stUuid); if(!st) return;
  const raw = strVal('#c_n');
  if(countOf(raw)===null){
    toast('数えただけの尾数は0以上の整数で入れてください（空でも構いません）', 5000);
    return;
  }
  const sp = speciesById(spId);
  const rec = {uuid:uuid(), survey_uuid:st.survey_uuid, station_uuid:stUuid,
    recorded_at:nowISO(),
    species_id:spId||'', species_name:sp?sp.ja:'', species_family:sp?sp.fam:'',
    count_unmeasured: countOf(raw),
    identification_confidence: segVal('conf'),
    notes: strVal('#c_note'),
    // ここで入れないと、写真を付けてから「1尾ずつ測る」を押した分が消える
    // （2026-08-17 の監査 Critical）
    photos: (SCREENS._photos||[]).slice()};
  if(!DB.upsert(DB.key.ca, rec)) return;
  photoOwnerDone(rec.photos);              // 付いたので、印は外す
  draftClear('catch:new:'+stUuid+':'+(spId||''));
  draftUnbind();
  // 履歴に「魚の記録」を残したまま個体入力へ。戻れば尾数の画面に帰る
  navReplace('catchEdit', {uuid: rec.uuid});
  nav('individuals', rec.uuid);
}

/* まだ保存していない記録にも使える版 */
function catchTotalOf(rec){
  const measured = rec.uuid ? DB.individualsOf(rec.uuid).length : 0;
  const un = countOf(rec.count_unmeasured);
  return measured + (un==='' || un===null ? 0 : un);
}
function deleteCatch(u){
  if(!confirm('この記録を削除します。よろしいですか？')) return;
  const c = DB.get(DB.key.ca, u);
  if(DB.softDelete(DB.key.ca, u)){
    draftClearFor('魚', u);
    toast('削除しました'); goTo('station', c?c.station_uuid:null);
  }
}

    return `<div class="card">

      </div>

      ${pts.length ? `<div class="card" style="padding:4px 12px">
        <table><thead><tr><th class="num">番号</th><th class="num">水深cm</th>
          <th class="num">流速cm/s</th><th>河床材</th><th>位置</th><th></th></tr></thead>

/* いま位置がどれくらい受かっているか。現場で「取れていない」と気づけるように */
function gpsHint(){
  const f = freshFix(20000);
  if(!f) return '位置：まだ取れていません（空の見えるところでお待ちください）';
  if(f.acc > GPS_MAX_ACC) return `位置：±${Math.round(f.acc)}m（粗いので測点には付けません）`;
  return `位置：±${Math.round(f.acc)}m で受かっています`;
}

function addEnvPoint(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  const d = numVal('#p_d'), v = numVal('#p_v');
  if(d==='' && v===''){ toast('水深か流速のどちらかは入れてください'); return; }
  const perr = rangeCheck([['水深', strVal('#p_d'), 0, 2000],
                           ['流速', strVal('#p_v'), 0, 1000]]);
  if(perr){ toast(perr, 6000); return; }

  const pt = {depth_cm:d, velocity_cms:v, substrate:segVal('p_sub'), note:strVal('#p_note')};
  // いま立っている場所を添える。
  // 古い測位や粗すぎる位置は付けない（前の測点の場所が付くほうが困る）
  const fix = freshFix(20000);
  let posMsg = '';
  if(fix && fix.acc<=GPS_MAX_ACC){
    pt.latitude = +fix.lat.toFixed(6);
    pt.longitude = +fix.lon.toFixed(6);
    pt.gps_accuracy = Math.round(fix.acc);
    pt.position_source = 'GPS';
  }else{
    posMsg = fix ? '（位置は粗すぎるので付けていません）' : '（位置が取れていません）';
  }

  const pts = envPoints(st).slice();
  pts.push(pt);
  st.env_points = pts;
  if(!DB.upsert(DB.key.st, st)) return;      // 保存できていないので欄も消さない
  // 測点の欄だけを空にして控え直す。そのまま render() すると、
  // まだ保存していない代表値やカバーの入力まで消える
  const dft = draftForForm('env:'+stUuid) || {};
  ['#p_d','#p_v','#p_note'].forEach(k=>{ dft[k] = ''; });
  dft.__sub = '';
  draftSave('env:'+stUuid, dft);
  toast(`${pts.length}点目${posMsg}`, posMsg?4000:2400);
  render();
}
function delEnvPoint(stUuid, i){
  const st = DB.liveStation(stUuid); if(!st) return;
  const pts = envPoints(st).slice();
  if(i<0 || i>=pts.length) return;
  if(!confirm(`${i+1}点目を消します。よろしいですか？`)) return;
  pts.splice(i,1);
  st.env_points = pts;
  if(DB.upsert(DB.key.st, st)){ toast('消しました'); render(); }
}
function saveEnv(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return;
  const checks = [['代表の水深', strVal('#e_drep'), 0, 2000],
                  ['代表の流速', strVal('#e_vrep'), 0, 1000]];
  OPT.substrate.forEach(k=>checks.push([k+'の割合', strVal('#sp_'+SUBSTRATE_NO[k]), 0, 100]));
  ['left','right'].forEach(side=>{
    const label = side==='left' ? '左岸' : '右岸';
    [0,1,2].forEach(i=>checks.push([label+'のカバーの割合', strVal('#cv_'+side+'_'+i), 0, 100]));
    checks.push([label+'のカバーの長さ', strVal('#cv_'+side+'_len'), 0, 100000]);
  });
  const err = rangeCheck(checks);
  if(err){ toast(err, 6000); return; }
  st.depth_rep_cm     = numVal('#e_drep');
  st.velocity_rep_cms = numVal('#e_vrep');

  const pct = {};
  OPT.substrate.forEach(k=>{ pct[k] = numVal('#sp_'+SUBSTRATE_NO[k]); });
  st.substrate_pct = pct;
  // 割合を入れたなら、多い順の1位2位を優占・次優占にする
  const rank = substrateRank({substrate_pct:pct});
  if(rank.length){
    st.substrate1 = rank[0].name;
    st.substrate2 = rank[1] ? rank[1].name : '';
  }

  ['left','right'].forEach(side=>{
    const list = [];
    [0,1,2].forEach(i=>{
      const type = strVal('#cv_'+side+'_'+i+'_t');
      const p = numVal('#cv_'+side+'_'+i);
      if(type) list.push({type, pct:p});
    });
    st['cover_'+side] = list;
    st['cover_'+side+'_length_m'] = numVal('#cv_'+side+'_len');
  });

  if(DB.upsert(DB.key.st, st)){

  SITEMARK = [
    L.circle([lat,lon], {radius:r, color:'#3fb950', weight:2, fillOpacity:.12}).addTo(map),
    L.marker([lat,lon], {icon:dotIcon('#3fb950',14)}).addTo(map),
  ];
}
function siteRadius(){
  const r = numVal('#si_r') || 100;
  const el = $('#si_rInfo'); if(el) el.textContent = `半径 ${r} m`;

  const map = MAPS.main.map;

/* 並べて打った数字をほぐす。空白・カンマ・改行・読点・セミコロンで区切る */
function parseLengths(text){
  const raw = String(text||'').split(/[\s,、，;；\/]+/).filter(x=>x!=='');
  const ok = [], bad = [];
  raw.forEach(t=>{
    const n = numOf(t);
    if(n==='' || n<=0) bad.push(t); else ok.push(n);
  });
  return {ok, bad, n: raw.length};
}
/* まとめて入れる欄の下に、いま何尾ぶんか出す */
function bulkHint(){
  const box = $('#i_bulk'), out = $('#i_bulkInfo'), btn = $('#i_bulkBtn');
  if(!box || !out) return;
  const r = parseLengths(box.value);
  out.innerHTML = r.n===0
    ? '数字を打って「つぎ」を押してください。'
    : (r.bad.length
        ? `<span class="pill ng">読めない値 ${r.bad.length}個</span> ${esc(r.bad.slice(0,6).join(' '))}`
          + '<br>直してから追加してください。'
        : `${r.ok.length}尾ぶん。最小 ${fmtNum(Math.min.apply(null,r.ok),1)}／`
          + `最大 ${fmtNum(Math.max.apply(null,r.ok),1)} cm`);
  if(btn){
    btn.disabled = !(r.ok.length && !r.bad.length);
    btn.textContent = r.ok.length && !r.bad.length
      ? `${r.ok.length}尾をまとめて追加` : 'まとめて追加';
  }
}
/* 打ち込み途中の並びを覚えておく。画面が描き直されても消えないように */
let BULK_TEXT = {};
function bulkKeep(caUuid){
  const box = $('#i_bulk');
  if(box) BULK_TEXT[caUuid] = String(box.value);
}
function bulkRestore(caUuid){
  const box = $('#i_bulk');
  if(box && BULK_TEXT[caUuid]) box.value = BULK_TEXT[caUuid];
}
/* いま開いている記録に対して覚え直す */
function bulkKeepAll(){
  const cur = STACK[STACK.length-1];
  if(cur && cur.name==='individuals' && cur.arg) bulkKeep(cur.arg);
}
/* 区切りを入れる。テンキーには空白キーが無いので、画面のボタンで区切る */
function bulkSep(){
  const box = $('#i_bulk'); if(!box) return;
  const v = String(box.value);
  if(v.trim()!=='' && !/[\s,、，;；\/]$/.test(v)) box.value = v + ' ';
  box.focus();
  bulkKeepAll();
  bulkHint();
}
/* 打ち間違いを1つ戻す。テンキーだと文字を選んで直しにくいため */
function bulkUndo(){
  const box = $('#i_bulk'); if(!box) return;
  const t = String(box.value).split(/[\s,、，;；\/]+/).filter(x=>x!=='');
  t.pop();
  box.value = t.length ? t.join(' ') + ' ' : '';
  box.focus();
  bulkKeepAll();
  bulkHint();
}

/* まとめて追加。1つでも読めない値があれば、1尾も入れない
   （半端に入ると、どこまで入ったか分からなくなる） */
function addIndividualsBulk(caUuid){
  const c = DB.getAlive(DB.key.ca, caUuid); if(!c) return;
  const r = parseLengths(strVal('#i_bulk'));
  if(!r.ok.length){ toast('数字を並べて入れてください'); return; }
  if(r.bad.length){
    toast(`読めない値があります：${r.bad.slice(0,5).join(' ')}。直してからお試しください`, 6000);
    return;
  }
  let list = DB.individualsOf(caUuid);
  let no = list.reduce((m,i)=>Math.max(m, numOf(i.individual_number)||0), 0);
  // まとめて1回で保存する。1尾ずつ保存すると、途中で失敗したとき半端に残る
  let all;
  try{ all = DB.loadRaw(DB.key.ind); }
  catch(e){ toast('保存された記録を読み取れないため、追加を中止しました', 6000); return; }
  const at = nowISO();
  r.ok.forEach(L=>{
    no += 1;
    all.push({uuid:uuid(), catch_uuid:caUuid,
      station_uuid:c.station_uuid, survey_uuid:c.survey_uuid,
      individual_number:no, total_length_cm:L, fork_length_cm:'',
      recorded_at:at, created_at:at, updated_at:at});
  });
  if(!DB.save(DB.key.ind, all)) return;      // 保存できていないので欄も消さない
  delete BULK_TEXT[caUuid];                  // 入れ終わったので覚えておかない
  toast(`${r.ok.length}尾を追加しました`);
  render();
}

function addIndividual(caUuid){

/* ---------- オフライン地図 ---------- */
let OPOLY = [];
// 圏外用の地図をさわる処理は、いちどに1つだけ。
// 保存と削除が重なると、一覧と実体が食い違う。
// 返事が返ってこなかったときは、読み込み直しても解けないよう印を残す
// （向こうはまだ動いているかもしれない）
let PACK_BUSY = false;
/* 出し入れ中であることを示す札。
   ただの「保存」「削除」という文字だと、別のタブの札を上書き・削除してしまう。
   操作ごとに別の札（id つき）にして、自分の札だけを外す（7回目の監査 Major）。
     {id, kind:'保存'|'削除', at, deadline, state:'進行中'|'結果不明'}  */
function packPending(){
  try{
    const o = JSON.parse(localStorage.getItem('fs_pack_pending')||'null');
    return (o && typeof o.id==='string' && o.id) ? o : null;
  }catch(e){ return null; }
}
/* 札を置く。使用権があり、ほかの札が無いときだけ。置けたら id を返す。
   置くのは「頼む前」。頼んだ後だと、返事を待つ間に読み込み直されて札が無い */
function packPendingSet(kind, timeoutMs){
  if(!ownsLock()) return null;
  if(packPending()) return null;             // ほかの札があれば上書きしない
  const rec = {id:uuid(), kind, at:Date.now(),
               deadline:Date.now() + (timeoutMs||300000), state:'進行中'};
  try{ localStorage.setItem('fs_pack_pending', JSON.stringify(rec)); }
  catch(e){ return null; }
  const back = packPending();                // 置けたことを読み直して確かめる
  return (back && back.id===rec.id) ? rec.id : null;
}
/* 自分の札だけを外す */
function packPendingDrop(id){
  const cur = packPending();
  if(!cur) return true;
  if(id && cur.id!==id) return false;        // 別のタブの札は触らない
  try{ localStorage.removeItem('fs_pack_pending'); return true; }catch(e){ return false; }
}
/* 返事が来なかった札に「結果不明」の印を付ける */
function packPendingUnknown(id){
  const cur = packPending();
  if(!cur || cur.id!==id) return;
  cur.state = '結果不明';
  try{ localStorage.setItem('fs_pack_pending', JSON.stringify(cur)); }catch(e){}
}
/* 解除してよいか。使用権があり、かつ「結果不明」か、待ち時間を過ぎていること。
   まだ動いている最中の札を、別のタブから外させない */
function packPendingClearable(){
  const cur = packPending();
  if(!cur) return false;
  return ownsLock() && (cur.state==='結果不明' || Date.now() > cur.deadline);
}
/* 「確かめたので続ける」 */
function packPendingClear(){
  if(!packPendingClearable()){
    toast(ownsLock() ? 'まだ処理中かもしれません。少し待ってからもう一度押してください'
                     : 'このタブでは解除できません。記録を入れているタブで行ってください', 6000);
    return;
  }
  const cur = packPending();
  if(!packPendingDrop(cur.id)){
    toast('解除できませんでした。ページを読み込み直してください', 6000);
    return;
  }
  PACK_BUSY = false;          // 同じ画面のまま、次の出し入れができるようにする
  toast('解除しました');
  render();
}
function packLocked(){ return PACK_BUSY || !!packPending(); }

function opolyDraw(){
  const map = MAPS.off.map;
  if(!map) return;
  if(OPOLYLAYER){ try{ map.removeLayer(OPOLYLAYER); }catch(e){} OPOLYLAYER=null; }
  if(OPOLY.length<2){
    if(OPOLY.length===1) OPOLYLAYER = L.circleMarker(OPOLY[0], {radius:5, color:'#4aa3ff'}).addTo(map);
    return;
  }
  OPOLYLAYER = (OPOLY.length>=3
    ? L.polygon(OPOLY, {color:'#4aa3ff', weight:2, fillOpacity:.15})
    : L.polyline(OPOLY, {color:'#4aa3ff', weight:2})).addTo(map);
}
function opolyUndo(){ OPOLY.pop(); opolyDraw(); }
function opolyClear(){ OPOLY=[]; opolyDraw(); }

function opolyZmax(){ const v=segVal('ozoom')||'z15'; return parseInt(v.replace(/[^\d]/g,''),10)||15; }
function opolyEstimate(){

  const layers = segMultiVal('olayers');

  const e = packEstimate(OPOLY, opolyZmax(), layers);
  el.textContent = `およそ ${e.tiles}枚・${e.mb}MB。通信できるところで保存してください。`;

function opolySave(svUuid){
  if(packLocked()){ toast('いま別の地図の出し入れが終わっていません。少し待ってください'); return; }
  if(!ownsLock()){
    toast('このタブでは地図を保存できません。記録を入れているタブから行ってください', 6000);
    return;
  }
  if(OPOLY.length<3){ toast('まず3点以上で囲ってください'); return; }
  const layers = segMultiVal('olayers');
  if(!layers.length){ toast('落とす地図を選んでください'); return; }
  const zmax = opolyZmax();
  const poly = OPOLY.slice();
  const urls = packTileUrls(poly, zmax, layers);
  const prog = $('#oprog');
  const jobId = packPendingSet('保存', 600000);
  if(!jobId){
    toast('いま別の出し入れが終わっていないか、印を置けませんでした', 8000);
    return;
  }
  // 一覧の書き換えまで終わってから札を外す。先に外すと、
  // その間に別のタブが古い一覧をもとに書き込める
  const done = (fn)=>{ try{ fn(); } finally { packPendingDrop(jobId); PACK_BUSY = false; } };
  if(prog) prog.textContent = `${urls.length}枚を保存しています…`;
  PACK_BUSY = true;
  swAsk({type:'savePack', urls}, 600000).then(r=>{
    const okN   = (r && r.ok)   || 0;
    const failN = (r && r.fail) || 0;
    if(okN===0){
      // 1枚も入っていないのに「保存しました」と言わない。
      // 圏外で地図が出ないことに現場で気づくことになる
      done(()=>{
        if(prog) prog.textContent = `1枚も保存できませんでした（${failN}枚失敗）。`
          + '電波の届くところでもう一度お試しください。';
        toast('保存できませんでした', 5000);
      });
      return;
    }
    // 保存に時間がかかる間に、使用権がほかのタブへ移っていることがある
    if(!ownsLock()){
      done(()=>{
        if(prog) prog.textContent = '地図は保存できましたが、'
          + '途中で使用権がほかのタブへ移ったため、一覧に記録できませんでした。'
          + 'ページを読み込み直してからやり直してください。';
        toast('一覧に記録できませんでした。読み込み直してください', 8000);
      });
      return;
    }
    const list = packStore();
    // 消すときに実体をたどれるよう、囲った範囲そのものを覚えておく。
    // 並びが変わっても取り違えないよう、id を付ける
    list.push({id:uuid(), name:`範囲${list.length+1}`, tiles:okN, fail:failN,
               mb:Math.round(okN*0.02*10)/10, layers, zmax, poly, at:nowISO()});
    if(!packSaveList(list)){
      // 実体は入ったのに一覧に残らない。「保存しました」と言うと、
      // 消せない地図が容量を食ったまま行方不明になる
      done(()=>{
        if(prog) prog.textContent = '地図は保存できましたが、一覧に記録できませんでした。'
          + '端末の空き容量を確認してください。';
        toast('一覧に記録できませんでした。空き容量を確認してください', 8000);
      });
      return;
    }
    done(()=>{
      if(prog) prog.textContent = failN
        ? `${okN}枚を保存しました（${failN}枚は取れませんでした）。`
        : `${okN}枚を保存しました。`;
      toast(failN ? `${okN}枚保存（${failN}枚は取れず）` : '保存しました', failN?5000:2400);
    });
    render();
  }).catch(e=>{
    if(e && e.timeout){
      // 向こうがまだ動いている可能性がある。次の出し入れを許すと食い違う。
      // 札は残したまま「結果不明」にする
      packPendingUnknown(jobId);
      if(prog) prog.textContent = '保存の返事が返ってきません。'
        + '裏でまだ動いているかもしれないので、しばらく待ってから'
        + '保存済みの一覧を確かめてください。';
      toast('返事がありません。一覧を確かめてください', 8000);
      render();
      return;                       // PACK_BUSY は立てたまま
    }
    done(()=>{                              // はっきり失敗したので札を外す
      if(prog) prog.textContent = '保存できませんでした：'+e.message;
      toast('保存できませんでした');
    });
  });
}
function packDrop(id){
  if(packLocked()){ toast('いま別の地図の出し入れが終わっていません。少し待ってください'); return; }
  if(!ownsLock()){
    toast('このタブでは地図を消せません。記録を入れているタブから行ってください', 6000);
    return;
  }
  const list=packStore();
  const hits = list.filter(p=>p.id===id);
  if(hits.length!==1){
    // 見つからない、または同じ印が複数ある。消すと巻き添えが出る
    toast(hits.length===0 ? 'その範囲が見つかりません。ページを読み込み直してください'
                          : '同じ印の記録が複数あります。ページを読み込み直してください', 8000);
    render();
    return;
  }
  const target = hits[0];
  if(!confirm('この範囲の地図を消します。よろしいですか？')) return;

  // 番号ではなく id で消す。並びは削除の間に変わりうる
  const dropFromList = (msg)=>{
    if(!ownsLock()){
      toast('書き換えの途中で使用権がほかのタブへ移りました。一覧はそのまま残します', 8000);
      return;
    }
    const now = packStore();
    if(now.filter(p=>p.id===id).length!==1){
      toast('一覧が変わりました。ページを読み込み直して確かめてください', 8000);
      render();
      return;
    }
    const rest = now.filter(p=>p.id!==id);
    if(!packSaveList(rest)){
      toast('一覧を書き換えられませんでした。端末の空き容量を確認してください', 8000);
      return;
    }
    toast(msg, 5000); render();
  };

  // 範囲の形を覚えていない古い記録が1つでもあると、
  // 「ほかの範囲でも使っているタイル」を数え切れない。
  // 数え違えると、別の範囲の地図まで消してしまう
  const others = list.filter(p=>p.id!==id);
  if(!target.poly || others.some(p=>!p.poly)){
    dropFromList('一覧から消しました。'
      + '（範囲の形を覚えていない古い記録があるため、地図の実体は残します）');
    return;
  }

  const mine = new Set(packTileUrls(target.poly, target.zmax, target.layers||[]));
  const keep = new Set();
  others.forEach(p=>packTileUrls(p.poly, p.zmax, p.layers||[]).forEach(u=>keep.add(u)));
  const drop = Array.from(mine).filter(u=>!keep.has(u));

  if(!drop.length){
    dropFromList('一覧から消しました（ほかの範囲でも使っている地図は残ります）');
    return;
  }

  const jobId = packPendingSet('削除', 300000);
  if(!jobId){
    toast('いま別の出し入れが終わっていないか、印を置けませんでした', 8000);
    return;
  }
  // 一覧の書き換えまで終わってから札を外す
  const done = (fn)=>{ try{ fn(); } finally { packPendingDrop(jobId); PACK_BUSY = false; } };
  PACK_BUSY = true;
  toast(`${drop.length}枚を消しています…`);
  swAsk({type:'dropPack', urls:drop}, 300000).then(r=>{
    if(!r || r.error){
      done(()=>toast('地図の実体を消せませんでした。一覧はそのまま残します（'
        + ((r&&r.error)||'返事がありません') + '）', 8000));
      return;                      // 一覧を消さない。あとでやり直せる
    }
    const failed = (r.failed||[]).length;
    if(failed){
      done(()=>toast(`${r.deleted||0}枚を消しましたが、${failed}枚が残りました。`
        + '一覧はそのまま残します。もう一度お試しください', 8000));
      return;
    }
    done(()=>dropFromList(`${r.deleted||0}枚を消しました`));
  }).catch(e=>{
    if(e && e.timeout){
      packPendingUnknown(jobId);   // 札は残したまま「結果不明」にする
      toast('消した結果の返事が返ってきません。一覧はそのまま残します。'
        + '一覧を確かめてください', 8000);
      render();
      return;                       // PACK_BUSY は立てたまま
    }
    done(()=>toast('地図の実体を消せませんでした。一覧はそのまま残します（'
      + e.message + '）', 8000));
  });
}

/* ---- データベースへ直接送る（2026-08-24・鳥アプリの方式を魚版に） ----
   送るのは31列CSVと同じ行。受け口（魚類データベースの fish_ingest_server.py）は
   同じものを2回受け取っても増やさない作りなので、押し直しても安全。
   自動では送らない。押したときだけ送る */
function dbSendUrl(){ return String(prefs().dbsend_url||'').trim(); }
function dbSendToken(){ return String(prefs().dbsend_token||''); }
/* 宛先の検査。おかしな宛先に記録を投げないための門。
   受け口は「通り道」（/app-ingest）の下に居るので、パスは許す */
function dbSendCheckUrl(raw){
  const v = String(raw||'').trim().replace(/\/+$/,'');
  if(!v) return {why:'宛先が空です'};
  let u = null;
  try{ u = new URL(v); }catch(e){}
  if(!u) return {why:'宛先の形がおかしいです'};
  if(u.protocol !== 'https:') return {why:'宛先は https で始めてください'};
  if(u.username || u.password) return {why:'宛先に名前やパスワードを入れないでください'};
  if(u.search || u.hash) return {why:'宛先に ? や # を付けないでください'};
  if(/\/(ingest|ping)$/i.test(u.pathname)){
    return {why:'宛先は /ingest まで書かず、その手前までにしてください'};
  }
  return {url:v, ts:/\.ts\.net$/i.test(u.hostname)};
}
function dbSendSavePrefs(){
  if($('#dbs_url')) prefSet('dbsend_url', strVal('#dbs_url'));
  if($('#dbs_token')) prefSet('dbsend_token', $('#dbs_token').value||'');
}
async function dbSendTest(){
  dbSendSavePrefs();
  const c = dbSendCheckUrl(dbSendUrl());
  if(!c.url){ toast(c.why, 7000); return; }
  toast('つながるか試しています…');
  try{
    const r = await fetch(c.url + '/ping', {method:'GET'});
    const j = await r.json();
    toast(j && j.ok === true ? 'つながりました'
      : '返事の形が違います。宛先をご確認ください', 6000);
  }catch(e){
    toast('つながりませんでした。電波と宛先をご確認ください', 8000);
  }
}
async function dbSendNow(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  dbSendSavePrefs();
  const c = dbSendCheckUrl(dbSendUrl());
  if(!c.url){ toast(c.why, 7000); return; }
  const token = dbSendToken();
  if(!token){ toast('合言葉を入れてください', 6000); return; }
  if(/[^\x20-\x7e]/.test(token)){
    // そのまま送ると意味の分からない通信エラーになる（鳥アプリの教訓）
    toast('合言葉に日本語などが混ざっています。'
      + 'データベースが表示した半角の合言葉を入れてください', 9000);
    return;
  }
  if(!c.ts && !confirm('宛先が Tailscale（.ts.net）ではありません。'
    + 'この宛先に記録を送りますか？')) return;
  const r = buildDbRows(sv);
  if(r.blocked.length){ toast('このままでは送れません：' + r.blocked[0], 9000); return; }
  if(!r.rows.length){ toast('送る行がありません', 6000); return; }
  toast('送っています…', 8000);
  let res = null, j = null;
  try{
    res = await fetch(c.url + '/ingest', {
      method:'POST',
      headers:{'Content-Type':'application/json',
               'Authorization':'Bearer ' + token,
               'X-Device-Id': deviceId()},
      body: JSON.stringify({app:'fish_survey', kind:'db_rows', version:1,
        survey_uuid: sv.uuid, rows: r.rows}),
    });
    try{ j = await res.json(); }catch(e){}
  }catch(e){
    toast('送れませんでした（通信エラー）。電波の良いところでお試しください', 10000);
    return;                        // 受領の印は更新しない
  }
  if(!res.ok || !j || j.ok !== true){
    const why = (j && (j.error || j.message)) || ('HTTP ' + res.status);
    toast('送れませんでした：' + why, 12000);
    return;                        // 受領の印は更新しない
  }
  const sv2 = DB.getAlive(DB.key.sv, svUuid);
  if(sv2){
    sv2.db_sent_at = nowISO();
    sv2.db_receipt = (j.receipt == null ? '' : String(j.receipt));
    DB.upsert(DB.key.sv, sv2);
  }
  toast('送りました。' + String(j.message||''), 10000);
  render();
}

/* ---------- 写真ZIP（無圧縮・追加の部品なし） ----------
   名前をUTF-8で入れる印（0x0800）を立てる。立てないと日本語のファイル名が化ける */
function crc32(u8){
  let c=~0>>>0;
  for(let i=0;i<u8.length;i++){ c^=u8[i]; for(let k=0;k<8;k++) c=(c>>>1)^(0xEDB88320 & -(c&1)); }
  return (~c)>>>0;
}
function buildZip(files){
  const enc=new TextEncoder(); const parts=[]; const central=[]; let offset=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.u8, crc=crc32(data);
    const lh=[].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(lh), name, data);
    const ch=[].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), u16(0), u16(0), u16(0),
      u32(0), u32(offset));
    central.push({head:new Uint8Array(ch), name});
    offset += lh.length + name.length + data.length;
  });
  const cdStart=offset; let cdSize=0;
  central.forEach(c=>{ parts.push(c.head, c.name); cdSize += c.head.length + c.name.length; });
  parts.push(new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
    u16(central.length), u16(central.length), u32(cdSize), u32(cdStart), u16(0))));
  return new Blob(parts, {type:'application/zip'});
}
/* ファイル名に使えない文字を落とす */
function safeName(v){
  return String(v==null?'':v).replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,'_').slice(0,40);

/* まだ記録に付いていない写真（付ける先の印だけが頼り）を拾う。
   拾わないと、書き出したZIPに入らないまま「できました」と言ってしまう
   （2026-08-18 の5回目の監査 Major） */
async function pendingPhotoItems(sv){
  // 読めなかったときは「0件」と言わない。
  // 言ってしまうと、足りないZIPを「できました」と渡すことになる

  const saved = savedPhotoIds();

  const 表 = {};
  DB.stationsOf(sv.uuid).forEach(st=>{
    const day = stationDate(st, sv);
    表[st.uuid] = {kind:'箇所', day, station:st.name||'', species_id:'', species_name:'',
      time:st.survey_time_start||'', lat:st.latitude, lon:st.longitude, rec_id:st.uuid};
    DB.catchesOf(st.uuid).forEach(c=>{
      表[c.uuid] = {kind:'魚', day, station:st.name||'',

        time:st.survey_time_start||'', lat:st.latitude, lon:st.longitude, rec_id:c.uuid};
    });
  });
  DB.notesOf(sv.uuid).forEach(n=>{
    表[n.uuid] = {kind:'メモ', day:sv.survey_date||'', station:'',
      species_id:'', species_name:'', time:n.created_at ? fmtTime(n.created_at) : '',
      lat:'', lon:'', rec_id:n.uuid};
  });
  // まだ記録になっていない画面の分は、写真に付けておいた中身から出す。
  // 鍵の文字を読むだけだと、どの箇所の何の魚か分からない
  // （2026-08-18 の11回目の監査 Major）
  const 鍵の種類 = (k)=>{
    const head = String(k||'').split(':')[0];

    if(head==='note')  return 'メモ';

  // 消した記録の分は「まだ付いていない写真」ではない。

  let owners; try{ owners = livePhotoOwners(); }catch(e){ throw e; }

    .sort((a,b)=>String(a.added_at||'').localeCompare(String(b.added_at||'')))
    .map(r=>{

        // 消した箇所でも、同じ調査のものなら呼び名を出す

        const st = (st0 && st0.survey_uuid===sv.uuid) ? st0 : null;
        const sp = spId ? speciesById(spId) : null;
        base = {kind: r.owner_kind || 鍵の種類(r.owner),
          day: st ? stationDate(st, sv) : (sv.survey_date||''),
          station: (st && st.name) || r.owner_st_name || '',
          species_id: spId||'',
          species_name: (sp && sp.ja) || r.owner_sp_name || '',
          time: st ? (st.survey_time_start||'') : '',
          lat: st ? st.latitude : '', lon: st ? st.longitude : '',
          rec_id: r.owner};
      }
      数[r.owner] = (数[r.owner]||0) + 1;
      return Object.assign({p:{id:r.id, ext:r.ext||'', size:r.size||0},
        pending:true, no:数[r.owner]}, base);
    });
}
/* 書き出し画面に、まだ記録に付いていない写真の分を足す。
   足さないと「0枚」に見えて、書き出しボタンを押せない
   （2026-08-18 の6回目の監査 Major） */
async function exportPhotoCount(sv, n){
  const gen = screenGen();
  let pend;
  try{ pend = await pendingPhotoItems(sv); }
  catch(e){
    if(screenStale(gen)) return;
    const box = $('#phPend');
    if(box) box.innerHTML = '<span class="pill ng">写真の置き場を読めません</span>';
    return;
  }
  if(screenStale(gen) || !pend.length) return;
  const 足す = pend.reduce((a,it)=>a + (numOf(it.p && it.p.size)||0), 0);
  const sz = $('#phBytes');
  if(sz) sz.textContent = fmtBytes((numOf(sz.dataset.bytes)||0) + 足す);
  const box = $('#phPend');
  if(box) box.innerHTML = `<span class="pill warn">まだ記録に付いていない写真が `
    + `${pend.length}枚あります</span>　ZIPには入りますが、`
    + `その箇所を開いて「写真をもう一度保存」を押すことをおすすめします。`;
  const cnt = $('#phCount');
  if(cnt) cnt.textContent = (n + pend.length) + ' 枚';
  const btn = $('#phZip');
  if(btn) btn.disabled = false;
}
function photoStats(sv){
  const items = photoItemsOf(sv);
  return {n: items.length,
          bytes: items.reduce((a,it)=>a + (numOf(it.p && it.p.size)||0), 0)};
}
function photoFilename(it, seq){
  const ext = (it.p && it.p.ext) || 'jpg';
  const head = String(seq).padStart(3,'0');
  const mark = it.pending ? '未保存_' : '';
  if(it.kind==='魚')  return `${head}_${mark}魚_${safeName(it.station)}_${safeName(it.species_name||it.species_id)}_${it.no}.${ext}`;
  if(it.kind==='箇所') return `${head}_${mark}箇所_${safeName(it.station)}_${it.no}.${ext}`;
  return `${head}_${mark}メモ_${safeName(it.time)}_${it.no}.${ext}`;
}
const FS_PHOTO_COLS = ['ファイル名','状態','種類','調査日','箇所','種ID','種名',
  '開始時刻','緯度','経度','記録ID','写真ID'];
/* ZIPの決まりごと。ここを超えるとパソコン側で開けない形になる */
const ZIP_MAX_FILES = 60000;          // 目録に入る件数（65535）より手前で止める
const ZIP_MAX_BYTES = 3.5*1024*1024*1024;   // 位置の数え方が4GBまで
/* 端末で無理なく作れる大きさ。超えたら調査を分けてもらう */
const PHOTO_ZIP_LIMIT = 800*1024*1024;

async function exportPhotoZip(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  // まだ記録に付いていない写真も入れる。落とすと、取りこぼしに気づけない
  let pend;
  try{ pend = await pendingPhotoItems(sv); }
  catch(e){
    toast('写真の置き場を読めませんでした。'
      + '足りないZIPになるおそれがあるため、書き出しを中止します'
      + '（端末を再起動してからお試しください）', 12000);
    return;
  }
  const items = photoItemsOf(sv).concat(pend);
  if(!items.length){ toast('この調査には写真がありません'); return; }
  if(items.length + 2 > ZIP_MAX_FILES){
    toast(`写真が多すぎてまとめられません（${items.length}枚）。調査を分けてください`, 9000);
    return;
  }
  const guess = items.reduce((a,it)=>a + (numOf(it.p && it.p.size)||0), 0);
  if(guess >= PHOTO_ZIP_LIMIT){
    toast(`写真が多すぎてまとめられません（約${fmtBytes(guess)}）。`
      + `${fmtBytes(PHOTO_ZIP_LIMIT)}までです。調査を分けて書き出してください`, 9000);
    return;
  }
  if(guess >= 0.3*PHOTO_ZIP_LIMIT && !confirm(`約${fmtBytes(guess)}あります。`
    + '\n時間がかかり、端末によっては失敗します。続けますか？')) return;

  toast('写真をまとめています…', 8000);
  const files=[], idx=[];
  let seq=0, missing=0, bytes=0;
  try{
    for(const it of items){
      let rec=null; try{ rec=await PhotoDB.get(it.p.id); }catch(e){}
      let buf=null;
      if(rec && rec.blob){
        // 記録側の大きさは書いた時のもの。実物で数え直さないと歯止めが効かない
        bytes += rec.blob.size;
        if(bytes > PHOTO_ZIP_LIMIT || bytes > ZIP_MAX_BYTES){
          toast(`写真が大きすぎてまとめられません（${fmtBytes(bytes)}を超えました）。`
            + '調査を分けて書き出してください', 9000);
          return;
        }
        try{ buf = await rec.blob.arrayBuffer(); }catch(e){ buf=null; }
      }
      // 中身が見つからなくても、一覧には必ず1行残す。
      // 落として黙っていると、ZIPだけを見たとき取りこぼしに気づけない
      // （2026-08-17 の監査 Major）
      let name = '';
      if(buf){
        seq += 1;
        name = photoFilename(it, seq);
        files.push({name, u8:new Uint8Array(buf)});
      }else{
        missing += 1;
      }
      idx.push({'ファイル名':name,
        '状態': !buf ? '中身が見つかりません'
                : (it.pending ? 'まだ記録に付いていません（アプリで保存し直してください）'
                              : '入っています'),
        '種類':it.kind, '調査日':it.day, '箇所':it.station,
        '種ID':it.species_id, '種名':it.species_name, '開始時刻':it.time,
        '緯度':fixCoord(it.lat), '経度':fixCoord(it.lon),
        '記録ID':it.rec_id, '写真ID':it.p.id});
    }
    // 突き合わせ用の一覧を同じZIPに入れる。どの写真がどの記録のものか、後から分かるように
    files.push({name:'写真一覧.csv',
      u8:new TextEncoder().encode('\ufeff'+toCsv(FS_PHOTO_COLS, idx))});
    if(pend.length){
      files.push({name:'まだ記録に付いていない写真.txt', u8:new TextEncoder().encode(
        `${pend.length}枚は、まだ記録に付いていません。\r\n`
        + '端末の空き容量が足りず、保存しきれなかった写真です。\r\n'
        + 'アプリでその箇所を開き、「写真をもう一度保存」を押してください。\r\n'
        + 'ファイル名の「未保存」が目印です。\r\n')});
    }
    if(missing){
      files.push({name:'足りない写真.txt', u8:new TextEncoder().encode(
        `この調査には写真が ${items.length}枚 ありますが、`
        + `${missing}枚は中身が見つからず入れられませんでした。\r\n`
        + '「写真一覧.csv」の「状態」の欄をご確認ください。\r\n')});
    }
    downloadBlob(`${exportFileBase(sv)}_写真.zip`, buildZip(files));
  }catch(e){
    toast('写真をまとめられませんでした：' + (e && e.message || e)
      + '（枚数が多いときは、調査を分けてお試しください）', 9000);
    return;
  }
  toast(missing
    ? `写真 ${seq}枚を書き出しました。${missing}枚は中身が見つかりませんでした`
      + '（ZIPの中の「足りない写真.txt」をご覧ください）'
    : `写真 ${seq}枚を書き出しました`, missing?9000:3000);
}

/* 31列に乗らない分の書き出し */
function exportExtraCsv(svUuid, kind){
  if(!ownsLock()){
    toast('このタブでは書き出せません。記録を入れているタブから書き出してください', 6000);
    return;
  }
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  let snap;
  try{ snap = exportSnapshot(); }
  catch(e){ toast(e.message, 8000); return; }

  const table = {
    '個体': [FS_IND_COLS,     buildIndRows(sv, snap)],
    '箇所': [FS_STATION_COLS, buildStationRows(sv, snap)],
    '調査': [FS_SURVEY_COLS,  buildSurveyRow(sv, snap)],
    '測点': [FS_POINT_COLS,   buildPointRows(sv, snap)],
    '採捕': [FS_GEAR_COLS,   buildGearRows(sv, snap)],
    'メッシュ': [FS_MESH_COLS, buildMeshRows(sv, snap)],
  }[kind];
  if(!table){ toast('書き出せません'); return; }
  const [cols, rows] = table;
  if(!rows.length){ toast('書き出す記録がありません'); return; }

  const csv = toCsv(cols, rows);
  const fname = `${exportFileBase(sv)}_${kind}.csv`;
  if(!ownsLock()){
    toast('書き出しの途中で、ほかのタブに使用権が移りました。'
        + 'このタブを読み込み直してからやり直してください', 8000);
    return;
  }
  download(fname, '﻿'+csv, 'text/csv;charset=utf-8');
  toast(`${rows.length}行を書き出しました`);
}

function exportDbCsv(svUuid){
  const svk = DB.getAlive(DB.key.sv, svUuid);
  if(!canExportDbCsv(svk)){
    toast('この調査には魚の記録がないので、31列のCSVは出せません。'
      + '「箇所ごとの記録」「測点ごとの水深・流速」をお使いください', 8000);
    return;
  }
  // 使用権のないタブから書き出すと、別のタブが書き換えている途中の
  // ばらばらな中身を1つのCSVに混ぜてしまう
  if(!ownsLock()){
    toast('このタブでは書き出せません。記録を入れているタブから書き出してください', 6000);
    return;
  }
  const sv = DB.get(DB.key.sv, svUuid); if(!sv) return;
  const r = buildDbRows(sv);
  if(r.blocked.length){ toast('先に足りないところを直してください'); return; }
  if(!r.rows.length){ toast('書き出す記録がありません'); return; }
  // 中身を全部作り終えてから、ファイルを出す直前にもう一度使用権を見る。
  // 組み立てに時間がかかる間に、ほかのタブへ移っていることがある
  const csv = toCsv(FS_DB_COLS, r.rows);
  const fname = `${exportFileBase(sv)}_DB取込用.csv`;
  if(!ownsLock()){
    toast('書き出しの途中で、ほかのタブに使用権が移りました。'
        + 'このタブを読み込み直してからやり直してください', 8000);
    return;
  }
  download(fname, '﻿'+csv, 'text/csv;charset=utf-8');
  sv.exported_at = nowISO();
  if(!DB.upsert(DB.key.sv, sv)){
    // ファイルは作れたが、書き出した記録が残らなかった。
    // 「書き出しました」と言うと、二重に取り込む危険が上がる
    toast('CSVは作りましたが、書き出した日時を保存できませんでした。'
        + '端末の空き容量を確認し、ページを読み込み直してください', 8000);
    return;
  }
  toast(`${r.rows.length}行を書き出しました`);
  render();
}

/* ============================================================
   アプリを最新にする
   記録（調査・箇所・魚）と、圏外用に落とした地図は消さない。
   消すのはアプリのプログラムと、地図を動かして自然に溜まった分だけ。
   ============================================================ */
/* 消してよい保管場所の名前を返す。
   - fish-map-pack-*（自分で範囲を囲って落とした地図）は消さない。
     利用者がわざわざ落としたもので、アプリの更新とは関係がない
   - 鳥（bird-）や産卵床（redd-）のものは、当然さわらない */
function cachesToClear(keys){
  return (keys||[]).filter(k =>
    k.startsWith('fish-survey-') || k.startsWith('fish-map-tiles-'));
}

/* いま配信されている版を見に行く（読むだけ。何も消さない） */
function checkLatestVersion(){
  return fetch('./fish_survey.html', {cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error('取りに行けませんでした（'+r.status+'）');
      return r.text();
    })
    .then(t=>{
      const m = t.match(/const APP_VERSION = '([^']*)'/);
      if(!m) throw new Error('版が読み取れませんでした');
      return m[1];
    });
}

function checkUpdate(){
  const box = $('#updInfo');
  if(box) box.textContent = '調べています…';
  checkLatestVersion().then(latest=>{
    if(!box) return;
    box.textContent = latest === APP_VERSION
      ? `最新です（${APP_VERSION}）`
      : `新しい版があります：${latest}（いまは ${APP_VERSION}）。下のボタンで取り込めます`;
  }).catch(e=>{
    if(box) box.textContent = '調べられませんでした：' + e.message
      + '（電波の届くところでお試しください）';
  });
}

function forceUpdate(){
  // 出し入れの途中なら、聞くまでもなく止める
  if(typeof packLocked==='function' && packLocked()){
    toast('圏外用の地図の出し入れが終わっていません。終わってからお試しください', 8000);
    return;
  }
  if(!confirm('アプリのプログラムだけを最新に読み込み直します。\n\n'
    + '・記録した調査・箇所・魚はそのまま残ります\n'
    + '・圏外用に落とした地図もそのまま残ります\n'
    + '・電波の届くところで行ってください\n\nよろしいですか？')) return;

  // 先に取れるか確かめる。取れないまま消すと、圏外では二度と開けなくなる
  toast('新しい版があるか調べています…', 8000);
  checkLatestVersion().then(latest=>{
    if(latest === APP_VERSION
       && !confirm(`いま入っている ${APP_VERSION} が最新です。\nそれでも読み込み直しますか？`)){
      toast('やめました');
      return;
    }
    doForceUpdate();
  }).catch(e=>{
    toast('新しい版を取りに行けませんでした：' + e.message
      + '。電波の届くところでお試しください（何も消していません）', 9000);
  });
}
function doForceUpdate(){
  toast('最新に読み込み直しています…', 8000);
  const reload = ()=>location.reload();
  const tasks = [];
  // このアプリのものだけを対象にする（同じ場所の別アプリを壊さない）
  if('serviceWorker' in navigator){
    tasks.push(navigator.serviceWorker.getRegistration()
      .then(r=>r ? r.unregister() : null).catch(()=>{}));
  }
  if(window.caches){
    tasks.push(caches.keys()
      .then(ks=>Promise.all(cachesToClear(ks).map(k=>caches.delete(k))))
      .catch(()=>{}));
  }
  Promise.all(tasks).then(reload, reload);
}

/* ============================================================
   起動
   ============================================================ */
function boot(){
  themeApply();        // 表示のモード（屋外＝明るい）を、描く前に当てる
  render();            // 先に画面を出す。保存領域の準備を待つと白いままになる
  claimLock();
  startGps();
  if(navigator.storage && navigator.storage.persist){
    try{ navigator.storage.persist(); }catch(e){}
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
  // 使われなくなった写真の片付け。使用権を取れてから、少し置いて始める
  // （起動直後に走らせると、書きかけを読む前に消してしまう）。
  // 長く開いたままだと迷子が溜まるので、そのあとも時々見る
  setTimeout(()=>{ try{ PhotoDB.gc(); }catch(e){} }, 4000);
  setInterval(()=>{ try{ PhotoDB.gc(); }catch(e){} }, 30*60*1000);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
