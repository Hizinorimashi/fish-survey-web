/* 通電のスタート・ストップ。押した時刻だけを覚え、表示は時計から作る */
/* 通電のスタート・ストップ。
   地点（目印）では、時刻と道すじだけを残して通電の秒数は積まない。
   積むと、地図の単位でも通電を測ったときに同じ労力を二重に数える（監査33回目 Major） */
function toggleEffort(stUuid){
  const st0 = DB.liveStation(stUuid); if(!st0) return;
  // 押すと画面を作り直すので、打っている漁具を先に書く。
  // ただし、止めるときは漁具の不備で足止めしない。
  // 止められないあいだ時計が動き続け、通電の時間が水増しされる（監査61回目 Major）
  const 止める = !!st0.effort_started_at || (st0.is_spot && !st0.ended_at);
  const 書けた = $('#gearBox') ? saveEffort(stUuid, {quiet:true}) : true;
  if(!書けた && !止める) return;
  // 知らせは、保存できてから1回だけ出す。先に出すと、あとの知らせに
  // 上書きされて、人には普通に保存できたようにしか見えない（監査62回目 Major）
  const 伝える = (文)=>toast(書けた ? 文
    : (文 + '。採捕記録は打ちかけのまま残しています。'
       + '足りないところを直してから、保存してください'), 書けた ? 3000 : 9000);
  // 漁具を書いたあとに読み直す。先に読んだ中身を書き戻すと、
  // いま保存したばかりの漁具が消える（監査34回目 Critical）
  const st = DB.liveStation(stUuid); if(!st) return;
  if(st.is_spot){
    // 地点は通電を持たない決まりだが、前の版で入った秒数を
    // 「終える」の副作用で消してはいけない（監査56回目 Critical）。
    // 押しっぱなしの状態だけ、いまの秒数にして止める
    // 止めるだけ。effortSeconds() は「いままでの秒数＋押していた分」を返すので、
    // ここで代入すると、前の版の値が何時間分にも膨らむ（監査57回目 Critical）
    if(st.effort_started_at) delete st.effort_started_at;
    if(st.ended_at){
      delete st.ended_at;
      if(DB.upsert(DB.key.st, st)){ 伝える('この地点の記録を再開しました'); render(); }
    }else{
      st.ended_at = nowISO();
      // 終わりの時刻を自動で入れるのは、きょうの分を現場で記録しているときだけ。
      // 過去の日を書き起こしているときに入れると、調査日と時刻が食い違う
      //（監査53回目 Major）
      const sv0 = DB.getAlive(DB.key.sv, st.survey_uuid);
      if(!st.survey_time_end) st.survey_time_end = autoTime(sv0);
      if(DB.upsert(DB.key.st, st)){ 伝える('この地点を終えました'); render(); }
    }
    return;
  }
  if(effortRunning(st)){
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
    if(DB.upsert(DB.key.st, st)){ 伝える(`通電 ${fmtDur(st.effort_seconds)}`); render(); }
  }else{
    st.effort_started_at = nowISO();
    if(DB.upsert(DB.key.st, st)){ 伝える('通電をはじめました'); render(); }
  }
}
/* 採捕記録（漁具と労力）を保存する。
   opt.quiet を立てると、保存できても画面を作り直さない（漁具の足し引きで使う）。
   保存できたかどうかを返す */
function saveEffort(stUuid, opt){
  opt = opt || {};
  const st = DB.liveStation(stUuid); if(!st) return false;
  const passes = strVal('#e_passes');
  if($('#e_passes') && countOf(passes)===null){
    toast('流した回数は0以上の整数で入れてください'); return false;
  }
  const err = rangeCheck([
    ['流した回数', passes, 0, 999],
    ['平均の川幅', strVal('#e_width'), 0, 2000],
    ['区間の長さ', strVal('#e_len'), 0, 100000],
    ['面積', strVal('#e_area'), 0, 10000000]]);
  if(err){ toast(err, 6000); return false; }
  const g = gearsNormalize(collectGears());
  if(g.err){ toast(g.err, 6000); return false; }
  // 画面に出ていない欄は触らない。地図の画面には長さ・面積の欄が無いので、
  // まとめて書き戻すと、箇所ハブで入れた値を空で上書きしてしまう
  if($('#e_passes')) st.effort_passes   = countOf(passes);
  if($('#e_width'))  st.width_m         = numVal('#e_width');
  if($('#e_len'))    st.length_m_manual = numVal('#e_len');
  if($('#e_area'))   st.area_m2_manual  = numVal('#e_area');
  if($('#gearBox'))  st.gears           = g.gears;
  if(!DB.upsert(DB.key.st, st)){
    toast('保存できませんでした（端末の空き容量をご確認ください）', 8000);
    return false;
  }
  draftClear('effort:'+stUuid);
  if(!opt.quiet){ toast('保存しました'); render(); }
  return true;
}
function endStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  const sv = DB.getAlive(DB.key.sv, st.survey_uuid);
  if(effortRunning(st)){          // 押しっぱなしのまま終わらせない
    st.effort_seconds = Math.round(effortSeconds(st));
    delete st.effort_started_at;
  }
  st.ended_at = nowISO();
  // 終了の時刻は、いま現場にいるときだけ自動で入れる。
  // あとから書き起こしているときは、手で入れた時刻を上書きしない
  if(isLiveNow(sv) && !st.survey_time_end) st.survey_time_end = timeValue();
  if(DB.upsert(DB.key.st, st)){ toast(stWordOf(st)+'を終えました'); goTo('survey', st.survey_uuid); }
}
function reopenStation(u){
  const st = DB.get(DB.key.st, u); if(!st) return;
  delete st.ended_at;   // 入れた終了時刻は消さない（手で入れたものかもしれない）
  if(DB.upsert(DB.key.st, st)){ render(); }
}

/* ---------- 物理環境：地図の上で点と線を足す ---------- */
let ENVLAYER = [];
let ENV_SEL = null;          // いま選んでいる記録のID

/* 魚の調査の地図。囲い（E・P/F）と点（P）を置く（魚類調査イメージ.pptx） */
let FISH_NEXT = {kind:'PF', draw:'', survey:''};
/* 地図の「いま何をしているか」は、調査＋地点ごとに分けて持つ。
   分けないと、P1で描きかけた囲いや、終わっていないラインが P2 に残り、
   P2でタップした座標が P1 の記録に足される（監査33回目 Critical）。
   持ち替えるだけで捨てないので、P1へ戻れば描きかけの続きから再開できる */
let SEL_SPOT_AT = '';
const MAP_WORK = {};
/* 地図へ「入り直した」かどうかは、画面を移った回数で見る。
   同じ画面のなかの描き直しでは選びかけを保ち、
   地点へ戻ってから同じ地図を開いたときは選び直しから始める（監査55回目 Major） */
let SEL_NAV_AT = -1;
function selResetOnSpotChange(svUuid, spot){
  const key = mapViewKey(svUuid, spot);
  const 入り直した = SEL_NAV_AT !== NAV_SEQ;
  SEL_NAV_AT = NAV_SEQ;
  if(SEL_SPOT_AT === key && !入り直した) return;
  if(SEL_SPOT_AT === key && 入り直した){
    // 同じ地点へ入り直しただけ。描きかけは残し、選んでいる記録だけ手放す
    FISH_SEL = null; FISH_PICK = ''; ENV_SEL = null;
    try{ ENV_MOVE = null; }catch(e){}
    try{ ENV_PICK = null; }catch(e){}
    return;
  }
  // 覚えておくのは「描きかけ」だけ。
  // 選んでいる記録まで覚えて戻すと、調査を開き直したときに
  // envUseSurvey/fishUseSurvey の「持ち越さない」を打ち消してしまう
  if(SEL_SPOT_AT) MAP_WORK[SEL_SPOT_AT] = {draw: FISH_NEXT.draw, line: ENV_NEXT.line};
  // 調査そのものが変わったら、つぎに足すものも最初に戻す。
  // 地点だけが変わったなら、選んでいる種類はそのまま使う
  const 前の調査 = String(SEL_SPOT_AT||'').split('|')[0];
  const 同じ調査 = !!SEL_SPOT_AT && 前の調査 === svUuid;
  SEL_SPOT_AT = key;
  // 「位置を直す」「選んで消す」も持ち越さない。
  // 持ち越すと、P2の地図タップで P1 の記録が動く（監査39回目 Critical）
  try{ ENV_MOVE = null; }catch(e){}
  try{ ENV_PICK = null; }catch(e){}
  const w = MAP_WORK[key] || {};
  FISH_NEXT = {kind: 同じ調査 ? FISH_NEXT.kind : 'PF',
               draw: w.draw || '', survey: svUuid};
  ENV_NEXT  = {kind: 同じ調査 ? ENV_NEXT.kind : 'P',
               auto: 同じ調査 ? ENV_NEXT.auto : false,
               line: w.line || '', survey: svUuid};
  FISH_SEL = null; FISH_PICK = ''; ENV_SEL = null;
}
/* この地点の地図で作った記録か。地点から開いていないときは、調査ぜんぶが対象 */
function ofSpot(st, spot){
  if(MAP_LOOSE && !spot) return !!st && !st.spot_uuid;
  return !spot || (st && st.spot_uuid === spot);
}
/* 地図に出す記録を取り出す。
   地点から開いているときは、その地点で作った分だけ。
   調査から直接開いたときは、調査ぜんぶ（監査35回目 Major）。
   kind: 'fish'（E・P/F・P）／'env'（測点・ライン） */
function mapStations(svUuid, kind, spot){
  const sp = (spot === undefined) ? MAP_SPOT : spot;
  const sv = DB.getAlive(DB.key.sv, svUuid);
  return DB.stationsOf(svUuid).filter(st=>{
    if(isMesh(st) || st.is_spot) return false;
    if(!ofSpot(st, sp)) return false;
    if(kind === 'fish') return !!unitKindOf(st);
    // 物理環境は「物理環境の記録」だけ。前のやり方の箇所を混ぜると、
    // そこへ環境の値を書き込めてしまう（監査38回目 Major）
    return stationKind(sv, st) === '物理環境';
  });
}
/* 地図の画面を開くときに、どの地点で開くかを決める。
   画面の中身を組み立てる前に呼ぶこと。onMount で決めていたら、
   一覧を作る時点ではまだ空で、調査ぜんぶが並んでいた（監査36回目 Critical）。
   消えた地点や別の調査の地点を渡されたら、地点なしとして開く */
function mapEnterSpot(svUuid, spot, loose){
  const st = spot ? DB.liveStation(spot) : null;
  MAP_SPOT = (st && st.is_spot && st.survey_uuid === svUuid) ? spot : '';
  MAP_LOOSE = !MAP_SPOT && !!loose;
  return MAP_SPOT;
}
/* この地点にぶら下がる記録（地点そのもの＋その地図で作ったもの）。
   地点画面の集計が、地図で入れた魚を数えていなかった（監査33回目 Major） */
function spotStations(stUuid){
  const st = DB.liveStation(stUuid); if(!st) return [];
  return [st].concat(DB.stationsOf(st.survey_uuid)
    .filter(x=>x.uuid!==stUuid && x.spot_uuid===stUuid));
}
/* この地点の種数・尾数。二重に数えないよう、記録は各単位の自分の分だけ足す */
function spotTotals(stUuid){
  const 種 = {};
  let 尾 = 0;
  spotStations(stUuid).forEach(x=>{
    DB.catchesOf(x.uuid).forEach(c=>{
      const t = catchTotal(c);
      const k = c.species_id || c.species_name;
      if(!k || t<=0) return;
      種[k] = true; 尾 += t;
    });
  });
  return {種: Object.keys(種).length, 尾: 尾};
}
function fishUseSurvey(svUuid){

/* まだ閉じていない囲いか。記録に残した印で見るので、読み込み直しても分かる。

/* 消す前に、その記録の打ちかけを書いてしまう。

function flushBeforeDelete(stUuid){

/* 記録として数えてよい単位か。描きかけの囲いは、まだ数えない。
   数えると、描き始めただけで箇所数が増え、旧地点の通電が集計から消える
   （監査62回目 Major）。地図に出すのと、続きから描くのは別 */
function unitReady(st){ return !polyDrawing(st); }
/* 置く。囲いは角を1つずつ足していく */
function fishAddAt(svUuid, lat, lon, acc){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return null;
  if(!writeAllowed()){
    toast('このタブでは追加できません。記録を入れているタブでお試しください', 6000);
    return null;
  }
  // 「地点に属さない以前の記録」を見ているだけの画面では、新しく作らせない。
  // 作ると、どの地点にも属さない記録がまた増える（監査52回目 Major）
  if(MAP_LOOSE){

      + '新しく作るときは、地点を選んでから開いてください', 8000);

  }

  const la = +(+lat).toFixed(6), lo = +(+lon).toFixed(6);

  const now = timeValue();
  const 描き中 = fishDrawing();

  const k = FISH_NEXT.kind;

  const no = nextStationNo(svUuid);
  if(no===null){ toast('番号が大きすぎて、これ以上置けません', 7000); return null; }
  const rec = {
    uuid: uuid(), survey_uuid: svUuid, station_no: no,
    // どの地点の地図で作ったかを覚える。地点に入れた天気・区間名などを
    // 書き出しへ渡すために使う（記録そのものは今までどおり調査にぶら下がる）
    spot_uuid: MAP_SPOT || '',

    unit_kind: k, name: unitAutoName(svUuid, k, all),

  if(k === 'P'){
    rec.latitude = la; rec.longitude = lo;
    rec.gps_accuracy = (acc===undefined || acc===null) ? '' : Math.round(acc);

    rec.poly_state = 'drawing';

  // 置くと、集計と努力量で数え方が食い違う（監査35回目 Major）
  if(k === 'P'){

  if(k === 'P'){
    unitRelink(svUuid);
    toast(`${rec.name} を置きました`);
  }else{
    FISH_NEXT = {kind:k, draw:rec.uuid, survey:svUuid};
    toast(`${rec.name} を描きはじめました。角をタップして、囲いを閉じてください`, 7000);
  }

/* 囲いを閉じる */
/* 囲いとして成り立つか。
   同じ点ばかり・つぶれた形・辺どうしが交わる形は、中か外かが決まらない
   （2026-08-20 の監査 Major） */
function polyProblem(pts){
  if(!pts || pts.length < 3) return '角が3つ以上ないと、囲いになりません';
  const 別々 = [];
  pts.forEach(v=>{
    if(!別々.some(w=>Math.abs(w[0]-v[0]) < 1e-9 && Math.abs(w[1]-v[1]) < 1e-9)) 別々.push(v);
  });
  if(別々.length < 3) return '同じ場所ばかりで、囲いになりません';
  if(!(polyArea(pts) > 1e-12)) return 'つぶれていて、囲いになりません';
  // 辺どうしが交わっていないか（角の数は多くないので、総当たりでよい）
  const n = pts.length;
  const 交わる = (a,b,c,d)=>{
    const s = (p,q,r)=>Math.sign((q[0]-p[0])*(r[1]-p[1]) - (q[1]-p[1])*(r[0]-p[0]));
    const d1=s(a,b,c), d2=s(a,b,d), d3=s(c,d,a), d4=s(c,d,b);
    return d1!==d2 && d3!==d4;
  };
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      if(i===j) continue;
      if((j+1)%n === i || (i+1)%n === j) continue;   // 隣どうしは端を共有する
      if(交わる(pts[i], pts[(i+1)%n], pts[j], pts[(j+1)%n])){
        return '線が交わっています。ねじれていない形にしてください';
      }
    }
  }
  return '';
}
/* 親に入っている「数に響く記録」を、中の単位へまるごと移す。
   移す道具が無いまま「移してください」と言うと、詰んでしまう
   （2026-08-23 の実機の声）。魚の記録・漁具・通電・距離・面積・回数・川幅 が対象。
   1尾ずつの記録は魚の記録にぶら下がっているので、一緒についてくる */
const 移す欄 = ['gears','effort_seconds','effort_started_at','effort_passes',
                'width_m','length_m_manual','area_m2_manual'];
function unitMoveOwn(親uuid, 子uuid){
  // 1つの入れ物につき1回の保存にまとめる。別々に保存すると、
  // 途中で失敗したとき親と子の両方に値が残る（監査71回目 Minor）
  let sts, cas, 元st, 元ca;
  try{
    sts = DB.loadRaw(DB.key.st); cas = DB.loadRaw(DB.key.ca);
    // 戻すための写しは、書き換える前に取る。書き換えたあとに読み直しても、
    // それは移動後の姿でしかない（監査72回目 Major）
    元st = JSON.parse(JSON.stringify(sts));
    元ca = JSON.parse(JSON.stringify(cas));
  }catch(e){ return false; }
  const 親 = sts.find(x=>x && x.uuid===親uuid);
  const 子 = sts.find(x=>x && x.uuid===子uuid);
  if(!親 || !子) return false;
  const t = nowISO();
  移す欄.forEach(k=>{
    if(親[k] === undefined || 親[k] === '') return;
    if(子[k] === undefined || 子[k] === '') 子[k] = 親[k];
    delete 親[k];
  });
  親.updated_at = t; 子.updated_at = t;
  cas.forEach(c=>{
    if(c && !c.deleted_at && c.station_uuid === 親uuid){
      c.station_uuid = 子uuid; c.updated_at = t;
    }
  });
  if(!DB.save(DB.key.st, sts)) return false;
  if(!DB.save(DB.key.ca, cas)){
    // 魚を書けなかったら、箇所を「変更前の写し」で戻す
    let 戻せた = false;
    try{ 戻せた = DB.save(DB.key.st, 元st); }catch(e){}
    return 戻せた ? false : 'broken';
  }
  return true;
}
function fishClosePoly(svUuid){
  const st = fishDrawing();
  if(!st){ toast('いま描いている囲いがありません'); return false; }
  const 具合 = polyProblem(polyPts(st));
  if(具合){ toast(具合, 8000); return false; }
  const 一覧 = DB.stationsOf(svUuid).filter(x=>unitKindOf(x));
  const 断り = unitParentBlocked(st, 一覧);
  if(断り){
    // 「移してください」と言うだけでは詰む。ここで移せるようにする
    const 親id = unitParentOf(st, 一覧);
    const 親 = 一覧.filter(x=>x.uuid===親id)[0];
    const 何 = 親 ? unitHasOwn(親) : '';
    if(!親 || !何){ toast(断り, 10000); return false; }
    if(!confirm(`${親.name} に入っている${何}を、いま閉じようとしている `
      + `${st.name} へ移しますか？

`
      + `「はい」＝移してから閉じます（${親.name} は中の集計になります）
`
      + `「いいえ」＝閉じるのをやめます（${親.name} はそのまま）`)){
      toast(断り, 10000);
      return false;
    }
    const 移し = unitMoveOwn(親.uuid, st.uuid);
    if(移し !== true){
      toast(移し === 'broken'
        ? '移す途中で書けなくなり、半端な状態になっています。'
          + '「データ点検」を開いてご確認ください'
        : '移せませんでした（端末の空き容量をご確認ください）。'
          + 'そのままにしてあります', 10000);
      return false;
    }
    toast(`${親.name} の${何}を ${st.name} へ移しました`, 6000);
  }
  // 閉じたことを記録に残す。残さないと、読み込み直しに耐えられない

  FISH_NEXT = {kind:FISH_NEXT.kind, draw:'', survey:svUuid};
  unitRelink(svUuid);
  const 中 = unitChildren(st.uuid, DB.stationsOf(svUuid)).length;

function fishUndoCorner(svUuid){

  if(!st){
    toast('いま描いている囲いがありません。角を置いてからお使いください', 5000);

  const pts = (st.poly||[]);
  if(pts.length <= 1){
    if(!DB.softDelete(DB.key.st, st.uuid)){
      toast('取り消せませんでした', 6000); return false;
    }
    FISH_NEXT = {kind:FISH_NEXT.kind, draw:'', survey:FISH_NEXT.survey};

/* 置いた記録の日付。何日かにわたる調査で入れ忘れると、

   今日が調査の期間内なら今日。外なら、はじめの日にそろえる */
/* 何日かにわたる調査で、いま記録する日。
   きょうが調査の期間から外れていると、これまでは必ず初日になっていた。
   過去の調査をあとから書き起こすときに、2日目以降を入れる手が無かった
   （監査47回目 Major）。画面で選べるようにして、選んだ日を覚えておく */
let REC_DAY = {sv:'', day:''};
function recDay(sv){
  if(sv && REC_DAY.sv === sv.uuid && REC_DAY.day
     && surveyDays(sv).indexOf(REC_DAY.day) >= 0) return REC_DAY.day;
  return todayInSurvey(sv);
}
/* 記録する日が「きょう」で、いま現場にいるときだけ、時刻を自動で入れる。
   過去の日を選んで後から書き起こしているのに端末の時刻を入れると、
   調査日は過去・時刻は入力日、という食い違った記録になる（監査49回目 Major） */
function autoTime(sv){
  return (recDay(sv) === dateValue() && isLiveNow(sv)) ? timeValue() : '';
}
function recDaySet(svUuid, day){
  REC_DAY = {sv: svUuid, day: day || ''};

/* いま開いている記録の日と、選んでいる「記録する日」が違うときの知らせ。
   この記録に足したものは、選んだ日ではなく、この記録の日の分になる。
   足すのを止めはしない（前の日の記録を直せなくなるため）が、
   黙って別の日に入ってしまわないよう、必ず画面に出す（監査48回目 Major） */
function recDayWarnHtml(sv, st){
  if(!sv || !st || surveyDays(sv).length <= 1) return '';
  const この記録 = stationDate(st, sv);
  const いま = recDay(sv);
  if(!この記録 || !いま || この記録 === いま) return '';
  const 短く = d => String(d).slice(5).replace('-','/');
  return `<div class="warnbox">これは <b>${esc(短く(この記録))}</b> の記録です
    （いま選んでいる記録する日：${esc(短く(いま))}）。<br>
    ここに足したものは <b>${esc(短く(この記録))}</b> の分になります。
    ${esc(短く(いま))} の分にしたいときは、その日の単位を新しく作ってください。</div>`;
}
/* 記録する日の選び手。1日だけの調査では出さない */
function recDayBarHtml(sv){
  const days = surveyDays(sv);
  if(!sv || days.length <= 1) return '';
  const いま = recDay(sv);
  const 外 = days.indexOf(dateValue()) < 0;
  return `<div class="card" style="padding:10px 12px">
    <label style="margin-top:0">記録する日</label>
    <div class="seg">${days.map(d=>`<button type="button"
      class="${d===いま?'on':''}" onclick="recDaySet('${sv.uuid}','${d}')"
      >${esc(String(d).slice(5).replace('-','/'))}</button>`).join('')}</div>
    <div class="dim small" style="margin-top:6px">${外
      ? 'きょうは調査の期間の外です。どの日の記録かを選んでください。'
      : 'ここで置いた記録は、選んだ日の分になります。'}</div>
  </div>`;
}
function todayInSurvey(sv){
  const days = surveyDays(sv);
  const t = dateValue();
  if(days.indexOf(t) >= 0) return t;
  return days[0] || String((sv && sv.survey_date) || '').slice(0,10);
}
/* 地図の画面は「調査」で開くほか、「地点」からも開ける。

            loose: !!arg.loose};

function fishMapTap(svUuid, latlng){

/* 地図に、囲いと点を描く */
function fishDrawAll(svUuid){
  const map = MAPS.main.map; if(!map) return;
  try{ FISHLAYER.forEach(x=>map.removeLayer(x)); }catch(e){}
  FISHLAYER = [];
  const list = mapStations(svUuid, 'fish');
  list.forEach(st=>{
    const k = unitKindOf(st);
    const on = st.uuid === FISH_SEL;
    const col = on ? '#f0883e' : (k==='E' ? '#a371f7' : (k==='PF' ? '#4aa3ff' : '#3fb950'));
    if(k === 'P'){
      const pt = stationPt(st);
      if(!pt) return;
      FISHLAYER.push(L.marker(pt, {icon:envBadge(st.name||'', col, on?30:24, on, false),
        zIndexOffset: on ? 1000 : 0})
        .on('click', e=>{ L.DomEvent.stop(e); fishMapTap(svUuid, e.latlng); }).addTo(map));
      return;
    }
    const pts = polyPts(st);
    if(!pts.length) return;
    const 描き中 = polyDrawing(st);
    if(pts.length >= 3 && !描き中){
      FISHLAYER.push(L.polygon(pts, {color:col, weight:on?4:3, opacity:.95,
        fillColor:col, fillOpacity:on?.22:.12, bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); fishMapTap(svUuid, e.latlng); }).addTo(map));
    }else{
      FISHLAYER.push(L.polyline(pts, {color:col, weight:3, opacity:.9,
        dashArray:'6 4', bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); fishMapTap(svUuid, e.latlng); }).addTo(map));
    }
    pts.forEach(v=>{
      FISHLAYER.push(L.circleMarker(v, {radius:描き中?6:4, color:'#fff', weight:2,
        fillColor:col, fillOpacity:1, bubblingMouseEvents:false})
        .on('click', e=>{ L.DomEvent.stop(e); fishMapTap(svUuid, e.latlng); }).addTo(map));
    });
    // 名前は、いちばん北の角に置く。真ん中に置くと、入れ子の囲いどうしで重なる
    const c = pts.slice().sort((a,b)=>b[0]-a[0])[0];
    if(c) FISHLAYER.push(L.marker(c, {icon:envBadge(st.name||'', col, on?30:24, on, true),
      zIndexOffset: on ? 1000 : 0})
      .on('click', e=>{ L.DomEvent.stop(e); fishMapTap(svUuid, e.latlng); }).addTo(map));
  });
}
function fishAllPoints(svUuid){
  const pts = [];
  mapStations(svUuid, 'fish').forEach(st=>{
    if(unitKindOf(st)==='P'){ const p = stationPt(st); if(p) pts.push(p); }
    else polyPts(st).forEach(v=>pts.push(v));
  });
  return pts;

  fishRememberView(svUuid);
}

/* ============================================================

const TRASH_KINDS = [
  {k:'sv', key:()=>DB.key.sv, word:'調査'},
  {k:'st', key:()=>DB.key.st, word:'箇所'},
  {k:'ca', key:()=>DB.key.ca, word:'魚の記録'},
  {k:'nt', key:()=>DB.key.nt, word:'メモ'},
];
function trashKindOf(k){ return TRASH_KINDS.find(x=>x.k===k); }
/* 消したものを集める。新しく消したものが上 */
function trashList(){
  const out = {};
  TRASH_KINDS.forEach(t=>{
    let all = [];
    try{ all = DB.loadRaw(t.key()); }catch(e){ all = []; }
    out[t.k] = all.filter(x=>x && x.deleted_at)
      .sort((a,b)=>String(b.deleted_at||'').localeCompare(String(a.deleted_at||'')));
  });
  return out;
}
function trashCount(){
  const l = trashList();
  return TRASH_KINDS.reduce((a,t)=>a + (l[t.k]||[]).length, 0);
}
/* その記録を出すための名前 */
function trashName(k, x){
  if(k==='sv') return `${x.river_name||''} ${x.site_name||''}`.trim() || '（名前なし）';
  if(k==='ca') return x.species_name || x.species_id || '（種なし）';

/* 親をたどる。戻すときは、親も一緒に戻さないと見えないままになる */
/* 親をさかのぼって、ぜんぶ数える。

   消えた地点や上の単位を指す記録が残る（監査42回目 Minor） */
function trashAncestors(k, x, 見た){
  見た = 見た || {};
  const out = [];
  trashParents(k, x).forEach(p=>{
    const key = p.k + ':' + p.uuid;
    if(見た[key]) return;
    見た[key] = true;
    out.push(p);
    const t = trashKindOf(p.k);
    const 親 = t ? DB.get(t.key(), p.uuid) : null;
    if(親) trashAncestors(p.k, 親, 見た).forEach(q=>out.push(q));
  });
  return out;
}
function trashParents(k, x){
  const out = [];
  if(k==='st' && x.survey_uuid) out.push({k:'sv', uuid:x.survey_uuid});
  // その記録を作った地点も、消えていたら一緒に戻す。
  // 戻さないと、消えた地点を指す記録だけがよみがえり、
  // 地点の地図にも旧記録の入口にも出ず、画面から手が届かなくなる（監査41回目 Critical）
  if(k==='st' && x.spot_uuid && x.spot_uuid !== x.uuid){
    out.push({k:'st', uuid:x.spot_uuid});
  }
  if(k==='st' && x.parent_uuid) out.push({k:'st', uuid:x.parent_uuid});
  if(k==='nt' && x.survey_uuid) out.push({k:'sv', uuid:x.survey_uuid});
  if(k==='ca'){
    if(x.station_uuid) out.push({k:'st', uuid:x.station_uuid});
    if(x.survey_uuid)  out.push({k:'sv', uuid:x.survey_uuid});
  }
  return out;
}
/* 戻す。親が消えていれば、親も一緒に戻す */
function trashRestore(k, uuid){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return false;
  }
  const t = trashKindOf(k); if(!t) return false;
  const x = DB.get(t.key(), uuid);
  if(!x){ toast('その記録はもうありません'); return false; }

  // 親だけでなく、その上の親までさかのぼる（監査42回目 Minor）
  trashAncestors(k, x).forEach(pa=>{
    const p = DB.get(trashKindOf(pa.k).key(), pa.uuid);
    if(p && p.deleted_at && !一緒に.some(q=>q.k===pa.k && q.uuid===pa.uuid)) 一緒に.push(pa);
  });
  // 親から順に戻す。親が戻らないまま子だけ戻すと、見えない記録になる
  // （2026-08-20 の監査 Major）
  const 順 = 一緒に.slice().reverse().concat([{k, uuid}]);
  const 戻した = [];
  for(const pa of 順){
    let r = false;
    try{ r = DB.restore(trashKindOf(pa.k).key(), pa.uuid); }catch(e){ r = false; }
    if(r){ 戻した.push(pa); continue; }
    // 途中で失敗したら、戻した分を消し直す（半端な状態を残さない）
    let 片付いた = true;
    戻した.forEach(done=>{
      try{ if(!DB.softDelete(trashKindOf(done.k).key(), done.uuid)) 片付いた = false; }
      catch(e){ 片付いた = false; }
    });
    toast(片付いた
      ? '戻せませんでした（端末の空き容量をご確認ください）。ごみ箱のままです'
      : '戻せませんでした。しかも途中まで戻ってしまいました。'
        + '空きを作ってから、ごみ箱をご確認ください', 12000);
    return false;
  }
  // 親子を付け直す。消すときに子の親を外しているので、
  // 戻しただけでは親子が戻らず、箇所数や距離が二重に数えられる（監査64回目 Major）
  const 調査たち = {};

    if(pa.k !== 'st') return;
    const r = DB.get(DB.key.st, pa.uuid);
    if(r && r.survey_uuid) 調査たち[r.survey_uuid] = true;
  });
  let 付け直せた = true;
  Object.keys(調査たち).forEach(su=>{ if(!unitRelink(su)) 付け直せた = false; });
  // 地点を戻したら、代表の位置も決め直す（監査65・66回目 Major）
  Object.keys(調査たち).forEach(su=>{ if(!spotPosFix(su)) 付け直せた = false; });
  if(!付け直せた){
    let 片付いた = true;
    戻した.forEach(done=>{
      try{ if(!DB.softDelete(trashKindOf(done.k).key(), done.uuid)) 片付いた = false; }
      catch(e){ 片付いた = false; }
    });
    toast(片付いた
      ? '戻せませんでした（親子の付け直しができませんでした）。'
        + '端末の空き容量をご確認ください。ごみ箱のままです'
      : '戻せませんでした。しかも途中まで戻ってしまいました。'
        + '空きを作ってから、ごみ箱をご確認ください', 12000);
    return false;
  }
  toast(`${trashName(k, x)} を戻しました`
    + (一緒に.length ? `（${一緒に.map(pa=>trashKindOf(pa.k).word).join('・')}も一緒に）` : ''));
  return true;
}
/* 完全に消す。中に入っているものも一緒に消す（迷子を残さない） */
function trashPurge(k, uuid){

/* まとめて完全に消す。
   先に全部読み、1つでも読めなければ何も消さない。
   途中で失敗したら、書いた分を元に戻す（親だけ消えて子が残る、を防ぐ）
   （2026-08-20 の監査 Critical） */
const PURGE_BOX = {sv:'sv', st:'st', ca:'ca', nt:'nt', in:'ind', mc:'mc'};
function trashPurgeMany(list){
  if(!writeAllowed()){
    toast('このタブでは消せません。記録を入れているタブでお試しください', 7000);
    return false;
  }
  // 消すものを、ぜんぶ足し合わせる（親子が重なっても1回で済む）
  const 消す = {};
  Object.keys(PURGE_BOX).forEach(kk=>{ 消す[kk] = new Set(); });
  let 読めた = true;
  (list||[]).forEach(x=>{
    const t = trashTargets(x.k, x.uuid);
    if(t.読めた === false) 読めた = false;
    Object.keys(PURGE_BOX).forEach(kk=>{
      (t[kk] || new Set()).forEach(id=>消す[kk].add(id));
    });
  });
  if(!読めた){
    toast('保存された記録を読み取れないため、消しませんでした', 8000);
    return false;
  }
  // 先に全部読む。1つでも読めなければ、何も消さない
  const 元 = {};
  for(const kk of Object.keys(PURGE_BOX)){
    const key = DB.key[PURGE_BOX[kk]];
    if(!key) continue;
    try{ 元[kk] = DB.loadRaw(key); }
    catch(e){
      toast('保存された記録を読み取れないため、消しませんでした', 8000);
      return false;
    }

  // あとから書くと、書けなかったとき「消えたのに墓標が無い」＝合成で復活する。
  // 消すのに失敗したら、墓標も元へ戻す
  const 元の墓標 = localStorage.getItem('fs_tombstones') || '[]';
  {
    const a = tombstones();
    const ある = new Set(a.map(t=>t.uuid));
    const t = nowISO();
    Object.keys(消す).forEach(kk=>{
      消す[kk].forEach(u=>{ if(!ある.has(u)){ a.push({uuid:u, at:t}); ある.add(u); } });
    });
    let 書けた = false;
    try{ localStorage.setItem('fs_tombstones', JSON.stringify(a)); 書けた = true; }
    catch(e){}
    if(!書けた){
      toast('完全に消せませんでした（消した印を書けません）。'
        + '端末の空き容量をご確認ください。記録はそのままです', 10000);
      return false;
    }
  }
  const 書いた = [];
  for(const kk of Object.keys(元)){
    if(!消す[kk] || !消す[kk].size) continue;
    const key = DB.key[PURGE_BOX[kk]];
    const 残り = 元[kk].filter(r=>!(r && 消す[kk].has(r.uuid)));
    if(!DB.save(key, 残り)){
      // 書いた分を元に戻す（半端に消えたままにしない）
      let 戻せた = true;
      書いた.forEach(k2=>{
        try{ if(!DB.save(DB.key[PURGE_BOX[k2]], 元[k2])) 戻せた = false; }
        catch(e){ 戻せた = false; }
      });
      try{ localStorage.setItem('fs_tombstones', 元の墓標); }catch(e){ 戻せた = false; }
      toast(戻せた
        ? '完全に消せませんでした（端末の空き容量をご確認ください）。記録はそのままです'
        : '完全に消せませんでした。しかも元に戻せず、一部だけ消えたままです。'
          + '空きを作ってから、ごみ箱をご確認ください', 12000);
      return false;
    }
    書いた.push(kk);
  }
  toast('完全に消しました');
  return true;
}
/* 完全に消すとき、一緒に消すもの */
function trashTargets(k, uuid){
  const out = {sv:new Set(), st:new Set(), ca:new Set(), nt:new Set(),
               in:new Set(), mc:new Set()};
  // 途中で読めなかったら、そのことを持ち帰る。空として扱うと、
  // 中の記録を数え漏らしたまま親だけ消してしまう（監査64回目 Minor）
  out.読めた = true;
  const 読む = (kk)=>{
    try{ return DB.loadRaw(trashKindOf(kk).key()); }
    catch(e){ out.読めた = false; return []; }
  };
  if(k==='sv'){
    out.sv.add(uuid);
    const sts = 読む('st').filter(x=>x && x.survey_uuid===uuid);
    sts.forEach(x=>out.st.add(x.uuid));
    読む('ca').filter(x=>x && (x.survey_uuid===uuid || out.st.has(x.station_uuid)))
      .forEach(x=>out.ca.add(x.uuid));
    読む('nt').filter(x=>x && x.survey_uuid===uuid).forEach(x=>out.nt.add(x.uuid));
  }else if(k==='st'){
    out.st.add(uuid);
    // 地点を消すときは、その地点の地図で作った記録も一緒に。
    // 残すと、開く道の無い記録だけが残る（監査41回目 Critical）
    const 全st = 読む('st');
    let 増えた = true;
    while(増えた){
      増えた = false;
      全st.forEach(x=>{
        if(!x || out.st.has(x.uuid)) return;
        if(out.st.has(x.spot_uuid) || out.st.has(x.parent_uuid)){
          out.st.add(x.uuid); 増えた = true;
        }
      });
    }
    読む('ca').filter(x=>x && out.st.has(x.station_uuid)).forEach(x=>out.ca.add(x.uuid));
  }else if(k==='ca'){
    out.ca.add(uuid);
  }else{
    out.nt.add(uuid);
  }
  // メッシュのマスも、その箇所と一緒に消す（迷子にしない）
  if(out.st.size && DB.key.mc){
    try{
      DB.loadRaw(DB.key.mc).filter(x=>x && out.st.has(x.station_uuid))
        .forEach(x=>out.mc.add(x.uuid));
    }catch(e){ out.読めた = false; }
  }
  // 1尾ずつの記録も、魚の記録と一緒に消す
  if(out.ca.size && DB.key.ind){
    try{
      DB.loadRaw(DB.key.ind).filter(x=>x && out.ca.has(x.catch_uuid))
        .forEach(x=>out.in.add(x.uuid));
    }catch(e){ out.読めた = false; }
  }
  return out;
}
function trashInside(k, uuid){
  const t = trashTargets(k, uuid);
  return t.sv.size + t.st.size + t.ca.size + t.nt.size
    + (t.in ? t.in.size : 0) + (t.mc ? t.mc.size : 0) - 1;
}

/* ============ 写真も預ける ============
   写真は1枚ずつ別のファイルにする。1つの大きなファイルにまとめると、
   端末の力が足りずに作れない・送れないことがあるため */
const GD_PHOTO_FOLDER = '写真';
/* 記録から指されている写真（保存済みの分だけ）。書きかけの分は預けない */
function cloudPhotoIds(){
  return Array.from(savedPhotoIds());
}
/* まだドライブに無いもの。名前は「ID.拡張子」 */
/* 送らなくてよい写真かどうか。
   名前と「0バイトでない」だけで見ていたので、大きさの合わないファイルが
   残っていると「もうある」と見なして永久に送り直さなかった（監査37回目 Critical）。
   大きさ（sizes）が分かるときは、それも突き合わせる */
/* 送り直しが要る写真。
   ドライブに同じ名前のファイルが複数あることがある。
   「大きさの合うものがちょうど1つ」のときだけ、送らなくてよいとみなす。
   最後の1件で上書きして判断すると、壊れたほうを残したまま済ませてしまう
  （監査39回目 Critical） */
function cloudPhotoNeed(ids, 候補, 手元){
  return (ids||[]).filter(id=>{
    const l = (候補 && 候補[id]) || [];
    if(!l.length) return true;                       // まだ無い
    const m = 手元 ? 手元[id] : undefined;
    if(m === undefined) return l.length !== 1;       // 手元の大きさが分からない
    const 合う = l.filter(f=>f.size !== undefined && +f.size === +m);
    return !(合う.length === 1 && l.length === 1);   // ちょうど1つで、それが合うとき以外は送る
  });
}
/* 記録は指しているのに、この端末に実体が無い写真 */
/* 記録に控えてある「この写真は何バイトのはず」を、IDごとに集める。
   同じ名前の候補が複数あるとき、いちばん大きいものを選ぶと、
   通信に失敗してできた大きな壊れファイルを拾いうる（監査44回目 Minor） */
function cloudPhotoSizes(){
  const out = {};
  try{
    Object.keys(DB.key).forEach(kk=>{
      DB.loadRaw(DB.key[kk]).forEach(x=>{
        ((x && x.photos) || []).forEach(pp=>{
          if(pp && pp.id && +pp.size > 0) out[pp.id] = +pp.size;
        });
      });
    });
  }catch(e){}
  return out;
}
async function cloudPhotoMissing(){
  const ids = cloudPhotoIds();
  const out = [];

    let r = null;
    try{ r = await PhotoDB.get(id); }catch(e){}
    if(!r || !r.blob) out.push(id);
  }

}
async function gdSubFolder(parentId, name, token){
  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='"
    + name + "' and '" + parentId + "' in parents and trashed=false");
  const list = await gdFetch('drive/v3/files?spaces=drive&orderBy=createdTime&fields=files(id)&q='
    + q, {}, token);
  if(list.files && list.files.length) return list.files[0].id;
  const made = await gdFetch('drive/v3/files?fields=id', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name, parents:[parentId],
      mimeType:'application/vnd.google-apps.folder'})}, token);
  const again = await gdFetch('drive/v3/files?spaces=drive&orderBy=createdTime&fields=files(id)&q='
    + q, {}, token);
  return (again.files && again.files.length) ? again.files[0].id : made.id;
}
/* フォルダの中のファイル名を、全部集める（何枚あっても最後まで） */
async function gdListNames(folderId, token){
  const out = [];
  let page = '';
  for(let i=0; i<50; i++){
    const q = encodeURIComponent("'"+folderId+"' in parents and trashed=false");
    const url = 'drive/v3/files?spaces=drive&pageSize=1000'
      + '&fields=nextPageToken,files(id,name,size)&q='
      + q + (page ? '&pageToken='+encodeURIComponent(page) : '');
    const r = await gdFetch(url, {}, token);
    (r.files||[]).forEach(f=>out.push(f));
    if(!r.nextPageToken) break;
    page = r.nextPageToken;
  }
  return out;
}
/* 写真を預ける。すでにある分は送らない */
async function cloudSavePhotos(token, folder){
  const ids = cloudPhotoIds();
  if(!ids.length) return {送った:0, 全部:0, 失敗:0};
  const 写真folder = await gdSubFolder(folder, GD_PHOTO_FOLDER, token);
  const ある = await gdListNames(写真folder, token);
  // 中身の入っていない（0バイトの）ファイルは「無い」ものとして送り直す
  // IDごとに、ドライブ側の候補をぜんぶ並べる（同じ名前が複数あることがある）
  const 候補 = {};
  ある.forEach(f=>{
    const k = String(f.name).split('.')[0];
    (候補[k] || (候補[k] = [])).push(f);
  });
  const 手元の大きさ = {};
  for(const id of ids){
    try{ const r = await PhotoDB.get(id); if(r && r.blob) 手元の大きさ[id] = r.blob.size; }
    catch(e){}
  }
  // 手元に実体が無いIDは、ドライブ側の候補の数にかかわらず、ここで外す。
  // 候補がちょうど1件だと「送らなくてよい」と見なされ、
  // 失敗の数にも入らなかった（監査62回目 Minor）
  const 手元に無い = {};
  ids.forEach(id=>{ if(手元の大きさ[id] === undefined) 手元に無い[id] = true; });
  const 送る = cloudPhotoNeed(ids, 候補, 手元の大きさ).filter(id=>!手元に無い[id]);
  // 大きさの合わないファイルは、送る前に片付ける。
  // 残すと同じ名前が2つ並び、戻すときに壊れたほうを拾いうる
  // 送り直すものは、先に古いファイルを片付ける。
  // ただし「大きさの合う正しいファイル」が1つでもあるうちは消さない。
  // 消してから送信に失敗すると、正しい控えまで失う（監査39回目 Critical）
  const 消せなかった = {}, 正しいのが残った = {};
  for(const id of 送る){
    const l = 候補[id] || [];
    const m = 手元の大きさ[id];
    const 正しい = l.filter(f=>m!==undefined && f.size!==undefined && +f.size === +m);
    // 正しいものを1つだけ残し、それ以外（0バイト・大きさ違い・重複）を消す
    const 残す = 正しい.length ? 正しい[0] : null;
    for(const f of l){
      if(残す && f.id === 残す.id) continue;
      let ok = false;
      try{ ok = await gdDelete(f.id, token); }catch(e){}
      if(!ok) 消せなかった[id] = true;
    }
    // 正しいものが残っているなら、送り直さなくてよい。
    // ただし「消せなかった」は別に覚えて、あとで知らせる（監査40回目 Minor）
    if(残す) 正しいのが残った[id] = true;
  }
  const 送れる = 送る.filter(id=>!消せなかった[id] && !正しいのが残った[id]);
  const 消せず = 送る.filter(id=>消せなかった[id]).length;
  let 送った = 0, 失敗 = 消せず + Object.keys(手元に無い).length;
  for(let i=0; i<送れる.length; i++){
    const id = 送れる[i];
    let rec = null;
    try{ rec = await PhotoDB.get(id); }catch(e){}
    if(!rec || !rec.blob){ 失敗++; continue; }
    try{
      // 入れ物と中身を、1回で送る。
      // 2段構えだと、中身の送信で切れたとき0バイトのファイルが残り、
      // 次からは「もうある」と見なして永久に送らない（2026-08-20 の監査 Critical）
      const 境 = '----fs' + id.replace(/[^A-Za-z0-9]/g,'');
      const 改行 = String.fromCharCode(13, 10);   // 書き方を間違えやすいので、作って使う
      const 頭 = '--' + 境 + 改行
        + 'Content-Type: application/json; charset=UTF-8' + 改行 + 改行
        + JSON.stringify({name: id + '.' + (rec.ext||'jpg'), parents:[写真folder]})
        + 改行 + '--' + 境 + 改行
        + 'Content-Type: ' + (rec.blob.type || 'application/octet-stream')
        + 改行 + 改行;
      const 尾 = 改行 + '--' + 境 + '--';
      const body = new Blob([頭, rec.blob, 尾]);
      const up = await fetch('https://www.googleapis.com/upload/drive/v3/files'
        + '?uploadType=multipart&fields=id,size', {method:'POST',
        headers:{Authorization:'Bearer '+token,
                 'Content-Type':'multipart/related; boundary='+境},
        body});
      if(!up.ok) throw new Error('ドライブ '+up.status);
      const r2 = await up.json().catch(()=>null);
      // 送った大きさが合わないものは、送れていないものとして扱う。
      // 中途半端なファイルを残すと、次から「もうある」と見なされる
      if(r2 && r2.size !== undefined && +r2.size !== rec.blob.size){
        if(r2.id){ try{ await gdDelete(r2.id, token); }catch(e){} }
        throw new Error('大きさが合いません');
      }
      送った++;
    }catch(e){ 失敗++; }
    if(i % 5 === 4) toast(`写真を預けています…（${i+1}/${送れる.length}）`, 4000);
  }
  return {送った, 全部: ids.length, 失敗};
}
/* 足りない写真を、ドライブから取り戻す */
async function cloudRestorePhotos(token, folder){
  const 足りない = await cloudPhotoMissing();
  if(!足りない.length) return {戻した:0, 足りない:0};
  let 写真folder;
  try{ 写真folder = await gdSubFolder(folder, GD_PHOTO_FOLDER, token); }
  catch(e){ return {戻した:0, 足りない:足りない.length}; }
  const ある = await gdListNames(写真folder, token);
  // 0バイトのファイルは写真ではない。取り込むと「開けない写真」が増える。
  // 同じ名前が複数あるときは、記録に控えた大きさと合うものだけを取る。
  // 「いちばん大きいもの」だと、壊れた大きなファイルを拾いうる（監査44回目 Minor）
  const 期待 = cloudPhotoSizes();
  const 候補 = {};
  ある.filter(f=>f.size === undefined || +f.size > 0).forEach(f=>{
    const k = String(f.name).split('.')[0];
    (候補[k] || (候補[k] = [])).push(f);
  });
  const 表 = {};
  Object.keys(候補).forEach(k=>{
    const l = 候補[k];
    const want = 期待[k];
    // 大きさが分かっているなら、候補が1つでも必ず照合する。
    // しないと、通信に失敗してできた壊れファイルをそのまま戻す（監査45回目 Minor）
    if(want > 0){
      const 合う = l.filter(f=>f.size === undefined || +f.size === want);
      if(合う.length === 1) 表[k] = 合う[0];
      return;
    }
    if(l.length === 1) 表[k] = l[0];
  });
  let 戻した = 0;
  for(let i=0; i<足りない.length; i++){
    const id = 足りない[i];
    const f = 表[id];
    if(!f) continue;
    try{
      const res = await fetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',
        {headers:{Authorization:'Bearer '+token}});
      if(!res.ok) throw new Error('ドライブ '+res.status);
      const blob = await res.blob();
      if(!blob || !blob.size) throw new Error('中身がありません');
      // 落とし終わってから、もう一度大きさを見る
      if(期待[id] > 0 && blob.size !== 期待[id]) throw new Error('大きさが合いません');
      const ext = String(f.name).split('.').slice(1).join('.') || 'jpg';
      await PhotoDB.put({id, blob, ext, size: blob.size, added_at: nowISO()});
      戻した++;
    }catch(e){}
    if(i % 5 === 4) toast(`写真を戻しています…（${i+1}/${足りない.length}）`, 4000);
  }
  return {戻した, 足りない: 足りない.length - 戻した};
}
/* ---- 自動クラウドバックアップ ----

const AUTO_BACKUP_MS = 3 * 60 * 1000;   // 変わってから3分後

async function autoBackupRun(){

/* 記録の「いつの操作か」。更新・削除・作成のうち、いちばん新しい時刻。
   まとめて消す経路や前の版の削除は deleted_at しか持たないことがあり、
   updated_at だけで比べると、別の端末の生きた古い記録と同点になって
   合成の結果が揺れる（監査76回目 Major） */
function recTime(x){
  if(!x) return '';
  const a = String(x.updated_at||''), b = String(x.deleted_at||''),
        c = String(x.created_at||'');
  let t = a;
  if(b > t) t = b;
  if(c > t) t = c;
  return t;
}
/* 同じ時刻の記録の勝ち負けを、どの経路でも同じに決める（監査77回目 Minor）。
   1) 新しい時刻 2) 消した方（消した意思を優先） 3) 中身の文字の並び */
function recPick(a, b){
  if(!a) return b; if(!b) return a;
  const ta = recTime(a), tb = recTime(b);
  if(ta !== tb) return ta > tb ? a : b;
  const da = !!a.deleted_at, db = !!b.deleted_at;
  if(da !== db) return da ? a : b;
  let sa = '', sb = '';
  try{ sa = stableStringify(a); }catch(e){}
  try{ sb = stableStringify(b); }catch(e){}
  return sa >= sb ? a : b;
}
/* 入れ子まで含めて、鍵の順をそろえて文字にする。
   JSON.stringify の第2引数（鍵の並び）は入れ子の中身まで削ってしまい、
   写真や漁具だけが違う記録を「同じ」と見なしていた（監査78回目 Major） */
function stableStringify(v){
  if(v === null || typeof v !== 'object') return JSON.stringify(v);
  if(Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k=>
    JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
/* 2つの控え（data＋墓標）を、記録ごとに「新しい方」で合わせる純粋な関数 */
function mergeDatasets(A, B){
  const 時 = recTime;

    const m = Object.create(null);
    ((A.data && A.data[k]) || []).forEach(x=>{ if(x && x.uuid) m[x.uuid] = x; });
    ((B.data && B.data[k]) || []).forEach(x=>{
      if(!x || !x.uuid) return;
      m[x.uuid] = recPick(m[x.uuid], x);
    });
    data[k] = Object.keys(m).map(u=>m[u]);
  }
  const tm = Object.create(null);
  (A.tombstones||[]).concat(B.tombstones||[]).forEach(t=>{
    if(!t || !safeId(t.uuid)) return;
    const at = (typeof t.at === 'string') ? t.at : '';
    if(tm[t.uuid] === undefined || at > tm[t.uuid]) tm[t.uuid] = at;
  });

}

  let 全ファイル = [], page = '', 読み切れず = false;
  for(let i=0; ; i++){
    if(i >= 50){ 読み切れず = true; break; }   // 異常な数。読み切れなかったと扱う
    const list = await gdFetch('drive/v3/files?spaces=drive'
      + '&fields=nextPageToken,files(id,name,modifiedTime)&q='+q
      + (page ? '&pageToken='+encodeURIComponent(page) : ''), {}, token);
    (list.files||[]).forEach(f=>全ファイル.push(f));
    if(!list.nextPageToken) break;
    page = list.nextPageToken;
  }
  const files = 全ファイル.filter(f=>f && /\.json$/.test(String(f.name||'')));
  let 合わせ = null, 読めた = 0, 読めない = 読み切れず ? 1 : 0;
  for(const f of files){
    try{
      const r = await fetch('https://www.googleapis.com/drive/v3/files/'
        + f.id + '?alt=media', {headers:{Authorization:'Bearer '+token}});
      if(!r.ok) throw new Error('ドライブ ' + r.status);
      const o = JSON.parse(await r.text());
      const 検査 = cloudCheck(JSON.stringify({app:o.app, version:o.version,
        saved_at:o.saved_at, data:o.data, tombstones:o.tombstones}));
      if(!検査.ok){ 読めない++; continue; }
      const 今回 = {data: 検査.data, tombstones: 検査.tombstones};
      合わせ = 合わせ ? mergeDatasets(合わせ, 今回) : 今回;
      読めた++;
    }catch(e){ 読めない++; }
  }
  return {合わせ, 読めた, 読めない, ファイル数: files.length};
}

/* ---- ドライブと合成（2台で使うとき） ----
   ドライブの控えと手元の記録を、記録ごとに「新しい操作をした方」で合わせる。
   ・同じ記録が両方にあれば、更新時刻の新しい方
   ・片方にしかなければ、それを残す
   ・墓標（完全に消した印）は両方を合わせ、載っている記録は戻さない
   合わせた結果を手元に置き、ドライブへも送り返す（2026-08-23・鳥アプリの考え方） */
function mergeBackup(remoteData, remoteTombs){
  const tombs = Object.create(null);
  tombstones().forEach(t=>{ tombs[t.uuid] = t.at || ''; });
  (Array.isArray(remoteTombs) ? remoteTombs : []).forEach(t=>{
    if(!t || typeof t.uuid !== 'string' || !safeId(t.uuid)) return;
    const at = (typeof t.at === 'string') ? t.at : '';
    // 同じ記録に墓標が2つあれば、新しい方の日時で持つ
    if(tombs[t.uuid] === undefined || at > tombs[t.uuid]) tombs[t.uuid] = at;
  });
  const 時 = recTime;
  const box = {}, 控え = [];
  const 数 = {手元のみ:0, ドライブのみ:0, 新しい方:0, 同じ:0, 墓標で除外:0, 墓標より新しい:0};
  for(const k of CLOUD_KEYS){
    const L = Object.create(null), R = Object.create(null);
    DB.loadRaw(DB.key[k]).forEach(x=>{ if(x && x.uuid) L[x.uuid] = x; });
    ((remoteData && remoteData[k]) || []).forEach(x=>{ if(x && x.uuid) R[x.uuid] = x; });
    const ids = new Set(Object.keys(L).concat(Object.keys(R)));
    const out = [];
    ids.forEach(u=>{
      const l = L[u], r = R[u];
      const 勝ち = recPick(l, r);
      if(tombs[u] !== undefined){
        // 墓標より新しい編集は消さない（消したあとに、別の端末で直した記録。
        // 無条件に消すと、その編集が黙って失われる。監査71回目 Critical）。
        // 日時の分からない墓標も、消す側に倒さない。
        // ただし墓標を破れるのは「生きた記録」だけ。ごみ箱への削除は
        // 消す操作なので、完全削除（墓標）を取り消す理由にならない。
        // 墓標より新しい削除なら、墓標の時刻をそこまで進める（監査82回目 Major）
        if((!tombs[u] || 時(勝ち) > tombs[u]) && !勝ち.deleted_at){
          数.墓標より新しい++;
          delete tombs[u];               // 記録が生きるので、墓標を下げる
        }else{
          if(時(勝ち) > (tombs[u]||'')) tombs[u] = 時(勝ち);
          数.墓標で除外++;
          控え.push({k, rec: 勝ち});     // どの入れ物かの札を付けて控える
          return;
        }
      }
      if(l && r){
        if(時(l) === 時(r)) 数.同じ++;
        else 数.新しい方++;
      }else if(l) 数.手元のみ++;
      else 数.ドライブのみ++;
      out.push(勝ち);
    });
    box[k] = out;
  }
  // 墓標より新しい子の祖先を、同じ集まりから復活させる（監査81回目 Major）
  {
    const 全勝ち = {};
    for(const k of CLOUD_KEYS){
      const m2 = Object.create(null);
      DB.loadRaw(DB.key[k]).forEach(x=>{ if(x && x.uuid) m2[x.uuid] = x; });
      ((remoteData && remoteData[k]) || []).forEach(x=>{
        if(!x || !x.uuid) return;
        m2[x.uuid] = recPick(m2[x.uuid], x);
      });
      全勝ち[k] = m2;
    }
    resurrectAncestors(box, 全勝ち, tombs, 控え, 数);
  }
  // 合わせた結果から、親を失った行を外す（片方で親を消していた場合など）。
  // 外す行の中身は控えに残す（黙って失わない。監査71回目 Critical）
  {
    const 写し = {};
    CLOUD_KEYS.forEach(k=>{ 写し[k] = box[k].map(x=>Object.assign({}, x)); });
    cloudPrune(写し);
    CLOUD_KEYS.forEach(k=>{
      const 残る = new Set(写し[k].map(x=>x.uuid));
      box[k].forEach(x=>{ if(!残る.has(x.uuid)) 控え.push({k, rec: x}); });
    });
  }
  const 外した = cloudPrune(box);
  const merged = Object.keys(tombs).map(u=>({uuid:u, at:tombs[u]}));
  return {box, 数, 外した, tombs: merged, 控え};
}
/* 墓標より新しい子が生き残ったのに、親が墓標で消えていたら、
   親（とその祖先）も同じ集まりから復活させ、祖先の墓標を下げる。
   これをしないと「新しい編集は残す」と言いながら、親を失った子が
   迷子として除かれてしまう（監査81回目 Major）。
   親のたどり: 1尾ずつ→魚の記録→箇所→調査、メモ→調査、マス→箇所、
   さらに箇所どうし（単位→親の囲い、単位→地点）もたどる（監査82回目 Major）。
   証拠になるのは「生きた記録」だけ。ごみ箱への削除は証拠にしない。
   復活させる祖先がごみ箱状態なら、写しを取って印を外し、
   更新時刻を証拠の時刻まで進めてから返す（監査82回目 Major） */
function resurrectAncestors(box, 全勝ち, tombs, 控え, 数){
  const 親道 = [
    {k:'ind', 欄:'catch_uuid',   先:'ca'},
    {k:'ca',  欄:'station_uuid', 先:'st'},
    {k:'mc',  欄:'station_uuid', 先:'st'},
    {k:'st',  欄:'parent_uuid',  先:'st'},
    {k:'st',  欄:'spot_uuid',    先:'st'},
    {k:'st',  欄:'survey_uuid',  先:'sv'},
    {k:'nt',  欄:'survey_uuid',  先:'sv'},
  ];
  const ある = {};
  CLOUD_KEYS.forEach(k=>{
    ある[k] = new Map((box[k]||[]).map(x=>[x.uuid, x]));
  });
  // 「新しい編集がある」という証拠の時刻。親をたどるとき、
  // きっかけになった子の時刻を上へ運ぶ。運ばないと、
  // 箇所そのものは古いために、その上の調査が復活しない
  const 証拠 = Object.create(null);
  const 証拠時 = x => {
    const t = x.deleted_at ? '' : recTime(x);   // ごみ箱の記録自身は証拠にならない
    const v = 証拠[x.uuid] || '';
    return t > v ? t : v;
  };
  // 子（下の段）から親（上の段）へ、何度か回して連鎖を拾う。
  // 箇所どうしのたどり（単位→囲い→地点）が挟まるため、回数は多めに取る。
  // 「ある」と「証拠」は増える一方なので、堂々巡りにはならない
  for(let 回 = 0; 回 < 8; 回++){
    let 増えた = false;
    親道.forEach(道=>{
      (box[道.k]||[]).forEach(x=>{
        const pu = x && x[道.欄];
        if(!pu || pu === x.uuid) return;
        const 証 = 証拠時(x);
        if(!証) return;
        const 居る = ある[道.先].get(pu);
        if(居る){
          // 親はいる。ごみ箱状態で、証拠の方が新しければ、ごみ箱から出す
          if(居る.deleted_at && 証 > String(居る.deleted_at)){
            delete 居る.deleted_at; delete 居る.deleted_by;
            if(証 > String(居る.updated_at||'')) 居る.updated_at = 証;
            増えた = true;
          }
          // 証拠の時刻だけは上へ運ぶ（祖父母の墓標を破るために要る）
          if(証 > (証拠[pu]||'')){ 証拠[pu] = 証; 増えた = true; }
          return;
        }
        const 親 = (全勝ち[道.先]||Object.create(null))[pu];
        if(!親) return;                          // どこにも無い親は復活させようがない
        const 墓 = tombs[pu];
        if(墓 === undefined) return;             // 墓標が無いのに無い＝別の理由。触らない
        // 子の編集（またはその子の証拠）が墓標より新しいときだけ、
        // 親を返して墓標を下げる
        if(!墓 || 証 > 墓){
          const 復活 = Object.assign({}, 親);
          if(復活.deleted_at){
            // ごみ箱状態の写ししか無ければ、削除の方が新しい限り復活させない
            if(!(証 > String(復活.deleted_at))) return;
            delete 復活.deleted_at; delete 復活.deleted_by;
          }
          // 復活した祖先の時刻を、証拠の時刻まで進めて残す。進めないと、
          // 他の端末ファイルに残ったままの古い墓標に次の合成でまた負けて、
          // 復活と消滅を繰り返し、結果が定まらない（監査83回目 Major）。
          // （箱の中に生きて居る祖先はそもそも墓標に負けていないので進めない。
          //  進めると、他の端末でのその記録自体の編集を上書きしてしまう）
          if(証 > recTime(復活)) 復活.updated_at = 証;
          box[道.先].push(復活);
          ある[道.先].set(pu, 復活);
          証拠[pu] = 証;                         // 証拠の時刻を上へ運ぶ
          delete tombs[pu];
          if(数) 数.墓標より新しい++;
          // 控えに入れてしまっていたら、取り出す
          const i = 控え.findIndex(c=>c && c.rec && c.rec.uuid === pu);
          if(i >= 0) 控え.splice(i, 1);
          増えた = true;
        }
      });
    });
    if(!増えた) break;
  }
}
/* 読み合わせた控え（data＋墓標）を、そのまま使える形に整える。
   ・墓標より古い記録は除く（除いた分は札付きで返す）
   ・記録の方が新しければ墓標を下げる
   ・親を失った行も除いて札付きで返す
   「戻す」で墓標を効かせないと、別の端末で消した記録が復活し、
   次の合成でまた消える＝結果が揺れる（監査74回目 Major） */
function normalizeDataset(ds){
  const 時 = recTime;
  const tombs = Object.create(null);
  (ds.tombstones||[]).forEach(t=>{
    if(!t || !safeId(t.uuid)) return;
    const at = (typeof t.at === 'string') ? t.at : '';
    if(tombs[t.uuid] === undefined || at > tombs[t.uuid]) tombs[t.uuid] = at;
  });
  const data = {}, 控え = [];
  const 全勝ち = {};
  for(const k of CLOUD_KEYS){
    const m2 = Object.create(null);
    ((ds.data && ds.data[k]) || []).forEach(x=>{ if(x && x.uuid) m2[x.uuid] = x; });
    全勝ち[k] = m2;
    data[k] = ((ds.data && ds.data[k]) || []).filter(x=>{
      if(!x || !x.uuid) return false;
      if(tombs[x.uuid] === undefined) return true;
      // 墓標を破れるのは生きた記録だけ（合成と同じ決まり。監査82回目 Major）
      if((!tombs[x.uuid] || 時(x) > tombs[x.uuid]) && !x.deleted_at){
        delete tombs[x.uuid]; return true;
      }
      if(時(x) > (tombs[x.uuid]||'')) tombs[x.uuid] = 時(x);
      控え.push({k, rec: x});
      return false;
    });
  }
  // 墓標より新しい子の祖先を復活させる（合成と同じ決まり。監査81回目 Major）
  resurrectAncestors(data, 全勝ち, tombs, 控え, null);
  {
    const 写し = {};
    CLOUD_KEYS.forEach(k=>{ 写し[k] = data[k].map(x=>Object.assign({}, x)); });
    cloudPrune(写し);
    CLOUD_KEYS.forEach(k=>{
      const 残る = new Set(写し[k].map(x=>x.uuid));
      data[k].forEach(x=>{ if(!残る.has(x.uuid)) 控え.push({k, rec: x}); });
    });
  }
  cloudPrune(data);
  return {data, tombstones: Object.keys(tombs).map(u=>({uuid:u, at:tombs[u]})), 控え};
}
async function cloudMerge(){
  if(!writeAllowed()){
    toast('このタブでは合成できません。記録を入れているタブでお試しください', 7000);
    return;
  }
  if(cloudBusy()) return;
  try{
  // 打ちかけがあれば、先に記録へ書いてしまう。書かずに合成すると、
  // そのあと開いた画面で古い打ちかけが復元され、合成した内容を上書きする
  //（監査79回目 Major）。書けなければ合成をやめる（監査80回目 Major）
  let 書けた = false;
  try{ 書けた = flushAllForms(); }catch(e){}
  if(!書けた){
    toast('打ちかけを保存できないため、合成をやめました。'
      + '端末の空き容量をご確認ください', 10000);
    return;
  }
  toast('ドライブの控えを読んでいます…', 8000);
  let 全部 = null;
  try{
    const token = await gdGetToken();
    const folder = await gdFolder(token);
    全部 = await cloudFetchAll(token, folder);
  }catch(e){
    toast('ドライブの控えを読めませんでした（' + (e && e.message || '') + '）', 9000);
    return;
  }
  // 「読めない」を先に見る。全部読めなかったときに「控えが無い」と
  // 取り違えると、欠けた内容で上書きしてしまう（監査81回目 Major）
  if(全部 && 全部.読めない){
    // 欠けた控えに、墓標より新しい編集が入っているかもしれない。
    // 欠けたまま墓標を効かせると、その編集が消える（監査80回目 Major）。
    // 「戻す」と同じく、読み切れないときはやめる
    toast('控えのうち ' + 全部.読めない + 'ファイルを読めませんでした。'
      + '欠けたまま合成すると記録が消えることがあるため、やめました。'
      + '電波の良いところでもう一度お試しください', 12000);
    return;
  }
  if(!全部 || !全部.合わせ){
    // ドライブがまだ空なら、いまの記録を送るだけでよい
    if(confirm('ドライブにまだ控えがありません。いまの記録を保存しますか？')){
      await cloudSave({nested:true});
    }
    return;
  }
  const m = mergeBackup(全部.合わせ.data, 全部.合わせ.tombstones);
  const 外し数 = Object.keys(m.外した||{}).reduce((a,k)=>a+m.外した[k], 0);
  if(!confirm('ドライブの控えと合成します。\n'
    + '・手元だけにある記録 ' + m.数.手元のみ + '件（残ります）\n'
    + '・ドライブだけにある記録 ' + m.数.ドライブのみ + '件（取り込みます）\n'
    + '・両方にあって内容が違う ' + m.数.新しい方 + '件（新しい操作をした方）\n'
    + '・完全に消した印で除くもの ' + m.数.墓標で除外 + '件'
    + (m.数.墓標より新しい ? '\n・消した後に直されていた記録 ' + m.数.墓標より新しい
        + '件（残します）' : '')
    + (外し数 ? '\n・もとの記録が見あたらない分 ' + 外し数 + '件（端末に控えて除きます）' : '')
    + '\nよろしいですか？')) return;
  // 読んでいる間・確認を待つ間にも、入力は進んでいることがある（監査81回目 Major）。
  // ここでもう一度打ちかけを書き、残りを控えてから、いまの手元で合成を組み直す
  try{ if(!flushAllForms()){
    toast('打ちかけを保存できないため、合成をやめました', 10000);
    return;
  } }catch(e){}
  try{
    const 残り = Object.assign({}, draftAll());
    // 端末に書けず画面の中（メモリ）だけに残った入力も、同じ控えに入れる。
    // 容量が足りないときこそ、ここにしか残っていない（監査82回目 Major）
    Object.keys(DRAFT_HOLD).forEach(k2=>{
      if(DRAFT_HOLD[k2]) 残り[k2] = DRAFT_HOLD[k2];
    });
    if(Object.keys(残り).length
       && !repairBackupPush({種類:'合成前の書きかけ', 中身: 残り})){

  // 除く分の中身を、先に端末へ控える（黙って失わない。監査71回目 Critical）。
  // 控えられないときは、合成をやめる
  // 控えは「種類＋中身」の形でそろえる。形が違うと、点検の行数に出ず、

  if((m.控え||[]).length && !repairBackupPush({種類:'合成で除いた行', 中身:m.控え})){

  const 元 = {};

        ? '合成できませんでした（端末の空き容量をご確認ください）。記録はそのままです'

  const 元の墓標 = localStorage.getItem('fs_tombstones') || '[]';

  let 整えた = true;

    return;
  }
  toast('合成しました。ドライブへも送り返します…', 6000);
  let 送り = 'error';
  try{ 送り = await cloudSave({auto:true, nested:true}); }catch(e){}
  // 手元に実体の無い写真を、ドライブから取り寄せる
  try{
    const token = await gdGetToken();
    const folder = await gdFolder(token);
    const r = await cloudRestorePhotos(token, folder);
    if(r && (r.戻した || r.足りない)){
      toast('写真: ' + (r.戻した||0) + '枚を取り寄せました'
        + (r.足りない ? '（見つからない分 ' + r.足りない + '枚）' : ''), 8000);
    }
  }catch(e){}
  reset('home');
  if(送り === 'ok') toast('合成が終わりました', 6000);
  else{
    toast('手元は合成できましたが、ドライブへ送り返せませんでした。'
      + 'あとで「ドライブに保存する」を押してください', 12000);
  }
  }finally{ cloudFree(); }
}

async function cloudRestore(){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  if(cloudBusy()) return;
  try{
  toast('ドライブから読んでいます…', 8000);
  try{
    const token = await gdGetToken();
    const folder = await gdFolder(token);
    const 全部 = await cloudFetchAll(token, folder);
    if(!全部.合わせ && !全部.読めない){
      toast('ドライブに控えがありませんでした', 8000); return;
    }
    if(全部.読めない){
      // 「戻す」は丸ごと置き換え。1ファイルでも読めていないと、
      // その端末だけにあった記録を消してしまう（監査75回目 Major）。
      // 足す方向の「合成」とは違い、ここでは中止する
      toast('控えのうち ' + 全部.読めない + 'ファイルを読めませんでした。'
        + '欠けたまま置き換えると記録が消えるため、戻すのをやめました。'
        + '電波の良いところでもう一度お試しください', 12000);
      return;
    }
    const 中 = normalizeDataset(全部.合わせ);
    const いま = CLOUD_KEYS.reduce((a,k)=>a + DB.load(DB.key[k]).length, 0);
    const 控え = CLOUD_KEYS.reduce((a,k)=>a + (中.data[k]||[]).length, 0);
    if(!confirm(`ドライブの控え（${全部.読めた}ファイルを読み合わせ／${控え}件）で、`
      + `いまの記録（${いま}件）を置き換えます。\n`
      + (中.控え.length ? `消した印などで除く分 ${中.控え.length}件は端末に控えます。\n` : '')
      + 'いまの記録は消えます。よろしいですか？')) return;
    if(中.控え.length && !repairBackupPush({種類:'戻すときに除いた行', 中身:中.控え})){
      toast('除く分の控えを取れなかったため、やめました。'
        + '端末の空き容量をご確認ください', 10000);
      return;
    }
    if(cloudApply(中.data, 中.tombstones)){
      // 戻した直後に、親子の結び付きと代表の位置を整える。
      // 古い写しが「消した囲い」を親に指したままだと、その囲いの
      // 完全削除に生きた子まで巻き込まれる（監査83回目 Critical）
      let 整えた = true;
      try{
        DB.surveys().forEach(sv=>{
          if(!unitRelink(sv.uuid)) 整えた = false;
          if(!spotPosFix(sv.uuid)) 整えた = false;
        });
      }catch(e){ 整えた = false; }
      let 写真 = {戻した:0, 足りない:0}, 写真の失敗 = '';
      try{ 写真 = await cloudRestorePhotos(token, folder); }
      catch(e){ 写真の失敗 = (e && e.message) || String(e); }
      toast('ドライブの控えで置き換えました'
        + (整えた ? '' : '（ただし親子のつながりを整えられませんでした。'
          + '「データを点検」をお試しください）')
        + (写真の失敗 ? `（ただし写真は戻せませんでした：${写真の失敗}）`
          : (写真.戻した ? `（写真 ${写真.戻した}枚も戻しました`
              + (写真.足りない ? `／${写真.足りない}枚は見つかりませんでした` : '') + '）'
            : (写真.足りない ? `（写真 ${写真.足りない}枚は見つかりませんでした）` : ''))), 9000);
      reset('home');
      return;
    }
  }catch(e){
    toast('戻せませんでした：' + ((e && e.message) || e), 10000);
  }
  render();
  }finally{ cloudFree(); }
}

   資料・データの管理（2026-08-23 の実機の声・鳥アプリに合わせた魚版）
   ・JSONバックアップ（全データ・写真込み）とその取り込み
   ・写真一覧／資料PDF／データ点検
   クラウド保存（Googleドライブ）は既にあるものをそのまま使う

/* ---- 位置GeoJSON（QGISでそのまま開ける形・EPSG:4326） ----
   点・線・面で1ファイルずつ。座標の並びは GeoJSON の決まりで [経度, 緯度]
   （2026-08-23 の実機の声・鳥アプリから） */
function geoFeature(geom, props){ return {type:'Feature', geometry:geom, properties:props}; }
function geoProps(sv, st, 種別){
  const si = spotInfoOf(sv, st);
  return {
    '種別': 種別, '名前': st.name||'', '調査日': stationDate(st, sv),
    '河川名': sv.river_name||'', '地点': si.spot||'', '地点名': si.site||'',
    '区間名': si.section||'', '調べたもの': exportKind(sv, st),
    '調査ID': sv.uuid, '記録ID': st.uuid,
  };
}
function buildGeoJSON(sv){
  const 点 = [], 線 = [], 面 = [];
  const sts = DB.stationsOf(sv.uuid).filter(unitReady);
  for(const st of sts){
    if(isMesh(st)) continue;                       // メッシュは31列とマスCSVで
    const k = unitKindOf(st);
    if(st.is_spot){
      const pt = stationPt(st);
      if(pt) 点.push(geoFeature({type:'Point', coordinates:[pt[1], pt[0]]},
        geoProps(sv, st, '調査地点')));
    }else if(k === 'P'){
      const pt = stationPt(st);
      if(pt) 点.push(geoFeature({type:'Point', coordinates:[pt[1], pt[0]]},
        geoProps(sv, st, 'ポイント')));
    }else if(k === 'E' || k === 'PF'){
      const pts = polyPts(st);
      if(pts.length >= 3){
        const ring = pts.map(v=>[v[1], v[0]]);
        ring.push(ring[0]);                        // 面は始点で閉じる
        面.push(geoFeature({type:'Polygon', coordinates:[ring]},
          geoProps(sv, st, k==='E' ? '調査範囲' : '河川区分（瀬淵）')));
      }
    }else if(isLine(st)){
      const a = linePt(st, 'start'), b = linePt(st, 'end');
      if(a){
        const mids = lineVias(st).map(v=>[v[1], v[0]]);
        const coords = [[a[1], a[0]]].concat(mids).concat(b ? [[b[1], b[0]]] : []);
        if(coords.length >= 2){
          const pr = geoProps(sv, st, '物理環境ライン');
          pr['向き'] = st.line_direction||'';
          線.push(geoFeature({type:'LineString', coordinates:coords}, pr));
        }
      }
    }else{
      // 物理環境の測点・前のやり方の箇所
      const pt = stationPt(st);
      if(pt){
        const pr = geoProps(sv, st, stationKind(sv, st)==='物理環境' ? '測点' : '箇所');
        pr['水深cm'] = numOf(st.depth_rep_cm); pr['流速cms'] = numOf(st.velocity_rep_cms);
        pr['環境区分'] = st.habitat_type||'';
        点.push(geoFeature({type:'Point', coordinates:[pt[1], pt[0]]}, pr));
      }
    }
    // 歩いた道すじ（どの種類の記録に付いていても出す）
    const tr = (st.track||[]).filter(validPt);
    if(tr.length >= 2){
      線.push(geoFeature({type:'LineString',
        coordinates: tr.map(v=>[v[1], v[0]])},
        geoProps(sv, st, '歩いた道すじ')));
    }
  }
  return {点, 線, 面};
}
function exportGeoJSON(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  const g = buildGeoJSON(sv);
  const base = `fish_${String(sv.survey_date||'').replace(/-/g,'')}_${(sv.river_name||'').slice(0,10)}`;
  let 出した = 0;
  const 出す = (名, feats)=>{
    if(!feats.length) return;
    download(`${base}_${名}.geojson`,
      JSON.stringify({type:'FeatureCollection', features:feats}), 'application/geo+json');
    出した++;
  };
  出す('点', g.点); 出す('線', g.線); 出す('面', g.面);
  toast(出した
    ? `GeoJSONを ${出した}ファイル書き出しました（点${g.点.length}・線${g.線.length}・面${g.面.length}）。`
      + 'QGISへそのまま読み込めます'
    : '位置の付いた記録がまだありません', 8000);
}

/* ---- 報告書用の書き出し（種一覧・地点×種） ----
   報告書の表をそのまま作れる形（2026-08-23 の実機の声・鳥アプリから）。
   数える決まりは画面の集計（surveyTally）と同じ:
   記録はいちばん小さい単位の分だけ数え、場所は地点でまとめる */
function buildReport(sv){
  const t = surveyTally(sv.uuid);
  // 列は場所の「鍵」で組む。名前だけで組むと、同じ名前の地点があったとき
  // 別の地点の尾数が同じ列に混ざる（監査71回目 Major）。
  // 同じ名前が重なったら (2)(3) を付けて見分ける
  const 名の数 = Object.create(null);
  const 場所たち = (t.場所||[]).map(x=>{
    const 名 = x.name || '（名前なし）';
    名の数[名] = (名の数[名]||0) + 1;
    return {鍵: x.鍵, 名: 名の数[名] > 1 ? `${名}(${名の数[名]})` : 名};
  });
  const 場所列 = 場所たち.map(x=>x.名);
  // 種一覧
  const 種一覧 = (t.種||[]).map(k=>{
    const sp = speciesById(k.id);
    return {
      '種名': k.name||'', '種ID': k.id||'', '科': sp ? sp.fam||'' : '',
      '尾数': k.尾, '出現地点数': Object.keys(k.場所||{}).length,
    };
  });
  // 地点×種（行＝種、列＝地点）
  const クロス = (t.種||[]).map(k=>{
    const row = {'種名': k.name||''};
    場所たち.forEach(x=>{
      const b = (k.場所||{})[x.鍵];
      row[x.名] = b ? b.尾 : '';
    });
    row['合計'] = k.尾;
    return row;
  });
  return {種一覧, クロス, 場所列};
}
function exportReport(svUuid){
  const sv = DB.getAlive(DB.key.sv, svUuid); if(!sv) return;
  const r = buildReport(sv);
  if(!r.種一覧.length){ toast('魚の記録がまだありません', 6000); return; }
  const base = `fish_${String(sv.survey_date||'').replace(/-/g,'')}_${(sv.river_name||'').slice(0,10)}`;
  download(`${base}_報告_種一覧.csv`,
    toCsv(['種名','種ID','科','尾数','出現地点数'], r.種一覧), 'text/csv');
  download(`${base}_報告_地点×種.csv`,
    toCsv(['種名'].concat(r.場所列).concat(['合計']), r.クロス), 'text/csv');
  toast(`報告書用のCSVを2つ書き出しました（${r.種一覧.length}種 × ${r.場所列.length}地点）`, 8000);
}

/* ---- 横断検索（2026-08-23 の実機の声・鳥アプリから） ----
   種名・場所・メモ・名前で、全部の調査の記録から探す */
function searchAll(q){
  q = String(q||'').trim();
  if(!q) return [];
  const 語 = q.split(/\s+/).filter(Boolean);
  const 当たる = (文)=>語.every(w=>String(文||'').indexOf(w)>=0);
  const out = [];
  const svName = {};
  try{
    DB.surveys().forEach(sv=>{
      svName[sv.uuid] = `${sv.river_name||''} ${String(sv.survey_date||'').slice(0,10)}`;
      const 文 = [sv.river_name, sv.site_name, sv.section_name, sv.memo,
        sv.investigator, sv.project_name, sv.project_number].join(' ');
      if(当たる(文)) out.push({種類:'調査', 見出し:svName[sv.uuid],
        添え: sv.memo||'', 開く:()=>goTo('survey', sv.uuid)});
    });
    // 親（調査・箇所）が消えている記録は出さない。
    // 出すと、押しても開けない（監査71回目 Minor）
    DB.loadRaw(DB.key.st).filter(x=>x && !x.deleted_at
        && svName[x.survey_uuid] !== undefined).forEach(st=>{
      const 文 = [st.name, st.memo, st.site_name, st.section_name,
        st.habitat_type].join(' ');
      if(当たる(文)) out.push({種類: st.is_spot ? '地点' : '箇所・単位',
        見出し: `${st.name||''}（${svName[st.survey_uuid]||''}）`,
        添え: st.memo||st.habitat_type||'', 開く:()=>mapOpenRecord(st.uuid)});
    });
    DB.loadRaw(DB.key.ca).filter(x=>x && !x.deleted_at).forEach(c=>{
      const 文 = [c.species_name, c.notes].join(' ');
      if(当たる(文)){
        const st = DB.liveStation(c.station_uuid);
        if(!st || svName[c.survey_uuid] === undefined) return;
        out.push({種類:'魚の記録',
          見出し: `${c.species_name||''} ${catchTotal(c)}尾（${st.name||''}・${svName[c.survey_uuid]||''}）`,
          添え: c.notes||'', 開く:()=>nav('catchEdit',{uuid:c.uuid})});
      }
    });
    DB.loadRaw(DB.key.nt).filter(x=>x && !x.deleted_at
        && svName[x.survey_uuid] !== undefined).forEach(nt=>{
      if(当たる(nt.content||'')) out.push({種類:'メモ',
        見出し: `${String(nt.content||'').slice(0,24)}（${svName[nt.survey_uuid]||''}）`,
        添え: String(nt.content||'').slice(0,60),
        開く:()=>nav('noteEdit',{uuid:nt.uuid})});
    });
  }catch(e){}
  return out.slice(0, 100);
}
let SEARCH_Q = '';

/* ---- JSONバックアップ（書き出し） ----
   形は cloudPack と同じ {app,version,saved_at,data} に photos を足したもの。
   取り込み側は cloudCheck で同じ検査を通す */
async function exportBackup(){
  toast('バックアップを作っています…', 8000);
  let text;
  try{ text = cloudPack(); }
  catch(e){ toast('記録を読み取れないため、書き出せませんでした', 8000); return; }
  const 点検 = cloudCheck(text);
  if(!点検.ok){
    toast('記録に戻せない形が混ざっています（' + 点検.why + '）。'
      + '先に「データ点検」をご覧ください', 10000);
    return;
  }
  const o = JSON.parse(text);
  // 写真も入れる（記録が指しているものだけ）
  o.photos = [];
  const ids = cloudPhotoIds();
  let 欠け = 0;
  for(const id of ids){
    let r = null; try{ r = await PhotoDB.get(id); }catch(e){}
    if(!r || !r.blob){ 欠け++; continue; }
    const b64 = await new Promise(res=>{
      const fr = new FileReader();
      fr.onload = ()=>res(String(fr.result||'').split(',')[1] || '');
      fr.onerror = ()=>res('');
      fr.readAsDataURL(r.blob);
    });
    if(b64) o.photos.push({id, ext: r.ext||'jpg', size: r.blob.size, b64});
    else 欠け++;
  }
  const day = dateValue().replace(/-/g,'');
  download('fish_survey_backup_' + day + '.json', JSON.stringify(o), 'application/json');
  toast('バックアップを書き出しました（記録と写真 ' + o.photos.length + '枚'
    + (欠け ? '・この端末に無い写真 ' + 欠け + '枚は入っていません' : '') + '）', 9000);
}

/* ---- JSONバックアップ（取り込み） ---- */
async function doImport(){
  const inp = $('#impFile');
  const f = inp && inp.files && inp.files[0];
  if(!f){ toast('ファイルを選んでください', 6000); return; }
  if(!writeAllowed()){
    toast('このタブでは取り込めません。記録を入れているタブでお試しください', 7000);
    return;
  }
  let text;
  try{ text = await f.text(); }
  catch(e){ toast('ファイルを読めませんでした', 8000); return; }
  // 写真を分けてから、記録の部分を cloudCheck と同じ検査に通す
  let o;
  try{ o = JSON.parse(text); }catch(e){ toast('中身を読めませんでした', 8000); return; }
  const photos = Array.isArray(o.photos) ? o.photos : [];
  delete o.photos;
  const 点検 = cloudCheck(JSON.stringify(o));
  if(!点検.ok){ toast('取り込めない形です（' + 点検.why + '）', 10000); return; }
  // 写真も、記録を置き換える前に形を確かめる（監査71回目 Minor）。
  // 壊れた1枚で全体を止めず、その枚だけ飛ばす。ただし多すぎ・大きすぎは全体を断る
  if(photos.length > 5000){ toast('写真が多すぎます', 9000); return; }
  for(const pp of photos){
    if(pp && typeof pp.b64 === 'string' && pp.b64.length > 40*1024*1024){
      toast('大きすぎる写真が入っています。取り込みをやめました', 9000);
      return;
    }
  }
  const 名 = {sv:'調査',st:'箇所',ca:'魚の記録',ind:'1尾ずつ',nt:'メモ',mc:'メッシュのマス'};
  const 数 = CLOUD_KEYS.map(k=>名[k] + ' ' + (点検.数[k]||0) + '件').join('・');
  if(!confirm('このバックアップで、いまの記録を丸ごと置き換えます。\n'
    + '（' + 数 + '・写真 ' + photos.length + '枚）\n'
    + 'いまの記録は消えます。よろしいですか？')) return;
  if(!cloudApply(点検.data, 点検.tombstones)) return;
  // 写真を戻す（形のおかしいものは飛ばす）
  let 戻した = 0, 飛ばした = 0;
  for(const pp of photos){
    if(!pp || !safeId(pp.id) || typeof pp.b64 !== 'string' || !pp.b64){ 飛ばした++; continue; }
    if(pp.ext !== undefined && !/^[A-Za-z0-9]{1,8}$/.test(String(pp.ext))){ 飛ばした++; continue; }
    try{
      const bin = atob(pp.b64);
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
      const blob = new Blob([buf]);
      if(!blob.size){ 飛ばした++; continue; }
      // 大きさの控えがあるのに合わないものは、壊れているので入れない
      if(pp.size !== undefined && +pp.size !== blob.size){ 飛ばした++; continue; }
      await PhotoDB.put({id: pp.id, blob, ext: String(pp.ext||'jpg').slice(0,8),
        size: blob.size, added_at: nowISO()});
      戻した++;
    }catch(e){ 飛ばした++; }
  }
  toast('取り込みました（写真 ' + 戻した + '枚'
    + (飛ばした ? '・取り込めなかった写真 ' + 飛ばした + '枚' : '') + '）。'
    + 'ホームへ戻ります', 9000);
  reset('home');
}

/* ---- 資料PDF（図鑑など）----
   クラウド保存・バックアップには入れない（大きいため）。この端末の中だけ */
const DocDB = {
  _open(){
    return new Promise((res, rej)=>{
      const rq = indexedDB.open('fs_docs', 1);
      rq.onupgradeneeded = ()=>{ rq.result.createObjectStore('docs', {keyPath:'id'}); };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>rej(rq.error);
    });
  },
  async _do(mode, fn){
    const db = await this._open();
    try{
      return await new Promise((res, rej)=>{
        const tx = db.transaction('docs', mode);
        const rq = fn(tx.objectStore('docs'));
        tx.oncomplete = ()=>res(rq && rq.result !== undefined ? rq.result : undefined);
        tx.onerror = ()=>rej(tx.error);
      });
    }finally{ try{ db.close(); }catch(e){} }
  },
  all(){ return this._do('readonly', st=>st.getAll()); },
  put(rec){ return this._do('readwrite', st=>st.put(rec)); },
  del(id){ return this._do('readwrite', st=>st.delete(id)); },
};

/* ---- データ修復（2026-08-23 の実機の声・鳥アプリの考え方） ----
   点検で見つかる壊れ方のうち、機械的に直せるものを直す。
   直す前に、消す・書き替える分を fs_repair_backup へ控える（人が見られるように） */
function repairScan(){
  const out = {読めない:[], 重なり:0, ID無し:0, 迷子:{ca:0, ind:0, つながり:0}};
  for(const k of CLOUD_KEYS){
    try{ DB.loadRaw(DB.key[k]); }
    catch(e){ out.読めない.push(k); }
  }
  try{
    // ふつうのオブジェクトを辞書にすると、__proto__ などのIDで
    // 入っていないのに「ある」と見えてしまう（監査71回目 Major）
    const seen = Object.create(null);
    for(const k of CLOUD_KEYS){
      if(out.読めない.indexOf(k) >= 0) continue;
      DB.loadRaw(DB.key[k]).forEach(x=>{
        if(!x || typeof x !== 'object'){ out.ID無し++; return; }
        if(!x.uuid){ out.ID無し++; return; }
        const kk = k + ':' + x.uuid;
        if(seen[kk]) out.重なり++; else seen[kk] = 1;
      });
    }
    const st = Object.create(null), ca = Object.create(null);
    DB.loadRaw(DB.key.st).forEach(x=>{ if(x && x.uuid) st[x.uuid] = x; });
    DB.loadRaw(DB.key.ca).forEach(x=>{ if(x && x.uuid) ca[x.uuid] = x; });
    // ごみ箱の中の分は数えない（修復でごみ箱へ移した分が、また数えられてしまう）
    DB.loadRaw(DB.key.ca).forEach(x=>{
      if(x && x.uuid && !x.deleted_at
         && (!x.station_uuid || !st[x.station_uuid])) out.迷子.ca++;
    });
    DB.loadRaw(DB.key.ind).forEach(x=>{
      if(x && x.uuid && !x.deleted_at
         && (!x.catch_uuid || !ca[x.catch_uuid])) out.迷子.ind++;
    });
    Object.keys(st).forEach(u=>{
      const x = st[u];
      ['spot_uuid','parent_uuid'].forEach(f=>{
        if(x[f] && !st[x[f]]) out.迷子.つながり++;
      });
    });
  }catch(e){}
  out.何かある = !!(out.読めない.length || out.重なり || out.ID無し
    || out.迷子.ca || out.迷子.ind || out.迷子.つながり);
  return out;
}
function repairBackupPush(記録たち){
  try{
    const a = JSON.parse(localStorage.getItem('fs_repair_backup')||'[]');
    a.push({at: nowISO(), 記録: 記録たち});

    // 書き出す・戻す・消すを選ぶ
    localStorage.setItem('fs_repair_backup', JSON.stringify(a));
    return true;
  }catch(e){ return false; }
}
function repairBackupList(){
  try{ return JSON.parse(localStorage.getItem('fs_repair_backup')||'[]') || []; }
  catch(e){ return []; }
}
/* 控えをJSONファイルに書き出す（保険として手元へ） */

/* 札付きの行を、ごみ箱（消した状態）として端末へ戻す。
   親がいない行はクラウドへは出ないままだが、手元で中身を確かめられる */
function repairBackupRestore(){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  const a = repairBackupList();
  let 戻した = 0, 札なし = 0;
  const 箱 = {};
  try{ CLOUD_KEYS.forEach(k=>{ 箱[k] = DB.loadRaw(DB.key[k]); }); }
  catch(e){ toast('記録を読み取れないため、やめました', 8000); return; }
  const ある = {};
  CLOUD_KEYS.forEach(k=>{
    ある[k] = new Set(箱[k].map(x=>x && x.uuid).filter(Boolean));
  });
  const t = nowISO();
  a.forEach(entry=>{
    // v110の途中までは、合成の控えが生の配列で入っていた。その形も読む
    let 中身 = entry && entry.記録 && entry.記録.中身;
    if(!Array.isArray(中身) && Array.isArray(entry && entry.記録)) 中身 = entry.記録;
    if(!Array.isArray(中身)) return;    // 丸ごとの控えは「書き出し」でだけ扱う
    中身.forEach(row=>{
      if(!row || !row.k || !row.rec || !CLOUD_KEYS.includes(row.k)){ 札なし++; return; }
      const rec = row.rec;
      if(!rec || !rec.uuid || ある[row.k].has(rec.uuid)) return;
      const 写 = Object.assign({}, rec);
      写.deleted_at = 写.deleted_at || t;   // ごみ箱として戻す（生き返らせない）
      箱[row.k].push(写);
      ある[row.k].add(rec.uuid);
      戻した++;
    });
  });
  if(!戻した){
    toast(札なし ? '戻せる形の控えがありません（古い形の控えは「書き出し」で取り出せます）'
                : '戻すものはありません', 8000);
    return;
  }
  for(const k of CLOUD_KEYS){
    if(!DB.save(DB.key[k], 箱[k])){
      toast('書き込めませんでした（端末の空き容量をご確認ください）', 9000);
      return;
    }
  }
  toast('控えの ' + 戻した + '件を、ごみ箱として戻しました。'
    + 'ごみ箱から中身を確かめられます', 9000);
  render();
}
/* 修復前の「丸ごとの控え」で、記録をそのまま置き換えて戻す */
function repairSnapshotRestore(){
  if(!writeAllowed()){
    toast('このタブでは戻せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  const a = repairBackupList();
  const 候補 = a.filter(e=>e && e.記録 && e.記録.種類 === '修復前の控え'
    && e.記録.中身 && typeof e.記録.中身 === 'object' && !Array.isArray(e.記録.中身));
  if(!候補.length){ toast('丸ごとの控えはありません', 6000); return; }
  const 最新 = 候補[候補.length - 1];
  if(!confirm('修復前の丸ごとの控え（' + String(最新.at||'').slice(0,16).replace('T',' ')
    + '）で、いまの記録を置き換えます。\nいまの記録は消えます。よろしいですか？')) return;
  // 記録・墓標・打ちかけの片付けまで、「戻す」と同じ道（cloudApply）を通す。
  // 別の道で書くと、墓標が古いまま残って次の合成でまた消える（監査80回目 Major）
  const rows = {};
  CLOUD_KEYS.forEach(k=>{
    rows[k] = Array.isArray(最新.記録.中身[k]) ? 最新.記録.中身[k] : [];
  });
  if(cloudApply(rows, Array.isArray(最新.記録.墓標) ? 最新.記録.墓標 : undefined)){
    toast('修復前の控えに置き換えました', 8000);
    reset('home');
  }
}
function repairBackupClear(){
  const a = repairBackupList();
  if(!a.length){ toast('控えはありません'); return; }
  if(!confirm('端末に控えている ' + a.length + '回分を消します。\n'
    + '先に「書き出し」で保険を取ることをおすすめします。よろしいですか？')) return;
  try{ localStorage.setItem('fs_repair_backup', '[]'); toast('消しました'); render(); }
  catch(e){ toast('消せませんでした', 6000); }
}
function repairRun(){
  if(!writeAllowed()){
    toast('このタブでは直せません。記録を入れているタブでお試しください', 7000);
    return;
  }
  const sc = repairScan();
  if(!sc.何かある){ toast('直すものはありません'); return; }
  if(!confirm('見つかった壊れ方を直します。\n'
    + '・同じIDの重なり ' + sc.重なり + '件（新しい方を残す）\n'
    + '・IDの無い行 ' + sc.ID無し + '件（控えを取って除く）\n'
    + '・親の無い魚の記録 ' + sc.迷子.ca + '件・1尾ずつ ' + sc.迷子.ind
    + '件（ごみ箱へ）\n'
    + '・切れたつながり ' + sc.迷子.つながり + '件（つながりだけ外す）\n'
    + '除いた分は端末の中に控えます。よろしいですか？')) return;
  // 直す前に、いまの記録を丸ごと控える（監査71回目 Major）。
  // 途中で失敗しても、この控えから戻せる。控えが取れなければ直さない
  const 丸ごと = {};
  try{
    for(const k of CLOUD_KEYS){ 丸ごと[k] = DB.loadRaw(DB.key[k]); }
  }catch(e){ toast('記録を読み取れないため、やめました', 8000); return; }
  if(!repairBackupPush({種類:'修復前の控え', 中身:丸ごと, 墓標: tombstones()})){
    toast('直す前の控えを取れなかったため、やめました。'
      + '端末の空き容量をご確認ください', 10000);
    return;
  }
  const 戻す = ()=>{
    let 戻せた = true;
    CLOUD_KEYS.forEach(k=>{
      try{ if(!DB.save(DB.key[k], 丸ごと[k])) 戻せた = false; }
      catch(e){ 戻せた = false; }
    });
    toast(戻せた
      ? '書き込めなかったため、直す前に戻しました'
      : '書き込めず、元にも戻せませんでした。「データ点検」の控えから戻せます', 12000);
  };
  const 控え = [];
  let 直した = 0;
  const 時 = x => String((x && (x.updated_at || x.created_at)) || '');
  try{
    // 重なり・ID無し
    for(const k of CLOUD_KEYS){
      if(!DB.key[k]) continue;
      let a; try{ a = DB.loadRaw(DB.key[k]); }catch(e){ continue; }
      const byId = Object.create(null);
      const out = [];
      let この鍵で直した = 0;
      a.forEach(x=>{
        if(!x || typeof x !== 'object' || !x.uuid){
          if(x !== null && x !== undefined){ 控え.push({k, rec: x}); この鍵で直した++; }
          return;
        }
        const 既 = byId[x.uuid];
        if(既 === undefined){ byId[x.uuid] = out.length; out.push(x); return; }
        // 新しい方を残す
        if(時(x) > 時(out[既])){ 控え.push({k, rec: out[既]}); out[既] = x; }
        else 控え.push({k, rec: x});
        この鍵で直した++;
      });
      直した += この鍵で直した;
      if(この鍵で直した){
        if(!DB.save(DB.key[k], out)){ 戻す(); return; }
      }
    }
    // 迷子の魚の記録・1尾ずつ → ごみ箱へ（消さない。人が見て決められる）
    const st = Object.create(null), ca2 = Object.create(null);
    DB.loadRaw(DB.key.st).forEach(x=>{ if(x && x.uuid) st[x.uuid] = x; });
    DB.loadRaw(DB.key.ca).forEach(x=>{ if(x && x.uuid) ca2[x.uuid] = x; });
    let 書けない = false;
    DB.loadRaw(DB.key.ca).forEach(x=>{
      if(書けない) return;
      if(x && x.uuid && !x.deleted_at && (!x.station_uuid || !st[x.station_uuid])){
        if(!DB.softDelete(DB.key.ca, x.uuid)){ 書けない = true; return; }
        直した++;
      }
    });
    if(書けない){ 戻す(); return; }
    DB.loadRaw(DB.key.ind).forEach(x=>{
      if(書けない) return;
      if(x && x.uuid && !x.deleted_at && (!x.catch_uuid || !ca2[x.catch_uuid])){
        if(!DB.softDelete(DB.key.ind, x.uuid)){ 書けない = true; return; }
        直した++;
      }
    });
    if(書けない){ 戻す(); return; }
    // 切れたつながりを外す
    let a2; try{ a2 = DB.loadRaw(DB.key.st); }catch(e){ a2 = null; }
    if(a2){
      let 変えた = false;
      const st2 = Object.create(null);
      a2.forEach(x=>{ if(x && x.uuid) st2[x.uuid] = x; });
      a2.forEach(x=>{
        if(!x) return;
        ['spot_uuid','parent_uuid'].forEach(f=>{
          if(x[f] && !st2[x[f]]){ x[f] = ''; 変えた = true; 直した++; }
        });
      });
      if(変えた && !DB.save(DB.key.st, a2)){ 戻す(); return; }
    }
  }catch(e){ 戻す(); return; }
  if(控え.length) repairBackupPush({種類:'修復で除いた行', 中身:控え});
  try{ DB.surveys().forEach(sv=>{ unitRelink(sv.uuid); spotPosFix(sv.uuid); }); }catch(e){}
  toast('直しました（' + 直した + 'か所）。除いた分は端末の中に控えてあります', 8000);
  render();
}

/* いまの状態を、地図の下の一行に出す */
function fishSyncHint(){

  const 描き中 = fishDrawing();
  document.querySelectorAll('#fishmap .mapicons a[data-k]').forEach(a=>{
    a.classList.toggle('on', a.dataset.k === FISH_NEXT.kind);
  });
  if(描き中){
    el.innerHTML = `<b>${esc(描き中.name)}</b> を描いています（角 ${polyPts(描き中).length}個）。`
      + `地図をタップして角を足し、右下の「囲いを閉じる」で閉じてください`;
    return;
  }
  el.innerHTML = `つぎ：<b>${esc(UNIT_WORD[FISH_NEXT.kind]||'')}</b>　`
    + (FISH_NEXT.kind==='P' ? '地図をタップすると置けます'
                            : '地図をタップすると、囲いを描きはじめます')
    + '<br>直したいものは、下の名前のボタン（E1・P/F1…）で選んでください';
}
function fishAddHere(svUuid){
  if(fixBusy()) return;      // 待っている間の二度押しで、二重に置かない
  toast('現在地を取っています…');
  const 確かめ = fixGuard(svUuid);
  getFixOnce(f=>{
    fixDone();
    if(!確かめ()) return;
    if(!f){ toast('現在地を取れませんでした。地図をタップしても置けます', 6000); return; }
    if(f.acc > GPS_MAX_ACC){
      toast(`いまの位置は ±${Math.round(f.acc)}m と粗いので置いていません`, 8000);
      return;
    }
    fishAddAt(svUuid, f.lat, f.lon, f.acc);
    render();
  }, {keep:true});     // 置いてよいかは 確かめ() が見る
}
function fishDelete(u){
  const st = DB.liveStation(u); if(!st) return;
  const 中 = unitChildren(u, DB.stationsOf(st.survey_uuid)).length;
  if(!confirm(`${st.name} を消します。${中?`中の ${中}件は残りますが、囲いの外に出ます。`:''}`
    + '中の記録も一緒に見えなくなります。よろしいですか？')) return;
  if(!flushBeforeDelete(u)){
    toast('打ちかけを保存できないので、消しませんでした。'
      + '足りないところを直すか、端末の空き容量をご確認ください', 9000);
    return;
  }
  if(!DB.softDelete(DB.key.st, u)) return;
  draftClearFor('箇所', u);
  if(FISH_SEL === u) FISH_SEL = null;
  if(FISH_NEXT.draw === u) FISH_NEXT = {kind:FISH_NEXT.kind, draw:'', survey:FISH_NEXT.survey};
  unitRelink(st.survey_uuid);
  toast('消しました');
  render();
}
SCREENS.envMap = (arg)=>{
  const {sv: svUuid, spot: 頼まれた, record: 指名, loose: 未所属だけ} = mapArg(arg);
  const sv = DB.getAlive(DB.key.sv, svUuid);
  if(!sv) return null;
  const spot = mapEnterSpot(svUuid, 頼まれた, 未所属だけ);   // 一覧を作る前に決める
  selResetOnSpotChange(svUuid, spot);   // 描きかけを控えてから、調査を切り替える
  envUseSurvey(svUuid);        // 別の調査から持ち越さない
  if(指名 && mapStations(svUuid, 'env', spot).some(x=>x.uuid===指名)) ENV_SEL = 指名;
  const all = DB.stationsOf(svUuid);
  // メッシュの範囲は位置の持ち方が違うので、点・線の並びに混ぜない。
  // 混ぜると、位置の無い点として並んでしまう。
  // 地点から開いたときは、その地点のメッシュだけを出す（点・線と同じ決まり）。
  // ただし、入口ができる前に作った「地点の決まっていないメッシュ」は
  // 見えなくならないよう、小見出しを付けて併せて出す（監査37回目の宿題・2026-08-24）
  const meshes = all.filter(isMesh);
  const spotMeshes = meshes.filter(st=>ofSpot(st, spot));
  const looseMeshes = spot ? meshes.filter(st=>!st.spot_uuid) : [];
  // 地点（新しい調査の地図で置いたもの）は、ここでは記録として扱わない。
  // 地点は「大まかにこの辺」の目印で、詳しい記録はこの画面で作る
  // 魚の単位（E・P/F・P）も、この一覧には出さない。
  // 出すと、物理環境の入力欄から魚の単位へ環境の値を書き込めてしまう（監査32回目 Major）
  const list = mapStations(svUuid, 'env');
  // 選んでいるものが消えていたら、いちばん新しいものにする
  if(ENV_SEL && !list.some(x=>x.uuid===ENV_SEL)) ENV_SEL = null;
  // 何も選んでいないときに自動で選ぶのは、この地点で作ったものだけ。
  // 調査ぜんぶの最新を選ぶと、P2を開いたのに P1 の記録を直してしまう
  if(!ENV_SEL){
    const 候補 = list.filter(x=>ofSpot(x, spot));
    if(候補.length) ENV_SEL = 候補[候補.length-1].uuid;
  }
  const cur = ENV_SEL ? list.find(x=>x.uuid===ENV_SEL) : null;

  const chip = (st)=>{
    const k = envKindOf(st);
    const half = (k==='L' && !linePt(st,'end'));
    const 選ぶ = envPickOn();
    const on = 選ぶ ? ENV_PICK.set.has(st.uuid) : (st.uuid===ENV_SEL);
    const act = 選ぶ ? `envPickToggle('${st.uuid}')` : `envSelect('${st.uuid}')`;
    return `<button type="button" data-u="${st.uuid}" class="${on?'on':''}"
      onclick="${act}">${選ぶ && on ? '&check; ' : ''}${esc(st.name||'')}${half?'…':''}</button>`;
  };

  const g = k => (cur && cur[k]!==undefined && cur[k]!=='' ? cur[k] : '');
  const pct = cur ? substratePct(cur) : {};

  return {
    title: `${sv.river_name||''} ${sv.site_name||''}`.trim() || '物理環境',
    sub:[{text:surveyPeriodText(sv)},
         {text:sv.status||'未開始', cls: sv.status==='調査中'?'ok':''},
         {text:`${list.length}件`}],
    html:`
      ${fromSpotHtml(spot)}
      ${recDayBarHtml(sv)}
